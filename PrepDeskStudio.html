ntrol, NCI for the rest<\/small><\/div><\/div><div class=\"sp-axis\"><span style=\"--x:0\">0%<\/span><span style=\"--x:20\">20%<\/span><span style=\"--x:50\">50%<\/span><span style=\"--x:100\">100%<\/span><\/div>","steps":["Small stakes sit at fair value","Influence earns a share of profit, one line","Control means the whole company comes onto your books"],"say":"How much you own decides how you account for it. Under 20 per cent, the stake is passive and sits at fair value. Between 20 and 50 you are presumed to have significant influence and use the equity method, one line of profit. Above 50 you control the company, so you consolidate all of it and show the part you do not own as non controlling interest."},{"type":"sort","q":"Which method applies?","buckets":["Fair value","Equity method","Consolidate"],"items":[["5% of a listed spice exporter","Fair value"],["30% of an associate with two board seats","Equity method"],["80% of Achaar Co","Consolidate"],["100% of a packaging subsidiary","Consolidate"],["15% passive stake in a logistics startup","Fair value"],["40% of a joint venture with shared decisions","Equity method"]],"why":"Passive stakes at fair value, influence through the equity method, control by consolidation. Board seats and shared decisions signal influence; a majority signals control.","say":"Sort Masala Mills' investments by how they would be accounted for. Look past the percentage when the description tells you about influence or control."},{"type":"explain","title":"Equity method: one line, moving with profit","text":"Buy 30% of an associate for &#8377;300 Cr. It earns &#8377;100 Cr and pays &#8377;40 Cr of dividends. Book 30 as share of profit, take 12 of cash as dividend and reduce the stake. Carrying value 318. No revenue or EBITDA comes in.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">BS<\/span><b>Cost 300<\/b><\/div><div class=\"fstep hl step-2\"><span class=\"fk\">IS<\/span><b>Share of profit +30<\/b><small>30% of 100, one line<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">BS<\/span><b>Dividend &minus;12<\/b><small>cash in, stake down<\/small><\/div><div class=\"fstep step-4\"><span class=\"fk\">BS<\/span><b>Carrying value 318<\/b><\/div><\/div><p class=\"trap\"><b>Trap:<\/b> the stake moves with the associate's book profit and dividends, never with its share price.<\/p>","steps":["Start at cost","Pick up your share of profit below EBIT","Dividends are cash in and reduce the stake","The balance moves with book profit, not market price"],"say":"The equity method in four moves. Masala Mills buys 30 per cent of an associate for 300 crore. The associate earns 100, so Masala Mills books 30 as share of profit, one line below EBIT. It pays 40 of dividends, so 12 of cash arrives and the stake falls by 12. Carrying value: 318. No revenue, no EBITDA. And the stake never moves with the share price."},{"type":"number","q":"30% stake bought for ₹300 Cr. The associate earns ₹100 Cr and pays ₹40 Cr in dividends. Carrying value at year end, in crore?","answer":318,"tol":0.5,"unit":"crore","why":"300 + 30% of 100 - 30% of 40 = 300 + 30 - 12 = 318.","say":"Your turn. A 30 per cent stake bought for 300 crore. The associate earns 100 crore and pays 40 crore of dividends. What is the carrying value at year end, in crore?"},{"type":"statements","title":"Walk it: consolidating 80% of Achaar Co","text":"Achaar Co: assets 500, liabilities 200, equity 300. Masala Mills pays 240 for 80%, at book value. Day of the deal.","rows":{"is":[["Net income",0]],"cfs":[["Cash paid for Achaar Co (investing)",-240],["Change in cash",-240]],"bs":[["Cash",-240],["Achaar Co assets",500],["Achaar Co liabilities",200],["NCI (equity)",60]]},"order":[["is",0],["cfs",0],["cfs",1],["bs",0],["bs",1],["bs",2],["bs",3]],"check":"Assets +260 = Liabilities +200 + Equity +60","say":"Now the hook. Control means consolidating 100 per cent of Achaar Co, not 80. Cash drops by 240. All 500 of Achaar Co's assets and all 200 of its liabilities come onto the balance sheet. The 20 per cent Masala Mills does not own is 60 crore, 20 per cent of 300 of equity, shown as non controlling interest. Assets up 260, liabilities up 200, NCI up 60. Balanced."},{"type":"mcq","q":"Achaar Co earns ₹50 Cr. What does Masala Mills' consolidated income statement show?","options":["Net income +40","Net income +50, with 10 attributed to NCI and 40 to Masala Mills shareholders","Net income +60","Share of profit +40 on one line"],"answer":1,"why":"Consolidation takes 100% of revenue, costs and profit. The split comes below the line: 10 to NCI, 40 to the parent. NCI is an allocation, never a separate cash flow; dividends paid to NCI sit in financing.","say":"Achaar Co earns 50 crore in its first year as a subsidiary. What appears in Masala Mills' consolidated income statement? Remember what consolidation means for revenue and profit."},{"type":"explain","title":"Goodwill: the price above fair value","text":"Pay &#8377;620 Cr for a business whose identifiable net assets, acquired brands included, are worth &#8377;540 Cr. The &#8377;80 Cr gap is goodwill. It is not amortised (Ind AS 36, US GAAP for listed companies); it is tested for impairment each year.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Deal<\/span><b>Price &#8377;620 Cr<\/b><\/div><div class=\"fstep step-2\"><span class=\"fk\">Deal<\/span><b>&minus; Fair value of net assets &#8377;540 Cr<\/b><small>incl. acquired brands<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">BS<\/span><b>Goodwill &#8377;80 Cr<\/b><small>tested, not amortised<\/small><\/div><\/div><p class=\"upd\"><b>Updated:<\/b> US private companies may amortise goodwill over up to 10 years; US tax amortises it over 15. Goodwill is not depreciable for Indian tax since the Finance Act 2021.<\/p>","steps":["The price paid","Less what the identifiable assets are worth","The rest is goodwill"],"say":"When Masala Mills pays more than the fair value of what it can identify, the difference is goodwill. Pay 620 crore for net assets worth 540, brands included, and 80 crore of goodwill appears. It is not amortised. Instead it is tested every year, and management sets the assumptions in that test. Two exceptions in the US: private companies may amortise over ten years, and tax amortises over fifteen."},{"type":"mcq","q":"Masala Mills has impaired goodwill in three of the last four years. Your takeaway?","options":["It is running out of cash","A pattern of overpaying for deals; impairment is non-cash, so it is about capital allocation, not liquidity","Goodwill should have been amortised","The auditor is at fault"],"answer":1,"why":"One impairment can be bad luck or a macro shock hitting every deal at once. A string across different deals is a track record. Check whether they cluster in one downturn before judging.","say":"Masala Mills has now written down goodwill in three of the last four years. What do you take away from that as an analyst? Pick the reading that separates cash from judgement."},{"type":"reveal","q":"What are the three different types of intercompany investments?","tag":"Your miss","a":"<p>They track influence. <b>Under 20%:<\/b> a passive investment at fair value. <b>20 to 50%:<\/b> significant influence, the equity method: one line for your share of profit, dividends reduce the stake, no revenue or EBITDA. <b>Control, usually over 50%:<\/b> full consolidation with non-controlling interest for the slice not owned.<\/p><p>Your example: 80% of a company with &#8377;500 Cr assets and &#8377;200 Cr liabilities. Consolidate 100% of everything; NCI = 20% of 300 = &#8377;60 Cr in equity; of &#8377;50 Cr profit, 10 to NCI and 40 to the parent.<\/p>","say":"Boss question one, a miss. What are the three types of intercompany investments? Give the bands, the method for each, and then run your own 80 per cent example with the NCI number. Then reveal."},{"type":"reveal","q":"What are the three sub-classifications of investment securities?","tag":"Your miss","a":"<p>The book's US GAAP categories: <b>trading<\/b> (marked to market through the income statement), <b>available for sale<\/b> (marked to market through OCI) and <b>held to maturity<\/b> (amortised cost).<\/p><p>Updated: since ASU 2016-01 took effect in 2018, those three apply only to debt securities. Equity stakes without influence go to fair value through net income, so a corporate venture portfolio now swings reported earnings every quarter. Ind AS 109 uses amortised cost, FVOCI and FVTPL, driven by the business model and the cash flow test.<\/p>","say":"Second miss, and the book is out of date on it. What are the three sub classifications of investment securities? Give the old three, say what changed in 2018, and name the Ind AS 109 categories. Then reveal."},{"type":"reveal","q":"Can companies amortise goodwill?","tag":"Your miss","a":"<p>Not a listed company. Under US GAAP (ASC 350) and Ind AS 36 goodwill has an indefinite life and is tested for impairment at least annually. Two exceptions: a US private company may elect to amortise goodwill straight line over up to 10 years, and for US tax purchased goodwill is amortised over 15 years (Section 197) whatever the books show.<\/p><p>Nuance: tax goodwill runs down while book goodwill sits flat, so a DTL builds with no scheduled reversal. India: goodwill is not tax-depreciable since the Finance Act 2021.<\/p>","say":"Third miss. Can companies amortise goodwill? Give the main rule, the two exceptions, and the Indian tax point. Then reveal."},{"type":"reveal","q":"A company has continuously incurred goodwill impairments. What do you take away?","tag":"Your miss","a":"<p>Recurring impairments usually mean management overpays for acquisitions, misjudges synergies or fails to integrate: goodwill is written down only when the acquired business is worth clearly less than was paid. One impairment can be bad luck; a string across deals is a track record.<\/p><p>Check whether they cluster around one or two deals, or landed together after a market downturn, since impairment tests are sensitive to discount rates and near-term cash flows. It is non-cash with usually no tax effect: it says nothing about liquidity, everything about capital allocation.<\/p>","say":"Last one, a miss. A company keeps taking goodwill impairment charges. What do you take away from that? Give the main reading, the two checks, and what it does not tell you. Then reveal."},{"type":"recap","points":["Under 20% fair value, 20 to 50% one line of profit, control means consolidating everything","NCI is the slice you do not own: equity on the BS, an allocation below profit, no cash flow","Goodwill is price above fair value of net assets: tested yearly, not amortised","Repeated impairments are about deal discipline, not cash"],"say":"Four to keep. Ownership sets the method: fair value, one line of profit, or full consolidation. Non controlling interest is the slice you do not own: in equity, a share below profit, never a cash flow. Goodwill is the price above fair value, tested every year rather than amortised. A string of impairments tells you about deal discipline, not cash. Next: debt and the revolver loop."}]},{"id":"acc-10","module":"acc","title":"Debt, credit ratios and the revolver loop","mins":7,"blurb":"Masala Mills' lender adds interest to the loan instead of taking cash. Then the model goes round in circles.","slides":[{"type":"hook","title":"Interest nobody paid","text":"Masala Mills' mezzanine lender adds &#8377;100 Cr of interest to the loan instead of collecting cash. Profit falls 75. Cash rises 25. Debt grows 100. All three at once. How?","say":"Masala Mills has a mezzanine loan where the lender does not collect interest in cash. Instead, 100 crore of interest is added to the loan balance. Profit falls by 75, cash goes up by 25, and the debt grows by 100, all in the same year. By now you can probably guess the mechanism. Let's confirm it, then meet the loop every model builder dreads."},{"type":"statements","title":"Walk it: ₹100 Cr of PIK interest at 25% tax","text":"Paid-in-kind interest is a real, deductible expense settled in more debt instead of cash.","rows":{"is":[["Interest (PIK)",100],["Pre-tax profit",-100],["Tax at 25%",-25],["Net income",-75]],"cfs":[["Net income",-75],["Add back PIK interest",100],["Change in cash",25]],"bs":[["Cash",25],["Debt",100],["Retained earnings",-75]]},"order":[["is",0],["is",1],["is",2],["is",3],["cfs",0],["cfs",1],["cfs",2],["bs",0],["bs",1],["bs",2]],"check":"Assets +25 = Liabilities +100 + Equity -75","say":"Same rule as lesson one. PIK interest is a real expense, so pre-tax profit falls 100, tax falls 25, net income falls 75. No cash left, so the cash flow statement adds the 100 back: cash up 25, the tax saved. On the balance sheet, cash is up 25 and debt is up 100, because the unpaid interest now belongs to the lender. Retained earnings down 75. It balances."},{"type":"mcq","q":"What makes the PIK walk different from the depreciation walk?","options":["PIK is not tax deductible","The other side of the entry: PIK grows a liability (debt), depreciation shrinks an asset (PP&E)","PIK is not added back","Cash falls with PIK"],"answer":1,"why":"Net income and cash move identically for any deductible non-cash charge. Only the balance sheet line differs. Modelling trap: add PIK back and forget to grow the debt, and every later year's interest is understated.","say":"Compare this with the depreciation walk from lesson one. Net income and cash moved by the same amounts. So what is actually different about PIK?"},{"type":"explain","title":"Two families of credit ratio","text":"<b>Leverage<\/b> sizes the debt: debt &divide; EBITDA. <b>Coverage<\/b> asks whether this year's earnings pay for it: EBITDA &divide; interest. A company can carry high leverage for years if coverage holds. Coverage predicts default; it also moves with rates when leverage does not.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>Leverage: how much<\/h4><ul><li>Debt &divide; EBITDA, debt &divide; equity<\/li><li>Size of the obligation<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Coverage: can they pay<\/h4><ul><li>EBITDA or EBIT &divide; interest<\/li><li>DSCR, FCCR<\/li><li>The one that predicts default<\/li><\/ul><\/div><\/div><table class=\"t compact\"><thead><tr><th>Debt at 6x EBITDA<\/th><th>Rate<\/th><th>EBITDA &divide; interest<\/th><\/tr><\/thead><tbody><tr><td>Cheap fixed debt<\/td><td>4.2%<\/td><td>4.0x<\/td><\/tr><tr><td>Refinanced at today's rates<\/td><td>8%<\/td><td>2.1x<\/td><\/tr><\/tbody><\/table>","say":"Lenders ask two questions. How much does Masala Mills owe, relative to what it earns? That is leverage, debt over EBITDA. And can this year's earnings pay the interest? That is coverage. Coverage predicts default. It also moves with interest rates even when leverage does not: the same 6 times leverage gives 4 times cover at 4.2 per cent and barely 2 times once the debt is refinanced at 8."},{"type":"number","q":"Debt is 6x EBITDA and the rate is 8%. EBITDA divided by interest, in times?","answer":2.08,"tol":0.05,"unit":"times","why":"Interest = 6 times 8% = 48% of EBITDA. Cover = 1 over 0.48 = 2.08x. At 4.2% the same leverage gives 1 over 0.252 = 4.0x.","say":"Work it. Debt is six times EBITDA and the interest rate is 8 per cent. What is EBITDA divided by interest? Set EBITDA to 100 if it helps."},{"type":"explain","title":"DSCR, and the liquidity trio","text":"DSCR = (EBITDA &minus; capex) &divide; (interest + principal); covenants sit around 1.10x to 1.25x. Liquidity: current, quick and cash ratio, strict to stricter. No number is good everywhere; the business model sets the norm. Keep restricted cash out.","visual":"<div class=\"fgrid\"><div class=\"fcard\"><div class=\"fname\">Current<\/div><div class=\"fx\">CA &divide; CL<\/div><div class=\"fnote\">broadest<\/div><\/div><div class=\"fcard\"><div class=\"fname\">Quick<\/div><div class=\"fx\">(cash + securities + receivables) &divide; CL<\/div><div class=\"fnote\">drops inventory<\/div><\/div><div class=\"fcard\"><div class=\"fname\">Cash<\/div><div class=\"fx\">cash &divide; CL<\/div><div class=\"fnote\">strictest<\/div><\/div><\/div><table class=\"t compact\"><thead><tr><th>FY26 current ratio<\/th><th>Business<\/th><th>x<\/th><\/tr><\/thead><tbody><tr><td>Jubilant FoodWorks<\/td><td>QSR<\/td><td>0.37<\/td><\/tr><tr><td>Bharti Airtel<\/td><td>Telecom<\/td><td>0.52<\/td><\/tr><tr><td>HUL<\/td><td>FMCG<\/td><td>1.22<\/td><\/tr><tr><td>DLF<\/td><td>Real estate<\/td><td>1.54<\/td><\/tr><tr><td>TCS<\/td><td>IT services<\/td><td>2.23<\/td><\/tr><\/tbody><\/table>","say":"Two more tools. Debt service coverage takes EBITDA minus the capex needed to keep running, over interest plus principal due this year; covenants sit around 1.1 to 1.25 times. And the liquidity trio: current, quick and cash ratios. Your note said industry standard to learn, so here is the pattern: the faster customers pay, the lower the normal ratio. Jubilant at 0.37, Airtel at 0.52, TCS at 2.23."},{"type":"mcq","q":"Jubilant FoodWorks runs a current ratio of 0.37x. Distress?","options":["Yes, anything below 1 is a warning","No: a QSR collects cash before paying suppliers, so a low ratio is its normal; judge against the sector","Yes, unless the quick ratio is above 1","Cannot tell without the cash ratio"],"answer":1,"why":"Negative working capital by design. The same 0.37x at a real estate developer, where DLF runs 1.54x, would be alarming. Liquidity ratios only mean something next to the business model.","say":"Here is your note turned into a question. Jubilant FoodWorks, the Domino's franchisee, runs a current ratio of 0.37. Is that distress?"},{"type":"explain","title":"The revolver loop","text":"The revolver tops cash up to a minimum. Interest on the average balance includes this year's draw: the draw sets interest, interest cuts net income, net income cuts cash, cash sets the draw. Break it with a circuit-breaker switch plus iteration, opening-balance interest, or algebra.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 210\" role=\"img\" aria-label=\"Interest sets the draw and the draw sets interest\"><defs><marker id=\"arr-acc10-loop\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-fink\"/><\/marker><\/defs><rect x=\"30\" y=\"20\" width=\"170\" height=\"50\" rx=\"8\" class=\"s-boxb step-1\"/><text x=\"115\" y=\"41\" text-anchor=\"middle\" class=\"s-tb\">Revolver draw up<\/text><text x=\"115\" y=\"58\" text-anchor=\"middle\" class=\"s-ts\">cash topped up to minimum<\/text><rect x=\"360\" y=\"20\" width=\"170\" height=\"50\" rx=\"8\" class=\"s-box step-2\"/><text x=\"445\" y=\"41\" text-anchor=\"middle\" class=\"s-tb\">Interest up<\/text><text x=\"445\" y=\"58\" text-anchor=\"middle\" class=\"s-ts\">rate times average balance<\/text><rect x=\"360\" y=\"140\" width=\"170\" height=\"50\" rx=\"8\" class=\"s-box step-3\"/><text x=\"445\" y=\"161\" text-anchor=\"middle\" class=\"s-tb\">Net income down<\/text><text x=\"445\" y=\"178\" text-anchor=\"middle\" class=\"s-ts\">after interest and tax<\/text><rect x=\"30\" y=\"140\" width=\"170\" height=\"50\" rx=\"8\" class=\"s-box step-4\"/><text x=\"115\" y=\"161\" text-anchor=\"middle\" class=\"s-tb\">Cash down<\/text><text x=\"115\" y=\"178\" text-anchor=\"middle\" class=\"s-ts\">shortfall widens<\/text><line x1=\"200\" y1=\"45\" x2=\"355\" y2=\"45\" class=\"s-line\" marker-end=\"url(#arr-acc10-loop)\"/><text x=\"278\" y=\"38\" text-anchor=\"middle\" class=\"s-ts\">sets<\/text><line x1=\"445\" y1=\"70\" x2=\"445\" y2=\"135\" class=\"s-line\" marker-end=\"url(#arr-acc10-loop)\"/><text x=\"470\" y=\"106\" class=\"s-ts\">cuts<\/text><line x1=\"360\" y1=\"165\" x2=\"205\" y2=\"165\" class=\"s-line\" marker-end=\"url(#arr-acc10-loop)\"/><text x=\"282\" y=\"158\" text-anchor=\"middle\" class=\"s-ts\">widens<\/text><line x1=\"115\" y1=\"140\" x2=\"115\" y2=\"75\" class=\"s-line\" marker-end=\"url(#arr-acc10-loop)\"/><text x=\"60\" y=\"106\" class=\"s-ts\">draws more<\/text><\/svg><figcaption>Interest depends on the draw, and the draw depends on cash after interest.<\/figcaption><\/figure>","steps":["Cash falls short, so the revolver draws","Interest is charged on the average balance, including the new draw","Higher interest means lower net income","Lower net income means less cash, so the draw grows again"],"say":"Now the loop from your note. A revolver tops cash up to the minimum. But interest is charged on the average balance, which includes the money just drawn. So the draw sets interest, interest cuts net income, net income cuts cash, and cash sets the draw. Excel cannot solve that in one pass. Fix it with a circuit breaker switch plus iteration, opening balance interest, or algebra."},{"type":"number","q":"Minimum cash ₹20 Cr. Before interest on the new draw, projected cash is -₹76 Cr. Revolver at 10% on the average balance, tax 20%. Draw, in crore?","answer":100,"tol":0.5,"unit":"crore","why":"Shortfall 96. The draw averages half itself, so it costs 10% times a half times 80% = 4% of itself after tax. Draw = 96 over (1 - 0.04) = 100. Tie-out: -76 + 100 - 4 = 20. The opening-balance shortcut draws 96 and leaves you 4 short.","say":"Solve the loop with algebra. Masala Mills wants 20 crore of minimum cash. Before interest on any new draw, next year's cash is projected at minus 76. The revolver charges 10 per cent on the average balance and tax is 20 per cent. How much must it draw, in crore? Gross the shortfall up."},{"type":"reveal","q":"If a company has incurred $100 in PIK interest, how are the three statements impacted?","tag":"Your miss","a":"<p>At 30% tax. <b>IS:<\/b> interest +100, pre-tax income &minus;100, net income &minus;70. <b>CFS:<\/b> net income &minus;70, add back the non-cash 100, cash +30. <b>BS:<\/b> cash +30; debt +100 as the interest accrues onto principal; retained earnings &minus;70.<\/p><p>Same X(1 &minus; t) and X &times; t pattern as depreciation; only the offsetting line differs: PIK grows a liability, depreciation shrinks an asset. Trap: adding it back but forgetting to roll the 100 into next year's opening debt.<\/p>","say":"Boss question one, a miss. A company incurs 100 dollars of PIK interest. How are the three statements affected? Walk all three, then say how it differs from depreciation and name the modelling trap. Then reveal."},{"type":"reveal","q":"How do you handle revolver circularity in a financial model?","tag":"Your miss","a":"<p>The loop: interest depends on the revolver balance, the draw depends on cash after interest, and cash depends on the balance. Excel cannot solve it in one pass.<\/p><p>Fixes: (1) a circuit-breaker switch that zeroes the circular interest, with iteration on, what bankers run on live deals; (2) interest on the opening balance only, no loop but biased; (3) algebra, draw = shortfall &divide; (1 &minus; r(1 &minus; t) &divide; 2): &#8377;96 Cr becomes &#8377;100 Cr at 10% and 20% tax.<\/p><p>Trap: iteration with no switch lets a stray circular error converge silently.<\/p>","say":"Second miss, your own note said revolver circularity read. How do you handle revolver circularity in a financial model? Describe the loop, give three fixes with the worked number, and the trap. Then reveal."},{"type":"reveal","q":"What are the two types of credit ratios used to assess default risk?","tag":"Your miss","a":"<p><b>Leverage ratios<\/b>, such as debt to EBITDA or debt to equity, measure how much debt the company carries against its earnings or capital. <b>Coverage ratios<\/b>, such as EBITDA to interest, DSCR and FCCR, measure whether current cash flow services that debt.<\/p><p>Leverage answers how much they owe; coverage answers whether they can pay this year, and coverage predicts default. At 6x leverage with 4x cover on cheap fixed debt a company is fine today; refinance at 8% and cover halves with no change in leverage.<\/p>","say":"Third miss. What are the two types of credit ratios used to assess default risk? Define both families, say which one predicts default, and give the rate example. Then reveal."},{"type":"reveal","q":"What are the main liquidity ratios and what does each measure?","tag":"Your miss","a":"<p><b>Current ratio<\/b>, current assets over current liabilities, the broadest. <b>Quick ratio<\/b>, cash plus marketable securities plus receivables over current liabilities, drops inventory and prepaids. <b>Cash ratio<\/b>, cash and equivalents over current liabilities, the strictest: could the company pay today with no collections? Restricted cash stays out of all three.<\/p><p>Your note: the industry sets the norm. Jubilant FoodWorks at 0.37x and Bharti Airtel at 0.52x run negative working capital by design; HUL 1.22x, DLF 1.54x, TCS 2.23x. Judge a number against its sector.<\/p>","say":"Last one, a miss. What are the main liquidity ratios and what does each measure? Define the three, say what each one drops, and give the industry pattern from your note. Then reveal."},{"type":"recap","points":["PIK is a deductible non-cash charge settled in more debt: net income down, cash up by the tax saved, debt up","Leverage sizes the debt, coverage says whether this year pays for it; coverage predicts default","Liquidity ratios mean something only next to the business model","Revolver loop: draw sets interest, interest sets the draw; switch plus iteration, or gross up the shortfall"],"say":"Four to keep. PIK is a deductible non cash charge paid in more debt: net income falls, cash rises by the tax saved, debt grows. Leverage sizes the debt, coverage says whether this year pays for it, and coverage predicts default. Liquidity ratios only mean something next to the business model. The revolver loop breaks with a switch plus iteration, or by grossing up the shortfall. Last: cash flow quality."}]},{"id":"acc-11","module":"acc","title":"Cash flow quality and the Indian annual report","mins":7,"blurb":"Masala Mills' EBITDA rose 20% and its operating cash flow fell. Same year, same company. Who is lying?","slides":[{"type":"hook","title":"EBITDA up 20%. Cash flow down. Who is lying?","text":"Masala Mills' adjusted EBITDA grew 20% this year. Operating cash flow fell. Management calls it timing. You have ten minutes with the annual report before the interview.","say":"Last puzzle of the module. Masala Mills reports adjusted EBITDA up 20 per cent, and in the same year operating cash flow fell. Management says it is timing. You have ten minutes with the annual report. Where do you look, and what do you strip out before you trust the profit number?"},{"type":"explain","title":"EBITDA to CFO to FCF","text":"EBITDA is an accrual profit before interest, tax, working capital and capex. Each step down removes one. They diverge when working capital outgrows sales or cash tax jumps. Adjusted EBITDA also adds back ESOP cost: non-cash, but real dilution.","visual":"<table class=\"t compact\"><thead><tr><th>Step<\/th><th>Amount<\/th><th>Running<\/th><\/tr><\/thead><tbody><tr class=\"step-1\"><td>EBITDA<\/td><td>100<\/td><td>100<\/td><\/tr><tr class=\"step-2\"><td>Cash interest<\/td><td>&minus;8<\/td><td>92<\/td><\/tr><tr class=\"step-3\"><td>Cash tax<\/td><td>&minus;15<\/td><td>77<\/td><\/tr><tr class=\"step-4\"><td>Working capital build<\/td><td>&minus;5<\/td><td><b>72 = CFO<\/b><\/td><\/tr><tr class=\"step-5\"><td>Capex<\/td><td>&minus;32<\/td><td><b>40 = FCF<\/b><\/td><\/tr><\/tbody><\/table>","steps":["Start at EBITDA, an accrual number","Pay the cash interest","Pay the cash tax","Fund the working capital build: that is CFO","Spend the capex: that is free cash flow"],"say":"EBITDA is not cash. It is an accrual profit measured before interest, tax, working capital and capex. Walk down: 100 of EBITDA, pay 8 of cash interest, 15 of cash tax, fund 5 of working capital, and operating cash flow is 72. Spend 32 on capex and free cash flow is 40. When EBITDA and cash flow part ways, it is almost always working capital or cash tax."},{"type":"number","q":"EBITDA 100, cash interest 8, cash tax 15, working capital build 5, capex 32. Free cash flow?","answer":40,"tol":0.5,"unit":"crore","why":"100 - 8 - 15 - 5 = 72 of CFO. 72 - 32 = 40 of FCF. Each step removes one thing EBITDA ignores.","say":"Run the bridge yourself. EBITDA 100, cash interest 8, cash tax 15, a working capital build of 5, and capex of 32. What is free cash flow?"},{"type":"statements","title":"Walk it: ₹40 Cr of ESOP cost","text":"Non-cash, and tax relief comes only at exercise, so a DTA builds for now. Tax 25%.","rows":{"is":[["ESOP cost",40],["Pre-tax profit",-40],["Tax at 25% (deferred)",-10],["Net income",-30]],"cfs":[["Net income",-30],["Add back ESOP cost",40],["Deferred tax asset built",-10],["Change in cash",0]],"bs":[["DTA",10],["Equity: ESOP reserve",40],["Retained earnings",-30]]},"order":[["is",0],["is",1],["is",2],["is",3],["cfs",0],["cfs",1],["cfs",2],["cfs",3],["bs",0],["bs",1],["bs",2]],"check":"Assets +10 = Liabilities 0 + Equity +10","say":"The add-back everyone argues about. Masala Mills expenses 40 crore of stock options at fair value over the vesting period. Pre-tax profit falls 40. Tax relief only comes at exercise, so the 10 of tax saving sits as a deferred tax asset and cash is flat. Equity rises 40 for the options reserve and falls 30 through retained earnings. Non cash, yes. Free, no: shareholders get diluted."},{"type":"mcq","q":"CFO trails net income for four straight years while profit keeps rising. Most likely reading?","options":["Healthy growth, cash will catch up","An earnings quality problem: receivables or inventory growing faster than the business needs, or cash tax catching up","High depreciation","Strong pricing power"],"answer":1,"why":"Profit is an opinion, cash is a fact. A widening gap over several years is the single strongest tell of aggressive accounting. Check receivable days against sales growth next.","say":"Here is the fastest single check for aggressive accounting. Operating cash flow has trailed net income for four years in a row while profit keeps rising. What is the most likely reading?"},{"type":"sort","q":"Run-rate EBITDA: take it out, or keep it in?","buckets":["Take out","Keep in"],"items":[["One-off plant closure cost","Take out"],["Interest earned on surplus cash","Take out"],["Restructuring charge in three of the last four years","Keep in"],["Gain on sale of an investment","Take out"],["Litigation cost at a pharma company sued routinely","Keep in"],["One-time VRS payout","Take out"]],"why":"Exceptional items are large, rare and shown on their own Schedule III line; other income is real but not operating. A charge that repeats is an operating cost wearing a label. Whether an item is non-recurring depends on the industry.","say":"Cleaning earnings means finding the run rate profit of the core business. Sort these. Exceptional items and other income come out. But a charge that keeps coming back is just an operating cost that management has relabelled."},{"type":"explain","title":"Cookie jars, big baths and the tells","text":"<b>Cookie jar:<\/b> over-provide in a good year, release the reserve in a weak one. <b>Big bath:<\/b> one outsized charge, often under a new CEO, so later years look better. Both manage the trend, not the total. Two or three tells together is the pattern.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>Numbers<\/h4><ul><li>CFO below net income for years<\/li><li>Receivable days outrunning sales growth<\/li><li>Capitalising what peers expense<\/li><li>Provisions released in weak quarters<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Outside the numbers<\/h4><ul><li>Rising related-party balances<\/li><li>Contingent liabilities large against net worth<\/li><li>Auditor qualification, emphasis of matter, or exit<\/li><li>Promoter pledges rising<\/li><\/ul><\/div><\/div><p class=\"ind\"><b>India:<\/b> IL&amp;FS and DHFL showed rising related-party lending and complex group structures before their 2018 and 2019 defaults; Manpasand's receivables outran its revenue.<\/p>","say":"Two classic games. Cookie jar accounting over provides in a good year and releases the reserve when a weak quarter needs help. Big bath accounting takes one enormous charge, often when a new CEO arrives, so later years look better. The tells sit in cash flow, receivable days and provisions, and outside the numbers: related parties, contingent liabilities, the auditor's language. One tell is noise; three together is a pattern."},{"type":"explain","title":"Reading an Indian P&L","text":"Schedule III shows expenses by nature: materials, employee cost, finance cost, D&A, other. No COGS line, so build gross margin yourself. Exceptional items sit above tax. Value on consolidated numbers; standalone drives dividends. Ind AS 37: provide when probable and measurable, otherwise a note.","visual":"<table class=\"t compact\"><thead><tr><th>Question<\/th><th>Answer<\/th><\/tr><\/thead><tbody><tr><td>Gross margin?<\/td><td>Not disclosed: rebuild from materials, purchases and inventory change<\/td><\/tr><tr><td>Standalone or consolidated?<\/td><td>Consolidated for valuation; standalone for dividends and holdco SOTP<\/td><\/tr><tr><td>Provision or contingent liability?<\/td><td>Provision if the outflow is probable and measurable; otherwise notes only<\/td><\/tr><tr><td>Proxy statement?<\/td><td>The AGM notice, with a section 102 explanatory statement<\/td><\/tr><\/tbody><\/table>","say":"An Indian interviewer checks whether you have read an annual report. Schedule III groups expenses by nature, so there is no cost of goods sold line and you build gross margin yourself. Exceptional items sit above tax. Value the group on consolidated numbers; standalone tells you about dividends. Under Ind AS 37 a provision is booked only when the outflow is probable and measurable; the rest lives in the notes."},{"type":"mcq","q":"Masala Mills' notes show a disputed GST demand equal to 60% of net worth, which it expects to win. Where does it sit?","options":["As a provision on the balance sheet","Through the P&L as an exceptional item","In the contingent liabilities note only, until an outflow becomes probable","In other income"],"answer":2,"why":"Possible, not probable, so Ind AS 37 keeps it out of the statements. Ratios look clean while a liability worth 60% of net worth waits in a footnote. Size contingent liabilities against net worth, not profit.","say":"Apply it. Masala Mills' annual report mentions a disputed GST demand equal to 60 per cent of its net worth, which management expects to win. Where does that number sit in the financial statements?"},{"type":"reveal","q":"Is EBITDA a good proxy for operating cash flow?","tag":"Your miss","a":"<p>No. EBITDA adds back D&amp;A but ignores three things that decide operating cash flow: cash taxes, cash interest and the change in working capital. Two companies with identical EBITDA can throw off very different cash if one is growing receivables and inventory fast. In the bridge, 100 of EBITDA became 72 of CFO.<\/p><p>Trap: adjusted EBITDA adds back ESOP cost because it is non-cash. It is a real cost that dilutes shareholders, so a high-ESOP company's adjusted EBITDA overstates its cash power against a peer paying in cash.<\/p>","say":"Boss question one, a miss. Is EBITDA a good proxy for operating cash flow? Give the three things it ignores, a number, and the stock compensation trap. Then reveal."},{"type":"reveal","q":"Why does the cash flow statement almost always use the indirect method, and why can EBITDA and CFO move in opposite directions in the same year?","tag":"Your miss","a":"<p>The indirect method starts from net income and adjusts for non-cash items and working capital. Almost everyone uses it because it is cheap, reusing the P&amp;L and balance sheet instead of tracking every receipt, and it doubles as a reconciliation of profit to cash.<\/p><p>EBITDA and CFO diverge because EBITDA stops before working capital, cash tax and cash interest. EBITDA can grow while receivables and inventory build faster than sales, pulling CFO down. A widening gap over years is where earnings quality problems show first.<\/p>","say":"Second miss, both halves of it. Why does the cash flow statement almost always use the indirect method, and why can EBITDA and operating cash flow move in opposite directions in the same year? Then reveal."},{"type":"reveal","q":"What are some examples of non-recurring items?","tag":"Your miss","a":"<p>Legal settlement gains or losses, restructuring and severance charges, asset and inventory write-downs, impairments, a plant closure, a one-off VRS payout. Analysts strip them out to see repeatable operating performance; in India they sit on their own exceptional items line, above tax.<\/p><p>The skill is noticing when non-recurring stops being non-recurring: a restructuring charge in three of four years is an operating cost and stays in normalised EBITDA. It is industry dependent: litigation is an add-back for most companies but routine cost for a pharma company sued constantly.<\/p>","say":"Third miss. What are some examples of non-recurring items? List them, say where they sit in an Indian income statement, and then give the judgement about when to stop treating them as one-offs. Then reveal."},{"type":"reveal","q":"What are exceptional items, and how do you treat them and other income when finding a company's real earnings power?","tag":"Your miss","a":"<p><b>Exceptional items<\/b> are large, infrequent items inside ordinary business, a plant closure, a litigation settlement, a VRS payout, shown on a separate Schedule III line so users can exclude them from the run rate. <b>Other income<\/b> is interest on surplus cash, dividends and investment gains: real, but not from operations.<\/p><p>Rebuild operating EBITDA without both before applying a multiple or running a DCF; the cash and investments belong in the EV bridge. Then check whether the exceptional items recur; if they do, they are operating costs and stay in.<\/p>","say":"Last boss question of the module, a miss. What are exceptional items, and how do you treat them and other income when you want a company's real earnings power? Define both, say what you do with them, and the check you run afterwards. Then reveal."},{"type":"recap","points":["EBITDA ignores interest, tax, working capital and capex; the gap to CFO is the story","Strip exceptional items and other income, but a charge that repeats is an operating cost","ESOP cost is non-cash but real dilution: back in for per-share value","Indian P&L: expenses by nature, no COGS line, consolidated for valuation, contingent liabilities in the notes"],"say":"That is the module. EBITDA ignores interest, tax, working capital and capex; the gap to operating cash flow is where the story hides. Strip exceptional items and other income, but a charge that keeps repeating is operating cost. ESOP cost is non cash and still dilutes you. An Indian income statement shows expenses by nature: build gross margin yourself and read the contingent liabilities note. Now go value Masala Mills."}]},{"id":"rat-01","module":"rat","title":"Liquidity: can it pay its bills?","mins":8,"blurb":"Airtel covers half its near-term bills and is fine. Learn the three liquidity tests and when below 1x is a real worry.","slides":[{"type":"hook","title":"Airtel covers half its bills. Should you worry?","text":"Airtel's current assets cover about half of what it owes within a year. Sun Pharma's cover nearly three times. By the end of this lesson you will know why Airtel can live with that.","visual":"<div class=\"kchips\"><span class=\"kchip dn\">Airtel 0.5x<\/span><span class=\"kchip up\">Sun Pharma 2.8x<\/span><\/div>","say":"Here's a puzzle. Airtel's current assets cover only about half of the bills it must pay in the next twelve months. Sun Pharma's cover them almost three times over. Sounds like Airtel is in trouble. It isn't, and by the end of this lesson you'll be able to explain why in an interview."},{"type":"explain","title":"Current ratio: near-term assets against near-term bills","text":"Add up what turns into cash within 12 months and divide by what falls due within 12 months. Above 1x, near-term assets cover near-term bills. Below 1x, something else fills the gap.","visual":"<div class=\"tacct\"><div class=\"step-1\"><div class=\"th\">Current assets<\/div><div class=\"tr\"><span>Cash<\/span><b>30<\/b><\/div><div class=\"tr\"><span>Receivables<\/span><b>100<\/b><\/div><div class=\"tr\"><span>Inventory<\/span><b>170<\/b><\/div><div class=\"tr\"><span><b>Total<\/b><\/span><b>300<\/b><\/div><\/div><div class=\"step-2\"><div class=\"th\">Current liabilities<\/div><div class=\"tr\"><span>Trade payables<\/span><b>85<\/b><\/div><div class=\"tr\"><span>Short-term loans<\/span><b>115<\/b><\/div><div class=\"tr\"><span><b>Total<\/b><\/span><b>200<\/b><\/div><\/div><\/div><div class=\"formula step-3\">Current ratio = 300 &divide; 200 = <b>1.5x<\/b><\/div><p class=\"key\">Masala Mills, FY26, &#8377; Cr<\/p>","steps":["Current assets add up to 300 crore","Bills due within a year add up to 200 crore","300 divided by 200 is 1.5x"],"say":"Start with Masala Mills, our snack and spice maker, in rupees crore. On the left, what turns into cash within a year: 30 of cash, 100 owed by customers, 170 of stock. That's 300. On the right, what it must pay within a year: 85 to suppliers and 115 of short-term loans. That's 200. 300 divided by 200 gives a current ratio of 1.5 times."},{"type":"ratio","id":"r-current","say":"Now the real companies, FY26. Sun Pharma tops the chart at 2.8 times and TCS at 2.2: big cash piles and receivables, small supplier bills. At the bottom, Tata Steel at 0.7 and Airtel at 0.5. Suppliers and short-term loans fund them. For Airtel that's fine, because subscribers pay every day. Below 1 is a worry only when short-term debt fills the gap."},{"type":"explain","title":"Quick ratio: take the stock out","text":"Stock is the slowest current asset: it must be sold, then collected. The quick ratio drops it and asks if the bills are covered without selling anything. A big drop from the current ratio means liquidity hangs on stock.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Current assets<\/span><b>&#8377;300 Cr<\/b><small>cash, receivables, stock<\/small><\/div><div class=\"fstep hl2 step-2\"><span class=\"fk\">Less stock<\/span><b>&minus;&#8377;170 Cr<\/b><small>must be sold first<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">Quick assets<\/span><b>&#8377;130 Cr<\/b><small>cash + receivables<\/small><\/div><div class=\"fstep hl step-4\"><span class=\"fk\">Quick ratio<\/span><b>0.65x<\/b><small>130 &divide; 200<\/small><\/div><\/div><p class=\"key\">Current 1.5x, quick 0.65x: more than half of Masala Mills' current assets is spice stock.<\/p>","steps":["Start from 300 crore of current assets","Take out 170 crore of stock","130 crore of cash and receivables is left","130 divided by 200 is 0.65x"],"say":"The quick ratio is the current ratio with the stock taken out. Stock is the slowest current asset: you have to sell it, then wait to get paid. Masala Mills has 300 of current assets, but 170 is spices and packets in the warehouse. Strip that out and 130 is left. 130 over 200 is 0.65 times. Without selling stock, it can't cover its bills."},{"type":"ratio","id":"r-quick","say":"Sun Pharma and TCS stay above 2 times, because their current assets are mostly cash and receivables. TCS barely moves at all: it holds no stock. The big fallers are DMart, from about 2 times down to 0.4, and Tata Steel, down to 0.3. Their current assets are mostly goods on shelves and steel in yards. DMart's gap between current and quick is the widest of the eight."},{"type":"explain","title":"Cash ratio: only the money in the bank","text":"The strictest test. Count only cash and liquid investments against current liabilities: no collections, no stock sales. Very high is safe, but ask why the cash sits idle.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>Counts<\/h4><ul><li>Cash and bank balances<\/li><li>Liquid funds and deposits<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Left out<\/h4><ul><li>Money customers owe<\/li><li>Stock in the warehouse<\/li><\/ul><\/div><\/div><div class=\"formula\">Cash ratio = 30 &divide; 200 = <b>0.15x<\/b><\/div>","say":"The cash ratio is the strictest test of all. Only cash and investments you could sell tomorrow count. Customers who still owe you, and stock in the warehouse, are left out. Masala Mills has 30 of cash against 200 of bills, a cash ratio of 0.15 times. Thin, but normal for a company that collects from distributors every month."},{"type":"ratio","id":"r-cash","say":"Sun Pharma is the only one above 1: it holds more cash than all its short-term bills. TCS is next at about 0.8, a treasury built from years of profit. At the bottom, Tata Steel at 0.1 and DMart below that. DMart spends its cash on new stores, Tata Steel on plants and repaying debt. A very high cash ratio is safe but lazy: ask whether that cash should fund growth or go back to shareholders."},{"type":"explain","title":"One fraction, three tests","text":"The three ratios share one denominator. Each test removes the slowest asset still on top: first stock, then receivables.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 450 168\" role=\"img\" aria-label=\"Current assets of 300 clear bills of 200; without stock 130 does not; cash alone is 30\"><line x1=\"290\" y1=\"6\" x2=\"290\" y2=\"118\" class=\"s-mline\"/><g class=\"step-1\"><text x=\"6\" y=\"31\" class=\"s-tb\">Current<\/text><rect x=\"70\" y=\"14\" width=\"33\" height=\"24\" class=\"s-fa\"/><rect x=\"103\" y=\"14\" width=\"110\" height=\"24\" class=\"s-fg\"/><rect x=\"213\" y=\"14\" width=\"187\" height=\"24\" class=\"s-fn\"/><text x=\"405\" y=\"31\" class=\"s-ta\">1.5x<\/text><\/g><g class=\"step-2\"><text x=\"6\" y=\"67\" class=\"s-tb\">Quick<\/text><rect x=\"70\" y=\"50\" width=\"33\" height=\"24\" class=\"s-fa\"/><rect x=\"103\" y=\"50\" width=\"110\" height=\"24\" class=\"s-fg\"/><text x=\"219\" y=\"67\" class=\"s-ta\">0.65x<\/text><\/g><g class=\"step-3\"><text x=\"6\" y=\"103\" class=\"s-tb\">Cash<\/text><rect x=\"70\" y=\"86\" width=\"33\" height=\"24\" class=\"s-fa\"/><text x=\"109\" y=\"103\" class=\"s-ta\">0.15x<\/text><\/g><text x=\"290\" y=\"132\" text-anchor=\"middle\" class=\"s-ts\">bills due within a year: 200<\/text><rect x=\"70\" y=\"146\" width=\"12\" height=\"12\" class=\"s-fa\"/><text x=\"86\" y=\"156\" class=\"s-ts\">Cash 30<\/text><rect x=\"146\" y=\"146\" width=\"12\" height=\"12\" class=\"s-fg\"/><text x=\"162\" y=\"156\" class=\"s-ts\">Receivables 100<\/text><rect x=\"274\" y=\"146\" width=\"12\" height=\"12\" class=\"s-fn\"/><text x=\"290\" y=\"156\" class=\"s-ts\">Stock 170<\/text><\/svg><figcaption>Each test drops the slowest asset left; the grey line is what falls due within a year.<\/figcaption><\/figure>","steps":["Current: all 300 of current assets","Quick: drop the stock, 130 left","Cash: only the 30 of cash"],"say":"Here's the way to remember all three. It's one fraction. Current assets on top for the current ratio. Drop the stock and you get the quick ratio. Drop the receivables too and only cash is left. The grey line is the 200 of bills due this year. Masala Mills clears it with everything, falls short without stock, and is far short on cash alone."},{"type":"mcq","q":"Which company has the lowest current ratio of the eight, and why is that not alarming?","options":["Tata Steel: steel sells the day it is made","Airtel: subscribers pay daily and suppliers fund it","DMart: shoppers pay at the till, so it needs no current assets","Maruti: it has no borrowings"],"answer":1,"why":"Airtel sits at 0.5x. Subscribers pay every day, so it can run on supplier credit. Below 1x worries you when short-term debt, not suppliers, fills the gap.","say":"Time to test it. Which of the eight has the lowest current ratio, and why doesn't that ring alarm bells? Think about how fast cash comes in."},{"type":"number","q":"Masala Mills FY27 plan: cash &#8377;40 Cr, receivables &#8377;110 Cr, inventory &#8377;150 Cr; payables &#8377;100 Cr, short-term loans &#8377;100 Cr. Quick ratio?","answer":0.75,"tol":0.01,"unit":"x","why":"Quick assets are cash plus receivables: 40 + 110 = 150. Current liabilities: 100 + 100 = 200. 150 &divide; 200 = 0.75x. The stock never enters.","say":"Your turn to calculate. Masala Mills' plan for next year: 40 of cash, 110 of receivables, 150 of stock, 100 of payables and 100 of short-term loans. What's the quick ratio?"},{"type":"mcq","q":"Which company shows the widest gap between its current ratio and its quick ratio?","options":["TCS","Airtel","Sun Pharma","DMart"],"answer":3,"why":"DMart drops from 2.0x to 0.4x because shelf stock is most of its current assets. TCS and Airtel barely move: they hold almost no stock.","say":"Which company's liquidity leans hardest on selling stock? In other words, where is the gap between current and quick ratio widest?"},{"type":"sort","q":"Quick ratio FY26: which side of 1x?","buckets":["Above 1x","Below 1x"],"items":[["Sun Pharma","Above 1x"],["TCS","Above 1x"],["HUL","Below 1x"],["DMart","Below 1x"],["Tata Steel","Below 1x"],["Airtel","Below 1x"]],"why":"Only Sun Pharma (2.3x) and TCS (2.2x) clear 1x without stock. HUL is next at 0.9x; DMart and Tata Steel fall below 0.5x once stock is removed.","say":"Sort these six by quick ratio. Does each one clear 1 times without selling any stock, or not? Remember who holds lots of stock and who holds almost none."},{"type":"order","q":"Rank by cash ratio, highest first","items":["Sun Pharma","TCS","Airtel","DMart"],"why":"Sun Pharma 1.4x, TCS 0.8x, Airtel 0.3x, DMart 0.1x. DMart puts its cash into new stores.","say":"Put these four in order of cash ratio, the biggest cash cushion first. Think about who keeps a treasury and who spends every rupee on growth."},{"type":"mcq","q":"Masala Mills (current assets &#8377;300 Cr, current liabilities &#8377;200 Cr) repays &#8377;50 Cr of short-term loans from cash. Its current ratio goes:","options":["Down, to 1.25x","Unchanged at 1.5x","Up, to about 1.67x","Down, to 1.0x"],"answer":2,"why":"Both sides fall by 50: 250 &divide; 150 = 1.67x. When the ratio is above 1, paying a current bill with cash lifts it. Below 1, the same move would push it down.","say":"One more, a trickier one. Masala Mills uses 50 crore of cash to repay short-term loans. Both sides of the fraction shrink. Does the current ratio go up, down, or stay put?"},{"type":"reveal","q":"What are the main liquidity ratios (current, quick and cash ratio), and what does each measure?","tag":"Your miss","a":"<p><b>Current<\/b> = current assets &divide; current liabilities: do one-year assets cover one-year bills. <b>Quick<\/b> drops inventory: can it pay without selling stock. <b>Cash<\/b> keeps only cash and liquid investments: could it pay today.<\/p><p>Read them against the business model. FY26: Sun Pharma 2.8x current; Airtel 0.5x, safe because subscribers pay daily. DMart falls from 2.0x current to 0.4x quick because shelf stock dominates. Below 1x is a worry when short-term debt, not suppliers, fills the gap.<\/p>","say":"Boss question, and one you flagged to learn with industry standards. What are the three liquidity ratios and what does each one measure? Give the formulas, then an industry example for each. Say it out loud, then reveal."},{"type":"reveal","q":"Airtel's current ratio is 0.5x. Is it about to run out of cash? What would you check?","tag":"","a":"<p>Not by itself. A current ratio below 1x is normal for a business that collects daily and pays suppliers late: Airtel's cash cycle is about &minus;164 days, so vendors fund it.<\/p><p>Check what fills the gap. Trade payables and customer advances are fine. Short-term borrowings rolled every few months mean refinancing risk. Then compare operating cash flow with debt due within a year, and look at interest cover (Airtel about 3x).<\/p>","say":"Second boss question. An interviewer says Airtel's current ratio is 0.5 times and asks if it's about to run out of cash. What's your answer, and what would you check next?"},{"type":"recap","points":["Current, quick and cash ratio are one fraction with fewer assets on top: all, then minus stock, then cash only","Read against the business model: Airtel at 0.5x is fine because cash comes in daily; short-term debt filling the gap is the worry","A wide current-to-quick gap (DMart 2.0x to 0.4x) means liquidity depends on selling stock"],"say":"Three things to keep. The liquidity ratios are one fraction, with fewer assets on top each time. Below 1 is fine when cash pours in daily, as at Airtel, and a worry when short-term debt fills the gap. And a big gap between current and quick ratio means liquidity hangs on selling stock. Next: how fast money moves through the business."}]},{"id":"rat-02","module":"rat","title":"Efficiency and the cash cycle","mins":10,"blurb":"HUL's suppliers fund it while DLF waits years for its cash. Learn the day counts, the cash cycle and the two turnover ratios.","slides":[{"type":"hook","title":"How long does a rupee stay stuck?","text":"HUL collects from distributors in about 19 days and pays suppliers in about 98, so its suppliers fund it. DLF's cash stays locked up for about 1,280 days. Today: how to measure how fast money moves.","visual":"<div class=\"kchips\"><span class=\"kchip up\">HUL cash cycle &minus;44 days<\/span><span class=\"kchip dn\">DLF cash cycle 1,282 days<\/span><\/div>","say":"Picture one rupee going round a business. At HUL, distributors pay in about 19 days, but HUL takes about 98 days to pay its suppliers. So suppliers are funding HUL. At DLF, the same rupee is locked in land and flats for about 1,280 days. This lesson shows you how to measure how long that takes."},{"type":"explain","title":"Inventory days: how long stock sits","text":"Stock divided by a year's operating costs, times 365, gives the days of costs sitting in the warehouse. Fewer days, less cash tied up. Turnover flips it: 365 divided by the days.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Inventory<\/span><b>&#8377;170 Cr<\/b><small>spices, flour, packets<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Operating costs<\/span><b>&#8377;850 Cr<\/b><small>revenue 1,000 &minus; EBITDA 150<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">Inventory days<\/span><b>73 days<\/b><small>170 &divide; 850 &times; 365<\/small><\/div><div class=\"fstep step-4\"><span class=\"fk\">Turnover<\/span><b>5x a year<\/b><small>365 &divide; 73<\/small><\/div><\/div><p class=\"key\">Textbooks divide by COGS. These numbers use total operating costs for all eight companies, so they compare like for like.<\/p>","steps":["Masala Mills holds 170 crore of stock","A year of operating costs is 850 crore","170 over 850, times 365, is 73 days","365 over 73 means stock turns 5 times a year"],"say":"First, how long stock sits before it's sold. Masala Mills holds 170 crore of spices and packets. Its yearly operating costs are 850. 170 over 850, times 365, is 73 days. So a bag of chilli powder waits about 73 days. Flip it, 365 divided by 73, and stock turns over 5 times a year. Fewer days means less cash stuck in the warehouse."},{"type":"ratio","id":"r-invturn","say":"DLF is off the chart at about 1,340 days, because land and unfinished flats count as inventory. Sun Pharma holds about 100 days of medicines and materials, and Tata Steel about 87. At the bottom, TCS and Airtel: they sell people's time and network access, so they hold almost no stock. 1,300 days is normal for a developer and alarming for a retailer."},{"type":"explain","title":"Debtor days: how long customers take to pay","text":"Receivables divided by revenue, times 365. It counts the days between booking a sale and banking the cash. Rising debtor days can mean revenue that has not turned into cash.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Receivables<\/span><b>&#8377;100 Cr<\/b><small>owed by distributors<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Revenue<\/span><b>&#8377;1,000 Cr<\/b><small>a year of sales<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">Debtor days<\/span><b>36.5 days<\/b><small>100 &divide; 1,000 &times; 365<\/small><\/div><\/div><p class=\"trap\"><b>Trap:<\/b> if receivables grow faster than revenue, debtor days stretch. Looser credit is the easiest way to buy growth.<\/p>","steps":["Distributors owe Masala Mills 100 crore","It sells 1,000 crore a year","100 over 1,000, times 365, is 36.5 days"],"say":"Next, how long customers take to pay. Masala Mills is owed 100 crore by distributors and sells 1,000 a year. 100 over 1,000, times 365, is 36.5 days. If sales grow and debtor days climb with them, the company is selling on looser credit. That's revenue that hasn't turned into cash yet."},{"type":"ratio","id":"r-dso","say":"Sun Pharma and TCS lead at about 97 and 93 days. Sun sells on credit to distributors and US wholesalers. TCS bills big clients after the work is done and waits about three months. At the bottom, DMart at under 1 day, because shoppers pay at the till. Tata Steel collects in about a week, as buyers pay upfront or through bank finance."},{"type":"explain","title":"Payable days: how long it takes to pay suppliers","text":"Payables divided by operating costs, times 365. High days are free funding when they come from bargaining power. They are a warning when the company simply cannot pay on time.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Payables<\/span><b>&#8377;85 Cr<\/b><small>owed to farmers, packers<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Operating costs<\/span><b>&#8377;850 Cr<\/b><small>same base as stock<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">Payable days<\/span><b>36.5 days<\/b><small>85 &divide; 850 &times; 365<\/small><\/div><\/div><div class=\"cmp\"><div class=\"cmp-c a\"><h4>Power<\/h4><ul><li>Suppliers want the volumes<\/li><li>Days steady over years<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Stress<\/h4><ul><li>Days rising as cash shrinks<\/li><li>Suppliers tighten terms<\/li><\/ul><\/div><\/div>","steps":["Masala Mills owes suppliers 85 crore","Divide by the same 850 crore of costs","85 over 850, times 365, is 36.5 days"],"say":"Now the other side. Masala Mills owes its spice farmers and packaging suppliers 85 crore. Divide by 850 of operating costs and multiply by 365: 36.5 days. Taking longer to pay is like a free loan from suppliers. That's great when it comes from muscle, as at HUL. It's a warning sign when bills are late because cash is short."},{"type":"ratio","id":"r-dpo","say":"Airtel is top at about 180 days. It owes network vendors large sums against a small cost base. HUL is next near 98 days, because suppliers want its volumes. At the bottom, DMart pays in about a week to win lower prices, and TCS sits at 28, since most of its costs are salaries, which never sit in payables."},{"type":"explain","title":"The cash cycle: days your own money is stuck","text":"Add the days stock sits and the days customers take, then subtract the days suppliers wait. What is left is how long the company funds itself. Negative means suppliers fund the business.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 450 132\" role=\"img\" aria-label=\"Stock sits 73 days and customers take 36.5, suppliers give 36.5, so Masala Mills funds 73 days\"><text x=\"10\" y=\"14\" class=\"s-ts\">Day 0: stock arrives<\/text><rect x=\"10\" y=\"22\" width=\"204\" height=\"24\" class=\"s-fa step-1\"/><text x=\"17\" y=\"39\" class=\"s-tb step-1\">Stock 73 days<\/text><rect x=\"214\" y=\"22\" width=\"102\" height=\"24\" class=\"s-fg step-2\"/><text x=\"220\" y=\"39\" class=\"s-tb step-2\">Debtors 36.5<\/text><text x=\"322\" y=\"39\" class=\"s-ts step-2\">cash in: day 109.5<\/text><rect x=\"10\" y=\"62\" width=\"102\" height=\"24\" class=\"s-fn step-3\"/><text x=\"15\" y=\"79\" class=\"s-tb step-3\">Credit 36.5<\/text><rect x=\"112\" y=\"62\" width=\"204\" height=\"24\" class=\"s-fb step-4\"/><text x=\"119\" y=\"79\" class=\"s-tb step-4\">Cash cycle 73 days<\/text><text x=\"10\" y=\"118\" class=\"s-t\">73 + 36.5 &minus; 36.5 = 73 days funded by Masala Mills itself<\/text><\/svg><figcaption>The cash cycle is the stretch the company has to finance on its own.<\/figcaption><\/figure><div class=\"formula\">CCC = inventory days + debtor days &minus; payable days<\/div>","steps":["Stock sits on the shelf for 73 days","Customers take 36.5 more days to pay","Suppliers gave 36.5 days of credit","Masala Mills funds the remaining 73 days"],"say":"Put the three on a timeline. Stock sits 73 days, then customers take 36.5 more, so cash comes back on day 109.5. But suppliers waited 36.5 days before Masala Mills paid them. So its own money is stuck for 73 days. That's the cash cycle. If it goes negative, suppliers fund the business, and growth throws off cash instead of eating it."},{"type":"ratio","id":"r-ccc","say":"DLF tops the chart at about 1,280 days: land and unbuilt flats lock cash up for years. Sun Pharma is next at 133, with 100 days of stock and 97 of receivables. Three companies run negative: Maruti at minus 14, HUL at minus 44, and Airtel at minus 164. Their customers pay within weeks, while suppliers wait three to six months."},{"type":"explain","title":"Asset turnover: sales from every rupee of assets","text":"Revenue divided by total assets. It shows how hard the whole asset base works. It is the middle term of DuPont: return on assets equals net margin times asset turnover.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Total assets<\/span><b>&#8377;700 Cr<\/b><small>plant, stock, receivables, cash<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Revenue<\/span><b>&#8377;1,000 Cr<\/b><small>a year of sales<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">Asset turnover<\/span><b>1.43x<\/b><small>1,000 &divide; 700<\/small><\/div><\/div><div class=\"formula\">ROA = net margin 6.75% &times; asset turnover 1.43 = 9.6%<\/div>","steps":["Masala Mills holds 700 crore of assets","They produce 1,000 crore of sales","1,000 over 700 is 1.43x"],"say":"Now zoom out to the whole balance sheet. Masala Mills holds 700 crore of assets: plant, stock, receivables and cash. It sells 1,000 a year. 1,000 over 700 is 1.43 times. Each rupee of assets brings in about 1.43 rupees of sales. This is the middle of DuPont: return on assets is net margin times asset turnover."},{"type":"ratio","id":"r-asset-turn","say":"DMart leads at 2.3 times: its shelves empty and refill about every month. TCS is next at about 1.5, needing little more than offices and laptops. At the bottom, Airtel at 0.4, with huge towers, fibre and spectrum, and DLF at about 0.1, holding years of land and flats against small yearly sales. DMart wins on turnover with thin margins. Airtel does the opposite."},{"type":"explain","title":"Fixed asset turnover: how capital-heavy is it?","text":"Revenue divided by net fixed assets, leaving out goodwill. High means plants are cheap next to what they sell. Low means growth needs heavy capex first, and returns depend on running the plant full.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Net fixed assets<\/span><b>&#8377;400 Cr<\/b><small>roasters, grinders, packing lines<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Revenue<\/span><b>&#8377;1,000 Cr<\/b><small>a year of sales<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">Fixed asset turnover<\/span><b>2.5x<\/b><small>1,000 &divide; 400<\/small><\/div><\/div><div class=\"cmp\"><div class=\"cmp-c a\"><h4>Asset-light<\/h4><ul><li>People or brands do the earning<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Asset-heavy<\/h4><ul><li>Plant, towers or spectrum come first<\/li><\/ul><\/div><\/div>","steps":["Masala Mills has 400 crore of plant","It sells 1,000 crore a year","1,000 over 400 is 2.5x"],"say":"Same idea, but only plant and machinery. Masala Mills has 400 crore of net fixed assets: roasting lines, grinders and packing machines. 1,000 of sales over 400 is 2.5 times. A low number means you must spend on plant before you earn anything, so returns depend on running that plant full."},{"type":"ratio","id":"r-fa-turn","say":"TCS is far ahead at about 10.7 times. Its main asset is its people, and people sit off the balance sheet. HUL is next at 7.1: its factories are cheap next to what its brands sell. At the bottom, Tata Steel at about 1.2, where plants cost almost a year's sales, and Airtel at 0.6, which must buy spectrum and build towers before it earns anything."},{"type":"number","q":"Masala Mills FY27: revenue &#8377;1,200 Cr, operating costs &#8377;1,000 Cr, inventory &#8377;180 Cr, receivables &#8377;120 Cr, payables &#8377;90 Cr. Cash conversion cycle in days?","answer":69.35,"tol":0.5,"unit":"days","why":"Inventory days 180 &divide; 1,000 &times; 365 = 65.7. Debtor days 120 &divide; 1,200 &times; 365 = 36.5. Payable days 90 &divide; 1,000 &times; 365 = 32.85. Cycle: 65.7 + 36.5 &minus; 32.85 = 69.35 days.","say":"Now the questions. Work out Masala Mills' cash cycle for next year. Stock and payables go over operating costs, receivables over revenue. Add the first two, subtract payables."},{"type":"mcq","q":"Three of the eight run a negative cash cycle. Which three?","options":["DMart, TCS and Airtel","HUL, DMart and Tata Steel","Maruti, Sun Pharma and DLF","Airtel, HUL and Maruti"],"answer":3,"why":"Airtel (&minus;164 days), HUL (&minus;44) and Maruti (&minus;14). Customers pay within weeks while suppliers wait three to six months.","say":"Which three companies get their suppliers to fund them? Pick the group with a negative cash cycle. Think about who collects fast and pays slowly."},{"type":"mcq","q":"TCS has debtor days of about 93 but a cash cycle of about 65. What brings it down?","options":["Inventory days of about 100","Advances from clients","Payable days of about 28","Its large cash pile"],"answer":2,"why":"TCS holds no stock, so its cycle is 93 debtor days minus about 28 payable days. Cash is not part of the formula.","say":"TCS waits about 93 days for clients to pay, yet its cash cycle is only about 65. Which piece of the formula pulls it down?"},{"type":"order","q":"Rank by payable days, highest first","items":["Airtel","HUL","Tata Steel","DMart"],"why":"Airtel about 180 days, HUL 98, Tata Steel 64, DMart 8. DMart pays fast to win lower prices.","say":"Order these four by how long they take to pay suppliers, slowest payer first. Think about bargaining power, and about what the costs actually are."},{"type":"sort","q":"Fixed asset turnover FY26: which side of 3x?","buckets":["Above 3x","Below 3x"],"items":[["TCS","Above 3x"],["HUL","Above 3x"],["Maruti","Above 3x"],["Sun Pharma","Below 3x"],["Tata Steel","Below 3x"],["Airtel","Below 3x"]],"why":"TCS 10.7x, HUL 7.1x and Maruti 4.1x run light. Sun Pharma 2.2x, Tata Steel 1.2x and Airtel 0.6x need heavy plant, towers or spectrum.","say":"Sort these six by fixed asset turnover. Which ones earn more than 3 rupees of sales per rupee of plant, and which need far more plant?"},{"type":"mcq","q":"DMart keeps about 4% of sales as net profit, Airtel about 13%. Yet DMart's return on assets is higher (10% against 6%). Why?","options":["It turns its assets about six times faster","It carries more debt","Its gross margin is higher","It holds more cash"],"answer":0,"why":"DuPont: ROA = net margin &times; asset turnover. DMart turns its assets 2.3x a year, Airtel 0.4x, about six times slower.","say":"Last one. DMart's net margin is about a third of Airtel's, yet DMart earns a better return on its assets. What's doing the work? Use DuPont."},{"type":"reveal","q":"How do you calculate inventory turnover, and what does it tell you?","tag":"Your miss","a":"<p>Inventory turnover = COGS &divide; average inventory. Inventory days = 365 &divide; turnover, or inventory &divide; COGS &times; 365.<\/p><p>It shows how fast stock sells and how much cash sits in the warehouse. Masala Mills: 170 of stock on 850 of costs is 73 days, about 5 turns a year. Read it against the model: DLF's 1,340 days is land and unfinished flats, normal for a developer; Sun Pharma holds about 100 days; TCS holds none. Rising days on flat sales can mean slow-moving or obsolete stock.<\/p>","say":"Boss question, one you missed. How do you calculate inventory turnover, and what does it tell you? Give the formula both ways, then an industry contrast. Say it, then reveal."},{"type":"reveal","q":"Debtor days jump from 60 to 90 while revenue grows 30%. What do you suspect, and what do you check?","tag":"","a":"<p>Revenue is growing faster than cash. The company may be selling on looser credit, booking sales early, or carrying a slow-paying customer.<\/p><p>Check receivables growth against revenue growth, the ageing schedule and bad-debt provisions, operating cash flow against EBITDA, and whether the jump sits in one customer or at quarter-end. Stretching debtor days is the easiest way to buy growth, so ask for cash collected, not revenue booked.<\/p>","say":"Second boss question. Debtor days jump from 60 to 90 while revenue grows 30 per cent. What do you suspect, and what would you check? Say it out loud first."},{"type":"recap","points":["Inventory and debtor days count how long cash is stuck; payable days count how long suppliers fund you","Cash cycle = inventory days + debtor days minus payable days; Airtel, HUL and Maruti run negative","Asset turnover (DMart 2.3x) and fixed asset turnover (TCS 10.7x) show how hard the assets work"],"say":"Keep three things. Stock and debtor days count how long cash is stuck, payable days how long suppliers fund you. The cash cycle adds the first two and subtracts payables, and Airtel, HUL and Maruti run it negative. Turnover ratios show how hard the assets work. Next: how much debt a company can carry."}]},{"id":"rat-03","module":"rat","title":"Leverage and coverage","mins":10,"blurb":"Airtel owes more, yet Tata Steel is the tighter credit. Learn the debt ratios lenders size up and the coverage tests they trust.","slides":[{"type":"hook","title":"Airtel owes more. Tata Steel is tighter.","text":"Airtel's debt about equals its equity, the highest of the eight. Tata Steel's is a little lower. Yet Airtel's cash earnings cover this year's interest and repayments 1.7 times, and Tata Steel's fall just short.","visual":"<div class=\"kchips\"><span class=\"kchip dn\">Airtel debt to equity 1.0x<\/span><span class=\"kchip up\">Airtel DSCR 1.7x<\/span><span class=\"kchip dn\">Tata Steel DSCR 0.97x<\/span><\/div>","say":"Here's a credit puzzle. Airtel has the most debt for its equity of all eight companies, about one to one. Tata Steel has a little less. Yet this year Airtel's cash earnings cover its interest and loan repayments 1.7 times, and Tata Steel's fall just short of 1. How big the debt is and whether it can be paid are two different questions."},{"type":"explain","title":"Two questions every lender asks","text":"Leverage ratios size the pile of debt against equity or a year of EBITDA. Coverage ratios ask if this year's earnings pay this year's charges. You need both.","visual":"<div class=\"cmp\"><div class=\"cmp-c a step-1\"><h4>Leverage: how big is the pile?<\/h4><ul><li>Net debt &divide; EBITDA<\/li><li>Debt &divide; equity<\/li><\/ul><\/div><div class=\"cmp-c b step-2\"><h4>Coverage: can this year pay?<\/h4><ul><li>Interest cover<\/li><li>DSCR<\/li><li>FCCR<\/li><\/ul><\/div><\/div>","steps":["Leverage: the size of the debt","Coverage: this year's ability to pay"],"say":"Lenders ask two questions. First, how big is the debt pile? That's leverage: compare debt with a year of EBITDA, or with the owners' money. Second, can this year's earnings pay this year's bills? That's coverage: interest cover, DSCR and FCCR. We'll build all five on Masala Mills, starting with leverage."},{"type":"explain","title":"Net debt to EBITDA: years to pay it off","text":"Add borrowings and lease liabilities, subtract cash, divide by EBITDA. It roughly says how many years of operating profit would clear the debt. Below zero means more cash than debt.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Borrowings<\/span><b>&#8377;250 Cr<\/b><small>plus leases, none here<\/small><\/div><div class=\"fstep hl2 step-2\"><span class=\"fk\">Less cash<\/span><b>&minus;&#8377;30 Cr<\/b><small>and liquid investments<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">Net debt<\/span><b>&#8377;220 Cr<\/b><small>250 &minus; 30<\/small><\/div><div class=\"fstep hl step-4\"><span class=\"fk\">Net debt &divide; EBITDA<\/span><b>1.47x<\/b><small>220 &divide; 150<\/small><\/div><\/div>","steps":["Masala Mills has 250 crore of borrowings","Take off 30 crore of cash","Net debt is 220 crore","220 over 150 of EBITDA is about 1.5x"],"say":"First, the one bankers quote most. Masala Mills has 250 crore of borrowings and 30 of cash, so net debt is 220. Its EBITDA, profit before interest, tax and depreciation, is 150. 220 over 150 is about 1.5 times: roughly a year and a half of operating profit would clear the debt. Lease liabilities count as debt too; Masala Mills has none."},{"type":"ratio","id":"r-nd-ebitda","say":"Tata Steel tops the chart at 2.4 times. It borrowed to build and buy plants in India and Europe. Airtel is next at about 1.3, counting spectrum dues and leases. Five of the eight sit below zero, holding more cash than debt. DLF is lowest at minus 5.5 after clearing debt with flat bookings, and Maruti is at minus 3.5. Read it against how steady cash flow is: 2 times is heavier for steel than for telecom."},{"type":"explain","title":"Debt to equity: whose money funds it?","text":"Borrowings plus leases divided by shareholders' equity. It compares lenders' money with owners' money. Zero debt is safe, but it can leave return on equity lower than it could be.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 196\" role=\"img\" aria-label=\"Debt of 250 against equity of 365 gives debt to equity of 0.68x\"><line x1=\"120\" y1=\"170\" x2=\"440\" y2=\"170\" class=\"s-line\"/><rect x=\"150\" y=\"70\" width=\"100\" height=\"100\" class=\"s-fb step-1\"/><text x=\"200\" y=\"62\" text-anchor=\"middle\" class=\"s-tb step-1\">&#8377;250 Cr<\/text><text x=\"200\" y=\"188\" text-anchor=\"middle\" class=\"s-ts\">Debt (lenders)<\/text><rect x=\"290\" y=\"24\" width=\"100\" height=\"146\" class=\"s-fa step-2\"/><text x=\"340\" y=\"16\" text-anchor=\"middle\" class=\"s-tb step-2\">&#8377;365 Cr<\/text><text x=\"340\" y=\"188\" text-anchor=\"middle\" class=\"s-ts\">Equity (owners)<\/text><text x=\"430\" y=\"100\" class=\"s-ta step-3\">0.68x<\/text><text x=\"430\" y=\"118\" class=\"s-ts step-3\">250 &divide; 365<\/text><\/svg><figcaption>For every rupee from owners, about 68 paise comes from lenders.<\/figcaption><\/figure>","steps":["Lenders have put in 250 crore","Owners' equity is 365 crore","250 over 365 is 0.68x"],"say":"Now compare debt with the owners' money. Masala Mills' lenders have put in 250 crore. Its shareholders' equity is 365. 250 over 365 is 0.68 times: for every rupee from owners, about 68 paise comes from lenders. Zero debt is safe, but cheap debt can lift return on equity, so a debt-free company isn't automatically the better run one."},{"type":"ratio","id":"r-de","say":"Airtel tops the chart at about 1 times, funding spectrum and towers with debt and leases. Tata Steel is close behind at 0.9: it borrowed to build plants and to buy Corus in Europe. The other six sit near zero. Maruti has chosen to stay debt-free for years, and DLF repaid its loans using advances from flat buyers."},{"type":"explain","title":"Interest cover: how many times profit pays the interest","text":"Operating profit, EBIT, divided by the interest cost. The test bites for borrowers near 3x. Very high cover at a debt-free company only means the interest bill is tiny.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">EBIT<\/span><b>&#8377;110 Cr<\/b><small>EBITDA 150 &minus; depreciation 40<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Interest<\/span><b>&#8377;20 Cr<\/b><small>8% on &#8377;250 Cr<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">Interest cover<\/span><b>5.5x<\/b><small>110 &divide; 20<\/small><\/div><\/div>","steps":["Operating profit after depreciation is 110 crore","Interest is 20 crore","110 over 20 is 5.5x"],"say":"Coverage ratios flip the question: can this year's profit pay this year's bills? Interest cover is the simplest. Masala Mills makes 110 crore of operating profit after depreciation and pays 20 of interest. 110 over 20 is 5.5 times. Comfortable. The test starts to bite for borrowers near 3 times."},{"type":"ratio","id":"r-icr","say":"Maruti and TCS top the chart at about 62 and 54 times, but only because they have no borrowings, so the interest bill is tiny. At the bottom, Tata Steel and Airtel, both near 3 times: interest takes about a third of their operating profit. Coverage of 50 times at a debt-free company says little. The test bites for the borrowers near 3."},{"type":"explain","title":"DSCR: interest and repayments together","text":"Interest cover ignores loan installments. DSCR adds them: net profit plus depreciation plus interest, divided by interest plus long-term loan repayments. Below 1x, this year's repayments need new borrowing.","visual":"<div class=\"tacct\"><div class=\"step-1\"><div class=\"th\">Cash earnings<\/div><div class=\"tr\"><span>Net profit<\/span><b>67.5<\/b><\/div><div class=\"tr\"><span>Depreciation<\/span><b>40<\/b><\/div><div class=\"tr\"><span>Interest<\/span><b>20<\/b><\/div><div class=\"tr\"><span><b>Total<\/b><\/span><b>127.5<\/b><\/div><\/div><div class=\"step-2\"><div class=\"th\">Debt service<\/div><div class=\"tr\"><span>Interest<\/span><b>20<\/b><\/div><div class=\"tr\"><span>Loan repayments<\/span><b>30<\/b><\/div><div class=\"tr\"><span><b>Total<\/b><\/span><b>50<\/b><\/div><\/div><\/div><div class=\"formula step-3\">DSCR = 127.5 &divide; 50 = <b>2.55x<\/b><\/div><p class=\"ind\"><b>India:<\/b> DSCR is the covenant Indian project lenders watch.<\/p>","steps":["Cash earnings: 67.5 + 40 + 20 = 127.5","Debt service: 20 of interest + 30 of repayments = 50","127.5 over 50 is 2.55x"],"say":"Interest cover forgets that loans must also be repaid. DSCR adds the installments. On top, a year's cash earnings: net profit of 67.5, plus 40 of depreciation, plus 20 of interest, is 127.5. Below, what lenders are owed this year: 20 of interest and 30 of repayments, 50 in all. 127.5 over 50 is 2.55 times. Indian project lenders watch this one closely."},{"type":"ratio","id":"r-dscr","say":"Only two of the eight have real debt to service, so you see two bars. Airtel's huge cash earnings cover interest and repayments 1.7 times. Tata Steel dips just below 1, at 0.97. For both, repayments include loans they refinanced. Below 1 means this year's repayments need some new borrowing."},{"type":"explain","title":"FCCR: the strictest coverage test","text":"Start from EBITDA, take off capex and tax, and divide by interest, loan repayments and lease payments. It asks if the cash left after keeping the business running covers every fixed charge.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">EBITDA<\/span><b>&#8377;150 Cr<\/b><small>operating profit<\/small><\/div><div class=\"fstep hl2 step-2\"><span class=\"fk\">Less capex<\/span><b>&minus;&#8377;50 Cr<\/b><sm
