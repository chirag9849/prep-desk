levered beta. One business, unlevered beta 0.80, tax 25%:","visual":"<div class=\"formula\">&beta;<sub>L<\/sub> = &beta;<sub>U<\/sub> &times; [1 + (1 &minus; t) &times; D/E]<\/div><table class=\"t compact\"><thead><tr><th>D/E<\/th><th>Equity beta<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0.80<\/td><td>Equity holds only business risk<\/td><\/tr><tr><td>0.5<\/td><td>1.10<\/td><td>Interest paid first; equity swings more<\/td><\/tr><tr><td>1.0<\/td><td>1.40<\/td><td>Same business, even thinner equity<\/td><\/tr><\/tbody><\/table>","say":"Here is the mechanism. Debt adds no business risk. It takes the same operating swings and loads them onto a thinner slice of equity, because interest gets paid first. So levered beta is always at or above unlevered beta. One business with an unlevered beta of point eight becomes one point one at a debt to equity of half, and one point four at one to one."},{"type":"explain","title":"Unlever each peer, take the median, relever once","text":"A peer's observed beta mixes business risk with its own debt. Strip each peer's debt, take the median, then add back Masala Mills' D/E of 0.5. Tax 25%.","visual":"<div class=\"formula\">&beta;<sub>U<\/sub> = &beta;<sub>L<\/sub> &divide; [1 + (1 &minus; t) &times; D/E]<\/div><table class=\"t compact\"><thead><tr><th>Peer (&beta;<sub>L<\/sub>, D/E)<\/th><th>Unlevered<\/th><\/tr><\/thead><tbody><tr><td>A (1.00, 0.30)<\/td><td>0.82<\/td><\/tr><tr><td>B (0.90, 0.10)<\/td><td>0.84<\/td><\/tr><tr><td>C (1.20, 0.80)<\/td><td>0.75<\/td><\/tr><tr><td>D (0.95, 0.25)<\/td><td>0.80<\/td><\/tr><tr><td><b>Median<\/b><\/td><td><b>0.81<\/b><\/td><\/tr><tr><td>Masala Mills relevered at D/E 0.5<\/td><td><b>0.81 &times; 1.375 = 1.11<\/b><\/td><\/tr><\/tbody><\/table>","say":"Here is the routine. Unlever each peer at its own debt to equity, leaving pure business risk. Peer A's one point zero becomes point eight two, peer C's one point two becomes point seven five. Take the median, point eight one. Then relever once at Masala Mills' own debt to equity of half: point eight one times one point three seven five is one point one one."},{"type":"number","q":"Peer A: levered beta 1.00, D/E 0.30, tax 25%. Unlevered beta, to two decimals?","answer":0.82,"tol":0.01,"unit":"","why":"1.00 / (1 + 0.75 x 0.30) = 1.00 / 1.225 = 0.816, about 0.82. Divide to unlever, multiply to relever.","say":"Do one yourself. Peer A has a levered beta of one point zero and debt to equity of point three. Tax is twenty five per cent. What is its unlevered beta, to two decimals?"},{"type":"number","q":"Masala Mills: unlevered median 0.81, D/E 0.5 (debt 500, market cap 1,000), tax 25%. Relevered beta, to two decimals?","answer":1.11,"tol":0.01,"unit":"","why":"0.81 x (1 + 0.75 x 0.5) = 0.81 x 1.375 = 1.11. This is the beta that fed Ke of 15% in the last lesson.","say":"Now relever for Masala Mills. Unlevered median point eight one, debt five hundred against a market cap of one thousand, tax twenty five per cent. What is the relevered beta, to two decimals?"},{"type":"mcq","q":"Your colleague skips the unlevering and averages the four levered betas: 1.01. What happens to Masala Mills' value?","options":["Nothing, the difference is noise","Ke is about 0.7 points too low, so value is overstated","Ke is too high, so value is understated","Only the bridge changes"],"answer":1,"why":"Ke = 7.14 + 1.01 x 7.08 = 14.3% against the right 15.0%. A lower discount rate inflates every cash flow and the terminal value most. Peer leverage was baked in.","say":"Your colleague skips the unlevering and just averages the four levered betas, getting one point zero one. What does that do to Masala Mills' valuation? Work out the direction first, then the size."},{"type":"explain","title":"Why one regression beta can't be trusted","text":"A single regression beta looks backward, carries the leverage of its sample window, and swings with the index and period you pick. A relevered peer median reads business risk more cleanly.","visual":"<div class=\"cmp\"><div class=\"cmp-c b\"><h4>Regression beta flaws<\/h4><ul><li>Backward looking: fit to past returns<\/li><li>Noisy: index, window, one-off events<\/li><li>Carries the sample period's leverage<\/li><\/ul><\/div><div class=\"cmp-c a\"><h4>Industry beta fixes<\/h4><ul><li>Averaging peers cancels company noise<\/li><li>Unlevering removes each peer's debt<\/li><li>Relevering uses today's structure<\/li><li>Works for private firms and divisions<\/li><\/ul><\/div><\/div>","say":"Why not just regress Masala Mills' own stock against the Nifty? One regression beta is noisy: change the index or the window and it moves. It looks backward, and it carries whatever debt the company had during the sample. Averaging peers cancels the noise, unlevering removes their debt, and relevering uses today's structure. It also works for private companies, which have no stock to regress."},{"type":"mcq","q":"Equity costs 15%, debt 6% after tax. Why doesn't Masala Mills fund itself entirely with debt?","options":["Regulators forbid it","Both Kd and Ke rise with leverage; past an optimum, distress costs beat the tax shield and WACC turns up","Debt has no tax shield","Shareholders would own less"],"answer":1,"why":"WACC is U-shaped. Cheap deductible debt lowers it at first; then default risk lifts both the cost of debt and the equity beta, and WACC rises.","say":"Equity costs fifteen per cent, debt six after tax. So why doesn't Masala Mills fund everything with debt? Give the mechanism, not just the slogan."},{"type":"reveal","q":"What is the impact of leverage on a company's beta, and what is the typical relationship between beta and the amount of leverage used?","tag":"Your miss","a":"<p>Debt adds no business risk; it piles the same swings onto a <b>thinner equity base<\/b>, because interest is paid first. So levered beta is never below unlevered beta: &beta;<sub>L<\/sub> = &beta;<sub>U<\/sub> &times; [1 + (1 &minus; t) &times; D/E]. In practice the relationship runs the other way: stable, low-beta businesses carry the most debt, because lenders trust their cash flows.<\/p>","say":"Your miss, both halves. What does leverage do to beta, and what is the typical real world relationship between beta and how much a company borrows? Mechanism first, then the pattern. Then reveal."},{"type":"reveal","q":"What are the flaws of regression betas, and what are the benefits of the industry beta approach?","tag":"Your miss","a":"<p><b>Regression flaws:<\/b> backward looking, fit to past returns; noisy, since the index, window and one-off events swing it; and it carries the leverage of the sample period. <b>Industry beta benefits:<\/b> averaging peers cancels company-specific noise; unlevering strips each peer's debt; relevering applies the target's current structure; and it works for private companies and divisions with no traded stock.<\/p>","say":"Your miss, the flaws entirely. What is wrong with a single regression beta, and what does the industry beta approach fix? Three flaws, four fixes. Say them, then reveal."},{"type":"reveal","q":"No listed company does exactly what your quick commerce target does. How do you still build a beta from market data, step by step?","tag":"Your miss","a":"<p>Pick <b>4 to 6 peers<\/b> in the same or an adjacent business: global quick commerce names alongside adjacent Indian listcos if needed. <b>Unlever<\/b> each peer's beta to strip its capital structure. <b>Average<\/b> the unlevered betas to cancel company noise. <b>Relever<\/b> at the target's own D/E and tax rate: &beta;<sub>L<\/sub> = &beta;<sub>U<\/sub> &times; (1 + (1 &minus; t) &times; D/E). No clean peers at all: a cyclicality read plus a size premium.<\/p>","say":"Your miss, the order and the fallback. No listed company does exactly what your quick commerce target does. How do you still build a beta from market data? Four steps in order, then reveal."},{"type":"reveal","q":"Two companies have the same total leverage ratio, identical free cash flows and margins. Same default risk?","tag":"Your miss","a":"<p><b>No.<\/b> Default is cash missing on a payment date, and a debt/EBITDA ratio hides what decides that: cash on hand (net debt), when the debt falls due (a maturity wall next year against ten spread years), fixed or floating rates in a rising-rate world, and covenant headroom. Lenders look past the headline ratio to all four.<\/p>","say":"Your miss. Two companies, same total leverage ratio, identical cash flows and margins. Do they carry the same default risk? Answer, then list what the ratio hides. Then reveal."},{"type":"recap","points":["Beta is market risk only; cyclical demand and debt push it up","Debt loads the same swings on thinner equity: levered beta is never below unlevered","Unlever each peer, take the median (0.81), relever at your D/E: Masala Mills 1.11","Averaging levered betas bakes peer debt in and understates Ke"],"say":"What to keep. Beta is market risk only, pushed up by cyclical demand and by debt. Debt loads the same swings on a thinner equity base, so levered beta is never below unlevered. Unlever each peer, take the median, relever at your own debt to equity: Masala Mills lands at one point one one. Average the levered betas and you understate the cost of equity."}]},{"id":"val-06","module":"val","title":"The DCF, step by step","mins":8,"blurb":"Five years of cash, one terminal value, a 12% WACC and a bridge. Out comes Rs 118.6 a share for a stock trading at Rs 100.","slides":[{"type":"hook","title":"Rs 100 on the screen, Rs 119 in the model","text":"You have Masala Mills' cash flows (lesson 3), its WACC of 12% (lessons 4 and 5) and its bridge (lesson 2). Now assemble them. Sixty seconds, five steps, one number.","visual":"<div class=\"flow\"><div class=\"fstep\"><span class=\"fk\">1<\/span><b>Forecast FCFF<\/b><\/div><div class=\"fstep\"><span class=\"fk\">2<\/span><b>Terminal value<\/b><\/div><div class=\"fstep\"><span class=\"fk\">3<\/span><b>Discount at WACC<\/b><\/div><div class=\"fstep\"><span class=\"fk\">4<\/span><b>Bridge to equity<\/b><\/div><div class=\"fstep hl\"><span class=\"fk\">5<\/span><b>Per share<\/b><\/div><\/div>","say":"You already have every part. Masala Mills' cash flows from lesson three, its twelve per cent WACC from lessons four and five, its bridge from lesson two. Now you assemble them into the answer an interviewer wants in about sixty seconds. Five steps, one number: one hundred and eighteen rupees sixty, against a share price of one hundred."},{"type":"order","q":"Walk me through a DCF. Put the steps in order.","items":["Forecast unlevered free cash flow for 5 to 10 years, until the business is steady","Estimate a terminal value for every year after that","Discount the cash flows and the terminal value at WACC to get enterprise value","Bridge to equity: subtract net debt, preference shares and minority interest, add associates","Divide by diluted shares and sensitise WACC and g"],"why":"Forecast, terminal value, discount to EV, bridge, per share. The step candidates drop is the bridge: preference shares and minority interest come out too, not just debt.","say":"Walk me through a DCF. Put the five steps in the order you would say them. The one most candidates skip or shorten is step four, and the interviewer is listening for it."},{"type":"explain","title":"Step 1 and 2: cash flows and a terminal value","text":"Masala Mills' FCFF grows from 100 to 140 over five years, then settles to 5% growth forever. Rs Cr, WACC 12%.","visual":"<div class=\"minichart\" style=\"--max:150\"><div class=\"mc-legend\"><span><i class=\"mc-a\"><\/i>Forecast FCFF, &#8377; Cr<\/span><span><i class=\"mc-c\"><\/i>First terminal year<\/span><\/div><div class=\"mc-plot\"><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:100\"><em>100<\/em><\/div><span class=\"mc-x\">Y1<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:110\"><em>110<\/em><\/div><span class=\"mc-x\">Y2<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:120\"><em>120<\/em><\/div><span class=\"mc-x\">Y3<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:130\"><em>130<\/em><\/div><span class=\"mc-x\">Y4<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:140\"><em>140<\/em><\/div><span class=\"mc-x\">Y5<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-c\" style=\"--v:147\"><em>147<\/em><\/div><span class=\"mc-x\">Y6 on, +5%<\/span><\/div><\/div><div class=\"mc-xpad\"><\/div><\/div><div class=\"formula\">TV<sub>5<\/sub> = 140 &times; 1.05 &divide; (12% &minus; 5%) = 2,100<\/div>","say":"Steps one and two. Masala Mills' free cash flow to the firm grows from one hundred crore in year one to one forty in year five. After that we assume five per cent growth forever. The terminal value at year five is next year's cash, one forty times one point zero five, divided by WACC minus growth, seven per cent. Two thousand one hundred crore."},{"type":"number","q":"Discount factor for year 5 at 12%: 1 / 1.12^5, to three decimals?","answer":0.567,"tol":0.002,"unit":"","why":"1.12^5 = 1.762, so the factor is 0.567. A rupee in year 5 is worth about 57 paise today at 12%.","say":"Step three starts with discount factors. What is the year five discount factor at twelve per cent, one divided by one point one two to the fifth power, to three decimals?"},{"type":"explain","title":"Step 3: discount everything to today","text":"Each year's cash gets its own factor. The terminal value sits at year 5, so it takes year 5's factor too. Explicit years are worth 424; the terminal value 1,192. EV 1,616.","visual":"<table class=\"t compact\"><thead><tr><th>Piece<\/th><th>Working<\/th><th>PV<\/th><\/tr><\/thead><tbody><tr><td>Years 1 to 5<\/td><td>100, 110, 120, 130, 140 &times; 0.893 to 0.567<\/td><td>424<\/td><\/tr><tr><td>TV at year 5<\/td><td>2,100 &times; 0.567<\/td><td>1,192<\/td><\/tr><tr><td><b>EV<\/b><\/td><td>TV is 74% of it<\/td><td><b>1,616<\/b><\/td><\/tr><\/tbody><\/table><p class=\"trap\"><b>Trap:<\/b> the terminal value is a year-5 number. It still needs discounting.<\/p>","say":"Step three. Discount each year's cash with its own factor: the five explicit years are worth four hundred and twenty four crore today. The terminal value is a year five number, so it takes year five's factor too: two thousand one hundred times point five six seven is one one nine two. Add them: enterprise value one six one six. The terminal value is seventy four per cent of it."},{"type":"number","q":"PV of the terminal value: 2,100 x 0.567. In Rs Cr, nearest whole number?","answer":1192,"tol":3,"unit":"Rs Cr","why":"2,100 x 0.5674 = 1,192. Forgetting this step would add the full 2,100 and overstate EV by about 900.","say":"Discount the terminal value. Two thousand one hundred crore at year five, times the year five factor of point five six seven. Present value in crore?"},{"type":"number","q":"Step 4 and 5: EV 1,616, net debt 380, preference 40, NCI 60, associate +50, 10 Cr diluted shares. Value per share in Rs?","answer":118.6,"tol":0.3,"unit":"Rs","why":"Equity = 1,616 - 380 - 40 - 60 + 50 = 1,186. Over 10 Cr diluted shares: Rs 118.6. The market is at Rs 100.","say":"Steps four and five. Enterprise value one six one six. Subtract net debt three eighty, preference forty, minority interest sixty, add the associate at fifty. Divide by ten crore diluted shares. Value per share in rupees?"},{"type":"explain","title":"How long to forecast, and the mid-year convention","text":"Forecast until the business is steady: growth near g, margins flat, capex near D&amp;A. About 5 years for FMCG, 7 to 10 for cement or ports. Cash arrives through the year, so mid-year discounting uses t &minus; 0.5.","visual":"<table class=\"t compact\"><thead><tr><th>Year<\/th><th>Year-end DF<\/th><th>Mid-year DF<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0.893<\/td><td>0.945<\/td><\/tr><tr><td>5<\/td><td>0.567<\/td><td>0.601<\/td><\/tr><tr><td>EV<\/td><td>1,616<\/td><td>1,710 (+5.8%)<\/td><\/tr><\/tbody><\/table>","say":"Two timing questions interviewers love. How long to forecast? Until the business is steady: growth near the terminal rate, margins flat, capex near depreciation. Five years for a snack maker, seven to ten for cement or ports. And the mid year convention: cash arrives through the year, not on thirty first March, so discount at t minus a half. For Masala Mills that lifts enterprise value about six per cent."},{"type":"mcq","q":"A firecracker maker earns most of its cash in the quarter before Diwali. Mid-year convention?","options":["Yes, it is always more accurate","No: cash lands late in the year, so mid-year overstates value; use year-end or quarters","Yes, but halve the terminal value","No, use beginning-of-year"],"answer":1,"why":"Mid-year assumes cash arrives evenly. Seasonal cash that lands in the last quarter is discounted too little by it, so value is overstated. Go year-end or model quarters.","say":"A firecracker maker earns most of its cash in the quarter before Diwali. Should you use the mid year convention for it? Think about when the cash actually lands."},{"type":"reveal","q":"Walk me through a DCF.","tag":"Your miss","a":"<p>A business is worth the cash it will generate, discounted for time and risk. <b>1. Forecast FCFF<\/b> for 5 to 10 years, until growth and margins settle. <b>2. Terminal value<\/b>: FCFF<sub>N+1<\/sub> &divide; (WACC &minus; g), or final EBITDA &times; a peer multiple. <b>3. Discount<\/b> both at WACC: enterprise value. <b>4. Bridge<\/b>: subtract net debt, leases, preference shares and minority interest, add associates. <b>5. Per share<\/b>: divide by diluted shares, then sensitise WACC and g. Masala Mills: 1,616 EV, 1,186 equity, &#8377;118.6.<\/p>","say":"Your miss, the step you dropped. Walk me through a DCF, in about sixty seconds, and this time say the full bridge: preference shares and minority interest, not just debt. Then reveal."},{"type":"reveal","q":"What is the purpose of the mid-year convention, and when would it be inappropriate?","tag":"Your miss","a":"<p><b>Purpose:<\/b> cash arrives through the year, not on 31 March, so discounting each year at t &minus; 0.5 matches reality and lifts value: &#8377;100 in year 5 at 12% is 56.7 at year-end timing, 60.1 at mid-year, about 5.8% more. <b>Inappropriate<\/b> when cash is seasonal: a winter-apparel retailer or a Diwali-heavy business earns most cash late in the year, so mid-year overvalues it. Go year-end or quarterly.<\/p>","say":"Your miss, the purpose. Why use a mid year convention, how much does it move value, and give one case where it would be wrong. Then reveal."},{"type":"reveal","q":"How do you decide the length of the explicit forecast period, and what goes wrong if you get it wrong?","tag":"Your miss","a":"<p>Length follows when the business <b>normalises<\/b>, not a five-year rule. Stop when growth is near g, margins are mid-cycle, ROIC has stopped climbing and capex is near depreciation. FMCG or IT settles in about 5 years; ports, cement and chemicals need 7 to 10 while plants ramp. Stop mid-transition and the terminal formula carries that unsteady year forever, inflating or crushing 70% of your value.<\/p>","say":"Your miss. How do you decide how many years to forecast explicitly, and what goes wrong if you stop too early? Give the test, not a number. Then reveal."},{"type":"reveal","q":"Your DCF is 40% above the market price. Which inputs do you recheck first, and how large an error would explain a gap that size?","tag":"Your miss","a":"<p><b>WACC and terminal growth<\/b>, because they move value most. With WACC minus g of 5 to 7 points, a WACC 100 to 150 basis points too low, or a g set too close to the risk-free rate, overstates value by 18 to 23% on its own. Then the bridge: minority interest, leases, guarantees, litigation, a subsidiary at cost. Fix these before concluding the market is wrong.<\/p>","say":"Your miss, the order of checks. Your DCF is forty per cent above the market. Which two inputs do you recheck first, and how big an error would it take to explain a gap that size? Then reveal."},{"type":"recap","points":["Forecast FCFF, terminal value, discount at WACC, bridge, per share: say all five","Masala Mills: PV of years 1 to 5 is 424, PV of TV 1,192, EV 1,616, Rs 118.6 a share","The terminal value is a year-5 number: discount it","Forecast until steady state; mid-year convention lifts value about 6% and fails for seasonal cash"],"say":"What to keep. Five steps: forecast firm cash flow, terminal value, discount at WACC, bridge, per share. Masala Mills comes out at one six one six of enterprise value and one eighteen sixty a share. The terminal value is a year five number, so discount it. Forecast until the business is steady, and use mid year timing unless the cash is seasonal."}]},{"id":"val-07","module":"val","title":"Terminal value: where 74% of the answer lives","mins":8,"blurb":"Rs 1,192 Cr of Masala Mills' Rs 1,616 Cr value comes from years you never forecast. Here is how to make that number honest.","slides":[{"type":"hook","title":"The years you never forecast","text":"Masala Mills' five forecast years are worth Rs 424 Cr. Everything after year 5, summed up as one terminal value, is worth Rs 1,192 Cr. Three quarters of the answer rides on one formula. Is that a problem?","visual":"<div class=\"minichart\" style=\"--max:1300\"><div class=\"mc-legend\"><span><i class=\"mc-a\"><\/i>PV of years 1 to 5<\/span><span><i class=\"mc-c\"><\/i>PV of terminal value<\/span><\/div><div class=\"mc-plot\"><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:424\"><em>424<\/em><\/div><span class=\"mc-x\">Forecast<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-c\" style=\"--v:1192\"><em>1,192<\/em><\/div><span class=\"mc-x\">Terminal<\/span><\/div><\/div><div class=\"mc-xpad\"><\/div><\/div>","say":"Here is the uncomfortable truth about Masala Mills' DCF. The five years you carefully forecast are worth four hundred and twenty four crore. Everything after year five, compressed into one terminal value, is worth one thousand one hundred and ninety two. Three quarters of the answer rides on one formula. This lesson is about making that formula honest."},{"type":"explain","title":"Why it divides by WACC minus g","text":"After the forecast, cash grows at g forever. In today's money each year is worth (1 + g) &divide; (1 + WACC) of the one before: discounting shrinks it, growth adds a bit back. That shrinking series sums to next year's cash &divide; (WACC &minus; g).","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 200\" role=\"img\" aria-label=\"Present values of a cash flow of 100 growing at 4 per cent and discounted at 10 per cent shrink by the same ratio each year; the infinite sum is 1,667\"><line x1=\"30\" y1=\"150\" x2=\"548\" y2=\"150\" class=\"s-mline\"/><rect x=\"40\" y=\"41\" width=\"32\" height=\"109\" rx=\"3\" class=\"s-boxa\"/><text x=\"56\" y=\"36\" text-anchor=\"middle\" class=\"s-ts\">91<\/text><text x=\"56\" y=\"166\" text-anchor=\"middle\" class=\"s-ts\">Y1<\/text><rect x=\"84\" y=\"47\" width=\"32\" height=\"103\" rx=\"3\" class=\"s-boxa\"/><text x=\"100\" y=\"42\" text-anchor=\"middle\" class=\"s-ts\">86<\/text><text x=\"100\" y=\"166\" text-anchor=\"middle\" class=\"s-ts\">Y2<\/text><rect x=\"128\" y=\"53\" width=\"32\" height=\"97\" rx=\"3\" class=\"s-boxa\"/><text x=\"144\" y=\"48\" text-anchor=\"middle\" class=\"s-ts\">81<\/text><text x=\"144\" y=\"166\" text-anchor=\"middle\" class=\"s-ts\">Y3<\/text><rect x=\"172\" y=\"58\" width=\"32\" height=\"92\" rx=\"3\" class=\"s-boxa\"/><text x=\"188\" y=\"53\" text-anchor=\"middle\" class=\"s-ts\">77<\/text><text x=\"188\" y=\"166\" text-anchor=\"middle\" class=\"s-ts\">Y4<\/text><rect x=\"216\" y=\"63\" width=\"32\" height=\"87\" rx=\"3\" class=\"s-boxa\"/><text x=\"232\" y=\"58\" text-anchor=\"middle\" class=\"s-ts\">73<\/text><text x=\"232\" y=\"166\" text-anchor=\"middle\" class=\"s-ts\">Y5<\/text><rect x=\"260\" y=\"67\" width=\"32\" height=\"83\" rx=\"3\" class=\"s-boxa\"/><text x=\"276\" y=\"62\" text-anchor=\"middle\" class=\"s-ts\">69<\/text><text x=\"276\" y=\"166\" text-anchor=\"middle\" class=\"s-ts\">Y6<\/text><rect x=\"304\" y=\"72\" width=\"32\" height=\"78\" rx=\"3\" class=\"s-boxa\"/><text x=\"320\" y=\"67\" text-anchor=\"middle\" class=\"s-ts\">65<\/text><text x=\"320\" y=\"166\" text-anchor=\"middle\" class=\"s-ts\">Y7<\/text><rect x=\"348\" y=\"76\" width=\"32\" height=\"74\" rx=\"3\" class=\"s-boxa\"/><text x=\"364\" y=\"71\" text-anchor=\"middle\" class=\"s-ts\">61<\/text><text x=\"364\" y=\"166\" text-anchor=\"middle\" class=\"s-ts\">Y8<\/text><rect x=\"400\" y=\"46\" width=\"140\" height=\"104\" rx=\"4\" class=\"s-boxg\"/><text x=\"470\" y=\"90\" text-anchor=\"middle\" class=\"s-tb\">Y9 to forever<\/text><text x=\"470\" y=\"110\" text-anchor=\"middle\" class=\"s-tb\">sums to 1,667 in all<\/text><text x=\"40\" y=\"190\" class=\"s-t\">Each bar = previous &times; 1.04 &divide; 1.10 = 0.945. All bars sum to 100 &divide; (10% &minus; 4%).<\/text><\/svg><figcaption>Cash 100 growing 4%, discounted at 10%. An infinite shrinking series has a finite sum.<\/figcaption><\/figure>","say":"Why divide by WACC minus g? After the forecast, cash grows at g forever. In today's money each year is worth one plus g over one plus WACC of the year before. Discounting shrinks it, growth adds a little back. A series shrinking by a fixed ratio has a finite sum: next year's cash over WACC minus g. Growth close to WACC means almost no shrinking, so the sum explodes."},{"type":"number","q":"Masala Mills: year 5 FCFF 140, g 5%, WACC 12%. Terminal value at year 5 in Rs Cr?","answer":2100,"tol":5,"unit":"Rs Cr","why":"140 x 1.05 = 147 is year 6 cash. 147 / (0.12 - 0.05) = 2,100. The numerator is next year's cash, not 140.","say":"Compute Masala Mills' terminal value. Year five free cash flow one forty, growth five per cent, WACC twelve. Terminal value at year five, in crore? Watch the numerator."},{"type":"mcq","q":"An intern sets Masala Mills' terminal growth at 9%. What breaks?","options":["Nothing, 9% is India's nominal GDP growth","The firm would outgrow the economy forever, and WACC minus g shrinks to 3%, tripling the TV","Only the discount factor changes","The bridge no longer balances"],"answer":1,"why":"g is forever. Nothing outgrows the economy forever, so g stays below the risk-free rate (7.14%), typically 4 to 6% in rupees. At 9%, TV jumps from 2,100 to about 5,087.","say":"An intern sets Masala Mills' terminal growth at nine per cent, arguing that India grows at that rate in nominal terms. What breaks? Two things, one economic and one mathematical."},{"type":"explain","title":"The exit multiple, and checking one method against the other","text":"The exit multiple prices Masala Mills as if sold at year 5: EBITDA<sub>5<\/sub> of 250 &times; a mature EV/EBITDA. Easy to defend, but it imports today's market mood into 74% of the DCF. So test each method with the other.","visual":"<div class=\"fgrid\"><div class=\"fcard\"><div class=\"fname\">Exit TV: implied g<\/div><div class=\"fx\">(TV &times; WACC &minus; FCF<sub>N<\/sub>) &divide; (TV + FCF<sub>N<\/sub>)<\/div><div class=\"fnote\">10x &times; 250 = 2,500: (300 &minus; 140) &divide; 2,640 = 6.1%<\/div><\/div><div class=\"fcard\"><div class=\"fname\">Gordon TV: implied multiple<\/div><div class=\"fx\">TV &divide; EBITDA<sub>N<\/sub><\/div><div class=\"fnote\">2,100 &divide; 250 = 8.4x, against mature peers<\/div><\/div><\/div>","say":"The other route is an exit multiple: price Masala Mills as if sold at year five, say ten times its year five EBITDA of two fifty, so two thousand five hundred. Easy to defend in a room, but it copies today's market pricing into most of your intrinsic value. So cross check. Back out the growth the multiple implies, and the multiple your growth implies."},{"type":"number","q":"Exit TV 2,500 at 10x, year 5 FCFF 140, WACC 12%. Implied perpetual growth in %, one decimal?","answer":6.1,"tol":0.1,"unit":"%","why":"(2,500 x 0.12 - 140) / (2,500 + 140) = 160 / 2,640 = 6.1%. That is above your 5% and close to the risk-free rate, so 10x is probably a growth-phase multiple.","say":"Back it out. An exit value of two thousand five hundred at ten times, year five cash of one forty, WACC twelve. What perpetual growth rate does that multiple imply, in per cent to one decimal?"},{"type":"number","q":"Gordon TV 2,100, year 5 EBITDA 250. Implied EV/EBITDA, one decimal?","answer":8.4,"tol":0.05,"unit":"x","why":"2,100 / 250 = 8.4x. Fine if mature snack peers trade near 8 to 9x; a red flag if they trade at 15x.","say":"And the other way. Your Gordon terminal value is two thousand one hundred, year five EBITDA two fifty. What exit multiple does your growth assumption imply, to one decimal?"},{"type":"explain","title":"The 80% problem is really a final-year problem","text":"60 to 80% in the TV is normal; it stands in for every later year. The risk is the final year, because the formula repeats it forever. It needs a mid-cycle margin, marginal tax, capex near D&amp;A, and reinvestment that funds g.","visual":"<div class=\"formula\">Reinvestment rate = g &divide; ROIC<\/div><table class=\"t compact\"><thead><tr><th>NOPAT 200, g 5%, WACC 12%<\/th><th>FCF<sub>N+1<\/sub><\/th><th>TV<\/th><\/tr><\/thead><tbody><tr><td>No reinvestment<\/td><td>200<\/td><td>2,857<\/td><\/tr><tr><td>ROIC 15%: reinvest 33%<\/td><td>133<\/td><td>1,905<\/td><\/tr><tr><td>ROIC 12%: reinvest 42%<\/td><td>117<\/td><td>1,667<\/td><\/tr><\/tbody><\/table>","say":"So is seventy four per cent a problem? Not by itself. Sixty to eighty is normal, because the terminal value stands in for every later year. The real risk is the final year, which the formula repeats forever. Growth needs reinvestment: to grow at five per cent with a fifteen per cent return, a third of profit must be reinvested. Assume none and the terminal value is overstated by half."},{"type":"number","q":"Terminal g 5%, terminal-year ROIC 15%. What share of NOPAT must be reinvested, in %?","answer":33.3,"tol":0.5,"unit":"%","why":"g / ROIC = 5 / 15 = 33.3%. If the model's terminal year reinvests far less than that, the growth is unfunded and the TV is too high.","say":"Run the thirty second check. Terminal growth five per cent, return on invested capital fifteen. What share of profit must be reinvested every year to fund that growth, in per cent?"},{"type":"reveal","q":"You compute terminal value both ways and the answers disagree sharply. How do you reconcile them, and what does a big gap tell you?","tag":"Your miss","a":"<p>Back out the perpetual growth the exit multiple implies and set it against your Gordon g. For Masala Mills, 10x implies <b>6.1%<\/b> against a 5% assumption. A wide gap means one assumption is wrong, or the exit multiple is not a mature, steady-state one: a growth-phase peer multiple applied to a terminal year. The multiple is the cross-check, not the anchor.<\/p>","say":"Your miss, the last step you forgot. Terminal value both ways, and the two answers disagree sharply. How do you reconcile them, and what does a big gap tell you? Then reveal."},{"type":"reveal","q":"Most of your DCF value sits in the terminal value. What concrete steps in the model reduce that dependence, or at least expose it?","tag":"Your miss","a":"<p><b>Extend<\/b> the explicit period for a business still in a growth or capex transition, so less rides on one terminal-year snapshot. <b>Sensitise<\/b>: show the TV across a band of WACC and g, not one number. <b>Cross-check<\/b> with the exit multiple and where mature peers trade, so the terminal assumption ties to something observable. And say the share out loud: 60 to 80% is normal.<\/p>","say":"Your miss, the handling. Most of your value sits in the terminal value. What three concrete steps in the model reduce that dependence or at least expose it? Then reveal."},{"type":"reveal","q":"Your terminal growth rate is sensible, but is the terminal year's cash flow a true steady state? Which lines would you inspect, and what should each look like?","tag":"Your miss","a":"<p><b>Capex vs depreciation:<\/b> close, adjusted for inflation, since the firm is only replacing assets; capex well above D&amp;A is growth that belongs in the explicit period. <b>Margin:<\/b> mid-cycle and sustainable, not a peak or trough year carried forever. <b>Working capital:<\/b> the change shrinks to fit modest steady growth. <b>Reinvestment<\/b> = g &divide; ROIC, consistent with the growth you assume.<\/p>","say":"Your miss, all of it. The growth rate is sensible, but is the terminal year's cash flow a true steady state? Name the lines you would inspect and what each should look like. Then reveal."},{"type":"reveal","q":"What is the argument against using the exit multiple approach in a DCF?","tag":"Your miss","a":"<p>A DCF is meant to be <b>intrinsic<\/b>, but an exit multiple copies today's peer pricing into the terminal value, which is 60 to 80% of the answer. A sector-wide mispricing flows straight into your intrinsic value. It also hides a growth assumption inside a multiple instead of stating it. Use it as a cross-check: back out the implied g and compare.<\/p>","say":"Your miss, half the critique. What is the argument against using an exit multiple for the terminal value in a DCF? Two points, then reveal."},{"type":"recap","points":["TV = next year's cash over WACC minus g; a shrinking series summed to infinity","Masala Mills: 140 x 1.05 / 7% = 2,100, worth 1,192 today, 74% of EV; normal","Cross-check: 10x exit implies 6.1% growth; 5% growth implies 8.4x","The final year must be steady: capex near D&A, mid-cycle margin, reinvestment = g / ROIC"],"say":"What to keep. Terminal value is next year's cash over WACC minus g, the sum of a shrinking series. Masala Mills' is two thousand one hundred, worth one one nine two today, seventy four per cent of the value, which is normal. Cross check each method against the other. And make the final year steady: capex near depreciation, mid cycle margin, reinvestment equal to g over return on capital."}]},{"id":"val-08","module":"val","title":"What-if drills: change one input, trace the chain","mins":7,"blurb":"Tax falls. Masala Mills borrows Rs 400 Cr. Beta jumps. Rates drop. Each one is a question in the room, and each one has a chain.","slides":[{"type":"hook","title":"The chain every what-if follows","text":"Every \"what happens to your DCF if...\" question has the same answer shape: cash flow, WACC, EV, bridge, shares. Most wrong answers stop at the first link. Masala Mills starts at Rs 118.6.","visual":"<div class=\"flow\"><div class=\"fstep\"><span class=\"fk\">1<\/span><b>Cash flow<\/b><\/div><div class=\"fstep\"><span class=\"fk\">2<\/span><b>WACC<\/b><\/div><div class=\"fstep\"><span class=\"fk\">3<\/span><b>EV<\/b><\/div><div class=\"fstep\"><span class=\"fk\">4<\/span><b>Bridge<\/b><\/div><div class=\"fstep hl\"><span class=\"fk\">5<\/span><b>Per share<\/b><\/div><\/div>","say":"Every what if question about a DCF has the same answer shape. Trace the chain: what happens to cash flow, what happens to WACC, so what happens to enterprise value, then the bridge, then the share count. Most wrong answers stop at the first link. Masala Mills starts this lesson at one eighteen sixty a share. Let's push it around."},{"type":"mcq","q":"The government cuts corporate tax. Masala Mills' DCF value goes...","options":["Up: NOPAT rises, end of story","Up, but less than NOPAT suggests: WACC also rises through Kd(1 - t) and a higher levered beta","Down: the tax shield shrinks","Unchanged: tax is not in a DCF"],"answer":1,"why":"NOPAT = EBIT x (1 - t) rises. But the after-tax cost of debt rises too, and levered beta rises because less tax relief puts more debt risk on shareholders. Net up, by less the more debt there is.","say":"First drill. The government cuts the corporate tax rate. What happens to Masala Mills' DCF value? Follow the chain past the first link before you answer."},{"type":"explain","title":"Tax cut: every channel, with numbers","text":"A drill from 34.94% to 25.17%, EBIT 1,000, unlevered beta 0.8, Rf 7%, ERP 7%, pre-tax Kd 9%. WACC rises twice: through Kd(1 &minus; t) and through the levered beta formula.","visual":"<table class=\"t compact\"><thead><tr><th>Tax 34.94% to 25.17%<\/th><th>D/E 0.2<\/th><th>D/E 1.5<\/th><\/tr><\/thead><tbody><tr><td>NOPAT<\/td><td>651 to 748<\/td><td>651 to 748<\/td><\/tr><tr><td>Levered beta<\/td><td>0.90 to 0.92<\/td><td>1.58 to 1.70<\/td><\/tr><tr><td>WACC<\/td><td>12.1% to 12.3%<\/td><td>10.7% to 11.6%<\/td><\/tr><tr><td><b>EV = NOPAT &divide; WACC<\/b><\/td><td><b>+12.8%<\/b><\/td><td><b>+6.5%<\/b><\/td><\/tr><\/tbody><\/table><p class=\"key\">Then deferred tax is remeasured once, and the case for carrying debt weakens.<\/p>","say":"The tax cut with numbers, from thirty five per cent to twenty five point one seven. Profit after tax jumps fifteen per cent. But WACC rises twice: the after tax cost of debt goes up, and levered beta goes up, since less tax relief leaves more debt risk on shareholders. A low debt firm gains thirteen per cent of value; a high debt firm only six and a half."},{"type":"mcq","q":"Masala Mills borrows Rs 400 Cr more. What happens to its enterprise value?","options":["Up by 400","Down by 400","Barely moves: EV is before financing; the only gain is the tax shield, less distress risk","Up by the interest saved"],"answer":2,"why":"EV values the operating business before financing. A modest raise nudges WACC down; a large one pushes it up. The debt itself adds at most the tax shield, about 25% x 400 = 100 if permanent.","say":"Second drill. Masala Mills raises four hundred crore of new debt. What happens to its enterprise value? Remember what enterprise value is meant to ignore."},{"type":"explain","title":"More debt: follow the proceeds for the per-share answer","text":"EV barely moves. Value per share depends on what the Rs 400 Cr does. Equity 1,186, 10 Cr shares, Rs 118.6 before the raise:","visual":"<table class=\"t compact\"><thead><tr><th>Use of the &#8377;400 Cr<\/th><th>Per share<\/th><\/tr><\/thead><tbody><tr><td>Hold as cash<\/td><td>&#8377;118.6 (net debt unchanged)<\/td><\/tr><tr><td>&#8377;40 special dividend<\/td><td>&#8377;78.6 + &#8377;40 cash<\/td><\/tr><tr><td>Buy back at &#8377;118.6<\/td><td>&#8377;118.6 (6.63 Cr shares)<\/td><\/tr><tr><td>Project worth &#8377;500 Cr<\/td><td><b>&#8377;128.6<\/b><\/td><\/tr><\/tbody><\/table>","say":"Per share depends on where the four hundred crore goes. Held as cash, net debt is unchanged and the share stays at one eighteen sixty. Paid out as a forty rupee dividend, the share drops to seventy eight sixty but you hold forty in cash. A fair value buyback changes nothing. Only a project worth more than it costs lifts value: five hundred for four hundred adds ten rupees."},{"type":"mcq","q":"Masala Mills' beta rises from 1.11 to 1.30, nothing else changes. Share value?","options":["Up: higher beta means higher growth","Down, and the terminal value takes the biggest hit","Unchanged: beta only affects Ke, not WACC","Down, but only years 1 to 5 are affected"],"answer":1,"why":"Ke rises about 1.3 points, WACC about 0.9, and every cash flow is discounted harder. The TV sits furthest out and is 74% of value, so it absorbs most of the damage.","say":"Third drill. Masala Mills' beta rises from one point one one to one point three, nothing else changes. Which way does the share value go, and which part of the DCF takes the biggest hit?"},{"type":"mcq","q":"Which moves Masala Mills' DCF more: WACC up 1 point, or sales growth up 1 point a year for the five forecast years?","options":["Sales growth, it compounds","WACC: it hits every cash flow and the TV; EV falls about 13% versus a 4% gain from growth","They are equal","Neither moves it much"],"answer":1,"why":"At WACC 13%, EV falls from 1,616 to about 1,411, down 13%. One extra point of growth for five years lifts EV only about 4%, because it never reaches the terminal rate.","say":"Fourth drill, the classic. Which moves Masala Mills' value more: the discount rate up one point, or sales growth up one point a year for the five forecast years? Have a number ready to prove it."},{"type":"explain","title":"Prove it with a grid","text":"WACC and g sit in the same denominator and compound over an infinite stream. Show the grid, never just assert it. Masala Mills, value per share in rupees:","visual":"<table class=\"t compact\"><thead><tr><th>Value per share<\/th><th>g 4%<\/th><th>g 5%<\/th><th>g 6%<\/th><\/tr><\/thead><tbody><tr><td>WACC 11%<\/td><td>124<\/td><td>146<\/td><td>177<\/td><\/tr><tr><td>WACC 12%<\/td><td>103<\/td><td><b>119<\/b><\/td><td>140<\/td><\/tr><tr><td>WACC 13%<\/td><td>86<\/td><td>98<\/td><td>113<\/td><\/tr><\/tbody><\/table>","say":"Here is the grid that proves it. Masala Mills' value per share across WACC from eleven to thirteen per cent and terminal growth from four to six. The base case is one nineteen. One point of WACC either way moves it by about twenty rupees. One point of terminal growth moves it by a similar amount, because both act through the same denominator, WACC minus g."},{"type":"number","q":"From the grid logic: Masala Mills at WACC 13%, g 5%. Value per share in Rs, nearest rupee?","answer":98,"tol":1.5,"unit":"Rs","why":"EV falls to about 1,411; equity 981 over 10 Cr shares is about Rs 98. One point of WACC took Rs 21 off the share.","say":"Read one cell yourself. Masala Mills at a WACC of thirteen per cent and terminal growth of five. What is the value per share in rupees, to the nearest rupee?"},{"type":"mcq","q":"A rival grows 5% forever but earns only 8% on new capital against a 12% WACC. Is that growth creating value?","options":["Yes, growth always adds value","No: at ROIC below WACC, growth destroys value; the firm is worth less than with no growth at all","Only if margins are stable","Yes, because the TV rises"],"answer":1,"why":"NOPAT 100, WACC 12%, g 5%: value is 1,071 at a 20% return, 833 at 12% (same as zero growth), and 536 at 8%. Growth is worth something only when new capital earns above WACC.","say":"Last drill. A rival snack maker grows five per cent forever but earns only eight per cent on the capital it reinvests, against a twelve per cent WACC. Is that growth creating value? Think about what growth costs."},{"type":"reveal","q":"How does a lower tax rate affect a DCF valuation? Walk me through everything that changes.","tag":"Your miss","a":"<p><b>Cash flow:<\/b> NOPAT = EBIT &times; (1 &minus; t) rises. <b>WACC rises twice:<\/b> Kd(1 &minus; t) goes up, and <b>levered beta<\/b> = &beta;<sub>U<\/sub>[1 + (1 &minus; t)D/E] goes up, since less tax relief leaves more debt risk on shareholders. <b>Net:<\/b> value rises, by less the more debt there is (+12.8% at D/E 0.2, +6.5% at 1.5 in the drill). Then deferred tax is remeasured once, and the target debt level may drift down.<\/p>","say":"Your miss, the one where your note says missed levered beta. A lower tax rate: walk through everything that changes in a DCF, in chain order. Then reveal."},{"type":"reveal","q":"Beyond NOPAT and the cost of debt, what happens on the balance sheet in the year a tax cut is enacted?","tag":"Your miss","a":"<p>Deferred tax assets and liabilities were built at the old rate, so they are <b>remeasured<\/b> at the new one: a one-time, non-cash gain if the company carried a net DTL, a loss if it carried a net DTA. After that, cash taxes paid can diverge from the book tax charge, so forecast cash taxes, not the P&amp;L expense.<\/p>","say":"Your miss. Beyond profit after tax and the cost of debt, what happens on the balance sheet in the year a tax cut is enacted, and what does it mean for the forecast? Then reveal."},{"type":"reveal","q":"How would raising additional debt affect a DCF analysis?","tag":"Your miss","a":"<p>Split <b>EV<\/b> from <b>value per share<\/b>. EV values the business before financing, so it barely moves: a modest raise nudges WACC down through the tax shield, a large one pushes it up as default risk lifts Kd and beta. Per share depends on the proceeds: flat if held as cash or used for a fair-value buyback, down plus cash if paid out, up only if invested above the cost of capital. Masala Mills: &#8377;118.6 to &#8377;128.6 on a 500-for-400 project.<\/p>","say":"Your miss, partly right last time: WACC falls was half the answer. How would raising additional debt affect a DCF? Split the two things it could mean, then reveal."},{"type":"recap","points":["Every what-if: cash flow, WACC, EV, bridge, shares","Tax cut: NOPAT up, WACC up via Kd(1 - t) and levered beta; value up, less if levered","More debt: EV about flat; per share depends on what the cash does","WACC beats growth: one point of WACC moves Masala Mills about Rs 20 a share; growth adds value only when ROIC beats WACC"],"say":"What to keep. Trace every what if through cash flow, WACC, enterprise value, bridge and shares. A tax cut lifts profit but also WACC, so levered firms gain less. More debt barely moves enterprise value; the per share answer follows the cash. And the discount rate beats growth: one point of WACC moves Masala Mills about twenty rupees, while growth only pays when returns beat WACC."}]},{"id":"val-09","module":"val","title":"Trading comps: what the market pays for a snack maker","mins":7,"blurb":"Seven listed peers, multiples from 8x to 25x. Pick the wrong statistic and Masala Mills is worth Rs 60 a share more than it should be.","slides":[{"type":"hook","title":"Seven peers, one number","text":"Listed snack and spice makers trade at 8, 9, 9.5, 10, 11, 12 and 25 times EBITDA. The mean is 12.1x. The median is 10.0x. On Masala Mills' Rs 200 Cr EBITDA that gap is Rs 420 Cr of value. Which one?","visual":"<div class=\"kchips\"><span class=\"kchip\">8x<\/span><span class=\"kchip\">9x<\/span><span class=\"kchip\">9.5x<\/span><span class=\"kchip up\">10x<\/span><span class=\"kchip\">11x<\/span><span class=\"kchip\">12x<\/span><span class=\"kchip dn\">25x<\/span><\/div>","say":"Seven listed snack and spice makers trade between eight and twenty five times EBITDA. The mean is twelve point one, the median ten. On Masala Mills' two hundred crore of EBITDA that is a four hundred and twenty crore difference in enterprise value, more than forty rupees a share. Trading comps are simple arithmetic wrapped around hard judgement. This lesson is the judgement."},{"type":"explain","title":"What a multiple does","text":"Absolute values reflect size, so they cannot be compared. A multiple divides value by a metric and gives a per-unit price: what the market pays for one rupee of EBITDA. Numerator and denominator must belong to the same investors.","visual":"<table class=\"t compact\"><thead><tr><th>Peer (&#8377; Cr)<\/th><th>EV &divide; EBITDA<\/th><th>Price per &#8377;1 of EBITDA<\/th><\/tr><\/thead><tbody><tr><td>Small<\/td><td>2,000 &divide; 200<\/td><td>10.0x<\/td><\/tr><tr><td>Large<\/td><td>20,000 &divide; 2,500<\/td><td>8.0x<\/td><\/tr><\/tbody><\/table><p class=\"trap\"><b>Trap:<\/b> EV &divide; net income mixes all funders' value with shareholders' profit. EV goes with EBITDA or EBIT; equity value goes with net income.<\/p>","say":"What does a multiple actually do? A company worth twenty thousand crore and one worth two thousand cannot be compared directly, because size is in the way. Divide each by its EBITDA and you get a per unit price: ten rupees for every rupee of EBITDA versus eight. Now you can say which is pricier. One rule: the numerator and denominator must belong to the same investors."},{"type":"sort","q":"Building the peer set: operational screen or financial screen?","buckets":["Operational fit","Financial fit"],"items":[["Same products and end markets","Operational fit"],["Market leader or challenger","Operational fit"],["Stage in the life cycle","Operational fit"],["Exposure to cyclicality or seasonality","Operational fit"],["Size: EV, revenue","Financial fit"],["Margin structure","Financial fit"],["Growth, historical and forecast","Financial fit"],["Leverage and ROIC","Financial fit"]],"why":"Operations first, because the multiple reflects demand drivers and competition. Then screen on the financial profile so a scaled leader is not compared with a sub-scale challenger.","say":"Two screens build a peer set. Sort these eight traits into the operational screen, which comes first, and the financial screen, which comes second. Three of the operational ones are the traits people usually skip."},{"type":"order","q":"Spreading comps: put the steps in order","items":["Pick the peer group: listed peers, or recent deals for transaction comps","Read industry research and filings to learn what drives the sector's multiples","Scrub the numbers: strip one-offs, align accounting, calendarize","Benchmark: LTM and forward multiples, range and median","Apply the median to Masala Mills and argue where it sits in the range"],"why":"Peers, context, scrub, benchmark, apply. Reading comes before pulling numbers, so you know what drives multiples before you compute them.","say":"Spreading comps is the mechanical bit, and interviewers ask you to walk through it. Put the five steps in order. Hint: you read before you open a single spreadsheet."},{"type":"explain","title":"Calendarize, then show LTM and forward","text":"Peers with March and December year-ends cover different months. Roll each onto a common period: LTM = last FY &minus; last year's interim + this year's interim. LTM is actual but carries one-offs; forward is what buyers pay for. Show both.","visual":"<div class=\"formula\">LTM = last full year &minus; prior-year interim + current-year interim<\/div><div class=\"cmp\"><div class=\"cmp-c a\"><h4>LTM<\/h4><ul><li>Reported, nothing to forecast<\/li><li>Needs scrubbing for one-offs<\/li><\/ul><\/div><div class=\"cmp-c c\"><h4>Forward (NTM)<\/h4><ul><li>Where the business is heading<\/li><li>Rests on consensus estimates<\/li><\/ul><\/div><\/div>","say":"Most Indian companies close in March; some peers close in December. Calendarize so every multiple covers the same window of the cycle: take the last full year, drop last year's interim period and add this year's. Then show both trailing and forward multiples. Trailing is real but carries one offs. Forward is what buyers pay for. The gap between them tells you what the market expects to change."},{"type":"mcq","q":"Seven peers: 8, 9, 9.5, 10, 11, 12, 25x. The 25x name is a take-private target. Which statistic do you apply to Masala Mills?","options":["Mean 12.1x, every peer counts","Median 10.0x, because one outlier drags the mean","The maximum, to be safe","The minimum, to be conservative"],"answer":1,"why":"The median resists a single extreme value. Six of seven names sit at or below 12x; the mean of 12.1x reflects the outlier, not the group. Mean is fine only for a small, tight set with nothing to exclude.","say":"Seven peers, eight to twenty five times, and the twenty five is a take private target with a deal premium baked in. Which statistic do you apply to Masala Mills, and why?"},{"type":"number","q":"Median 10x on Masala Mills' forward EBITDA of 200. Net debt 380, pref 40, NCI 60, associate +50, 10 Cr shares. Value per share in Rs?","answer":157,"tol":1,"unit":"Rs","why":"EV 2,000; equity 2,000 - 380 - 40 - 60 + 50 = 1,570; Rs 157 a share. The 25th to 75th percentile, 9.25x to 11.5x, gives Rs 142 to 187.","say":"Apply it. Ten times Masala Mills' forward EBITDA of two hundred, then the same bridge as always: net debt three eighty, preference forty, minority sixty, associate plus fifty, ten crore shares. Value per share in rupees?"},{"type":"mcq","q":"Should Masala Mills itself sit inside its own peer group?","options":["Yes, it is the most comparable company of all","No, never look at its own multiple","Leave it out of the set that sets the multiple, but track its own trading range as a separate check","Only if it is the largest"],"answer":2,"why":"Its own price would prop up the yardstick. The counter-argument: if markets get the average right, its price is a valid data point. So exclude it from the median, and show its historical range beside the result.","say":"Should Masala Mills sit inside its own peer group? There is a good argument on each side, and the best answer uses both."},{"type":"mcq","q":"Comps say Masala Mills is cheap against peers at 7.2x. Does that make it undervalued?","options":["Yes, cheap against peers is cheap","Not necessarily: comps are relative; if the whole sector is mispriced, comps cannot see it. A DCF tests the peers","Yes, if the median is above 9x","No, comps never say anything"],"answer":1,"why":"Comps catch one stock mispriced by thin coverage or forced selling. A sector-wide bubble slips through, because the target looks fair against equally inflated peers. Only an intrinsic method catches that.","say":"Masala Mills trades at about seven times EBITDA against a peer median of ten. Cheap against peers. Does that make it undervalued? Think about what comps can and cannot see."},{"type":"reveal","q":"You have pulled each peer's reported numbers. What must you do to them before calculating any multiple?","tag":"Your miss","a":"<p><b>Scrub and normalise.<\/b> Strip out non-recurring items: one-off gains, impairments, restructuring. Adjust for accounting policy differences, such as lease treatment or capitalised development costs. <b>Calendarize<\/b> fiscal year-ends onto a common period, so seasonality and period mismatches do not distort the comparison. Raw reported figures from different companies are rarely like for like.<\/p>","say":"Your miss, steps one to three of spreading. You have pulled each peer's reported numbers. What must you do to them before you compute a single multiple? Three things, then reveal."},{"type":"reveal","q":"Beyond industry, products, customers and channels, what traits of the business itself would you check before calling two companies comparable?","tag":"Your miss","a":"<p>Three operating traits people skip. <b>Market position:<\/b> leader or challenger. <b>Stage in the life cycle:<\/b> growth, mature or declining. <b>Exposure to cyclicality or seasonality.<\/b> These sit in the operating screen, which comes first: a company belongs in the set only if it faces similar demand drivers and competitive dynamics. Then the financial screen: size, margins, growth, leverage, returns.<\/p>","say":"Your miss, the two part screen. Beyond industry and products, what traits of the business itself would you check before calling two companies comparable? Three operating traits, then reveal."},{"type":"reveal","q":"Make the best case for keeping the target in its own peer set. What assumption about markets supports it?","tag":"Your miss","a":"<p>Comps rest on the idea that the market may misprice any single stock but gets the <b>average<\/b> roughly right. If that holds, the target's own price is as valid a data point as any peer's, so there is no principled reason to drop it. The practical compromise: exclude it from the set that sets the applied multiple, and track its own historical trading range as a separate check.<\/p>","say":"Your miss, the counterpoint. Make the best case for keeping the target inside its own peer set, and name the assumption about markets that supports it. Then give the compromise. Then reveal."},{"type":"reveal","q":"What kind of mispricing can a comps analysis never detect, and what do you use to catch it?","tag":"Your miss","a":"<p>A <b>sector-wide<\/b> mispricing. Comps are a relative check, not an absolute one: if a whole peer group is overvalued together, as in a bubble, the target looks fairly priced against equally inflated peers. Catching that needs an intrinsic valuation such as a DCF, which values the cash flows on their own terms. Comps test the price against peers; the DCF tests whether the peers are right.<\/p>","say":"Your miss. What kind of mispricing can comps never detect, and what do you use to catch it? One sentence each, then reveal."},{"type":"recap","points":["A multiple is a per-unit price; pair EV with EBITDA, equity value with net income","Operational screen first, then financial; 4 to 8 names; target out of the median","Peers, read, scrub and calendarize, benchmark LTM and forward, apply the median","Masala Mills at 10x: EV 2,000, Rs 157 a share; range Rs 142 to 187; cheap against peers is not cheap in absolute terms"],"say":"What to keep. A multiple is a per unit price, and the numerator must match the denominator's owners. Screen peers on operations first, then financials, and keep the target out of the median. Read, scrub, calendarize, benchmark, apply. Masala Mills at the ten times median is one fifty seven a share. And cheap against peers is never cheap in absolute terms."}]},{"id":"val-10","module":"val","title":"Precedents and the price of control","mins":6,"blurb":"A buyer wants all of Masala Mills. Shareholders can sell at Rs 100 any day they like. Why would any of them accept Rs 100?","slides":[{"type":"hook","title":"Nobody sells control at the market price","text":"A packaged-foods major wants 100% of Masala Mills. The stock is at Rs 100. Every holder can sell at Rs 100 today without the buyer. So the offer has to be more. How much more, and why?","visual":"<div class=\"flow\"><div class=\"fstep\"><span class=\"fk\">Unaffected<\/span><b>&#8377;100<\/b><small>before any leak<\/small><\/div><div class=\"fstep hl2\"><span class=\"fk\">+ Premium<\/span><b>?<\/b><\/div><div class=\"fstep hl\"><span class=\"fk\">Offer<\/span><b>?<\/b><small>what precedents record<\/small><\/div><\/div>","say":"A packaged foods major wants all of Masala Mills. The stock trades at one hundred rupees, and every holder can sell at one hundred today without the buyer's help. So why would anyone tender at one hundred? They won't. The offer has to be higher, and the record of how much higher is what precedent transactions capture."},{"type":"mcq","q":"Why is a control premium paid? Pick the complete answer.","options":["Because buyers are generous","To make holders give up a liquid stake they could sell any day, and because control itself is worth more: strategy, all the cash, synergies","Only because of synergies","Because SEBI requires 30%"],"answer":1,"why":"Two reasons, always both. Holders must be paid to give up a liquid minority stake. And a controller can set strategy and capital structure, take 100% of the cash flows and capture synergies.","say":"Why is a control premium paid? Most candidates give one reason and stop. There are two, and the interviewer is waiting for the second. Pick the option that gives both."},{"type":"number","q":"Precedents in packaged foods show premiums around 30% to the unaffected price. Masala Mills at Rs 100. Offer price in Rs?","answer":130,"tol":0.5,"unit":"Rs","why":"100 x 1.30 = 130. The unaffected price is the one before any leak or rumour, not the price after the market started guessing.","say":"Put a number on it. Precedent deals in packaged foods show premiums of about thirty per cent to the undisturbed share price. Masala Mills trades at one hundred before any leak. What offer price does that imply, in rupees?"},{"type":"explain","title":"What pushes a premium higher","text":"Competition, scarcity and a turnaround story lift the premium. So does a buyer who thinks the target is cheap: a 30% premium can still sit below its own view of fair value.","visual":"<table class=\"t compact\"><thead><tr><th>Driver<\/th><th>Why the price goes up<\/th><\/tr><\/thead><tbody><tr><td>Auction<\/td><td>More bidders bid each other up<\/td><\/tr><tr><td>Synergies<\/td><td>The buyer pays away part of the value it expects<\/td><\/tr><tr><td>Scarcity<\/td><td>Few alternatives; keep it from a rival<\/td><\/tr><tr><td>Buyer thinks it's cheap<\/td><td>A big premium can still be below its fair value<\/td><\/tr><tr><td>Turnaround<\/td><td>New management lifts earnings above today's run-rate<\/td><\/tr><\/tbody><\/table>","say":"What pushes a premium higher? Competition first: in an auction, bidders bid each other up. Synergies, where the buyer pays away part of what it expects to gain. Scarcity, when the target is a scale asset with no substitute and a rival might get it first. A buyer who thinks the stock is cheap. And a turnaround, where the premium is priced off what the business earns once run properly."},{"type":"explain","title":"Precedents against trading comps","text":"Trading comps price a liquid minority stake. Precedents price control in a real sale, premium included. Deal multiples sit higher, and the data is thinner: few deals, old rate cycles, private terms.","visual":"<table class=\"t compact\"><thead><tr><th>Masala Mills, EBITDA 200<\/th><th>Multiple<\/th><th>Per share<\/th><\/tr><\/thead><tbody><tr><td>Trading comps median<\/td><td>10x<\/td><td>&#8377;157<\/td><\/tr><tr><td>Precedent deals<\/td><td>12x to 14x<\/td><td>&#8377;197 to &#8377;237<\/td><\/tr><\/tbody><\/table><p class=\"key\">Precedents also prove the value is achievable: real buyers existed at those prices.<\/p>","say":"Set the two market methods side by side. Trading comps gave Masala Mills one fifty seven at ten times, the price of a liquid minority stake. Packaged food deals have closed at twelve to fourteen times, so precedents give one ninety seven to two thirty seven. Higher, because control is in the price. And precedents prove something a DCF cannot: real buyers paid those prices."},{"type":"number","q":"Precedent median 13x on Masala Mills' EBITDA of 200. Same bridge: net debt 380, pref 40, NCI 60, associate +50, 10 Cr shares. Per share in Rs?","answer":217,"tol":1,"unit":"Rs","why":"EV 2,600; equity 2,600 - 380 - 40 - 60 + 50 = 2,170; Rs 217 a share. That is a 117% premium to Rs 100, which tells you the market or the deal set is off: investigate before using it.","say":"Apply the deal multiple. Thirteen times Masala Mills' EBITDA of two hundred, then the usual bridge and ten crore shares. Value per share in rupees? Then look at the implied premium and ask whether it is believable."},{"type":"sort","q":"Before trusting a deal multiple, which questions push it up and which push it down?","buckets":["Pushes the multiple up","Pushes it down"],"items":[["Strategic buyer with synergies","Pushes the multiple up"],["Competitive auction","Pushes the multiple up"],["Hostile bid","Pushes the multiple up"],["Peak-cycle deal, low rates then","Pushes the multiple up"],["Financial buyer underwriting to an IRR","Pushes it down"],["Forced or distressed seller","Pushes it down"],["Stock consideration leaving risk with the seller","Pushes it down"]],"why":"Ask of each deal: who bought, how, and when. Strategics, auctions, hostility and peak cycles inflate multiples; PE discipline, forced sellers and stock deals deflate them.","say":"Sort these deal features. Which ones push a precedent multiple up, and which hold it down? These are the questions you ask of every deal before you let it into the set."},{"type":"mcq","q":"The buyer acquires 26% of Masala Mills from the promoter at Rs 130. What does SEBI's Takeover Code require?","options":["Nothing until 50%","An open offer to public holders for at least 26% more, at no less than Rs 130","A delisting offer","A rights issue"],"answer":1,"why":"Crossing 25% triggers a mandatory open offer for at least 26% more, at a price no lower than the negotiated one. Public holders get the promoter's premium.","say":"The buyer picks up twenty six per cent of Masala Mills from the promoter at one thirty. What does SEBI's takeover code require next, and why does it matter for public shareholders?"},{"type":"reveal","q":"Your DCF and trading comps agree on a value. Apart from the control premium, what can precedent deals tell a seller that neither of those can?","tag":"Your miss","a":"<p>That the value is <b>achievable<\/b>. Precedents show that real buyers, strategic or financial, exist for this kind of asset and have paid up for it before, and whether a given deal structure has worked in practice. A DCF or a trading range can call a price fair, but if no buyer would write the cheque, the seller cannot realise it.<\/p>","say":"Your miss, the point you highlighted. Your DCF and comps agree. Apart from the control premium, what can precedent deals tell a seller that neither of those can? Then reveal."},{"type":"reveal","q":"Leaving synergies aside, what about the sale process or the asset itself can push a buyer to pay a much bigger premium?","tag":"Your miss","a":"<p><b>Competitive process:<\/b> more bidders in an auction bid the price up; a sole negotiated buyer faces far less pressure. <b>Scarcity:<\/b> a scale asset central to the buyer's strategy with few or no alternatives, so a strategic pays up to secure it before a competitor does. And <b>turnaround potential<\/b>: the premium is priced off what the business earns once run properly, not today's run-rate.<\/p>","say":"Your miss, the three drivers. Leaving synergies aside, what about the sale process or the asset itself pushes a buyer to pay a much bigger premium? Then reveal."},{"type":"reveal","q":"Why is transaction comps analysis often harder than trading comps, and what would you ask of each deal in the set?","tag":"Your miss","a":"<p><b>Harder because<\/b> deals are few, often old (keep about five years), struck in different rate cycles, and private terms, earn-outs and synergy assumptions are rarely disclosed. <b>Ask of each deal:<\/b> strategic or financial buyer? Auction or one-to-one? Friendly or hostile? Cash or stock? Why did each side deal, was the seller forced? What were rates and the cycle then?<\/p>","say":"Your miss, both parts. Why are transaction comps harder than trading comps, and what six questions would you ask of each deal before using its multiple? Then reveal."},{"type":"recap","points":["Premium pays holders to give up a liquid stake, and buys rights only a controller has","Auctions, synergies, scarcity and turnarounds push it up; PE discipline and forced sellers pull it down","Masala Mills: 30% premium gives Rs 130; deal multiples of 12 to 14x give Rs 197 to 237","SEBI: crossing 25% triggers an open offer for 26% more at no less than the deal price"],"say":"What to keep. A control premium pays holders to give up a liquid stake and buys rights only a controller has. Competition, synergies, scarcity and turnarounds push it up. Masala Mills at a thirty per cent premium is one thirty; deal multiples put it near two hundred. And in India, crossing twenty five per cent triggers an open offer for twenty six per cent more."}]},{"id":"val-11","module":"val","title":"Multiples decoded: what a P/E really says","mins":8,"blurb":"Masala Mills trades at 11x earnings and 7x EBITDA. Is that cheap? The honest answer needs growth, ROE, debt and the cycle before it needs a peer.","slides":[{"type":"hook","title":"Is 11x cheap?","text":"Masala Mills: EPS Rs 9, price Rs 100, so P/E 11.1x. EV/EBITDA 7.2x. A peer trades at 15x earnings. Which one is cheap? Every number in this lesson says: it depends on what the multiple is made of.","visual":"<div class=\"kchips\"><span class=\"kchip\">P/E 11.1x<\/span><span class=\"kchip\">Earnings yield 9%<\/span><span class=\"kchip\">EV/EBITDA 7.2x<\/span><span class=\"kchip dn\">Peer P/E 15x<\/span><\/div>","say":"Masala Mills earns nine rupees a share and trades at one hundred, so eleven times earnings, a nine per cent earnings yield. Its EV to EBITDA is about seven. A peer trades at fifteen times earnings. Which is cheap? You cannot know yet. A multiple is a compressed story about growth, returns, debt and risk, and this lesson decompresses it."},{"type":"explain","title":"Twins with different debt: same EV/EBITDA, different P/E","text":"EV and EBITDA sit above the capital structure, so debt barely moves EV/EBITDA. P/E is after interest, so it moves with debt. Firm L borrows 500 at 10% to buy back half its equity; 7.5% after-tax debt costs more than the 6% earnings yield:","visual":"<table class=\"t compact\"><thead><tr><th>&#8377; Cr, tax 25%<\/th><th>U: no debt<\/th><th>L: debt 500<\/th><\/tr><\/thead><tbody><tr><td>EV, EBITDA<\/td><td>1,000, 100<\/td><td>1,000, 100<\/td><\/tr><tr><td>Net income<\/td><td>60<\/td><td>22.5<\/td><\/tr><tr><td>EV/EBITDA<\/td><td>10.0x<\/td><td>10.0x<\/td><\/tr><tr><td>P/E<\/td><td>16.7x<\/td><td>22.2x<\/td><\/tr><\/tbody><\/table>","say":"Two identical businesses. One has no debt. The other borrowed five hundred crore at ten per cent and bought back half its shares. Both have enterprise value of one thousand and EBITDA of one hundred, so both trade at ten times. But the levered twin's price to earnings jumps from under seventeen to over twenty two, because after tax interest costs more than the earnings yield it replaced."},{"type":"explain","title":"Which multiple for which business","text":"EV/EBITDA is the default because financing does not move it. Switch when the business model says so.","visual":"<table class=\"t compact\"><thead><tr><th>Multiple<\/th><th>Use it for<\/th><th>Blind spot<\/th><\/tr><\/thead><tbody><tr><td>EV/EBITDA<\/td><td>Most comps<\/td><td>Ignores capex intensity<\/td><\/tr><tr><td>P/E<\/td><td>Stable, low-debt, clean earnings<\/td><td>Bent by debt, one-offs, tax<\/td><\/tr><tr><td>P/B<\/td><td>Banks, NBFCs, insurers<\/td><td>Useless for asset-light firms<\/td><\/tr><tr><td>EV/Revenue<\/td><td>Loss-making growth firms<\/td><td>Ignores margins<\/td><\/tr><tr><td>EV/(EBITDA &minus; capex)<\/td><td>Telecom, infrastructure<\/td><td>Capex timing<\/td><\/tr><\/tbody><\/table>","say":"Which multiple for which business? EV to EBITDA is the default because debt, depreciation policy and tax do not move it. price to earnings suits stable, lightly levered firms with clean earnings. Price to book is for banks and insurers, where book tracks value. EV to revenue is for loss makers with nothing else to multiply. And EBITDA minus capex for telecom and infrastructure, where capex eats the EBITDA."},{"type":"explain","title":"P/E from fundamentals","text":"To grow at g a firm must retain g &divide; ROE of its profit. Put the payout into Gordon growth and the multiple falls out. Growth earns a premium only when ROE beats the cost of equity.","visual":"<div class=\"formula\">Forward P/E = (1 &minus; g &divide; ROE) &divide; (r &minus; g)<\/div><table class=\"t compact\"><thead><tr><th>r 12%, g 8%<\/th><th>ROE<\/th><th>Retains<\/th><th>P/E<\/th><\/tr><\/thead><tbody><tr><td>Efficient grower<\/td><td>25%<\/td><td>32%<\/td><td>17.0x<\/td><\/tr><tr><td>Earns its cost<\/td><td>12%<\/td><td>67%<\/td><td>8.3x<\/td><\/tr><\/tbody><\/table>","say":"What a price to earnings ratio is made of. To grow at g, a firm retains g over ROE of its profit and pays out the rest. Put that payout into the Gordon formula for the justified multiple. Two firms growing eight per cent: the one earning twenty five on equity retains a third and trades at seventeen times; the one earning twelve retains two thirds and deserves eight."},{"type":"number","q":"Cost of equity 12%, growth 8%, ROE 25%. Justified forward P/E, one decimal?","answer":17.0,"tol":0.1,"unit":"x","why":"Payout = 1 - 8 / 25 = 0.68. Divide by (12% - 8%) = 4%: 17.0x. Same growth at 12% ROE gives only 8.3x.","say":"Compute one. Cost of equity twelve per cent, growth eight, return on equity twenty five. What forward price to earnings do the fundamentals justify, to one decimal?"},{"type":"number","q":"A bank: ROE 18%, cost of equity 13%, growth 5%. Justified P/B, two decimals?","answer":1.63,"tol":0.01,"unit":"x","why":"(18 - 5) / (13 - 5) = 13 / 8 = 1.63x. P/B prices the spread of ROE over cost of equity. ROE of 10% would give 0.63x, a discount to book.","say":"Same idea on book value. A bank earns eighteen per cent on equity, its cost of equity is thirteen, growth five. What price to book do the fundamentals justify, to two decimals?"},{"type":"mcq","q":"Masala Mills is at 11.1x earnings with about 10% EPS growth. A peer is at 30x with 30% growth. On PEG, who is cheaper?","options":["Masala Mills, 11x beats 30x","The peer: PEG 1.0 against Masala Mills' 1.1","They are the same","PEG cannot be used here"],"answer":1,"why":"PEG = P/E / growth: 11.1 / 10 = 1.1 against 30 / 30 = 1.0. PEG normalises for growth; it still ignores risk, ROIC and how much cash the growth burned. Useless with no earnings or unstable growth.","say":"Masala Mills at eleven times with ten per cent growth, a peer at thirty times with thirty per cent growth. On a PEG basis, who is cheaper, and what does PEG still miss?"},{"type":"explain","title":"Reverse DCF: what Rs 100 already assumes","text":"Fix today's price and solve for the growth it implies. For a stable firm, implied g = WACC &minus; FCFF<sub>1<\/sub> &divide; EV. Masala Mills: market EV 1,430, FCFF 100, WACC 12%.","visual":"<div class=\"flow\"><div class=\"fstep\"><span class=\"fk\">Market EV<\/span><b>1,430<\/b><\/div><div class=\"fstep\"><span class=\"fk\">FCFF yield<\/span><b>7.0%<\/b><small>100 &divide; 1,430<\/small><\/div><div class=\"fstep\"><span class=\"fk\">WACC<\/span><b>12%<\/b><\/div><div class=\"fstep hl\"><span class=\"fk\">Implied g<\/span><b>5.0%<\/b><small>forever, from year 1<\/small><\/div><\/div><p class=\"key\">Your DCF has 10% growth for five years, then 5%. The market is paying for 5% from day one. That gap is the whole debate.<\/p>","say":"Turn the DCF around. Hold today's price fixed and ask what growth it needs. Masala Mills' market enterprise value is one four three zero, next year's cash one hundred, a seven per cent cash yield. At a twelve per cent WACC, the price implies five per cent growth forever, starting now. Your own DCF assumed ten per cent for five years first. That is the whole debate in one number."},{"type":"number","q":"Reverse DCF: market EV 1,430, FCFF next year 100, WACC 12%. Implied perpetual growth in %, one decimal?","answer":5.0,"tol":0.1,"unit":"%","why":"12% - 100 / 1,430 = 12% - 7.0% = 5.0%. The price needs 5% forever. Now judge that against guidance and history instead of arguing about your model.","say":"Compute it. Market enterprise value one four three zero, free cash flow next year one hundred, WACC twelve per cent. What perpetual growth does the price imply, in per cent to one decimal?"},{"type":"reveal","q":"Two companies grow at the same rate with the same cost of capital. Why might one trade at a much higher P/E?","tag":"Your miss","a":"<p><b>Return on invested capital<\/b> against the cost of capital. Growth creates value only when ROIC exceeds WACC. A firm earning 25% on reinvested capital needs to reinvest far less to grow at the same rate as one earning 8%, so more of each rupee of profit is free. The market prices that into the multiple: 17.0x against 8.3x in the drill.<\/p>","say":"Your miss, the third variable. Same growth, same cost of capital, very different price to earnings ratios. What about how the growth is generated explains it? Then reveal."},{"type":"reveal","q":"EPS halved from $2 to $1 over four years, yet the $10 share price never moved. Most likely explanation, and how do you confirm it?","tag":"Your miss","a":"<p>Total earnings power probably did not halve; the <b>share count grew<\/b>, most plausibly through a secondary issue or a stock-funded acquisition that added shares without matching near-term earnings. P/E went from 5x to 10x on a flat price, which suggests the market saw the deal as value-neutral. Confirm by checking total net income and diluted shares separately. In India: QIPs and rights issues dilute the same way.<\/p>","say":"Your miss, the read. EPS fell from two dollars to one over four years, the price held at ten. What most likely happened, and what two numbers confirm it? Then reveal."},{"type":"reveal","q":"A commodity producer trades at 15x earnings in a record-margin year. Cheap or expensive?","tag":"Your miss","a":"<p>Likely <b>expensive<\/b>. A cyclical near a margin peak has earnings about to fall, so 15x on peak earnings is a much higher multiple on normal earnings. The same 15x is cheap for a steady compounder mid-cycle, and cheap for a company growing 25%. Always ask where in the cycle the E sits, and compare against peers at a similar growth rate.<\/p>","say":"Your miss, the framework. A commodity producer trades at fifteen times earnings in a record margin year. Cheap or expensive, and what is the logic? Then reveal."},{"type":"reveal","q":"A colleague says a reverse DCF is more objective than a forward DCF because you forecast nothing. What is wrong with that?","tag":"Your miss","a":"<p>It still needs a <b>WACC and a terminal growth rate<\/b>, so it moves the subjectivity rather than removing it. Pick an aggressive, low WACC and the price implies modest, conservative-looking growth; pick a high WACC and the same price implies aggressive growth. Masala Mills: at 12% the price implies 5% growth; at 13%, 6%. State the WACC every time.<\/p>","say":"Your miss, the limit you highlighted. A colleague says a reverse DCF is more objective because you forecast nothing. What is wrong with that claim? Then reveal."},{"type":"recap","points":["EV/EBITDA ignores financing; P/E moves with debt, so twins can differ","P/E = payout / (r - g), and payout depends on ROE; higher ROE at the same growth earns a higher multiple","P/B = (ROE - g) / (Ke - g); PEG normalises for growth but ignores risk and ROIC","Reverse DCF: Masala Mills at Rs 100 implies 5% growth forever at a 12% WACC; state the WACC"],"say":"What to keep. EV to EBITDA ignores financing, price to earnings does not, so twins trade apart. Price to earnings is payout over r minus g, and payout depends on return on equity. Price to book prices the ROE spread over cost of equity. PEG adjusts for growth, not risk. A reverse DCF says Masala Mills at one hundred needs five per cent growth forever at twelve per cent WACC."}]},{"id":"val-12","module":"val","title":"Special cases: when the standard DCF breaks","mins":8,"blurb":"Masala Mills was easy: steady cash, listed peers. Now a loss-making rival, a cement cycle, a conglomerate and a bank. Each one breaks a tool you just learned.","slides":[{"type":"hook","title":"Four companies Masala Mills' toolkit cannot value","text":"A quick-commerce startup losing Rs 5,900 Cr a year. A cement maker at peak margins. A conglomerate with a snack arm, a retail arm and a listed stake. A bank. Which tool breaks for each, and what replaces it?","visual":"<div class=\"kchips\"><span class=\"kchip dn\">Loss-maker: no EBITDA<\/span><span class=\"kchip dn\">Cyclical: wrong year<\/span><span class=\"kchip dn\">Conglomerate: one multiple<\/span><span class=\"kchip dn\">Bank: no EV<\/span><\/div>","say":"Masala Mills was the easy case: steady cash, listed peers, a normal balance sheet. Now four companies where the toolkit breaks. A quick commerce startup losing nearly six thousand crore a year. A cement maker at peak margins. A conglomerate with three unrelated arms. And a bank. For each one, know which tool fails and what replaces it."},{"type":"explain","title":"When a DCF is the wrong tool","text":"A DCF needs credible cash flows. Each row lacks them.","visual":"<table class=\"t compact\"><thead><tr><th>Situation<\/th><th>Why the DCF breaks<\/th><th>Use instead<\/th><\/tr><\/thead><tbody><tr><td>No credible projections<\/td><td>Revenue and EBIT are guesses<\/td><td>Comps<\/td><\/tr><tr><td>Cash negative far out<\/td><td>Nearly all value in a guessed TV<\/td><td>Revenue or user multiples, scenarios<\/td><\/tr><tr><td>Banks and insurers<\/td><td>Debt is raw material<\/td><td>P/B vs ROE, DDM, embedded value<\/td><\/tr><tr><td>Going-concern doubt<\/td><td>Cash flows may never exist<\/td><td>Liquidation value<\/td><\/tr><tr><td>Early-stage startup<\/td><td>10 to 15 years to mature; it may die<\/td><td>VC method, recent rounds<\/td><
