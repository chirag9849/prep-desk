uld also earn interest on the idle 50.<\/p>","say":"Boss question, one you missed. A company issues 100 million of debt and spends 50 million on plant. 5 per cent interest, five year straight line, 40 per cent tax. Walk through day one and the end of year one. Say both years out loud, then reveal."},{"type":"reveal","q":"What is capitalised interest, and how does interest on a loan funding a factory under construction flow through the three statements versus normal interest?","tag":"Your miss","a":"<p>Interest on borrowing that funds an asset under construction is added to the asset's cost (Ind AS 23), in CWIP, not expensed.<\/p><p><b>IS:<\/b> no interest expense during the build, so net income is higher than if expensed. <b>CFS:<\/b> the cash leaves as an investing outflow inside capex, not operating; no add-back. <b>BS:<\/b> CWIP up by the interest, cash down, equity untouched.<\/p><p>Once the plant is commissioned, the interest depreciates with the asset. Build-phase EBIT and interest cover are flattered: watch Indian power, cement and infra names with large CWIP.<\/p>","say":"Second boss question, also a miss. What is capitalised interest, and how does interest on a loan funding a factory under construction move through the three statements compared with normal interest? Cover all three statements and say what happens when the plant opens."},{"type":"reveal","q":"You buy a machine for ₹100 with a 5-year life, straight line. After two years you realise it will last three years longer. How do you depreciate it from here?","tag":"","a":"<p>It is a change in accounting estimate, so apply it prospectively (Ind AS 8, ASC 250) and never restate the years already reported.<\/p><p>Book value after year 2: 100 &minus; 2 &times; 20 = &#8377;60. Remaining life: 3 + 3 = 6 years. New depreciation: 60 &divide; 6 = &#8377;10 a year, down from 20. Net income rises; cash moves only if tax depreciation also changes. In India tax runs on WDV blocks, so the effect runs through the DTL and cash is flat.<\/p>","say":"One more, a practical card rather than a miss. You bought a machine for 100 rupees with a five year life. After two years you realise it will last three years longer. How do you depreciate it from here, and what moves on the statements? Say it, then reveal."},{"type":"recap","points":["Day one of a borrow-and-buy is balance sheet only: swaps, no profit","Year one cash = tax saved on new charges minus cash interest; the tax rate sets the sign","Capitalised interest hides in CWIP and returns as depreciation","A change in useful life is prospective: spread book value over the new remaining life"],"say":"Keep four things. Borrowing and buying do nothing to profit on the day. In year one, cash is the tax saved minus the interest paid, so the tax rate decides the sign. Interest during a build hides in capital work in progress and comes back as depreciation. And a change in useful life is applied going forward, never restated. Next: why profit is not cash."}]},{"id":"acc-03","module":"acc","title":"Profit is not cash","mins":7,"blurb":"Masala Mills made a profit and ran out of cash. Accrual accounting and Ind AS 115 explain how.","slides":[{"type":"hook","title":"Masala Mills made a profit and ran out of cash. How?","text":"Every quarter the P&amp;L says the business works. Every quarter the bank balance shrinks. Both are telling the truth.","say":"Here is the classic. Masala Mills reports a profit every quarter, and the bank balance keeps shrinking. The accountants are honest and the auditors are happy. How can both be true at once? This lesson is about the gap between profit and cash, and the rules that decide when a sale counts."},{"type":"explain","title":"Accrual books it when earned","text":"Accrual accounting records revenue when control passes to the customer and expenses when they are incurred, whether or not money moved. Cash accounting waits for the money. The P&amp;L is accrual; the cash flow statement is the bridge back to cash.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>Accrual (the P&amp;L)<\/h4><ul><li>Revenue when control passes<\/li><li>Expense when incurred<\/li><li>Receivables, payables, inventory appear<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Cash<\/h4><ul><li>Only when money moves<\/li><li>No receivables or payables<\/li><li>What the bank sees<\/li><\/ul><\/div><\/div>","say":"The root of it is accrual accounting. The income statement books a sale when the customer takes control of the goods, not when the customer pays. Costs are booked when they are incurred, not when the bill is settled. Cash accounting waits for the money. The cash flow statement is the bridge that takes you from one to the other."},{"type":"statements","title":"Walk it: a credit sale","text":"Masala Mills sells goods worth 100 on credit, cost 60, and pays 20 of salaries in cash. No tax.","rows":{"is":[["Revenue",100],["COGS",60],["Salaries",20],["Net income",20]],"cfs":[["Net income",20],["Receivables build",-100],["Inventory used",60],["Change in cash",-20]],"bs":[["Receivables",100],["Inventory",-60],["Cash",-20],["Retained earnings",20]]},"order":[["is",0],["is",1],["is",2],["is",3],["cfs",0],["cfs",1],["cfs",2],["cfs",3],["bs",0],["bs",1],["bs",2],["bs",3]],"check":"Assets +20 = Liabilities 0 + Equity +20","say":"Watch it. Revenue 100, cost of goods 60, salaries 20, so net income is plus 20. Now the cash flow statement. Start at 20. The customer has not paid, so the 100 receivable is a use of cash. The 60 of stock that shipped was already paid for, so add it back. Cash ends at minus 20, exactly the salaries. Profit up 20, cash down 20."},{"type":"mcq","q":"Profit +20, cash -20. What explains the 40 gap?","options":["The salaries","The ₹100 receivable not yet collected, net of 60 of stock already paid for","Depreciation","An error: they should match"],"answer":1,"why":"Working capital reconciles the two. The sale is booked but not collected (minus 100); the stock shipped had been bought earlier (plus 60). Net minus 40.","say":"So profit is up 20 and cash is down 20. Where did the 40 go? Pick the explanation you would give an interviewer who asks you to reconcile the two."},{"type":"statements","title":"Walk it: stock bought on credit","text":"Inventory rises 50, funded entirely by payables. Nothing hits profit, nothing hits cash.","rows":{"is":[["Net income",0]],"cfs":[["Inventory build",-50],["Payables rise",50],["Change in cash",0]],"bs":[["Inventory",50],["Payables",50]]},"order":[["is",0],["cfs",0],["cfs",1],["cfs",2],["bs",0],["bs",1]],"check":"Assets +50 = Liabilities +50 + Equity 0","say":"A second mini walk, a favourite trick question. Masala Mills buys 50 of inventory on credit. Buying stock is not an expense yet, so the income statement is untouched. On the cash flow statement the inventory build and the payables rise cancel exactly. Balance sheet: inventory up 50, payables up 50. Working capital funds itself when both sides grow together."},{"type":"explain","title":"How the profitable company runs dry","text":"Growth parks cash in receivables and inventory faster than profit brings it in. The gap is funded by working capital loans, factoring or fresh equity. When that funding stops, a profitable company is insolvent.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">IS<\/span><b>Sales grow<\/b><small>profit looks fine<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">BS<\/span><b>Receivables, stock grow<\/b><small>faster than sales<\/small><\/div><div class=\"fstep hl2 step-3\"><span class=\"fk\">CFS<\/span><b>CFO negative<\/b><small>cash drains<\/small><\/div><div class=\"fstep step-4\"><span class=\"fk\">Fund<\/span><b>Loans, factoring, equity<\/b><\/div><div class=\"fstep hl2 step-5\"><span class=\"fk\">End<\/span><b>Funding stops<\/b><small>insolvent, still profitable<\/small><\/div><\/div>","steps":["Sales and profit both grow","Receivables and inventory grow even faster","Operating cash flow turns negative","Outside money fills the gap","When it stops, the company fails while reporting a profit"],"say":"Now the answer to the hook. A fast growing Masala Mills needs more stock and more distributor credit every quarter. Those are real cash outflows that never appear as expenses. So operating cash flow turns negative while profit grows. Loans or factoring fill the gap for a while. The day the funding stops, a profitable company cannot pay its bills. Growing retailers and EPC contractors fall into this trap."},{"type":"order","q":"Put the Ind AS 115 five steps in order","items":["Identify the contract","Identify the performance obligations","Determine the transaction price","Allocate the price by standalone selling prices","Recognise revenue as each obligation is satisfied"],"why":"Contract, obligations, price, allocation, recognition. The test throughout is transfer of control, not risk and reward.","say":"Now the rules on when a sale counts. Ind AS 115, IFRS 15 and ASC 606 share one five step model. Drag the steps into order. The logic runs from the contract down to the moment control passes."},{"type":"number","q":"A phone plus two-year plan sells for 30,000. Standalone prices: phone 24,000, plan 12,000. Revenue booked to the phone on day one?","answer":20000,"tol":10,"unit":"rupees","why":"Allocate in proportion to standalone prices: 30,000 times 24,000 divided by 36,000 = 20,000 on handover. The remaining 10,000 is spread over the 24-month plan.","say":"Step four in action. A phone and a two year plan sell together for 30,000. Sold separately they would cost 24,000 and 12,000. How much revenue is booked to the phone on day one, when it is handed over? Allocate the bundle price in proportion."},{"type":"mcq","q":"Under Ind AS 115, a residential real estate developer books most revenue...","options":["By percentage of completion as construction progresses","At possession or handover, a point in time","When the booking advance arrives","Evenly over the project's planned life"],"answer":1,"why":"The developer controls the flat until title or possession passes, so most sale contracts fail the over-time test. Revenue bunches around handover and growth looks lumpier.","say":"A sector where this changed the numbers. Under Ind AS 115, when does an Indian residential developer book most of its revenue? Think about who controls the flat while it is being built."},{"type":"explain","title":"Gross or net: same profit, different margin","text":"Does the company control the good before the customer gets it? Principal: book the full sale gross. Agent: book only the commission. Profit is identical; revenue, margin and growth are not. Indicators: inventory risk, who sets the price, who picks the supplier.","visual":"<table class=\"t compact\"><thead><tr><th>&#8377;100 sale, &#8377;90 supplier cost<\/th><th>Principal (gross)<\/th><th>Agent (net)<\/th><\/tr><\/thead><tbody><tr><td>Revenue<\/td><td>100<\/td><td>10<\/td><\/tr><tr><td>Gross profit<\/td><td>10<\/td><td>10<\/td><\/tr><tr><td>Gross margin<\/td><td>10%<\/td><td>100%<\/td><\/tr><\/tbody><\/table>","say":"Last rule. A 100 rupee sale with a 90 rupee supplier cost earns 10 either way. A retailer that controls the stock books 100 of revenue at a 10 per cent margin. A marketplace that only arranges the sale books 10 of revenue at a 100 per cent margin. Same profit, completely different revenue and margin. Check this before comparing a retailer with a marketplace."},{"type":"reveal","q":"A company sells goods worth 100 on credit, cost 60, and pays 20 of cash salaries this quarter. Walk through all three statements, ignoring tax.","tag":"Your miss","a":"<p><b>IS:<\/b> revenue +100, COGS &minus;60, salaries &minus;20, net income +20.<\/p><p><b>CFS:<\/b> start at +20. Receivables rose 100, a use of cash. Inventory fell 60, a source. Cash &minus;20, which is exactly the salaries, the only cash that moved.<\/p><p><b>BS:<\/b> receivables +100, inventory &minus;60, cash &minus;20, so assets +20; retained earnings +20.<\/p><p>The punchline: profit up 20, cash down 20, and the 100 of uncollected receivables is the gap. Always close by checking that CFS cash equals the balance sheet cash change.<\/p>","say":"Boss question, one you missed. A company sells goods worth 100 on credit, cost 60, and pays 20 of cash salaries. Walk through all three statements with no tax. Finish with the punchline about profit and cash moving in opposite directions, then reveal."},{"type":"reveal","q":"For long-term projects, what are the two methods for revenue recognition?","tag":"Your miss","a":"<p>The book's two methods were percentage of completion (revenue as work is done) and completed contract (all revenue at the end).<\/p><p>Under ASC 606, IFRS 15 and Ind AS 115 both are gone. One test replaces them: does control transfer <b>over time<\/b> or at a <b>point in time<\/b>? A project the customer controls as it is built is recognised over time, usually by cost incurred over total cost (the input method). Otherwise revenue waits for handover: Indian residential developers now book at possession.<\/p>","say":"Second one you missed, and the book's answer is out of date. For long term projects, what are the two methods for revenue recognition? Give the old answer, then say what replaced it and why real estate revenue got lumpier. Reveal when ready."},{"type":"reveal","q":"What is the difference between recognising revenue gross versus net, and why does it matter when profit is identical?","tag":"Your miss","a":"<p>Ind AS 115 asks whether the company controls the good or service before it reaches the customer. A <b>principal<\/b> does, and books the full sale price with the supplier's cost as an expense. An agent only arranges the sale and books its commission.<\/p><p>Rupee profit is the same. Revenue, gross margin and growth are not: a &#8377;100 sale with &#8377;90 of cost is 10% margin gross and 100% margin net. Indicators: inventory risk, who sets the price, who chooses the supplier. Check before comparing a retailer with a marketplace.<\/p>","say":"Last boss question, also a miss. What is the difference between recognising revenue gross versus net, principal versus agent, and why does it matter for margins when profit is identical? Give the test, the three indicators and a number. Then reveal."},{"type":"recap","points":["The P&L is accrual; working capital on the CFS reconciles profit to cash","Growth parks cash in receivables and stock, so a profitable company can run dry","Ind AS 115: five steps, revenue follows control, over time or at a point in time","Principal books gross, agent books net; same profit, different margin"],"say":"Four takeaways. Profit is accrual and the cash flow statement reconciles it to cash through working capital. Growth parks cash in receivables and stock, so profitable companies can run out of money. Revenue follows control through the five steps, over time or at a point in time. And principal versus agent changes revenue and margin without changing profit. Next lesson: working capital and the cash cycle."}]},{"id":"acc-04","module":"acc","title":"Working capital and the cash cycle","mins":7,"blurb":"Stock sits, customers take their time, suppliers wait. Count the days Masala Mills has to fund itself.","slides":[{"type":"hook","title":"Who is funding whom?","text":"Masala Mills' stock sits 45 days. Customers pay in 30. Suppliers wait 40. For how many days is Masala Mills financing its own sales, and could that number ever be negative?","say":"Think about one bag of masala. It sits in the warehouse for 45 days. The distributor who buys it pays 30 days later. The farmer who supplied the chillies waited 40 days to be paid. Somewhere in there, Masala Mills is funding the whole chain out of its own pocket. For how long? And can the answer be negative?"},{"type":"explain","title":"Two working capitals","text":"<b>Accounting NWC<\/b> is current assets minus current liabilities, cash and debt included: a liquidity measure. <b>Operating NWC<\/b> is receivables plus inventory minus payables and accruals, cash and debt excluded: the cash the business needs to run. Models use the second.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>Accounting NWC<\/h4><ul><li>Current assets &minus; current liabilities<\/li><li>Includes cash and short-term debt<\/li><li>For lenders and the current ratio<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Operating NWC<\/h4><ul><li>Receivables + inventory &minus; payables &minus; accruals<\/li><li>Excludes cash and debt<\/li><li>Feeds the change in NWC in FCF<\/li><\/ul><\/div><\/div><p class=\"mynote\">Your note: accounting NWC tells you about short-term liquidity; operating NWC tells you how much cash the business needs to run.<\/p>","say":"First, which working capital. Accounting working capital is current assets minus current liabilities, with cash and debt inside. It tells a lender about liquidity. Operating working capital drops cash and debt and keeps receivables, inventory, payables and accruals. It tells you how much cash the business needs to run, and that is the one that feeds free cash flow. Your own note had this split right."},{"type":"mcq","q":"Why leave cash and debt out of working capital in a DCF?","options":["They are too volatile to forecast","They are investing and financing items, and already sit in net debt, so keeping them in counts them twice","Cash is not really an asset","Debt is always long term"],"answer":1,"why":"Operations do not create cash or debt. When you bridge from enterprise value to equity value, both sit in net debt. Leaving them in NWC counts the same rupee twice.","say":"Here is one you missed. Why do we exclude cash and debt from working capital in a valuation model? Pick the answer that gives the modelling reason, not just the definition."},{"type":"explain","title":"Negative working capital: strength or stress?","text":"Negative working capital is strength when customers pay before suppliers are paid and payable days are stable and chosen. It is stress when payable days are rising because bills cannot be paid. Same sign, opposite story. Read the trend and the mix.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>Strength<\/h4><ul><li>Customers pay first: QSR, FMCG, subscriptions<\/li><li>Payable days stable and chosen<\/li><li>Growth throws off cash<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Stress<\/h4><ul><li>Payable days rising and forced<\/li><li>Cash balance shrinking<\/li><li>Suppliers tightening terms<\/li><\/ul><\/div><\/div><p class=\"ind\"><b>India:<\/b> Maruti Suzuki, Dabur and most large FMCG and auto names run structurally negative working capital.<\/p>","say":"Can working capital be negative? Yes, and it can be the best thing about a business. If customers pay before the suppliers are paid, growth throws off cash instead of eating it. Maruti and Dabur run like that. The warning sign is the same number arriving for the wrong reason: payable days climbing because the company cannot pay on time."},{"type":"explain","title":"The cash conversion cycle","text":"Stock sits DIO days, customers take DSO days, suppliers give DPO days. The company funds the gap: CCC = DIO + DSO &minus; DPO = 45 + 30 &minus; 40 = 35 days. Inventory turnover is DIO flipped: 365 &divide; 45 is about 8.1 times.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 130\" role=\"img\" aria-label=\"Stock sits 45 days, customers take 30, suppliers give 40, so the company funds 35 days\"><text x=\"40\" y=\"14\" class=\"s-ts\">Day 0: stock arrives<\/text><rect x=\"40\" y=\"22\" width=\"180\" height=\"22\" class=\"s-fa step-1\"/><text x=\"48\" y=\"38\" class=\"s-tb\">DIO 45 days<\/text><rect x=\"220\" y=\"22\" width=\"120\" height=\"22\" class=\"s-fg step-2\"/><text x=\"228\" y=\"38\" class=\"s-tb\">DSO 30<\/text><text x=\"346\" y=\"38\" class=\"s-ts\">cash in, day 75<\/text><rect x=\"40\" y=\"66\" width=\"160\" height=\"22\" class=\"s-fn step-3\"/><text x=\"48\" y=\"82\" class=\"s-tb\">DPO 40 days<\/text><rect x=\"200\" y=\"66\" width=\"140\" height=\"22\" class=\"s-fb step-4\"/><text x=\"208\" y=\"82\" class=\"s-tb\">CCC 35 days<\/text><text x=\"40\" y=\"118\" class=\"s-t\">Supplier funds 40 days; Masala Mills funds 45 + 30 &minus; 40 = 35 days<\/text><\/svg><figcaption>The cash conversion cycle is the stretch the company has to finance itself.<\/figcaption><\/figure><div class=\"formula\">CCC = DIO + DSO &minus; DPO<\/div>","steps":["Stock sits on the shelf for 45 days","Then the customer takes 30 days to pay","The supplier gave 40 days of credit","The remaining 35 days come out of Masala Mills' pocket"],"say":"Now the hook, drawn as a timeline. Stock sits for 45 days, that is days inventory outstanding. Then the customer takes 30 days to pay, days sales outstanding. The supplier gave 40 days of credit, days payable outstanding. 45 plus 30 minus 40 leaves 35 days that Masala Mills funds itself. Inventory turnover is the same idea flipped: 365 over 45, about eight times a year."},{"type":"number","q":"Masala Mills negotiates 60 days from suppliers instead of 40. DIO 45, DSO 30. New cash conversion cycle, in days?","answer":15,"tol":0.5,"unit":"days","why":"45 + 30 - 60 = 15 days. Twenty extra days of supplier credit frees twenty days of sales from the company's own funding.","say":"Your turn. Masala Mills talks its suppliers into 60 days instead of 40. Stock still sits 45 days and customers still pay in 30. What is the new cash conversion cycle, in days?"},{"type":"sort","q":"Which income statement line drives the forecast for each balance?","buckets":["Revenue","COGS","Opex"],"items":[["Receivables","Revenue"],["Deferred revenue","Revenue"],["Inventory","COGS"],["Payables","COGS"],["Prepaid expenses","Opex"],["Accrued expenses","Opex"]],"why":"Receivables sit at selling price, so they run off revenue. Inventory and payables sit at cost, so they run off COGS. Prepaids and accruals follow the opex they relate to. Hold historical days unless terms are changing.","say":"To forecast working capital you tie each balance sheet line to the income statement line it moves with, then hold the days or percentage steady. Drag each line to its driver. The clue is what each balance is carried at: selling price or cost."},{"type":"statements","title":"Walk it: provide first, write off later","text":"Gross receivables 1,000. Masala Mills expects 5% to go bad and provides 50. A later write-off of 30 moves nothing. No tax.","rows":{"is":[["Bad debt expense",50],["Net income",-50]],"cfs":[["Net income",-50],["Add back provision",50],["Change in cash",0]],"bs":[["Receivables, net of allowance",-50],["Retained earnings",-50]]},"order":[["is",0],["is",1],["cfs",0],["cfs",1],["cfs",2],["bs",0],["bs",1]],"check":"Assets -50 = Liabilities 0 + Equity -50","say":"Masala Mills has 1,000 of gross receivables and expects 5 per cent to go bad, so it books 50 of expense in the period of the sale. The allowance is a contra asset: net receivables drop to 950. No cash moved, so the cash flow statement adds the 50 back. When a specific 30 is later written off, gross and allowance both fall 30. Net stays 950. Profit is untouched."},{"type":"mcq","q":"Masala Mills writes off a ₹30 Cr receivable already covered by its allowance. Effect on net income?","options":["Falls 30","Falls 20","Unchanged","Rises, because the allowance is released"],"answer":2,"why":"The loss was expensed when the allowance was built. The write-off just moves 30 out of gross receivables and out of the allowance. Net receivables and profit do not move. India: tax allows the deduction only now, so a DTA unwinds.","say":"Check. Masala Mills now writes off a 30 crore receivable that was already covered by the allowance. What happens to net income? Remember when the expense was actually booked."},{"type":"reveal","q":"Why are cash and debt excluded in the calculation of net working capital?","tag":"Your miss","a":"<p>Cash sits with investing decisions and debt with financing, so neither is created or consumed by day-to-day operations. Operating NWC keeps receivables, inventory, payables and accruals: the cash the business needs to run, which is the line that feeds a DCF.<\/p><p>The modelling reason: when you bridge from enterprise value to equity value, cash and debt already sit in net debt. Leaving them inside NWC counts the same rupee twice.<\/p><p>Your note is right: accounting NWC measures short-term liquidity; operating NWC measures the cash the operations need.<\/p>","say":"Boss question one, a miss. Why are cash and debt excluded when you calculate net working capital? Give the operations reason and the double counting reason, and name the two kinds of working capital. Then reveal."},{"type":"reveal","q":"Is negative working capital a bad signal about a company's health?","tag":"Your miss","a":"<p>Not by itself. Negative working capital is normal, often a strength, for businesses that collect from customers before paying suppliers: quick service restaurants, retailers, subscription software, Indian FMCG and auto names. The operating cycle funds itself and growth generates cash.<\/p><p>It is a bad signal when it comes from stress: a shrinking cash balance and ageing, growing payables the company cannot pay. Read trend and composition together. Same sign, opposite story.<\/p><p>Nuance: a negative NWC figure can coexist with a current ratio above 1; the two can move differently.<\/p>","say":"Second miss. Is negative working capital a bad signal about a company's health? Give both cases and the one check that tells them apart. Say it out loud, then reveal."},{"type":"reveal","q":"What ratios would you look at to assess working capital management efficiency?","tag":"Your miss","a":"<p>Days inventory outstanding, days sales outstanding and days payable outstanding, combined into the cash conversion cycle: DIO + DSO &minus; DPO. Shorter means a rupee spent on stock comes back as cash faster.<\/p><p>Watch the denominators: DIO and DPO use COGS because inventory and payables are carried at cost; DSO uses revenue because receivables sit at selling price. Inventory turnover is COGS over average inventory, the same idea as DIO flipped (365 &divide; turnover).<\/p><p>A very low or negative CCC can be bargaining power or stretched suppliers; check which.<\/p>","say":"Third miss. What ratios would you use to assess working capital efficiency? Name the three, combine them, and say which denominator each one uses and why. Then reveal."},{"type":"reveal","q":"A company factors its receivables to a bank for cash. Operating or financing cash flow, and why does it matter?","tag":"Your miss","a":"<p>It depends on recourse. <b>Without recourse<\/b> the bank bears the credit risk, the receivable is derecognised, and the cash is a true sale: an operating inflow, standing in for normal collection.<\/p><p><b>With recourse<\/b> the company still bears the default risk, so it is a secured borrowing: the receivable stays, a liability appears, and the cash is financing.<\/p><p>It matters because a disguised loan shown as operating cash flatters CFO and DSO at once. Some analysts add factored receivables back to net debt. India's TReDS platform faces the same test.<\/p>","say":"Last one, also a miss. A company sells its receivables to a bank for cash. Does that show up as operating or financing cash flow, and why does the classification matter? The answer turns on one word. Say it, then reveal."},{"type":"recap","points":["Model operating NWC: cash and debt already sit in net debt","CCC = DIO + DSO - DPO; receivables run off revenue, stock and payables off COGS","Negative working capital is strength when chosen, stress when forced","Bad debts hit profit when provided, not when written off"],"say":"Four to keep. Use operating working capital in a model, because cash and debt already live in net debt. The cash cycle is inventory days plus receivable days minus payable days, each forecast off its own driver. Negative working capital is strength when customers pay first, stress when bills go unpaid. Bad debts cost you when you provide, not when you write off. Next: capex and the plant roll-forward."}]},{"id":"acc-05","module":"acc","title":"Capex, D&A and the plant roll-forward","mins":6,"blurb":"Masala Mills spends on plant every year. Which number did a human decide, and which just falls out?","slides":[{"type":"hook","title":"Three numbers, one decision","text":"Masala Mills opens the year with &#8377;400 Cr of plant, spends &#8377;120 Cr on new lines and charges &#8377;90 Cr of depreciation. What does it close at? And which of the three did a human actually decide?","say":"Masala Mills starts the year with 400 crore of plant and machinery. During the year it spends 120 crore on new lines and books 90 crore of depreciation. What is the closing balance? Easy. The better question: of those three numbers, which one did a person actually decide, and which ones just fell out of the arithmetic?"},{"type":"explain","title":"Capex is the input, PP&E is the output","text":"Capex is a business decision: guidance, a share of revenue, capacity needs. D&A comes off the asset base or a schedule by capex vintage. Closing PP&E falls out: opening + capex &minus; D&A. Debt, retained earnings and intangibles roll forward the same way.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">BS<\/span><b>Opening PP&amp;E 400<\/b><\/div><div class=\"fstep hl step-2\"><span class=\"fk\">Input<\/span><b>+ Capex 120<\/b><small>the decision<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">IS<\/span><b>&minus; D&amp;A 90<\/b><small>off the asset base<\/small><\/div><div class=\"fstep step-4\"><span class=\"fk\">BS<\/span><b>Closing PP&amp;E 430<\/b><small>the output<\/small><\/div><\/div><p class=\"mynote\">Your note: capex is an input from the business economics; ending PP&amp;E = beginning + capex &minus; D&amp;A is the output.<\/p>","steps":["Start with the opening balance","Capex is the input: someone decided to spend 120","Depreciation comes off the asset base","Closing PP&E is whatever is left"],"say":"Your own note had this right. Capex is the input, because spending on plant is a business decision: guidance, a percentage of revenue, or capacity you need. Depreciation comes off the asset base you already have. Closing plant is simply opening plus capex minus depreciation. It is the output. Debt, retained earnings and intangibles all roll forward in exactly the same shape."},{"type":"number","q":"Opening PP&E 400, capex 120, D&A 90. Closing PP&E, in crore?","answer":430,"tol":0.5,"unit":"crore","why":"400 + 120 - 90 = 430. Capex adds, depreciation subtracts, the balance is the result.","say":"Quick one to lock in the shape. Opening plant 400, capex 120, depreciation 90. What does Masala Mills close the year at, in crore?"},{"type":"statements","title":"Walk it: a year of capex and depreciation","text":"Capex 120 never touches profit. D&A 90 is deductible at 25% and uses no cash. Both land on PP&E.","rows":{"is":[["Depreciation",90],["EBIT",-90],["Tax at 25%",-22.5],["Net income",-67.5]],"cfs":[["Net income",-67.5],["Add back D&A",90],["Capex (investing)",-120],["Change in cash",-97.5]],"bs":[["Cash",-97.5],["PP&E",30],["Retained earnings",-67.5]]},"order":[["is",0],["is",1],["is",2],["is",3],["cfs",0],["cfs",1],["cfs",2],["cfs",3],["bs",0],["bs",1],["bs",2]],"check":"Assets -67.5 = Liabilities 0 + Equity -67.5","say":"Both flows on the statements. Depreciation of 90 cuts EBIT by 90, tax by 22.5, net income by 67.5. The cash flow statement adds the 90 back, then capex of 120 leaves through investing. Cash is down 97.5. Balance sheet: cash down 97.5, plant up 30, which is the 120 in minus the 90 off, retained earnings down 67.5. Capex never touched profit."},{"type":"explain","title":"Setting the inputs, and the sanity check","text":"Capex: management guidance, a share of revenue, or capacity. D&A: a share of revenue or of prior capex, or a waterfall that ages each capex vintage. Check capex &divide; D&A: well above 1 for a grower, drifting toward 1 as it matures.","visual":"<table class=\"t compact\"><thead><tr><th>Line<\/th><th>Forecast from<\/th><th>Watch<\/th><\/tr><\/thead><tbody><tr><td>Capex<\/td><td>Guidance, % of revenue, capacity<\/td><td>Growth vs maintenance split<\/td><\/tr><tr><td>D&amp;A<\/td><td>% of revenue or of past capex; vintage waterfall<\/td><td>Lives match the assets<\/td><\/tr><tr><td>Capex &divide; D&amp;A<\/td><td>120 &divide; 90 = 1.33x this year<\/td><td>Should drift to 1x when mature<\/td><\/tr><\/tbody><\/table><p class=\"trap\"><b>Trap:<\/b> a mature company with capex stuck at 2x D&amp;A for the whole forecast is a model error, not a strategy.<\/p>","say":"How do you set the inputs? Capex comes from guidance, a share of revenue, or the capacity the plan needs. Depreciation is a share of revenue or of past capex, or a full waterfall that ages each year's spend. Then sanity check the ratio of capex to depreciation. Masala Mills is at 1.33 times, a grower. As growth matures that ratio should drift toward one."},{"type":"mcq","q":"A mature, low-growth company's model shows capex at 2x D&A for ten straight years. Your read?","options":["Strong reinvestment, a good sign","Probably a model error: capex should converge toward D&A as growth matures","D&A is being understated","Nothing unusual"],"answer":1,"why":"Capex well above depreciation means the asset base is growing fast. A low-growth company does not do that for a decade. Either the capex assumption or the depreciation schedule is wrong.","say":"Here is the sanity check as a question. You open a model of a mature, low growth company and capex sits at twice depreciation for ten years. What do you conclude?"},{"type":"explain","title":"Capitalise or expense: timing, not total","text":"Spend 100 a year on development. Expensed, the P&amp;L takes 100 each year. Capitalised over 5 years, the charge starts at 20 and climbs to 100. Margins look better early; the cost has only been delayed. Ind AS 38: capitalise only after feasibility.","visual":"<div class=\"minichart\" style=\"--max:100\"><div class=\"mc-legend\"><span><i class=\"mc-a\"><\/i>Expensed<\/span><span><i class=\"mc-b\"><\/i>Capitalised, amortised over 5 years<\/span><\/div><div class=\"mc-plot\"><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:100\"><em>100<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:20\"><em>20<\/em><\/div><span class=\"mc-x\">Y1<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:100\"><em>100<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:40\"><em>40<\/em><\/div><span class=\"mc-x\">Y2<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:100\"><em>100<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:60\"><em>60<\/em><\/div><span class=\"mc-x\">Y3<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:100\"><em>100<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:80\"><em>80<\/em><\/div><span class=\"mc-x\">Y4<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:100\"><em>100<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:100\"><em>100<\/em><\/div><span class=\"mc-x\">Y5<\/span><\/div><\/div><div class=\"mc-xpad\"><\/div><\/div>","say":"Capitalising a cost parks it on the balance sheet and releases it later through depreciation or amortisation. Spend 100 a year on product development. Expense it and the income statement takes 100 every year. Capitalise it over five years and the charge starts at 20 and climbs to 100 by year five. Early margins look better. The total cost is identical. Only the timing moved."},{"type":"sort","q":"Capitalise or expense?","buckets":["Capitalise","Expense"],"items":[["Interest on a plant under construction (Ind AS 23)","Capitalise"],["Development cost after feasibility (Ind AS 38)","Capitalise"],["Research before feasibility","Expense"],["Advertising to build the Masala Mills brand","Expense"],["Routine repairs","Expense"],["A new roasting line","Capitalise"]],"why":"Capitalise what creates a future asset you can measure: plant, build-phase interest, development past feasibility. Research, advertising and repairs are expensed because no verifiable asset results.","say":"Sort these. Which costs can Masala Mills put on the balance sheet, and which must go straight through the income statement? The test is whether a measurable future asset results."},{"type":"mcq","q":"Masala Mills' software arm capitalises a rising share of its development spend each year, and margins keep improving. Your read?","options":["Genuine efficiency gains","Margins are flattered by deferral: check the capitalisation ratio and the amortisation life against how fast the software is rewritten","Cash flow has improved","The company is cutting R&D"],"answer":1,"why":"A rising capitalised share lifts margins without any change in the cost base. A five-year life on software rewritten in eighteen months overstates the asset. The trend is the tell, not the policy.","say":"A software business inside Masala Mills capitalises more of its development spend each year, and margins keep rising. What is your read as an analyst?"},{"type":"explain","title":"Why the Masala Mills brand is not on its balance sheet","text":"A self-built brand, customer base or workforce has no arm's-length price, so accounting leaves it off. The moment someone buys the company, the same brand appears as acquired intangibles and goodwill. Book value across an organic grower and an acquirer is not comparable.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>Organic grower<\/h4><ul><li>Brand built with expensed advertising<\/li><li>Intangibles on the balance sheet: close to zero<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Acquirer of the same brand<\/h4><ul><li>Price paid proves the value<\/li><li>Trademark and goodwill appear<\/li><\/ul><\/div><\/div>","say":"Why is the Masala Mills brand, worth a fortune, missing from its own balance sheet? Because nobody has paid for it. There is no transaction to verify the value, so the advertising that built it was expensed. If a rival bought Masala Mills tomorrow, the identical brand would appear on the buyer's books as a trademark and goodwill. Same brand, different owner, different balance sheet."},{"type":"reveal","q":"How would you forecast capex and D&A when creating a financial model?","tag":"Your miss","a":"<p>Capex is the input, from management guidance, a share of revenue or capacity needs. D&amp;A is forecast as a share of revenue or of prior capex, or from a depreciation waterfall that ages each capex vintage. PP&amp;E is the output: ending = beginning + capex &minus; D&amp;A.<\/p><p>Sanity check capex &divide; D&amp;A: well above 1 while the company grows, converging toward 1 as growth matures. A mature company stuck at 2x for the forecast is a model error.<\/p><p>Debt, retained earnings and intangibles roll forward the same way.<\/p>","say":"Boss question one, a miss. How would you forecast capex and depreciation in a financial model? Say which is the input, which is the output, how you set each, and the sanity check. Then reveal."},{"type":"reveal","q":"When can a company capitalise software development costs?","tag":"Your miss","a":"<p>The book's rule was stage based: internal-use software is capitalised once it leaves preliminary planning and enters application development (funding committed, coding begun); software built to sell, once technological feasibility is reached. Ind AS 38 capitalises development only after feasibility.<\/p><p><b>Updated:<\/b> FASB's ASU 2025-06 drops the stage test for internal-use software: capitalise once funding is committed and completion is probable (years from 15 December 2027). Software built to sell keeps the feasibility rule. Watch the capitalised share and the amortisation life.<\/p>","say":"Second miss. When can a company capitalise software development costs? Give the book's rule, the Ind AS version, and the recent US update. Then say what you would watch for as an analyst. Reveal when done."},{"type":"reveal","q":"Why are the values of a company's intangible assets not reflected on its balance sheet?","tag":"Your miss","a":"<p>Internally built intangibles, a brand, a customer base, a workforce, fail the objectivity test: no arm's-length transaction verifies their price, so they stay off and the spend that built them is expensed.<\/p><p>When the same value changes hands in an acquisition, the purchase price makes it observable, and it is booked as identifiable intangibles or goodwill. So a brand can be worth zero on one balance sheet and billions on another; adjust for deal history before comparing book values. The same logic keeps most R&amp;D off the balance sheet.<\/p>","say":"Last one, a miss. Why are the values of a company's intangible assets not reflected on its balance sheet? Give the principle, the exception when a deal happens, and why that matters for comparing book values. Then reveal."},{"type":"recap","points":["Capex is the input, D&A comes off the asset base, PP&E is the output","Capex to D&A runs above 1 for a grower and drifts to 1 when mature","Capitalising delays a cost, it never removes it: watch the capitalised share","Self-built intangibles stay off the books until a deal prices them"],"say":"Four to remember. Capex is the input, depreciation comes off the asset base, closing plant is the output. The ratio of capex to depreciation runs above one for a grower and settles toward one. Capitalising a cost only delays it, so watch how much gets capitalised and for how long. And a brand reaches the balance sheet only when someone pays for it. Next: deferred taxes."}]},{"id":"acc-06","module":"acc","title":"Deferred taxes without the fog","mins":7,"blurb":"Masala Mills' P&L shows tax it never paid this year. Nobody is cheating. Here is where it went.","slides":[{"type":"hook","title":"Tax on paper, cash in the bank","text":"Masala Mills' P&amp;L shows &#8377;25 Cr of tax expense that was never paid this year. The auditors signed off. Where did the &#8377;25 Cr go?","say":"Here is the puzzle. Masala Mills' income statement shows 25 crore of tax expense that it did not actually pay this year. Nobody is cheating and the auditors are fine with it. So where did the 25 crore go, and will the tax office ever get it? That is deferred tax, and it is simpler than it looks."},{"type":"explain","title":"Two sets of books, two timetables","text":"The accounts (Ind AS) and the tax return count some items in different years. Tax return deducts faster: cash tax is lower now, higher later, and the gap is a <b>deferred tax liability<\/b>. Books expense first, tax allows it later: a deferred tax asset.","visual":"<div class=\"cmp\"><div class=\"cmp-c b\"><h4>Creates a DTL<\/h4><ul><li>Tax depreciation faster than book<\/li><li>Revenue booked now, taxed later<\/li><\/ul><\/div><div class=\"cmp-c a\"><h4>Creates a DTA<\/h4><ul><li>Tax losses carried forward<\/li><li>Provisions not yet tax-deductible<\/li><li>MAT credit<\/li><\/ul><\/div><\/div>","say":"A company keeps two timetables. The accounts follow Ind AS, the tax return follows the Income Tax Act. When the tax return lets you deduct something faster, you pay less cash tax now and more later. The books still charge tax on book profit, and the gap piles up as a deferred tax liability. Expense it in the books first and the reverse happens: a deferred tax asset."},{"type":"sort","q":"DTA or DTL?","buckets":["DTA","DTL"],"items":[["Tax depreciation faster than book depreciation","DTL"],["Business losses carried forward","DTA"],["Bad debt provision not yet deductible","DTA"],["MAT credit","DTA"],["Revenue booked now, taxed when collected","DTL"],["Gratuity provision, deductible when paid","DTA"]],"why":"Paid less tax now than the books show: DTL. Paid more now than the books show, or carrying a loss to use later: DTA. Indian provisions for bad debts and gratuity are deductible only when paid, so they build DTAs.","say":"Sort these. Each item either means the company has paid less tax now than the books show, which is a liability, or more tax now than the books show, which is an asset. Think about which timetable is running ahead."},{"type":"statements","title":"Walk it: the deferral alone","text":"Masala Mills buys a &#8377;1,000 Cr asset. Book depreciation 100, tax depreciation 200 (20% WDV), tax 25%. Total tax charge unchanged; 25 of it is deferred.","rows":{"is":[["Current tax",-25],["Deferred tax expense",25],["Net income",0]],"cfs":[["Net income",0],["Add back deferred tax",25],["Change in cash",25]],"bs":[["Cash",25],["DTL",25]]},"order":[["is",0],["is",1],["is",2],["cfs",0],["cfs",1],["cfs",2],["bs",0],["bs",1]],"check":"Assets +25 = Liabilities +25 + Equity 0","say":"The deferral on its own. Taxable profit is 100 lower than book profit, because tax depreciation is 200 against book depreciation of 100. Cash tax falls 25. The P and L still shows the full charge: current tax down 25, deferred tax up 25, net income unchanged. The cash flow statement adds the deferred tax back: cash up 25. Balance sheet: cash up 25, deferred tax liability up 25."},{"type":"number","q":"Book depreciation 100, tax depreciation 200, tax rate 25%. DTL created in year one, in crore?","answer":25,"tol":0.5,"unit":"crore","why":"Gap of 100 times 25% = 25. Year two the gap is 60 (160 vs 100), so the DTL grows to 40; year three 47. From year five tax depreciation drops below 100 and it unwinds.","say":"Compute it. Book depreciation 100, tax depreciation 200 under 20 per cent written down value, tax rate 25 per cent. How big is the deferred tax liability at the end of year one, in crore?"},{"type":"mcq","q":"Masala Mills' DTL grows every year. Bad news?","options":["Yes: unpaid tax falling due next year","Not by itself: it is tax deferred, like an interest-free loan that rolls while capex keeps growing; it reverses when capex slows","Yes: a sign of aggressive accounting","It never reverses, so ignore it"],"answer":1,"why":"WDV front-loads deductions. On one asset the DTL rises then falls. A company adding assets faster than old ones run off keeps rolling it forward. It is deferred, not avoided.","say":"Masala Mills keeps building plants, and its deferred tax liability keeps growing. Should that worry you? Pick the answer that explains what the balance really is."},{"type":"explain","title":"A DTA is worth only what future profit can absorb","text":"Ind AS 12: recognise a DTA only to the extent future taxable profit is <b>probable<\/b>. A judgement, not arithmetic. Fail it and the write-down lands in tax expense in one quarter, with no operating line warning you first.","visual":"<table class=\"t compact\"><thead><tr><th>Situation<\/th><th>Why the DTA fails<\/th><\/tr><\/thead><tbody><tr><td>Recent losses, cause not fixed<\/td><td>No sign of future profit<\/td><\/tr><tr><td>Losses about to expire<\/td><td>Cannot be used in time<\/td><\/tr><tr><td>Unit being wound down or sold<\/td><td>The profit source goes<\/td><\/tr><tr><td>SEZ or concessional regime lost<\/td><td>Less future tax to shelter<\/td><\/tr><\/tbody><\/table><p class=\"ind\"><b>India:<\/b> business losses carry forward 8 years; unabsorbed depreciation has no time limit. US NOLs from 2018 carry forward indefinitely against 80% of taxable income.<\/p>","say":"Now the asset side. A deferred tax asset is a claim on future tax savings, so it is only worth something if future taxable profit arrives to shelter. Ind AS 12 says probable, and that is a judgement. Recent losses, losses about to expire, a unit being shut, a tax holiday lost: each can force a write-down through the tax line with no warning in the operating numbers."},{"type":"explain","title":"A rate cut remeasures everything at once","text":"Deferred tax sits at the enacted rate. A company moving to the 115BAA regime restates every DTL and DTA at 25.17% in one go. Net-DTL companies book a one-time gain, net-DTA companies a one-time charge. Non-cash either way.","visual":"<table class=\"t compact\"><thead><tr><th>&#8377;100 Cr timing difference<\/th><th>DTL<\/th><\/tr><\/thead><tbody><tr><td>Old rate, 34.94%<\/td><td>34.9<\/td><\/tr><tr><td>New rate, 25.17%<\/td><td>25.2<\/td><\/tr><tr><td><b>One-time gain<\/b><\/td><td class=\"pos\">9.8<\/td><\/tr><\/tbody><\/table><p class=\"trap\"><b>Trap:<\/b> never carry a remeasurement gain into forecast earnings. It is a one-off through the tax line.<\/p>","say":"One more mechanic. Deferred tax balances sit at the tax rate that will apply when they reverse. So when India offered the 25.17 per cent regime in 2019, every company that switched restated all its deferred balances at once. A 100 crore timing difference went from a 34.9 crore liability to 25.2, a one-time gain of 9.8. Companies with net deferred tax assets took a charge instead. No cash moved."},{"type":"mcq","q":"Masala Mills carries a net DTA and elects the 115BAA regime at 25.17%. First-year effect in the tax line?","options":["A one-time gain","A one-time non-cash charge: the DTA is remeasured down from the old, higher rate","A cash tax refund","Nothing until the DTA is used"],"answer":1,"why":"The DTA was carried at the old rate of around 30 to 35%. At 25.17% each rupee of timing difference shelters less tax, so the asset shrinks and the charge hits tax expense. Giving up unused SEZ years is a further cost.","say":"Apply it. Masala Mills has a net deferred tax asset and decides to move to the 25.17 per cent regime. What shows up in the tax line in the year it switches?"},{"type":"reveal","q":"What are deferred tax liabilities?","tag":"Your miss","a":"<p>A DTL arises when a temporary difference lets the company pay less cash tax now than the book tax expense implies, with the balance due later. The classic driver is depreciation: tax deductions run ahead of book depreciation early in an asset's life (India's WDV blocks against Schedule II lives), and the gap accrues as a DTL until it reverses.<\/p><p>Nuance: tax deferred, not avoided. A growing, capex-heavy company rolls it forward like an interest-free loan; it shrinks only when capex slows.<\/p>","say":"Boss question one, a miss. What are deferred tax liabilities? Give the definition, the classic driver with the Indian angle, and the nuance about whether a growing liability is a problem. Then reveal."},{"type":"reveal","q":"What are deferred tax assets?","tag":"Your miss","a":"<p>A DTA arises when the books recognise a tax benefit before the cash saving arrives: tax losses carried forward, Indian provisions deductible only when paid, MAT credit. The future tax saving sits as an asset and reverses as the losses or deductions are used.<\/p><p>Nuance: it is worth face value only if enough future taxable profit arrives in time. Ind AS 12 requires probable future profit; US GAAP uses a valuation allowance. A company emerging from losses often books a large write-down or write-up with no change in tax law.<\/p>","say":"Second miss. What are deferred tax assets? Give the sources, the Indian ones included, and the test that decides whether the asset is real. Say it, then reveal."},{"type":"reveal","q":"When would you tell a company it cannot recognise a DTA, or must write one down?","tag":"Your miss","a":"<p>Ind AS 12 allows a DTA only to the extent future taxable profit is probable, a forward-looking judgement, not a mechanical test. It fails when recent losses have no fixed cause; losses will expire before they can be used; the unit generating the profit is being wound down or sold; or a concessional regime that gave the DTA its value is lost.<\/p><p>Trap: management defending a DTA with aggressive projections while the operating trend says otherwise. When the write-off comes it lands in one quarter's tax expense.<\/p>","say":"Third miss. When would you tell a company it cannot recognise a deferred tax asset, or has to write one down? Give the test and four situations that fail it. Then reveal."},{"type":"reveal","q":"Why might the effective and marginal tax rates differ?","tag":"Your miss","a":"<p>Three rates. <b>Marginal<\/b> is statutory, 25.17% for a 115BAA company. <b>Effective<\/b> is book tax over pre-tax profit; it moves with permanent differences, non-deductible items, tax holidays (SEZ, the 15% 115BAB rate), foreign profit mix, unrecognised DTAs and one-offs such as a remeasurement. <b>Cash tax rate<\/b> moves with timing differences: accelerated tax depreciation, losses used, provisions deductible only when paid.<\/p><p>A company can sit below the statutory rate for years purely from timing differences. Read the effective rate over three to five years before using it in a DCF.<\/p>","say":"Last one, a miss. Why might a company's effective and marginal tax rates differ? Name the three rates and give concrete examples of what moves each. Then reveal."},{"type":"recap","points":["DTL: tax deducted faster than booked; deferred, not avoided, and it rolls while capex grows","DTA: losses, disallowed provisions, MAT credit; real only if future profit is probable","A rate change remeasures every deferred balance at once, non-cash, one-off","Marginal, effective and cash tax rates are three different numbers"],"say":"Four things. A deferred tax liability is tax deducted early, deferred not avoided, and it keeps rolling while the company invests. A deferred tax asset is only as good as the future profit that will use it. A rate change restates every deferred balance in one quarter, no cash moving. And marginal, effective and cash tax rates are three different numbers. Next: earnings per share and buybacks."}]},{"id":"acc-07","module":"acc","title":"EPS, share count and buybacks","mins":7,"blurb":"Masala Mills buys back shares. Fewer shares, same business. EPS goes up. Or does it?","slides":[{"type":"hook","title":"Fewer shares, same business. EPS up?","text":"Masala Mills spends &#8377;200 Cr of idle cash buying back its own shares. The share count falls. Everyone expects EPS to rise. One number decides whether it does.","say":"Masala Mills has 200 crore of cash sitting in fixed deposits and decides to buy back its own shares. Fewer shares, same business, so EPS must go up. Right? Not always. One comparison decides it, and by the end of this lesson you will do it in your head."},{"type":"explain","title":"Basic and diluted","text":"Basic EPS divides net income less preferred dividends by the weighted average shares. Diluted uses the same numerator over a bigger count: add the net new shares from in-the-money options and convertibles. In a loss year, diluted equals basic.","visual":"<div class=\"fgrid\"><div class=\"fcard\"><div class=\"fname\">Basic EPS<\/div><div class=\"fx\">(NI &minus; pref div) &divide; weighted avg shares<\/div><div class=\"fnote\">shares actually outstanding<\/div><\/div><div class=\"fcard\"><div class=\"fname\">Diluted EPS<\/div><div class=\"fx\">(NI &minus; pref div) &divide; diluted shares<\/div><div class=\"fnote\">plus in-the-money options and converts, net<\/div><\/div><\/div><p class=\"trap\"><b>Trap:<\/b> in a net loss year, adding shares would shrink the loss per share. That is antidilutive, so diluted EPS equals basic.<\/p>","say":"Two versions of EPS. Basic takes net income, less any preferred dividends, over the weighted average shares outstanding. Diluted keeps the numerator and enlarges the denominator with the shares that would exist if in the money options and convertibles were exercised. One trap: in a loss year, more shares would make the loss per share smaller, so the rules ignore them and diluted equals basic."},{"type":"explain","title":"The treasury stock method","text":"Assume every in-the-money option is exercised. Take the cash proceeds and buy back shares at the market price. Only the net new shares count. Out-of-the-money options are ignored.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Step<\/span><b>Exercise 10 lakh<\/b><small>strike &#8377;10, proceeds &#8377;100 lakh<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Step<\/span><b>Buy back 4 lakh<\/b><small>&#8377;100 lakh &divide; &#8377;25<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">EPS<\/span><b>+6 lakh shares<\/b><small>net dilution<\/small><\/div><\/div>","steps":["Holders exercise 10 lakh options at 10 rupees, paying in 100 lakh","The company spends that 100 lakh buying back 4 lakh shares at 25","Only the 6 lakh net new shares dilute EPS"],"say":"The treasury stock method is how diluted shares are counted. Masala Mills has 10 lakh options with a 10 rupee strike and the shares trade at 25. Assume they are all exercised: 10 lakh new shares and 100 lakh rupees of cash comes in. Assume that cash buys back shares at 25: 4 lakh shares retired. Net new shares: 6 lakh. Only those count."},{"type":"number","q":"10 lakh options, strike ₹10, share price ₹25. Net new shares under the treasury stock method, in lakh?","answer":6,"tol":0.05,"unit":"lakh shares","why":"Exercise adds 10 lakh and brings in ₹100 lakh. That cash buys back 100 ÷ 25 = 4 lakh shares. Net: 6 lakh.","say":"Do it yourself. 10 lakh options, strike price 10 rupees, market price 25 rupees. Under the treasury stock method, how many net new shares go into the diluted count, in lakh?"},{"type":"number","q":"US example: net income $50m, 20m shares, a $100m 5% convertible into 4m shares, 25% tax. Diluted EPS in dollars?","answer":2.24,"tol":0.01,"unit":"dollars","why":"If-converted: add back after-tax interest, 5 times 0.75 = 3.75, so 53.75 over 24m shares = $2.24. Below basic $2.50, so it is dilutive and counts.","say":"Convertibles use the if converted method. Net income 50 million dollars, 20 million shares, a 100 million dollar 5 per cent convertible that turns into 4 million shares, 25 per cent tax. Add back the after tax interest, add the shares, and give me diluted EPS in dollars."},{"type":"mcq","q":"Net income 100, 100 shares, price 20. Cash earns 3% after tax. Masala Mills buys back 200 of stock (10 shares). New EPS?","options":["1.00, unchanged","1.04","0.96","1.11"],"answer":1,"why":"Net income loses the interest on 200 at 3%: 100 - 6 = 94. Shares: 90. EPS 1.04. The test: earnings yield 5% (1 over a P/E of 20) beats the 3% after-tax yield given up, so accretive.","say":"The buyback test. Net income 100, 100 shares, price 20, so the price to earnings ratio is 20 and the earnings yield is 5 per cent. The cash earns 3 per cent after tax. Masala Mills spends 200 buying back 10 shares. What is the new EPS?"},{"type":"statements","title":"Walk it: the ₹200 Cr buyback","text":"Cash earned 4% pre-tax, 3% after tax at 25%. The business is unchanged; only the interest income disappears.","rows":{"is":[["Interest income",-8],["Pre-tax profit",-8],["Tax at 25%",-2],["Net income",-6]],"cfs":[["Net income",-6],["Buyback (financing)",-200],["Change in cash",-206]],"bs":[["Cash",-206],["Equity: shares bought back",-200],["Retained earnings",-6]]},"order":[["is",0],["is",1],["is",2],["is",3],["cfs",0],["cfs",1],["cfs",2],["bs",0],["bs",1],["bs",2]],"check":"Assets -206 = Liabilities 0 + Equity -206","say":"Here is the buyback on the statements. The 200 crore of cash earned 4 per cent before tax, so interest income falls 8, tax falls 2, net income falls 6. On the cash flow statement the 200 leaves through financing, so cash is down 206. Balance sheet: cash down 206, equity down 200 for the shares retired and 6 for the lost profit. The operating business did not move."},{"type":"mcq","q":"Masala Mills trades at 25x earnings. Its cash earns 6% pre-tax, 4.5% after tax. A buyback is...","options":["Accretive","Dilutive: the 4% earnings yield is below the 4.5% given up","Neutral","Depends on the share count"],"answer":1,"why":"Earnings yield is 1 over 25, 4%. The cash earned 4.5% after tax. Retiring shares at a 4% yield while giving up 4.5% lowers EPS. At 20x (5% yield) it would be accretive. Issuing shares is the same test reversed.","say":"Now the hook, with numbers. Masala Mills trades at 25 times earnings. Its cash earns 6 per cent before tax, 4.5 after. Is a buyback accretive or dilutive to EPS? Compare the two yields."},{"type":"explain","title":"ROE rides on leverage","text":"Two companies, assets 1,000, EBIT 150, 25% tax. B carries 500 of debt at 8%. Accounting ROA uses net income, so debt drags it. Operating ROA uses NOPAT and ignores financing. ROE rises because the equity base shrank: ROE = ROA &times; assets &divide; equity.","visual":"<table class=\"t compact\"><thead><tr><th>Metric<\/th><th>A, no debt<\/th><th>B, 500 debt at 8%<\/th><\/tr><\/thead><tbody><tr><td>Net income<\/td><td>112.5<\/td><td>82.5<\/td><\/tr><tr><td>Accounting ROA<\/td><td>11.25%<\/td><td>8.25%<\/td><\/tr><tr><td>Operating ROA (NOPAT)<\/td><td>11.25%<\/td><td>11.25%<\/td><\/tr><tr><td>ROE<\/td><td>11.25%<\/td><td>16.5%<\/td><\/tr><\/tbody><\/table><p class=\"trap\"><b>Trap:<\/b> a debt-funded buyback lifts EPS and ROE the same way: the equity base shrank, risk rose, the business did not improve. ROIC means something only next to WACC.<\/p>","say":"Buybacks and debt share a mechanic. Company A has no debt: net income 112.5, so ROA and ROE are both 11.25 per cent. Company B borrowed 500 at 8 per cent: interest of 40 cuts net income to 82.5, accounting ROA falls to 8.25, but ROE jumps to 16.5 because the equity is only 500. Operating ROA, using NOPAT, is 11.25 for both. Same business, different financing."},{"type":"reveal","q":"What are the two ways to calculate earnings per share?","tag":"Your miss","a":"<p><b>Basic EPS:<\/b> net income less preferred dividends, over the weighted average basic shares. <b>Diluted EPS:<\/b> the same numerator over a larger count that adds the net new shares from in-the-money options, warrants and convertibles.<\/p><p>The mechanism is the treasury stock method: assume the options are exercised, use the proceeds to buy back stock at market, and add only the net new shares (10 lakh options at &#8377;10, price &#8377;25: +6 lakh). Convertibles: add back after-tax interest, add the shares. Out-of-the-money securities are ignored; in a loss year diluted equals basic.<\/p>","say":"Boss question one, a miss. What are the two ways to calculate earnings per share? Define both, then explain the treasury stock method with a quick number and name the loss year trap. Then reveal."},{"type":"reveal","q":"How would a share repurchase impact EPS?","tag":"Your miss","a":"<p>A buyback shrinks the share count, which lifts EPS, but the cash spent stops earning interest (or new debt adds interest), so net income falls a little. EPS rises only if the earnings yield (1 &divide; P/E) beats the after-tax yield given up. At 20x with cash earning 4.5% after tax: accretive; at 25x, dilutive.<\/p><p>Accretion is arithmetic, not value creation. Buying back overvalued stock lifts EPS while destroying value; a debt-funded buyback adds hidden risk. India taxes buyback proceeds as capital gains from 1 April 2026; the test is unchanged.<\/p>","say":"Second miss. How does a share repurchase affect EPS? Give the mechanical answer, then the test, then the warning about value. Say it out loud, then reveal."},{"type":"reveal","q":"How would raising capital through a share issuance affect EPS?","tag":"Your miss","a":"<p>Issuing shares enlarges the denominator, so EPS is diluted unless the new cash earns more than the earnings yield: the buyback test reversed. With net income 100, 100 shares at a price of 20 and cash earning 3% after tax, issuing 200 (10 shares) gives 106 over 110, EPS 0.96 from 1.00.<\/p><p>For a stock-funded acquisition the same logic applies: the deal is accretive when the acquirer's P/E is higher than the target's, before synergies. Accretion tests optics, not whether the price paid was right.<\/p>","say":"Third miss, the mirror image. How does raising capital by issuing shares affect EPS? Use the same test, give the number, and add the acquisition version. Then reveal."},{"type":"reveal","q":"What is the relationship between ROA and ROE?","tag":"Your miss","a":"<p>ROE = ROA &times; (assets &divide; equity), the equity multiplier. With no debt the two are identical. Adding debt raises assets relative to equity and lifts ROE above ROA with no change in the business: 11.25% to 16.5% in the example, with half the capital borrowed.<\/p><p>So a rising ROE can be pure leverage. If ROA is flat while ROE climbs, the company is adding debt and risk, and leverage cuts both ways in a bad year. To compare asset efficiency across capital structures, use operating ROA with NOPAT.<\/p>","say":"Last one, a miss. What is the relationship between return on assets and return on equity? Give the identity, the example, and how you would read a rising ROE. Then reveal."},{"type":"recap","points":["Diluted EPS adds only in-the-money securities, net of shares their cash buys back","Buyback or issue: compare the earnings yield with the after-tax yield on the cash","Accretion is arithmetic; value depends on the price against intrinsic value","ROE = ROA times assets over equity: leverage lifts ROE, not the business"],"say":"Four to keep. Diluted EPS counts only in the money securities, net of the shares their cash would buy back. A buyback or share issue is accretive when the earnings yield beats the after tax yield on the cash. Accretion is arithmetic, value is about price. And leverage lifts return on equity without improving the business. Next: leases, where rent turns into debt."}]},{"id":"acc-08","module":"acc","title":"Leases: rent becomes debt","mins":7,"blurb":"Masala Mills rents a warehouse. Ind AS 116 arrives and EBITDA jumps by the whole rent. Nothing changed.","slides":[{"type":"hook","title":"EBITDA jumped. The warehouse did not move.","text":"Masala Mills rents a warehouse for &#8377;500 a year, five years, no option to buy. Ind AS 116 arrives. EBITDA rises by the whole &#8377;500, debt rises by &#8377;1,895, and the landlord gets the same cheque. How?","say":"Masala Mills rents a warehouse for 500 a year for five years. Think of the units as lakh if you like. Then Ind AS 116 comes in. Suddenly EBITDA is up by the whole 500, reported debt is up by 1,895, and the landlord receives exactly the same cheque. Your note said you needed to learn this from the CFA book. Here it is, built from scratch."},{"type":"explain","title":"Day one: the present value of the rent","text":"Every standard starts the same way. Lease liability = PV of the payments at the lease rate: &#8377;500 &times; 3.791 = &#8377;1,895 at 10%. An equal <b>right-of-use asset<\/b> goes on the other side. No P&amp;L effect on day one.","visual":"<div class=\"formula\">Liability = 500 &times; (1 &minus; 1.10<sup>&minus;5<\/sup>) &divide; 0.10 = 500 &times; 3.791 = &#8377;1,895<\/div><div class=\"balance\"><span>ROU asset +1,895<\/span><span class=\"eq\">=<\/span><span>Lease liability +1,895<\/span><\/div>","say":"Day one is the same under Ind AS 116, IFRS 16 and US GAAP. Take the five payments of 500, discount them at the lease rate of 10 per cent. The annuity factor is 3.791, so the liability is 1,895. Put the same number on the asset side as a right of use asset. Both sides grow by 1,895 and nothing touches profit yet."},{"type":"number","q":"₹500 a year for 5 years, discount rate 10%. Day-one lease liability, in rupees?","answer":1895,"tol":5,"unit":"rupees","why":"The 5-year annuity factor at 10% is 3.791. 500 times 3.791 = 1,895. The right-of-use asset starts at the same number.","say":"Compute the day one number. Five payments of 500, one a year, discounted at 10 per cent. What is the lease liability Masala Mills books, to the nearest few rupees?"},{"type":"explain","title":"Ind AS 116: depreciation plus falling interest","text":"Depreciate the asset: 1,895 &divide; 5 = 379 a year. Charge 10% interest on a liability that shrinks like a loan: 190, 158, 124, 87, 45. The total is front-loaded: 569 down to 425. A US operating lease shows one flat 500. Both sum to 2,500.","visual":"<div class=\"minichart\" style=\"--max:600\"><div class=\"mc-legend\"><span><i class=\"mc-a\"><\/i>Ind AS 116: depreciation + interest<\/span><span><i class=\"mc-b\"><\/i>ASC 842 operating: flat cost<\/span><\/div><div class=\"mc-plot\"><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:569\"><em>569<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:500\"><em>500<\/em><\/div><span class=\"mc-x\">Y1<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:538\"><em>538<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:500\"><em>500<\/em><\/div><span class=\"mc-x\">Y2<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:503\"><em>503<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:500\"><em>500<\/em><\/div><span class=\"mc-x\">Y3<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:466\"><em>466<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:500\"><em>500<\/em><\/div><span class=\"mc-x\">Y4<\/span><\/div><div class=\"mc-group\"><div class=\"mc-col mc-a\" style=\"--v:425\"><em>425<\/em><\/div><div class=\"mc-col mc-b\" style=\"--v:500\"><em>500<\/em><\/div><span class=\"mc-x\">Y5<\/span><\/div><\/div><div class=\"mc-xpad\"><\/div><\/div>","say":"Now the income statement, where the standards part ways. Under Ind AS 116 the right of use asset depreciates: 1,895 over five years is 379 a year. The liability carries 10 per cent interest and falls like a loan: 190, then 158, 124, 87 and 45. Total charge 569 in year one, falling to 425. A US operating lease shows one flat 500. Both add up to 2,500."},{"type":"mcq","q":"Which standard still lets a lessee call something an operating lease with a single flat cost?","options":["Ind AS 116","IFRS 16","US GAAP, ASC 842","All three"],"answer":2,"why":"Ind AS 116 and IFRS 16 have one lessee model: every lease except short-term and low-value ones gets depreciation plus interest. ASC 842 keeps the operating class on the P&L, though the liability is on the balance sheet too.","say":"Quick check. Under which standard can a lessee still show a lease as a single flat operating cost on the income statement? Remember that all three put the liability on the balance sheet."},{"type":"statements","title":"Walk it: year one, against the old rent","text":"Changes in year one versus expensing &#8377;500 of rent. Before tax. Ind AS 7 moves interest paid to financing, so the whole payment leaves CFO.","rows":{"is":[["Rent removed",-500],["Depreciation",379],["Interest",190],["Profit before tax",-69]],"cfs":[["Profit before tax",-69],["Add back depreciation",379],["Interest paid moved to financing",190],["Lease payment (financing)",-500],["Change in cash",0]],"bs":[["ROU asset",-379],["Lease liability",-310],["Retained earnings",-69]]},"order":[["is",0],["is",1],["is",2],["is",3],["cfs",0],["cfs",1],["cfs",2],["cfs",3],["cfs",4],["bs",0],["bs",1],["bs",2]],"check":"Assets -379 = Liabilities -310 + Equity -69","say":"Year one, against the old way of expensing rent. Rent of 500 disappears, depreciation of 379 and interest of 190 appear, so pre-tax profit is 69 lower and EBITDA 500 higher. On the cash flow statement nothing real changed: the 500 still left, but under Ind AS 7 interest and principal both sit in financing, so operating cash flow is 500 higher. The asset falls 379, the liability 310."},{"type":"explain","title":"Same cash, different ratios","text":"Rent now sits below EBITDA as depreciation and interest. The business is unchanged; the ratios are not. Compare peers on one basis: leases in both EBITDA and debt, or in neither. Subtract lease payments before calling CFO minus capex free cash flow.","visual":"<table class=\"t compact\"><thead><tr><th>Metric<\/th><th>Moves<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td>EBITDA<\/td><td class=\"pos\">Up 500<\/td><td>Rent leaves opex<\/td><\/tr><tr><td>Net debt<\/td><td class=\"neg\">Up 1,895<\/td><td>Lease liability counts<\/td><\/tr><tr><td>CFO<\/td><td class=\"pos\">Up 500 (Ind AS 7) or 310<\/td><td>Payment moves to financing<\/td><\/tr><tr><td>Interest cover, ROCE<\/td><td class=\"neg\">Usually down<\/td><td>Capital +1,895, EBIT only +121<\/td><\/tr><\/tbody><\/table>","say":"Here is the damage to the ratios. EBITDA is up 500 because rent left operating costs. Net debt is up 1,895 because the lease liability counts. Operating cash flow is up, by 500 in India where interest paid sits in financing, by 310 elsewhere. Interest cover and return on capital usually fall. The warehouse and the cheque to the landlord are identical. Compare peers on one basis."},{"type":"sort","q":"After Ind AS 116, does each item go up, down or stay the same?","buckets":["Up","Down","Unchanged"],"items":[["EBITDA","Up"],["Reported debt","Up"],["Operating cash flow","Up"],["Interest cover","Down"],["Cash paid to the landlord","Unchanged"],["Total P&L charge over the five years","Unchanged"]],"why":"Rent moves below EBITDA, the liability joins debt, and the payment moves out of CFO. Interest cover falls because interest rose. The cash and the lifetime cost of 2,500 do not change.","say":"Sort them. For each item, did Ind AS 116 push it up, push it down, or leave it alone? Keep asking yourself: did anything real change, or only where it is reported?"},{"type":"mcq","q":"Masala Mills leases its warehouses; a peer owns its own. Comparing EV/EBITDA without adjusting for Ind AS 116 is...","options":["Fine, both report under Ind AS","Misleading: Masala Mills' EBITDA and debt both rose mechanically; the owner saw no uplift","Conservative for Masala Mills","Only a problem for US companies"],"answer":1,"why":"The lessee's EBITDA is flattered and its EV carries the lease liability. Put leases in both EBITDA and debt for both companies, or strip them from both. Trent, Indian Hotels and IndiGo saw big mechanical margin jumps in 2019.","say":"Apply it. Masala Mills leases every warehouse. A competitor owns its buildings. You screen both on enterprise value to EBITDA straight from the reported numbers. Is that fair?"},{"type":"reveal","q":"What is the accounting treatment for finance leases?","tag":"Your miss","a":"<p>Day one: the PV of the payments is booked as a lease liability and a right-of-use asset. The charge is depreciation plus interest, front-loaded: &#8377;500 a year for 5 years at 10% gives a &#8377;1,895 liability, then 379 depreciation plus 190 interest in year 1.<\/p><p>US GAAP calls a lease finance when it is really a purchase: ownership transfers, bargain purchase option, most of the economic life, PV near fair value, specialised asset. Ind AS 116 and IFRS 16 apply this model to every lease but short-term and low-value ones.<\/p>","say":"Boss question one, a miss. What is the accounting treatment for finance leases? Give day one, the income statement split with numbers, and when US GAAP classifies a lease as finance. Then reveal."},{"type":"reveal","q":"What is the accounting treatment for operating leases?","tag":"Your miss","a":"<p>Under Ind AS 116 and IFRS 16 a lessee has no operating leases: every lease except short-term and low-value ones is capitalised and expensed as depreciation plus interest. Under US GAAP (ASC 842) operating leases survive: liability and right-of-use asset on the balance sheet, but one straight-line lease cost on the income statement.<\/p><p>Ratios move though cash does not: EBITDA, CFO and debt rise, interest cover and ROCE change. In India, Ind AS 7 puts interest paid in financing too, so the whole payment leaves CFO.<\/p>","say":"Second miss. What is the accounting treatment for operating leases? Say what Ind AS and IFRS did to the category, what US GAAP kept, and what happens to the ratios. Then reveal."},{"type":"reveal","q":"How do you calculate the fixed charge coverage ratio and what does it mean?","tag":"Your miss","a":"<p>FCCR = (EBIT + lease or rent charges) &divide; (lease or rent charges + interest expense). It asks whether earnings cover every fixed contractual charge, rent included, not just interest on debt. Higher means more cushion.<\/p><p>It exists because interest cover alone understates the fixed burden on a heavy lessee such as a retailer or an airline. Adding rent to both sides treats leases like debt, the right instinct even before Ind AS 116 and ASC 842 capitalised them. Updated: with leases capitalised, check how the loan agreement defines fixed charges.<\/p>","say":"Third miss. How do you calculate the fixed charge coverage ratio, and what does it mean? Give the formula, who it matters for, and why it existed before leases were capitalised. Then reveal."},{"type":"reveal","q":"How did Ind AS 116 change lease accounting for Indian companies, and what does it do to EBITDA and leverage?","tag":"","a":"<p>From 1 April 2019 every lease except short-term and low-value ones goes on the lessee's balance sheet: a right-of-use asset and a lease liability equal to the PV of future payments. The old rent expense splits into depreciation (above EBIT) and interest (below EBIT).<\/p><p>EBITDA rises mechanically with no change in cash paid to landlords. The lease liability joins reported debt, so net debt to EBITDA moves on both sides, and interest cover and ROCE shift. Trent, Indian Hotels and IndiGo saw the largest mechanical margin jumps.<\/p>","say":"Last one, a practical card. How did Ind AS 116 change lease accounting for Indian companies, and what did it do to EBITDA and leverage ratios? Give the mechanics, the ratio effects and a sector example. Then reveal."},{"type":"recap","points":["Day one everywhere: liability and ROU asset at the PV of payments, 500 a year at 10% is 1,895","Ind AS 116 charges depreciation plus falling interest, front-loaded; ASC 842 operating keeps one flat cost","Same cash, but EBITDA, CFO and debt all rise; compare peers on one basis","FCCR treats rent as debt: add it to both sides of interest cover"],"say":"Four things. Day one is the same everywhere: a liability and a right of use asset at the present value of the rent. Ind AS 116 then charges depreciation plus falling interest, front loaded; a US operating lease keeps one flat cost. Cash is identical, but EBITDA, operating cash flow and debt all rise, so compare peers on one basis. Fixed charge cover always treated rent as debt. Next: ownership."}]},{"id":"acc-09","module":"acc","title":"Who owns whom: stakes, NCI and goodwill","mins":7,"blurb":"Masala Mills pays 240 for 80% of a pickle maker and its balance sheet grows by 260. Where did the extra 20 come from?","slides":[{"type":"hook","title":"Pay 240, balance sheet grows 260","text":"Masala Mills pays &#8377;240 Cr for 80% of Achaar Co, which has &#8377;500 Cr of assets and &#8377;200 Cr of liabilities. Total assets rise by &#8377;260 Cr, not &#8377;240 Cr. Where did the extra &#8377;20 Cr come from?","say":"Masala Mills buys 80 per cent of Achaar Co, a pickle maker, for 240 crore. Achaar Co has 500 crore of assets and 200 of liabilities. After the deal, Masala Mills' total assets are up by 260 crore, even though it only paid 240. Where did the extra 20 come from, and who owns it? This is your own worked example, animated."},{"type":"explain","title":"Ownership decides the accounting","text":"Under 20%: a passive stake at fair value. 20 to 50%: significant influence, the equity method, one line of profit. Control, usually over 50%: consolidate everything and show the slice you do not own as non-controlling interest. The bands are presumptions; influence and control decide.","visual":"<div class=\"spectrum\"><div class=\"sp-seg step-1\" style=\"--w:20;--t:8\"><b>Fair value<\/b><small>under 20%<\/small><\/div><div class=\"sp-seg step-2\" style=\"--w:30;--t:18\"><b>Equity method<\/b><small>20 to 50%<\/small><\/div><div class=\"sp-seg step-3\" style=\"--w:50;--t:30\"><b>Consolidate<\/b><small>co
