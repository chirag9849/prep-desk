"recap","points":["Profit chain: NIM (helped by cheap CASA) minus costs (cost to income) minus credit cost.","A high NIM usually buys riskier loans: always read it next to credit cost.","Low gross NPA can hide fast write-offs; capital above the minimum is room to grow."],"say":"Three things to keep. A lender's profit is the spread, helped by cheap CASA deposits, minus running costs, minus credit cost. Never read NIM without credit cost. And low NPAs can hide fast write-offs, while spare capital is room to grow."}]},{"id":"rat-08","module":"rat","title":"Insurers: combined ratio and VNB","mins":7,"blurb":"Every big general insurer paid out more than it collected last year. Here is how they still make money.","slides":[{"type":"hook","title":"Paying out more than it takes in","text":"New India Assurance paid 122 in claims and costs for every 100 of premium in FY26. Not one of six big general insurers stayed under 100. How do they stay in business?","visual":"<div class=\"kchips\"><span class=\"kchip dn\">Claims + costs &gt; premium<\/span><span class=\"kchip up\">Still in business<\/span><\/div>","say":"Here's a strange business. New India Assurance paid out 122 rupees in claims and costs for every 100 rupees of premium it collected. And none of the six big general insurers in our data stayed under 100. Yet they stay in business. Two insurance ratios explain how, and how life insurers are judged instead."},{"type":"explain","title":"Two kinds of insurer, two scorecards","text":"General insurers sell one-year cover, so each year's claims show up fast. Life insurers sell policies that run for decades, so the profit on a sale arrives slowly.","visual":"<div class=\"cmp\"><div class=\"cmp-c a step-1\"><h4>General insurer<\/h4><ul><li>Motor, health, fire<\/li><li>Cover for a year<\/li><li>Scorecard: combined ratio<\/li><\/ul><\/div><div class=\"cmp-c b step-2\"><h4>Life insurer<\/h4><ul><li>Protection, savings<\/li><li>Policies run for decades<\/li><li>Scorecard: VNB margin<\/li><\/ul><\/div><\/div>","steps":["General: one-year cover, judged on the combined ratio","Life: long policies, judged on VNB margin"],"say":"First, split insurers in two. General insurers sell motor, health and fire cover, usually for one year, so you see each year's claims quickly. Their scorecard is the combined ratio. Life insurers sell policies that last decades, so the profit on a sale arrives over many years. Their scorecard is the VNB margin."},{"type":"explain","title":"Combined ratio: claims plus costs","text":"Add claims and expenses, each as a share of premium. Below 100% means underwriting profit. Our toy insurer: 75% + 30% = <b>105%<\/b>, an underwriting loss of 5.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 128\" role=\"img\" aria-label=\"Premium of 100 against claims of 75 plus expenses of 30, which add to 105, past the 100 line\"><g class=\"step-1\"><text x=\"10\" y=\"35\" class=\"s-tb\">Premium<\/text><rect x=\"110\" y=\"16\" width=\"400\" height=\"30\" rx=\"5\" class=\"s-boxa\"/><text x=\"310\" y=\"36\" text-anchor=\"middle\" class=\"s-tb\">100<\/text><\/g><g class=\"step-2\"><text x=\"10\" y=\"85\" class=\"s-tb\">Paid out<\/text><rect x=\"110\" y=\"66\" width=\"300\" height=\"30\" rx=\"5\" class=\"s-boxb\"/><text x=\"260\" y=\"86\" text-anchor=\"middle\" class=\"s-tb\">Claims 75<\/text><\/g><g class=\"step-3\"><rect x=\"410\" y=\"66\" width=\"120\" height=\"30\" rx=\"5\" class=\"s-boxg\"/><text x=\"470\" y=\"86\" text-anchor=\"middle\" class=\"s-tb\">Costs 30<\/text><line x1=\"510\" y1=\"8\" x2=\"510\" y2=\"106\" class=\"s-lb\" stroke-dasharray=\"5 4\"/><text x=\"510\" y=\"122\" text-anchor=\"middle\" class=\"s-tr\">105 &gt; 100<\/text><\/g><\/svg><figcaption>Claims ratio 75% + expense ratio 30% = combined ratio 105%.<\/figcaption><\/figure>","steps":["Premium collected: 100","Claims paid: 75, a 75% claims ratio","Costs: 30. Total 105, past the 100 line"],"say":"The combined ratio. Our toy insurer collects 100 of premium. It pays 75 in claims, a claims ratio of 75 per cent. Commissions, staff and other costs take 30, an expense ratio of 30. Add them: 105 per cent. Above 100 means the insurance itself lost money, 5 rupees on every 100. Lower is better."},{"type":"explain","title":"The float pays the bills","text":"Premiums arrive before claims are paid. The insurer invests that money in the meantime. Here investment income of 9 turns an underwriting loss of 5 into a profit of 4.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Day one<\/span><b>Premium +100<\/b><small>collected upfront<\/small><\/div><div class=\"fstep hl step-2\"><span class=\"fk\">Meanwhile<\/span><b>Invested +9<\/b><small>income on the float<\/small><\/div><div class=\"fstep hl2 step-3\"><span class=\"fk\">Later<\/span><b>Claims, costs &minus;105<\/b><small>paid over time<\/small><\/div><div class=\"fstep step-4\"><span class=\"fk\">Profit<\/span><b>+4<\/b><small>&minus;5 underwriting, +9 investing<\/small><\/div><\/div>","steps":["Premium comes in on day one","It earns investment income while it waits","Claims and costs go out later","Profit of 4"],"say":"So how do they survive? Timing. Premium comes in on day one, but claims are paid over months or years. In between, the insurer invests that pool of money, called the float. Our toy insurer earns 9 on it. Minus 5 from underwriting plus 9 from investing gives a profit of 4. Most Indian general insurers work this way."},{"type":"ratio","id":"r-combined","say":"Every bar sits above 100. New India Assurance is worst at 122: claims nearly equal its premium, plus a one-time wage revision. Go Digit's motor-heavy book is next at 111. Best is Star Health at 100, which prices retail health cover tightly. Bajaj General runs a disciplined book at 103."},{"type":"explain","title":"VNB margin: profit on this year's sales","text":"Value of new business is the profit, in today's money, that this year's new policies will earn over their life. Divide by APE: regular premium plus a tenth of single premium. Toy life insurer: <b>25%<\/b>.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"VNB margin for a toy life insurer: VNB 25 over APE of 100 equals 25 per cent\"><g class=\"step-1\"><rect x=\"118\" y=\"8\" width=\"165\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Value of new business<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">25<\/text><\/g><line x1=\"34\" y1=\"69\" x2=\"366\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"42\" y=\"84\" width=\"125\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"105\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Regular premium<\/text><text x=\"105\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">90<\/text><text x=\"180\" y=\"113\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"193\" y=\"84\" width=\"165\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"276\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">10% of single premium<\/text><text x=\"276\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">10<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">25%<\/text><\/g><\/svg><figcaption>Protection earns the highest margin, participating savings the lowest.<\/figcaption><\/figure>","steps":["Top: today's value of future profit on new policies, 25","Bottom: APE, 90 plus a tenth of 100, so 100","VNB margin is 25%"],"say":"For life insurers, profit on a policy comes over decades, so we value it upfront. VNB, value of new business, is the profit this year's new policies will earn, in today's money. Divide by APE, annual premium equivalent: regular premium plus a tenth of single premium. 25 over 100 is 25 per cent. Product mix drives it: protection earns most."},{"type":"ratio","id":"r-vnb","say":"SBI Life leads at 28 per cent: it sells through SBI's vast branch network at low cost and has a big protection book. Axis Max Life and ICICI Prudential follow near 25. LIC is lowest at 21: it sells mostly participating savings policies, where most profit goes to policyholders. HDFC Life lost GST credits and faced new surrender rules."},{"type":"number","q":"A general insurer earns &#8377;1,000 Cr of premium, pays &#8377;680 Cr of claims and &#8377;300 Cr of expenses. Combined ratio, in %?","answer":98,"tol":0.5,"unit":"%","why":"Claims ratio 68% + expense ratio 30% = 98%. Below 100%, so it makes an underwriting profit of &#8377;20 Cr before any investment income.","say":"Questions now. 1,000 crore of premium, 680 crore of claims, 300 crore of expenses. What's the combined ratio?"},{"type":"mcq","q":"Which of these insurers made an underwriting profit in FY26?","options":["Star Health","ICICI Lombard","Go Digit","None of them"],"answer":3,"why":"An underwriting profit needs a combined ratio below 100%. The best, Star Health, was at 100.4%. Profit came from investing the float.","say":"Look back at the combined ratio chart. Which of these made money on the insurance itself, before investment income? Be careful with the one closest to the line."},{"type":"order","q":"Rank by combined ratio, best (lowest) first","items":["Star Health","Bajaj General","Go Digit","New India Assurance"],"why":"Star Health 100%, Bajaj General 103%, Go Digit 111%, New India Assurance 122%.","say":"Rank these four general insurers from the best combined ratio, the lowest, to the worst."},{"type":"mcq","q":"LIC has the lowest VNB margin of the five (21%). Why?","options":["It sells too many protection policies","It sells mostly participating savings policies, where most profit goes to policyholders","Its premiums fell","It has no agents"],"answer":1,"why":"Product mix drives VNB margin. Protection earns the most; participating savings, where policyholders share most of the profit, earns the least.","say":"LIC is the biggest life insurer, but it has the lowest VNB margin of the five. What did the chart say drives it?"},{"type":"number","q":"New policies this year: &#8377;2,000 Cr regular premium, &#8377;4,000 Cr single premium, VNB &#8377;600 Cr. VNB margin, in %?","answer":25,"tol":0.3,"unit":"%","why":"APE = 2,000 + 10% &times; 4,000 = 2,400. VNB margin = 600 &divide; 2,400 = 25%.","say":"Work out APE first. 2,000 crore of regular premium and 4,000 crore of single premium. Only a tenth of single premium counts. Then divide 600 crore of VNB by it."},{"type":"sort","q":"General insurer metric or life insurer metric?","buckets":["General insurer","Life insurer"],"items":[["Claims ratio","General insurer"],["Expense ratio","General insurer"],["Combined ratio","General insurer"],["Investment income on the float","General insurer"],["VNB margin","Life insurer"],["APE","Life insurer"],["Protection share of sales","Life insurer"]],"why":"General insurers are judged year by year on claims and costs against premium. Life insurers are judged on the value of what they sell, measured by VNB against APE.","say":"Sort each measure into the kind of insurer it belongs to. Ask yourself: is it judged year by year on claims and costs, or on the value of policies that run for decades?"},{"type":"reveal","tag":"","q":"A general insurer reports a 103% combined ratio and a healthy profit. How, and what would worry you?","a":"<p>It lost 3 per 100 of premium on underwriting but earned more by investing the <b>float<\/b>: premiums collected before claims are paid. Most Indian general insurers work this way.<\/p><p>Worries: a rising combined ratio, profits that depend on bond gains, and long-tail lines like motor third-party, where claims arrive years later and reserves may be too thin.<\/p>","say":"Boss question. A general insurer runs a 103 per cent combined ratio and still reports a healthy profit. Explain how, and what would worry you. Say it out loud first."},{"type":"recap","points":["Combined ratio = claims ratio + expense ratio; below 100% is an underwriting profit.","Indian general insurers mostly run above 100% and earn their profit on the float.","VNB margin = VNB &divide; APE; protection earns the most, participating savings the least."],"say":"Three things to keep. The combined ratio adds claims and costs against premium, and below 100 is a profit. Most Indian general insurers run above 100 and live off the float. And life insurers are judged on VNB margin, which depends on product mix."}]},{"id":"rat-09","module":"rat","title":"Sector KPIs","mins":12,"blurb":"IndiGo filled its planes and still lost money. Eight sector scorecards find what standard ratios miss.","slides":[{"type":"hook","title":"Every sector has its own scorecard","text":"IndiGo lost money in FY26. The reason sits in two numbers, each under six rupees. Sector KPIs find what the standard ratios miss.","visual":"<div class=\"kchips\"><span class=\"kchip\">Hotels: RevPAR<\/span><span class=\"kchip\">Telecom: ARPU<\/span><span class=\"kchip\">Airlines: RASK, CASK<\/span><span class=\"kchip\">Refiners: GRM<\/span><span class=\"kchip\">Power: PLF<\/span><span class=\"kchip\">Retail: SSSG<\/span><span class=\"kchip\">Cement: EBITDA per tonne<\/span><span class=\"kchip\">Software: NRR<\/span><\/div>","say":"Margins and returns work everywhere, but every sector also has its own scorecard, and interviewers expect you to know it. IndiGo lost money in FY26 because of a gap between two numbers, each smaller than six rupees. This lesson teaches eight sector KPIs, one at a time, with a tiny example for each."},{"type":"explain","title":"RevPAR: hotels","text":"Room revenue per available room per night. It combines how full the hotel is with what it charges. A 100-room hotel selling 75 rooms at &#8377;8,000 earns <b>&#8377;6,000<\/b> RevPAR.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"RevPAR: room revenue 6 lakh rupees over 100 rooms equals 6,000 rupees, which is 75 per cent occupancy times an 8,000 rupee rate\"><g class=\"step-1\"><rect x=\"121\" y=\"8\" width=\"158\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Room revenue a night<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">&#8377;6,00,000<\/text><\/g><line x1=\"113\" y1=\"69\" x2=\"287\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"138\" y=\"84\" width=\"125\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Rooms available<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">100<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">&#8377;6,000<\/text><\/g><\/svg><figcaption>Same answer: 75% occupancy &times; &#8377;8,000 average rate.<\/figcaption><\/figure>","steps":["Top: 75 rooms sold at 8,000 rupees, 6 lakh a night","Bottom: all 100 rooms, sold or empty","RevPAR is 6,000 rupees"],"say":"RevPAR is revenue per available room. A hotel has 100 rooms and sells 75 tonight at 8,000 rupees each. That's 6 lakh of room revenue, spread over all 100 rooms, empty ones included. RevPAR is 6,000 rupees. It's also occupancy times rate: 75 per cent times 8,000. Rate-led growth is better, since it adds revenue without adding cost."},{"type":"ratio","id":"r-revpar","say":"IHCL's Taj hotels lead at rupees 13,250: luxury rates at about 78 per cent full. Juniper's few large Hyatt hotels come next at 10,863, filling 81 per cent. Lemon Tree is last at 5,855. Its midscale rooms fill well but sell cheaply. That's a rate gap, not an occupancy gap."},{"type":"explain","title":"ARPU: telecom","text":"Average revenue per user per month: service revenue divided by average subscribers. An operator with &#8377;600 Cr of service revenue in a quarter and 1 Cr users earns <b>&#8377;200<\/b> a month per user.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"ARPU: 200 crore rupees of monthly revenue over 1 crore subscribers equals 200 rupees per user per month\"><g class=\"step-1\"><rect x=\"111\" y=\"8\" width=\"178\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Service revenue a month<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">&#8377;200 Cr<\/text><\/g><line x1=\"103\" y1=\"69\" x2=\"297\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"124\" y=\"84\" width=\"151\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Average subscribers<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">1 Cr<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">&#8377;200<\/text><\/g><\/svg><figcaption>A quarter of &#8377;600 Cr is &#8377;200 Cr a month.<\/figcaption><\/figure>","steps":["Top: a month of service revenue, 600 over 3","Bottom: average subscribers, 1 crore","ARPU is 200 rupees a month"],"say":"ARPU, average revenue per user. An operator books 600 crore of service revenue in a quarter, so 200 crore a month. It has 1 crore subscribers on average. That's 200 rupees per user per month. Telecom costs are mostly fixed, the network is already built, so each extra rupee of ARPU flows largely to EBITDA."},{"type":"ratio","id":"r-arpu","say":"Airtel earns the most per user, 257 rupees a month. It has more postpaid and high-spending smartphone users. Jio is at 214, with many low-paying feature-phone users in its base. Vodafone Idea is last at 190: a weaker network keeps fewer high spenders."},{"type":"explain","title":"RASK vs CASK: airlines","text":"Divide revenue and cost by available seat km: seats flown times distance. A plane with 1,000 seats flying 1,000 km offers 10 lakh seat km. RASK above CASK means profit.","visual":"<div class=\"fgrid\"><div class=\"fcard step-1\"><div class=\"fname\">RASK<\/div><div class=\"fx\">&#8377;55 lakh &divide; 10 lakh = &#8377;5.50<\/div><div class=\"fnote\">revenue per seat km<\/div><\/div><div class=\"fcard step-2\"><div class=\"fname\">CASK<\/div><div class=\"fx\">&#8377;50 lakh &divide; 10 lakh = &#8377;5.00<\/div><div class=\"fnote\">cost per seat km<\/div><\/div><div class=\"fcard step-3\"><div class=\"fname\">Spread<\/div><div class=\"fx\">&#8377;0.50 &times; 10 lakh = &#8377;5 lakh<\/div><div class=\"fnote\">profit<\/div><\/div><\/div>","steps":["Revenue per seat km: 5.50","Cost per seat km: 5.00","Fifty paise of spread, times every seat km"],"say":"Airlines are a spread business. Count available seat kilometres: 1,000 seats flown 1,000 kilometres is 10 lakh. Revenue of 55 lakh gives RASK, revenue per seat kilometre, of 5 rupees 50. Costs of 50 lakh give CASK of 5 rupees. Fifty paise of spread, times 10 lakh seat kilometres, is 5 lakh of profit. Tiny gaps swing profit hugely."},{"type":"ratio","id":"r-rask","say":"This chart is IndiGo, two years. In FY25, RASK of 5.14 comfortably beat CASK of 4.66. In FY26, RASK slipped to 4.99 after the Middle East crisis and the December 2025 flight disruptions. CASK rose to 5.00, mainly because the weaker rupee raised dollar-linked costs. A one paisa gap, and IndiGo lost money."},{"type":"explain","title":"GRM: refiners","text":"Gross refining margin is the value of the fuels made from a barrel minus what the crude cost. A barrel bought at $75 that yields $85 of products earns a <b>$10<\/b> GRM, before running costs.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Buy<\/span><b>Crude &minus;$75<\/b><small>one barrel<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Refine<\/span><b>Petrol, diesel, jet fuel<\/b><\/div><div class=\"fstep step-3\"><span class=\"fk\">Sell<\/span><b>Products +$85<\/b><\/div><div class=\"fstep hl step-4\"><span class=\"fk\">GRM<\/span><b>$10 a barrel<\/b><small>before operating costs<\/small><\/div><\/div>","steps":["Buy a barrel of crude for 75 dollars","Refine it into fuels","Sell the products for 85 dollars","GRM: 10 dollars a barrel"],"say":"GRM, gross refining margin. A refiner buys a barrel of crude for 75 dollars, turns it into petrol, diesel and jet fuel, and sells those for 85 dollars. The margin is 10 dollars a barrel, before running costs. GRMs move mostly with global fuel spreads, so one strong quarter says more about the market than the refiner."},{"type":"ratio","id":"r-grm","say":"BPCL leads at 11.7 dollars a barrel, lifted by about 18 dollars in the January to March quarter when fuel margins spiked. MRPL follows at 9.2, HPCL at 8.8. The last bar is the Singapore benchmark at 6.5, a regional reference. All three Indian refiners beat it in FY26."},{"type":"explain","title":"PLF: power plants","text":"Plant load factor is power generated over the most the plant could make running flat out all year. A 1,000 MW plant can make 8,760 GWh a year. It makes 6,132: <b>70%<\/b>.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"PLF: 6,132 gigawatt hours generated over 8,760 possible equals 70 per cent\"><g class=\"step-1\"><rect x=\"138\" y=\"8\" width=\"125\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Power generated<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">6,132 GWh<\/text><\/g><line x1=\"106\" y1=\"69\" x2=\"294\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"114\" y=\"84\" width=\"171\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">1,000 MW &times; 8,760 hours<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">8,760 GWh<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">70%<\/text><\/g><\/svg><figcaption>A year has 8,760 hours.<\/figcaption><\/figure>","steps":["Top: what the plant actually generated","Bottom: full capacity for every hour of the year","PLF is 70%"],"say":"PLF, plant load factor, shows how hard a power plant runs. A 1,000 megawatt plant running every hour of the year, 8,760 hours, would make 8,760 gigawatt hours. It actually makes 6,132. That's 70 per cent. PLF matters most for plants selling on the spot market. Contracted plants earn fixed charges for staying available, even when idle."},{"type":"ratio","id":"r-plf","say":"JSW Energy and Tata Power's plants outside Mundra lead at 73 per cent, with NTPC's coal fleet close at 72. Grids run the cheapest, most reliable plants first. Adani Power is at 66.5, near the all-India average of 65, dragged down by weak demand and more renewables. Tata Power's Mundra plant ran just 18 per cent: it was shut from July 2025 to April 2026."},{"type":"explain","title":"SSSG: retail and restaurants","text":"Same-store sales growth counts only stores open in both years. Masala Mills' 10 outlets grow from 100 to 106: <b>6%<\/b>. Three new outlets add 20, so revenue grows 26%. Only the 6% came free.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Last year<\/span><b>10 outlets: 100<\/b><\/div><div class=\"fstep hl step-2\"><span class=\"fk\">Same stores<\/span><b>106<\/b><small>+6% SSSG<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">New stores<\/span><b>+20<\/b><small>needs capex<\/small><\/div><div class=\"fstep step-4\"><span class=\"fk\">This year<\/span><b>126<\/b><small>+26% revenue<\/small><\/div><\/div>","steps":["Last year, 10 outlets sold 100","The same 10 now sell 106: SSSG of 6%","Three new outlets add 20","Total 126: revenue up 26%"],"say":"SSSG, same-store sales growth. Say Masala Mills runs 10 snack outlets that sold 100 last year. This year those same 10 sell 106, so same-store growth is 6 per cent. Three new outlets add 20, so total revenue jumps 26 per cent. But most of that growth needed new capex. The 6 per cent came free, so it's worth more."},{"type":"ratio","id":"r-sssg","say":"DMart leads at 10.8 per cent: low prices keep pulling more shoppers into its old stores. KFC, run by Devyani, posted 4.9, its best in 14 quarters. McDonald's only just turned positive at 1.5. Domino's is last at 0.2: orders grew about 10 per cent, but cheaper deals kept sales per store flat."},{"type":"explain","title":"EBITDA per tonne: cement and steel","text":"Operating profit on each tonne sold. A cement maker with &#8377;1,000 Cr of EBITDA on 1 Cr tonnes earns <b>&#8377;1,000<\/b> a tonne. It compares producers of any size.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"EBITDA per tonne: 1,000 crore rupees over 1 crore tonnes equals 1,000 rupees a tonne\"><g class=\"step-1\"><rect x=\"150\" y=\"8\" width=\"100\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">EBITDA<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">&#8377;1,000 Cr<\/text><\/g><line x1=\"142\" y1=\"69\" x2=\"258\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"151\" y=\"84\" width=\"99\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Tonnes sold<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">1 Cr<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">&#8377;1,000<\/text><\/g><\/svg><figcaption>In cement, freight distance and regional prices decide most of the gap.<\/figcaption><\/figure>","steps":["Top: operating profit, 1,000 crore","Bottom: tonnes sold, 1 crore","1,000 rupees a tonne"],"say":"EBITDA per tonne is operating profit on each tonne sold. A cement maker earns 1,000 crore of EBITDA on 1 crore tonnes, so 1,000 rupees a tonne. Because it's per tonne, a small regional player and a national giant compare directly. In cement, freight distance and regional prices decide most of the gap."},{"type":"ratio","id":"r-ebitda-tonne","say":"Two charts. In cement, UltraTech leads at rupees 1,253 a tonne: scale and plants near markets cut freight and fuel. Shree Cement follows at 1,125. Ambuja trails at 728, still absorbing plants it bought. In steel, Tata Steel India earns 15,213 a tonne, while SAIL's older plants earn about 6,018."},{"type":"explain","title":"NRR: software subscriptions","text":"Take last year's customers only. Start with their revenue, add upsell, take off downgrades and lost customers. 100 + 30 &minus; 5 &minus; 5 = 120: <b>NRR 120%<\/b>.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Start<\/span><b>100<\/b><small>same customers<\/small><\/div><div class=\"fstep hl step-2\"><span class=\"fk\">Upsell<\/span><b>+30<\/b><small>more seats, more usage<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">Downgrades<\/span><b>&minus;5<\/b><\/div><div class=\"fstep hl2 step-4\"><span class=\"fk\">Churn<\/span><b>&minus;5<\/b><small>customers lost<\/small><\/div><div class=\"fstep step-5\"><span class=\"fk\">A year on<\/span><b>120<\/b><small>NRR 120%<\/small><\/div><\/div>","steps":["Last year's customers paid 100","They bought 30 more","Some cut back by 5","Some left, taking 5","Same customers now pay 120"],"say":"NRR, net revenue retention, follows last year's customers only. They paid 100. This year they buy 30 more, some downgrade by 5, and some leave, taking 5 with them. The same customers now pay 120, so NRR is 120 per cent. Above 100, the business grows even with zero new customers. Below 100, new sales first fill the leak."},{"type":"ratio","id":"r-nrr","say":"Snowflake leads at 126 per cent, then MongoDB at 122. Both charge by usage, so bills grow as customers' data grows. Twilio has recovered to 116, from 108 a year ago. Freshworks, Indian-founded and listed in the US, is lowest at 104: small and mid-sized clients cut seats more readily."},{"type":"number","q":"A 200-room hotel sells 150 rooms a night at an average &#8377;8,000. RevPAR, in rupees?","answer":6000,"tol":1,"unit":"rupees","why":"Occupancy 150 &divide; 200 = 75%. 75% &times; &#8377;8,000 = &#8377;6,000. Or room revenue &#8377;12 lakh &divide; 200 rooms.","say":"Questions. A 200-room hotel sells 150 rooms a night at 8,000 rupees each. What's its RevPAR?"},{"type":"mcq","q":"Why did IndiGo lose money in FY26?","options":["It flew far fewer seats","RASK slipped to 4.99, just under a CASK of 5.00","Its RASK rose faster than CASK","Fuel was its only cost"],"answer":1,"why":"Profit is RASK minus CASK, times seat km. A one paisa negative gap across billions of seat km turned FY25's profit into a loss.","say":"Back to the hook. What happened to IndiGo's two per-seat numbers in FY26?"},{"type":"sort","q":"Which sector reports each KPI?","buckets":["Hotels","Telecom","Refining and power","Retail"],"items":[["RevPAR","Hotels"],["Occupancy","Hotels"],["ARPU","Telecom"],["Subscribers","Telecom"],["GRM","Refining and power"],["PLF","Refining and power"],["Same-store sales growth","Retail"],["New store openings","Retail"]],"why":"RevPAR is occupancy times rate. Telecom revenue is ARPU times subscribers. GRM is a refiner's margin a barrel, PLF a plant's usage. Retail growth splits into same-store growth and new stores.","say":"Sort each KPI into the sector that reports it. Each sector gets two."},{"type":"order","q":"Rank these cement makers by EBITDA per tonne, highest first","items":["UltraTech","Shree Cement","Dalmia Bharat","Ambuja"],"why":"UltraTech &#8377;1,253, Shree &#8377;1,125, Dalmia &#8377;1,023, Ambuja &#8377;728 a tonne.","say":"Rank these four cement makers on EBITDA per tonne, highest at the top. Scale and low-cost plants win."},{"type":"number","q":"Last year's customers paid &#8377;100 Cr. This year they add &#8377;25 Cr of upsell, downgrade &#8377;5 Cr and churn &#8377;8 Cr. NRR, in %?","answer":112,"tol":0.5,"unit":"%","why":"100 + 25 &minus; 5 &minus; 8 = 112, so NRR is 112%. New customers never enter NRR.","say":"Last one. Last year's customers paid 100 crore. They buy 25 more, cut back 5, and some leave, taking 8. What's the net revenue retention?"},{"type":"reveal","tag":"","q":"A hotel chain says RevPAR grew 10%. What do you ask next?","a":"<p>Split it: RevPAR = <b>occupancy &times; average room rate<\/b>. Rate-led growth is stronger, because a higher price adds revenue without adding cost, while filling more rooms brings more staff and upkeep.<\/p><p>Then ask whether it is like-for-like: new hotels still ramping up distort the average, as with Chalet's newer properties. Finally, compare with peers in the same segment.<\/p>","say":"Boss question. A hotel chain tells you RevPAR grew 10 per cent. What do you ask next? Answer out loud, then reveal."},{"type":"recap","points":["Most sector KPIs are price times volume per unit of capacity: RevPAR, ARPU, RASK, GRM, EBITDA per tonne.","Utilisation KPIs (PLF, occupancy) matter most where revenue is not contracted.","Growth KPIs strip out new capacity: SSSG ignores new stores, NRR ignores new customers."],"say":"Three things to keep. Most sector KPIs measure revenue or profit per unit of capacity, so always split them into price and volume. Utilisation matters most where revenue isn't contracted. And the best growth measures, same-store sales and net revenue retention, strip out growth you had to pay for."}]},{"id":"val-01","module":"val","title":"Three ways to value a company","mins":6,"blurb":"Masala Mills trades at Rs 100. Three methods, three different answers. Which one do you trust?","slides":[{"type":"hook","title":"Meet Masala Mills Ltd","text":"A listed snack and spice maker. Share price Rs 100, about 10 crore shares, EBITDA Rs 200 Cr next year. Your DCF says Rs 119. Peers say Rs 157. A buyer might pay Rs 217. Who is right?","visual":"<div class=\"kchips\"><span class=\"kchip\">Price &#8377;100<\/span><span class=\"kchip up\">DCF &#8377;119<\/span><span class=\"kchip up\">Comps &#8377;157<\/span><span class=\"kchip up\">Deals &#8377;217<\/span><\/div>","say":"Meet Masala Mills, a listed Indian snack and spice maker you will value for the whole module. The stock trades at one hundred rupees. Your discounted cash flow says one nineteen. Listed peers say one fifty seven. A buyer might pay two seventeen. Three answers from one company. By the end of this lesson you will know why they differ and which one to trust when."},{"type":"explain","title":"Three lenses, three questions","text":"A <b>DCF<\/b> asks what the cash is worth. <b>Trading comps<\/b> ask what the market pays today for a small, liquid stake in a similar firm. <b>Precedent transactions<\/b> ask what buyers paid for control.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>DCF<\/h4><ul><li>Future cash, discounted for time and risk<\/li><li>Intrinsic value<\/li><\/ul><\/div><div class=\"cmp-c c\"><h4>Trading comps<\/h4><ul><li>Peer multiples applied to Masala Mills<\/li><li>Price of a minority stake today<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Precedents<\/h4><ul><li>What acquirers paid in real deals<\/li><li>Price of control<\/li><\/ul><\/div><\/div>","say":"Three lenses, each answering a different question. A DCF asks what Masala Mills' future cash is worth today, discounted for time and risk. Trading comps ask what the market pays right now for a small, liquid stake in a similar snack maker. Precedent transactions ask what acquirers actually paid to take control of businesses like it. Different questions, so different answers."},{"type":"mcq","q":"Which method usually prints the highest value, and why?","options":["DCF, because terminal value is huge","Trading comps, because peers are expensive","Precedents, because buyers pay for control","They should all match if done well"],"answer":2,"why":"Deal prices include a control premium, often 20 to 40% above the undisturbed share price, so precedents sit at the top of the chart.","say":"Quick prediction. Which of the three methods usually gives the highest value, and why? Think about who is paying in each case before you pick."},{"type":"explain","title":"The football field","text":"Bankers put every range on one chart. Each bar is one method. The dashed line is today's price. Masala Mills at Rs 100 sits below every bar except its own 52-week range.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 1040 236\" role=\"img\" aria-label=\"Football field for Masala Mills: 52-week range 85 to 120, trading comps 142 to 187, DCF 103 to 140, precedent deals 197 to 237, against a share price of 100 rupees\"><text x=\"200\" y=\"49\" text-anchor=\"end\" class=\"s-tb\">52-week range<\/text><rect x=\"320\" y=\"34\" width=\"140\" height=\"22\" rx=\"5\" class=\"s-fn\"/><text x=\"314\" y=\"49\" text-anchor=\"end\" class=\"s-ts\">85<\/text><text x=\"466\" y=\"49\" class=\"s-ts\">120<\/text><text x=\"200\" y=\"91\" text-anchor=\"end\" class=\"s-tb\">DCF (WACC 12%, g 4 to 6%)<\/text><rect x=\"392\" y=\"76\" width=\"148\" height=\"22\" rx=\"5\" class=\"s-fg\"/><text x=\"386\" y=\"91\" text-anchor=\"end\" class=\"s-ts\">103<\/text><text x=\"546\" y=\"91\" class=\"s-ts\">140<\/text><text x=\"200\" y=\"133\" text-anchor=\"end\" class=\"s-tb\">Trading comps (9.25x to 11.5x)<\/text><rect x=\"548\" y=\"118\" width=\"180\" height=\"22\" rx=\"5\" class=\"s-fa\"/><text x=\"542\" y=\"133\" text-anchor=\"end\" class=\"s-ts\">142<\/text><text x=\"734\" y=\"133\" class=\"s-ts\">187<\/text><text x=\"200\" y=\"175\" text-anchor=\"end\" class=\"s-tb\">Precedent deals (12x to 14x)<\/text><rect x=\"768\" y=\"160\" width=\"160\" height=\"22\" rx=\"5\" class=\"s-fb\"/><text x=\"762\" y=\"175\" text-anchor=\"end\" class=\"s-ts\">197<\/text><text x=\"934\" y=\"175\" class=\"s-ts\">237<\/text><line x1=\"220\" y1=\"204\" x2=\"1010\" y2=\"204\" class=\"s-line\"/><text x=\"240\" y=\"226\" text-anchor=\"middle\" class=\"s-ts\">&#8377;65<\/text><text x=\"440\" y=\"226\" text-anchor=\"middle\" class=\"s-ts\">&#8377;115<\/text><text x=\"640\" y=\"226\" text-anchor=\"middle\" class=\"s-ts\">&#8377;165<\/text><text x=\"840\" y=\"226\" text-anchor=\"middle\" class=\"s-ts\">&#8377;215<\/text><line x1=\"380\" y1=\"22\" x2=\"380\" y2=\"204\" class=\"s-la\" stroke-dasharray=\"5 4\"/><text x=\"386\" y=\"18\" class=\"s-ta\">Price &#8377;100<\/text><\/svg><figcaption>Value per share. Every bar comes from a later lesson; the numbers carry through the module.<\/figcaption><\/figure>","say":"This chart is called a football field. Each bar is one method's range of value per share for Masala Mills. The dashed line is today's price of one hundred rupees. Notice the order. The DCF sits lowest among the three methods, comps in the middle, deals highest. You will build every one of these bars in the lessons ahead."},{"type":"sort","q":"Which method wins in each situation?","buckets":["DCF","Trading comps","Precedents"],"items":[["Forecastable cash flows, few true peers","DCF"],["Pricing an IPO against listed names","Trading comps"],["Advising a promoter selling the whole company","Precedents"],["Many listed peers, quick market check","Trading comps"],["Recent deals in the sector, control price needed","Precedents"],["Unlisted company, no share price to anchor to","DCF"]],"why":"DCF leads when cash is forecastable or there is no market price. Comps lead when liquid peers exist. Precedents lead when control is what is being sold.","say":"Sort these six situations by the method that should lead. Ask yourself one thing for each: is there a reliable market price to lean on, and is control being sold or just a small stake?"},{"type":"explain","title":"When each method is weak","text":"Every method has a blind spot. Know it before the interviewer names it.","visual":"<table class=\"t compact\"><thead><tr><th>Method<\/th><th>Weak when<\/th><\/tr><\/thead><tbody><tr><td>DCF<\/td><td>Loss-makers, peak or trough years, startups<\/td><\/tr><tr><td>Trading comps<\/td><td>The whole sector is mispriced<\/td><\/tr><tr><td>Precedents<\/td><td>Few deals, stale rate cycles, private terms<\/td><\/tr><\/tbody><\/table>","say":"Every method has a blind spot. A DCF struggles with loss makers, startups and companies at the peak or trough of a cycle, because the cash flows are not credible. Comps cannot see a whole sector that is mispriced together. Precedents suffer from thin data: few deals, old rate cycles and terms nobody disclosed."},{"type":"mcq","q":"Masala Mills has an unlisted rival, Desi Crunch Pvt Ltd, run by its founder. What changes when you value it?","options":["Switch to precedents only","Same tools, dirtier inputs, no market check, then an illiquidity discount","Use book value, since there is no price","Apply a control premium"],"answer":1,"why":"Normalise owner pay and related-party costs, let the DCF lead with peers as a cross-check, then take 10 to 30% off because a private stake cannot be sold any day.","say":"Masala Mills has an unlisted rival, Desi Crunch, run by its founder. What changes when you value a private company instead of a listed one? Pick the option that gets both the method and the final adjustment right."},{"type":"explain","title":"Private company: the three moves","text":"Same methods, worse data. Clean the numbers, let the DCF lead, then discount for the missing exit.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">1<\/span><b>Normalise<\/b><small>owner salary, related-party rent<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">2<\/span><b>Value<\/b><small>DCF leads, peers cross-check<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">3<\/span><b>Discount<\/b><small>10 to 30% for illiquidity<\/small><\/div><\/div>","steps":["Private firms are run to minimise tax, so add back owner pay and discretionary spend.","No share price to check against, so the DCF carries the answer.","Listed multiples include a premium for being sellable any day. A private stake is not."],"say":"Three moves for a private company. First, normalise: founders pay themselves oddly and route costs through related parties, so clean that up. Second, value it with a DCF and use listed peers only as a cross check. Third, take an illiquidity discount, usually ten to thirty per cent, because listed prices include a premium for being sellable any day."},{"type":"mcq","q":"A client asks you to value a painting. Which method?","options":["A DCF on expected resale gains","Comparable sales of similar works, adjusted","Replacement cost of canvas and labour","Book value in the owner's accounts"],"answer":1,"why":"A painting produces no cash, so there is nothing to discount. It has a price, not an intrinsic value: use recent auction and private sales, adjusted for artist, period, size and condition.","say":"A client asks you to value a painting. Which method would you use? Remember what a DCF actually needs before you answer."},{"type":"reveal","q":"How would you value a painting?","tag":"Your miss","a":"<p>Not with a DCF. A painting throws off no cash, so there is nothing to discount: it has a <b>price<\/b>, not an intrinsic value. I'd pull recent auction and private sales of comparable works, adjust for artist, period, size, condition and provenance, and give a range rather than a point estimate.<\/p>","say":"Your miss. You were asked how to value a painting and reached for a DCF twice. Say it out loud now: no cash flow, so no DCF. Comparable sales, adjusted, as a range. Then reveal and compare."},{"type":"reveal","q":"What is an illiquidity discount, and why does it exist?","tag":"Your miss","a":"<p>A haircut, typically 10 to 30%, applied to a private company's value because the stake cannot be sold quickly at a fair price. Public multiples already include a <b>liquidity premium<\/b>: investors pay more for shares they can exit any day. Strip that out for a private stake. The discount shrinks if an IPO or sale is near.<\/p>","say":"Your miss. What is an illiquidity discount and why does it exist? Give the size, the reason it exists in public prices, and what makes it shrink. Then reveal."},{"type":"reveal","q":"For an unlisted company, what role should listed peer EV/EBITDA multiples play, and why?","tag":"Your miss","a":"<p>A <b>cross-check<\/b>, not the primary method. With no market price to anchor to, the DCF carries the valuation off the company's own capacity, margins and working capital. Peer multiples then test whether the answer lands in a sensible range. Leading with them would import other companies' pricing into a business you can model directly.<\/p>","say":"Your miss. For an unlisted company, what should listed peer multiples do in your valuation, and why? Decide whether they lead or follow, then reveal."},{"type":"recap","points":["DCF for intrinsic value, comps for today's minority price, precedents for the price of control","Precedents sit highest because buyers pay a control premium","Private company: normalise, DCF leads, then an illiquidity discount of 10 to 30%","No cash flow means no DCF: a painting gets comparable sales"],"say":"What to keep. A DCF gives intrinsic value, comps give today's price for a minority stake, and precedents give the price of control, which is why they sit highest. For a private company, normalise, let the DCF lead and take an illiquidity discount. And anything with no cash flow gets comparable sales, never a DCF."}]},{"id":"val-02","module":"val","title":"Enterprise value, equity value and the bridge","mins":7,"blurb":"Masala Mills' market cap is Rs 1,000 Cr. Its enterprise value is Rs 1,430 Cr. Where did the extra 430 come from?","slides":[{"type":"hook","title":"Two prices for one company","text":"Masala Mills: Rs 100 a share, 10 crore diluted shares, so Rs 1,000 Cr of equity. Yet the business is worth Rs 1,430 Cr to everyone who funded it. Which number is the company worth?","visual":"<div class=\"balance\"><span>Equity value &#8377;1,000 Cr<\/span><span class=\"eq\">vs<\/span><span>Enterprise value &#8377;1,430 Cr<\/span><\/div>","say":"Masala Mills trades at one hundred rupees with ten crore diluted shares, so its equity is worth one thousand crore. Yet the operating business is worth one thousand four hundred and thirty crore to everyone who funded it. Both numbers are right. The difference is who has a claim on the cash. This lesson is the bridge between them."},{"type":"explain","title":"One test settles every line","text":"<b>Enterprise value<\/b> is the operating business, owned by all capital providers. <b>Equity value<\/b> is the slice left for shareholders. Ask of every item: is its cash already inside the EBITDA I valued? A claim on that cash comes out. Value outside it goes in.","visual":"<div class=\"cmp\"><div class=\"cmp-c b\"><h4>Comes out (claims)<\/h4><ul><li>Borrowings, promoter loans<\/li><li>Lease liabilities (Ind AS 116)<\/li><li>Preference shares<\/li><li>Minority interest (NCI)<\/li><\/ul><\/div><div class=\"cmp-c a\"><h4>Goes in (outside EBITDA)<\/h4><ul><li>Cash and short-term investments<\/li><li>Associates, at market value<\/li><li>Other non-operating assets<\/li><\/ul><\/div><\/div>","say":"One test settles every line of the bridge. Enterprise value is the operating business, owned by lenders and shareholders together. Equity value is what shareholders keep. For each item ask: is its cash already inside the EBITDA I valued? Debt, leases, preference shares and minority interest are claims on that cash, so they come out. Cash and associates sit outside EBITDA, so they go in."},{"type":"sort","q":"Build Masala Mills' bridge. Where does each item go?","buckets":["Subtract from EV","Add to EV","Leave out"],"items":[["Bank borrowings Rs 400 Cr","Subtract from EV"],["Promoter loan Rs 70 Cr","Subtract from EV"],["Lease liabilities Rs 30 Cr","Subtract from EV"],["Cash Rs 120 Cr","Add to EV"],["Preference shares Rs 40 Cr","Subtract from EV"],["Minority interest Rs 60 Cr","Subtract from EV"],["Listed associate, market value Rs 50 Cr","Add to EV"],["Trade payables Rs 90 Cr","Leave out"]],"why":"Payables are operating working capital, already inside the cash flows you valued. Everything else is either a claim ranking ahead of shareholders or an asset whose income EBITDA never saw.","say":"Now build the bridge yourself. Drag each item of Masala Mills into subtract, add, or leave out. One of them is a trap: it looks like a liability but it already lives inside the operating cash flows."},{"type":"explain","title":"Masala Mills, market basis","text":"Start from what the market says equity is worth and walk up to enterprise value. Net debt is 500 minus 120 cash, so 380.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Equity<\/span><b>1,000<\/b><small>&#8377;100 &times; 10 Cr shares<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">+ Net debt<\/span><b>+380<\/b><small>500 debt-like, 120 cash<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">+ Pref, NCI<\/span><b>+100<\/b><small>40 + 60<\/small><\/div><div class=\"fstep step-4\"><span class=\"fk\">&minus; Associate<\/span><b>&minus;50<\/b><small>at market<\/small><\/div><div class=\"fstep hl step-5\"><span class=\"fk\">EV<\/span><b>1,430<\/b><small>&#8377; Cr<\/small><\/div><\/div>","steps":["Market cap uses diluted shares.","Debt-like 500: bank 400, promoter loan 70, leases 30. Less cash 120.","Preference and minority interest rank ahead of common equity.","The associate's profit is not in EBITDA, so its value is not in EV.","EV 1,430 against EBITDA 200: about 7.2x."],"say":"Here is Masala Mills on a market basis. Equity one thousand crore. Add net debt of three eighty: five hundred of debt-like items, which is bank debt, a promoter loan and leases, less one twenty of cash. Add preference shares and minority interest, one hundred together. Take out the listed associate at market value, fifty. Enterprise value one thousand four hundred and thirty crore."},{"type":"number","q":"Masala Mills' DCF gives EV of Rs 1,616 Cr. Net debt 380, preference 40, NCI 60, associate +50. Equity value in Rs Cr?","answer":1186,"tol":1,"unit":"Rs Cr","why":"1,616 - 380 - 40 - 60 + 50 = 1,186. Claims on the cash you valued come out; the associate's value goes in.","say":"Now run the bridge downhill. The DCF gives an enterprise value of one thousand six hundred and sixteen crore. Net debt three eighty, preference forty, minority interest sixty, and a listed associate worth fifty. What is the equity value in crore?"},{"type":"explain","title":"How many shares? The treasury stock method","text":"Only in-the-money options count. Their strike cash buys back shares at today's price. RSUs have no strike, so add them in full. Masala Mills at Rs 100:","visual":"<table class=\"t compact\"><thead><tr><th>Instrument<\/th><th>Working<\/th><th>New (Cr)<\/th><\/tr><\/thead><tbody><tr><td>9.6 Cr basic shares<\/td><td><\/td><td>9.60<\/td><\/tr><tr><td>0.5 Cr options at &#8377;60<\/td><td>0.5 &minus; 30 &divide; 100<\/td><td>+0.20<\/td><\/tr><tr><td>0.4 Cr options at &#8377;120<\/td><td>out of the money<\/td><td>0<\/td><\/tr><tr><td>0.2 Cr RSUs<\/td><td>no strike<\/td><td>+0.20<\/td><\/tr><tr><td><b>Diluted<\/b><\/td><td><\/td><td><b>10.00<\/b><\/td><\/tr><\/tbody><\/table>","say":"How many shares do you divide by? Treasury stock method. Nine point six crore basic shares. Half a crore of options struck at sixty are in the money: exercising raises thirty crore, which buys back point three crore shares at one hundred, so net new is point two. The one twenty strikes are out of the money. RSUs have no strike, so all point two crore count. Ten crore diluted."},{"type":"number","q":"TSM drill: 0.5 Cr options at strike Rs 60, share price Rs 100. Net new shares in crore?","answer":0.2,"tol":0.01,"unit":"Cr shares","why":"Proceeds 0.5 x 60 = Rs 30 Cr buy back 30 / 100 = 0.3 Cr shares. Net new = 0.5 - 0.3 = 0.2 Cr. Run each tranche on its own strike.","say":"Your turn. Half a crore of options with a strike of sixty rupees, and the share trades at one hundred. Using the treasury stock method, how many net new shares, in crore, do they add?"},{"type":"mcq","q":"Suppose Masala Mills also had a convertible bond: Rs 60 Cr face, converting at Rs 80 a share. Price is Rs 100. What do you do?","options":["Keep it as debt; bonds are always debt","Add 0.75 Cr shares and also keep the Rs 60 Cr in net debt","Add 0.75 Cr shares and pull the Rs 60 Cr out of net debt","Ignore it until it converts"],"answer":2,"why":"Conversion price 80 is below the 100 share price, so assume conversion: 60 / 80 = 0.75 Cr new shares. Then remove the face value from debt, or you count the same claim twice.","say":"Suppose Masala Mills also had a convertible bond, sixty crore of face value converting at eighty rupees a share, with the stock at one hundred. What do you do with it? Watch for the double count."},{"type":"number","q":"A Rs 50 Cr tax demand is under appeal. You judge a 40% chance it crystallises. Haircut to equity value, in Rs Cr?","answer":20,"tol":0.5,"unit":"Rs Cr","why":"Contingent liabilities never sit in reported net debt, but they are real claims. Weight the outflow by probability: 50 x 40% = 20.","say":"The notes disclose a fifty crore tax demand under appeal. You judge a forty per cent chance it sticks. It is not in net debt. How much do you take off equity value, in crore?"},{"type":"reveal","q":"In an Indian company's EV-to-equity bridge, which debt-like items might never appear in the standard debt schedule?","tag":"Your miss","a":"<p>Three regulars. <b>Promoter and group loans<\/b>, often unsecured and parked outside the borrowings note. <b>Lease liabilities<\/b> under Ind AS 116, which are debt-like and belong in net debt. And on the other side, net debt should net off short-term investments as well as cash. Also scan for gratuity deficits and tax demands under appeal.<\/p>","say":"Your miss, four attempts and still partial. In an Indian company's bridge, which debt-like items can hide outside the standard debt schedule? Name at least two, then reveal."},{"type":"reveal","q":"Masala Mills owns 35% of a separately listed business. How is that stake carried, and what number goes in the bridge?","tag":"Your miss","a":"<p>A 20 to 50% stake is an <b>associate<\/b>, carried at cost plus its share of profits under the equity method, which usually understates what it is worth. Its earnings are not in Masala Mills' EBITDA, so its value is not in EV. Add it back at <b>market value<\/b>, not book, when walking from enterprise value to equity value.<\/p>","say":"Your miss. Masala Mills owns thirty five per cent of a separately listed company. How is that stake carried in the books, and which number do you add in the bridge? Say both parts, then reveal."},{"type":"reveal","q":"How do you handle restricted stock and convertible preferred in the diluted share count?","tag":"Your miss","a":"<p><b>RSUs<\/b>: add them in full. There is no strike price, so no buyback offset; the treasury stock method does not apply. <b>Convertible preferred<\/b>: run the if-converted test. If price times conversion ratio beats the liquidation value, add the as-converted shares and drop the preferred from the bridge. If not, keep it as a debt-like claim and add no shares.<\/p>","say":"Your miss, the one you marked skip this. How do RSUs and convertible preferred enter the share count? One rule for each, and remember what happens to the preferred in the bridge once it converts. Then reveal."},{"type":"recap","points":["EV is the operating business for all funders; equity is the shareholders' slice","Claims on the cash you valued come out; value outside EBITDA goes in","Masala Mills: EV 1,616 less 380 net debt, 40 pref, 60 NCI, plus 50 associate = 1,186","TSM for in-the-money options by tranche; RSUs in full; convertibles as shares if in the money"],"say":"What to keep. Enterprise value belongs to everyone who funded the business; equity value is the shareholders' slice. Claims on the cash you valued come out, value that sits outside EBITDA goes in. For Masala Mills, one six one six becomes one one eight six. And divide by diluted shares: treasury stock method for options, RSUs in full, convertibles as shares when in the money."}]},{"id":"val-03","module":"val","title":"Free cash flow: FCFF and FCFE","mins":7,"blurb":"Masala Mills earns Rs 90 Cr of profit next year but only Rs 70 Cr is really the shareholders' to spend. Where did the rest go?","slides":[{"type":"hook","title":"Profit is not cash","text":"Masala Mills forecasts EBIT of Rs 160 Cr and net income of Rs 90 Cr. Yet the cash the whole firm can hand out is 100, and the cash shareholders alone can take is 70. Two cash flows, two owners.","visual":"<div class=\"kchips\"><span class=\"kchip\">EBIT 160<\/span><span class=\"kchip\">Net income 90<\/span><span class=\"kchip up\">FCFF 100<\/span><span class=\"kchip up\">FCFE 70<\/span><\/div>","say":"Here is Masala Mills' forecast for next year. EBIT of one sixty crore, net income of ninety. But the cash the whole firm can hand out is one hundred, and the cash shareholders alone can take home is seventy. Two cash flows, two sets of owners. Which one you discount decides which rate you use and which value you land on."},{"type":"explain","title":"FCFF: cash for everyone who funded the business","text":"Tax EBIT as if there were no debt, add back D&amp;A because it is not cash, subtract capex and the working capital build. Interest stays out: its cost and tax saving live in WACC.","visual":"<div class=\"formula\">FCFF = EBIT &times; (1 &minus; t) + D&amp;A &minus; capex &minus; &Delta;NWC<\/div><div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">EBIT<\/span><b>160<\/b><\/div><div class=\"fstep step-2\"><span class=\"fk\">NOPAT<\/span><b>120<\/b><small>after 25% tax<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">+ D&amp;A<\/span><b>+40<\/b><\/div><div class=\"fstep step-4\"><span class=\"fk\">&minus; capex, &Delta;NWC<\/span><b>&minus;50 &minus; 10<\/b><\/div><div class=\"fstep hl step-5\"><span class=\"fk\">FCFF<\/span><b>100<\/b><\/div><\/div>","steps":["Start from operating profit.","Tax it as if there were no debt. India's marginal rate is 25.17%; we round to 25%.","Depreciation was never cash. Put it back.","Capex and the stock and receivables build are real cash out.","Rs 100 Cr belongs to lenders and shareholders together."],"say":"Free cash flow to the firm is the cash left for everyone who funded the business. Start from EBIT of one sixty. Tax it as if there were no debt: at twenty five per cent that leaves one twenty. Add back forty of depreciation, which was never cash. Subtract fifty of capex and ten of working capital build. One hundred crore, before anyone is paid interest."},{"type":"order","q":"Put the FCFF build in order, top to bottom","items":["EBIT","Subtract tax on EBIT (as if no debt) to get NOPAT","Add back depreciation and amortisation","Subtract capital expenditure","Subtract the increase in net working capital","FCFF"],"why":"Operating profit, taxed unlevered, then the three non-P&L cash items: non-cash D&A back, capex and working capital out. Interest never appears.","say":"Put the free cash flow to the firm build in order from top to bottom. Start with operating profit and end with the cash that belongs to all capital providers. Interest should be nowhere in the list."},{"type":"number","q":"Masala Mills, year 1: EBIT 160, tax 25%, D&A 40, capex 50, working capital build 10. FCFF in Rs Cr?","answer":100,"tol":0.5,"unit":"Rs Cr","why":"160 x 0.75 = 120, plus 40, minus 50, minus 10 = 100. Interest of 40 is not deducted; its effect sits in WACC.","say":"Compute it. EBIT one sixty, tax twenty five per cent, depreciation forty, capex fifty, working capital build ten. What is free cash flow to the firm in crore?"},{"type":"explain","title":"FCFE: what shareholders keep","text":"Pay the lenders first. After-tax interest leaves; new borrowing arrives and repayments leave, because borrowed cash can be paid out to shareholders and repaid cash cannot.","visual":"<div class=\"formula\">FCFE = FCFF &minus; interest &times; (1 &minus; t) + net borrowing<\/div><div class=\"flow\"><div class=\"fstep\"><span class=\"fk\">FCFF<\/span><b>100<\/b><\/div><div class=\"fstep\"><span class=\"fk\">&minus; after-tax interest<\/span><b>&minus;30<\/b><small>40 &times; 0.75<\/small><\/div><div class=\"fstep\"><span class=\"fk\">+ net borrowing<\/span><b>0<\/b><small>no new debt<\/small><\/div><div class=\"fstep hl\"><span class=\"fk\">FCFE<\/span><b>70<\/b><\/div><\/div><p class=\"key\">Same answer from net income: 90 + 40 &minus; 50 &minus; 10 + 0 = 70.<\/p>","say":"Free cash flow to equity is what shareholders keep after lenders are served. Take the firm's one hundred, pay after tax interest of thirty, and add any net borrowing. Masala Mills raises no new debt, so seventy. Why does borrowing sit inside it? Because borrowed cash can be paid out to shareholders, and repayments cannot. Check it from net income: ninety plus forty minus fifty minus ten is seventy."},{"type":"number","q":"Masala Mills repays Rs 25 Cr of debt next year instead of nothing. FCFE in Rs Cr?","answer":45,"tol":0.5,"unit":"Rs Cr","why":"70 - 25 = 45. Repayments are cash that cannot reach shareholders. FCFF stays 100: lenders are inside the firm, so debt moves do not touch it.","say":"Change one thing. Masala Mills now repays twenty five crore of debt next year instead of holding debt flat. What is free cash flow to equity in crore? And notice what happens to free cash flow to the firm."},{"type":"explain","title":"Match the cash flow to its owners' rate","text":"Each cash flow is discounted at the return its owners demand. Mix them up and the value is wrong.","visual":"<table class=\"t compact\"><thead><tr><th><\/th><th>FCFF<\/th><th>FCFE<\/th><\/tr><\/thead><tbody><tr><td>Belongs to<\/td><td>Lenders and shareholders<\/td><td>Shareholders<\/td><\/tr><tr><td>Discount at<\/td><td>WACC<\/td><td>Cost of equity<\/td><\/tr><tr><td>Gives<\/td><td>EV, then bridge<\/td><td>Equity directly<\/td><\/tr><tr><td>Default for<\/td><td>Most companies<\/td><td>Banks, NBFCs<\/td><\/tr><\/tbody><\/table>","say":"Match each cash flow to the rate its owners demand. Cash to the firm is discounted at the weighted average cost of capital and gives enterprise value, which you then bridge down. Cash to equity is discounted at the cost of equity and gives equity value directly. Discounting equity cash at WACC, a lower rate, overstates value."},{"type":"mcq","q":"A rival is highly leveraged, with book equity near zero in some years. FCFF or FCFE?","options":["FCFE, because debt is the whole story","FCFF at WACC, because repayments make FCFE lurch","Either, they always agree","Neither, use a dividend model"],"answer":1,"why":"FCFE nets out debt service, so mandatory repayments can turn it negative for reasons that have nothing to do with the business. FCFF stays stable; subtract net debt once at the end.","say":"A rival snack maker is highly leveraged, with book equity near zero in some years. Would you value it on free cash flow to the firm or to equity? The instinct and the right answer point in opposite directions here."},{"type":"explain","title":"Leases: pick one basis and use it everywhere","text":"Ind AS 116 turns rent into depreciation plus interest, so EBITDA rises and a debt-like liability appears. Treat the lease as debt or as opex. Both give the same equity if every line follows one choice.","visual":"<table class=\"t compact\"><thead><tr><th>Route (rent 100, EBITDA 400 after rent, leases 600, other net debt 300, peers 10x)<\/th><th>EV<\/th><th>Equity<\/th><\/tr><\/thead><tbody><tr><td>Opex: 10x &times; 400<\/td><td>4,000<\/td><td>3,700<\/td><\/tr><tr><td>Debt: 9.2x &times; 500 (10x restated with leases)<\/td><td>4,600<\/td><td>3,700<\/td><\/tr><tr><td>Mixed: 10x &times; 500<\/td><td>5,000<\/td><td>4,700, wrong<\/td><\/tr><\/tbody><\/table>","say":"Leases are where candidates go blank. Under Ind AS 116 rent becomes depreciation plus interest, so EBITDA rises by the whole rent and a lease liability appears. Two consistent routes. Lease as debt: rent stays out of free cash flow, the liability goes into net debt and the WACC weights. Or lease as opex: deduct rent, drop the liability. Mixing them inflates equity by the full lease."},{"type":"mcq","q":"Masala Mills' EBITDA of Rs 200 Cr is after Ind AS 116, so it excludes rent. Its Rs 30 Cr lease liability is in net debt. Consistent?","options":["No, leases are never debt","Yes: lease as debt in cash flow, net debt and WACC weights","Only if you also deduct the rent from FCFF","Only if you drop the liability from net debt"],"answer":1,"why":"Pre-rent EBITDA and FCFF, lease liability in net debt and in the debt weight of WACC: that is the lease-as-debt route, applied everywhere. Deducting rent as well would count the lease twice.","say":"Check Masala Mills itself. Its EBITDA of two hundred crore is after Ind AS 116, so rent is not deducted, and its thirty crore lease liability sits in net debt. Is that consistent, and if so why?"},{"type":"reveal","q":"What is the difference between unlevered free cash flow (FCFF) and levered free cash flow (FCFE)?","tag":"Your miss","a":"<p>Both are cash after reinvestment; they differ in <b>who owns it<\/b>. FCFF = EBIT(1 &minus; t) + D&amp;A &minus; capex &minus; &Delta;NWC: cash for lenders and shareholders, before any financing. Discount at WACC for enterprise value. FCFE = net income + D&amp;A &minus; capex &minus; &Delta;NWC + net borrowing: cash left for shareholders after debt service. Discount at the cost of equity for equity value directly. Masala Mills: 100 and 70.<\/p>","say":"Your miss, the definitions. What separates unlevered from levered free cash flow? Give both formulas, who owns each, and the rate and output for each. Then reveal."},{"type":"reveal","q":"For which kind of business is FCFE at the cost of equity the natural choice, and why does FCFF at WACC make little sense there?","tag":"Your miss","a":"<p><b>Banks and NBFCs.<\/b> Debt is their raw material, an operating input, not a financing choice layered on an operating company. Separating operations from financing, the whole point of an unlevered FCFF, has no economic meaning for a lender. FCFE also suits firms with a fixed, stable capital structure, where the FCFF route adds steps without insight.<\/p>","say":"Your miss, the use case you highlighted. For which kind of business is free cash flow to equity at the cost of equity the natural choice, and why does the firm route make no sense there? Say it, then reveal."},{"type":"reveal","q":"With leases capitalised under Ind AS 116, what happens in your DCF to the lease payments and the lease liability?","tag":"Your miss","a":"<p>The lease principal is now a financing outflow, not an operating one, so keep both ends consistent. <b>Lease as debt:<\/b> leave lease payments out of FCFF, put the lease liability in net debt next to borrowings, and count it in the WACC debt weight. <b>Pre-116 view:<\/b> deduct the payments from FCFF and leave the liability out. Mixing them counts the lease twice or drops it. Matters most for retailers, airlines and hotels.<\/p>","say":"Your miss, the one you left completely blank. With leases on the balance sheet under Ind AS 116, what happens in your DCF to the lease payments and to the lease liability? Give the two consistent routes, then reveal."},{"type":"recap","points":["FCFF = EBIT(1 - t) + D&A - capex - working capital build; Masala Mills: 100","FCFE = FCFF - after-tax interest + net borrowing; Masala Mills: 70","FCFF at WACC gives EV; FCFE at cost of equity gives equity; default to FCFF, FCFE for banks","Leases: debt everywhere or opex everywhere, never a mix"],"say":"What to keep. Free cash flow to the firm is EBIT after tax plus depreciation minus capex and working capital build, one hundred for Masala Mills. Cash to equity takes out after tax interest and adds net borrowing, seventy. Firm cash at WACC gives enterprise value; equity cash at the cost of equity gives equity. Default to the firm, use equity for banks. And leases: one basis, everywhere."}]},{"id":"val-04","module":"val","title":"WACC and CAPM with Indian inputs","mins":7,"blurb":"Masala Mills' lenders want 8%. Its shareholders want 15%. Blend them right and you get the one number that drives the whole DCF.","slides":[{"type":"hook","title":"What is a rupee next year worth today?","text":"Masala Mills will throw off Rs 100 Cr next year. A bank would lend to it at 8%. Its shareholders could earn 15% elsewhere at similar risk. So what rate shrinks that Rs 100 Cr to today's value?","visual":"<div class=\"kchips\"><span class=\"kchip\">Lenders: 8%<\/span><span class=\"kchip\">Shareholders: 15%<\/span><span class=\"kchip up\">Blend: ?<\/span><\/div>","say":"Masala Mills will generate one hundred crore next year. A bank lends to it at eight per cent. Its shareholders could earn fifteen per cent elsewhere at the same risk. Neither number alone is the right rate for the firm's cash. The blend is. By the end of this lesson you will have built it: twelve per cent."},{"type":"explain","title":"A discount rate is a required return","text":"It is what investors demand for this risk, given their alternatives: the risk-free rate for time, plus a premium for uncertainty. It compounds, so far-out cash gets hit hardest.","visual":"<table class=\"t compact\"><thead><tr><th>&#8377;100 received in<\/th><th>At 10%<\/th><th>At 12%<\/th><\/tr><\/thead><tbody><tr><td>Year 1<\/td><td>90.9<\/td><td>89.3 (&minus;1.8%)<\/td><\/tr><tr><td>Year 5<\/td><td>62.1<\/td><td>56.7 (&minus;8.6%)<\/td><\/tr><tr><td>Year 10<\/td><td>38.6<\/td><td>32.2 (&minus;16.5%)<\/td><\/tr><\/tbody><\/table>","say":"Conceptually, a discount rate is a required return. It is what investors demand to hold this risk, given what they could earn elsewhere: the risk free rate for time, plus a premium for uncertainty. Because it compounds, two extra points barely dent year one cash but cut year ten cash by a sixth. That is why terminal value is so sensitive to it."},{"type":"explain","title":"WACC blends what lenders and shareholders demand","text":"Weights are <b>market<\/b> values, because WACC prices the next rupee raised. Only interest is tax-deductible, so (1 &minus; t) touches debt alone. With no debt, WACC equals the cost of equity.","visual":"<div class=\"formula\">WACC = E/(D+E) &times; Ke + D/(D+E) &times; Kd &times; (1 &minus; t)<\/div><div class=\"fgrid\"><div class=\"fcard\"><div class=\"fname\">Ke, cost of equity<\/div><div class=\"fx\">Rf + &beta; &times; ERP<\/div><div class=\"fnote\">CAPM<\/div><\/div><div class=\"fcard\"><div class=\"fname\">Kd, cost of debt<\/div><div class=\"fx\">today's rate on new borrowing<\/div><div class=\"fnote\">then &times; (1 &minus; t)<\/div><\/div><\/div>","say":"The weighted average cost of capital blends the two demands. Weight the cost of equity and the after tax cost of debt by market values, because WACC prices the next rupee the company raises, not the capital already on the books. Only interest is tax deductible, so the one minus t touches debt alone. A company with no debt has a WACC equal to its cost of equity."},{"type":"explain","title":"Where each Indian input comes from","text":"Risk-free rate in the currency of the cash flows. ERP that is current, not a textbook 5%. Tax at the marginal rate. All as of September 2026.","visual":"<table class=\"t compact\"><thead><tr><th>Input<\/th><th>Source<\/th><th>India, Sep 2026<\/th><\/tr><\/thead><tbody><tr><td>Rf<\/td><td>10-year G-sec<\/td><td>7.14%<\/td><\/tr><tr><td>ERP<\/td><td>Damodaran: mature + country<\/td><td>7.08% = 4.23% + 2.85%<\/td><\/tr><tr><td>Beta<\/td><td>Relevered peer median vs Nifty 50<\/td><td>Masala Mills 1.11<\/td><\/tr><tr><td>Tax<\/td><td>Marginal, Section 115BAA<\/td><td>25.17% (we round to 25%)<\/td><\/tr><\/tbody><\/table>","say":"Where do the Indian inputs come from? The risk free rate is the ten year government bond, seven point one four per cent in late September 2026, in rupees because the cash flows are in rupees. The equity risk premium is Damodaran's India figure, about seven point one: a mature premium plus a country premium. Beta is a relevered peer median. Tax is the marginal twenty five point one seven."},{"type":"number","q":"Masala Mills: Rf 7.14%, beta 1.11, ERP 7.08%. Cost of equity in %, to one decimal?","answer":15.0,"tol":0.1,"unit":"%","why":"7.14 + 1.11 x 7.08 = 7.14 + 7.86 = 15.0%. Beta scales the premium, not the risk-free rate.","say":"Build the cost of equity. Risk free rate seven point one four per cent, beta one point one one, equity risk premium seven point zero eight per cent. What does CAPM give, in per cent, to one decimal?"},{"type":"number","q":"Masala Mills borrows at 8% pre-tax. Tax 25%. After-tax cost of debt in %?","answer":6.0,"tol":0.05,"unit":"%","why":"8 x (1 - 0.25) = 6.0%. Interest is deductible, so the government pays a quarter of it.","say":"Now debt. Masala Mills can borrow today at eight per cent. Tax is twenty five per cent. What is the after tax cost of debt, in per cent?"},{"type":"number","q":"Market cap Rs 1,000 Cr, debt-like Rs 500 Cr (including leases). Ke 15.0%, after-tax Kd 6.0%. WACC in %?","answer":12.0,"tol":0.1,"unit":"%","why":"Weights 1,000 / 1,500 and 500 / 1,500. WACC = 0.667 x 15.0 + 0.333 x 6.0 = 10.0 + 2.0 = 12.0%. Market cap for equity, not book equity.","say":"Put it together. Market cap one thousand crore, debt-like items five hundred crore including leases. Cost of equity fifteen, after tax cost of debt six. What is Masala Mills' WACC in per cent?"},{"type":"mcq","q":"Your analyst used Masala Mills' effective tax rate of 22% and its average interest cost on old loans in the WACC. Right or wrong?","options":["Right, use what the company actually pays","Wrong on both: WACC uses marginal inputs","Wrong on tax only","Wrong on debt only"],"answer":1,"why":"WACC prices the next rupee raised. So the tax rate is the marginal rate (25.17%) and the cost of debt is today's rate on new borrowing, not a blend of old loans.","say":"Your analyst plugged in Masala Mills' effective tax rate of twenty two per cent and the average interest cost on its old loans. Right or wrong? Think about what question WACC is answering."},{"type":"explain","title":"India's equity risk premium, and the double-count trap","text":"Country risk is added once. The G-sec already carries India's default spread of 1.87%. Add a country premium on top and you count it twice, about 1.9 points of Ke.","visual":"<div class=\"flow\"><div class=\"fstep\"><span class=\"fk\">Mature ERP<\/span><b>4.23%<\/b><small>US-based<\/small><\/div><div class=\"fstep\"><span class=\"fk\">+ Country<\/span><b>2.85%<\/b><small>1.87% spread, scaled up<\/small><\/div><div class=\"fstep hl\"><span class=\"fk\">India ERP<\/span><b>7.08%<\/b><small>Damodaran, Jan 2026<\/small><\/div><\/div><p class=\"trap\"><b>Trap:<\/b> purists strip the 1.87% default spread out of the 7.14% G-sec (about 5.3%) so country risk is counted once. Most practitioners don't; know both.<\/p>","say":"How India's premium is built. Start with a mature market premium of about four point two per cent. Add a country premium of two point eight five: India's default spread of one point eight seven, scaled up because equity is riskier than sovereign debt. Total about seven point one. The trap: the government bond already carries that default risk, so purists strip it out of the risk free rate."},{"type":"reveal","q":"Conceptually, what does the discount rate represent?","tag":"Your miss","a":"<p>The <b>required return<\/b>: what investors demand for taking this risk, set by what they could earn elsewhere at the same risk. Risk-free rate for time value, plus a risk premium. It compounds, so it bites hardest on far-out cash and on terminal value. For Masala Mills the blend of lenders' 8% and shareholders' 15% is a 12% WACC.<\/p>","say":"Your miss. Conceptually, what does the discount rate represent? Two parts to the answer and one consequence for the DCF. Say it, then reveal."},{"type":"reveal","q":"Effective tax rate and average interest cost on old loans are on file. Do they go into WACC? What principle decides?","tag":"Your miss","a":"<p>No. Use <b>marginal<\/b> inputs, because WACC prices the next rupee of capital raised, not capital already on the balance sheet. Cost of debt is today's rate on new borrowing, not the blended historic coupon. Tax is the marginal rate, 25.17% for most domestic Indian companies under Section 115BAA. Weights are market values: book debt is a fair proxy, book equity never.<\/p>","say":"Your miss, your own highlight. The effective tax rate and the average interest cost on old loans are both on file. Do they go into WACC, and what single principle decides? Then reveal."},{"type":"reveal","q":"Put numbers on it: how does Damodaran's January 2026 update build India's equity risk premium, and how does it compare with the US?","tag":"Your miss","a":"<p>India ERP = mature market ERP + country risk premium. India's adjusted default spread is <b>1.87%<\/b>; scaled up for equity risk it becomes a country premium of <b>2.85%<\/b>. Add a mature ERP of about 4.23% to get about <b>7.08%<\/b>. The US sits at 4.46%, which includes a small default spread of its own.<\/p>","say":"Your miss, the build you highlighted. With numbers, how does Damodaran's January 2026 update construct India's equity risk premium, and how does it compare with the US figure? Then reveal."},{"type":"reveal","q":"No listed bonds, no rating, and the historic interest cost blends old loans. What two other ways estimate what new debt would cost?","tag":"Your miss","a":"<p><b>Synthetic rating:<\/b> compute interest cover (EBIT &divide; interest), map it to a rating band on a published table such as Damodaran's, add that band's spread to the risk-free rate. Above 8 to 10x cover is roughly AAA or AA in India; 2 to 3x is BBB or below. <b>Bank lending rate<\/b> to a similar borrower: MCLR or the external benchmark rate plus a spread. Then tax-effect it.<\/p>","say":"Your miss, the two routes you highlighted. A company with no bonds, no rating and a blended historic interest cost. What two other ways estimate the cost of new debt? Name both, then reveal."},{"type":"recap","points":["Discount rate = required return: risk-free rate plus a risk premium; it compounds","WACC uses market weights and marginal inputs; (1 - t) touches debt only","Masala Mills: Ke 15.0%, after-tax Kd 6.0%, two thirds equity, WACC 12.0%","India ERP about 7.08% already holds country risk; the G-sec holds it too, so never add it twice"],"say":"What to keep. A discount rate is the return investors require: risk free plus a premium, and it compounds. WACC blends equity and after tax debt at market weights with marginal inputs. For Masala Mills, fifteen and six blend to twelve per cent. And India's equity premium already carries country risk, so count it once."}]},{"id":"val-05","module":"val","title":"Beta: levered, unlevered and borrowed from peers","mins":7,"blurb":"Four snack peers, four betas, none of them Masala Mills. How do you turn other people's risk into your own number?","slides":[{"type":"hook","title":"Whose risk is it anyway?","text":"Four listed snack peers have betas of 1.00, 0.90, 1.20 and 0.95. Average them and you get 1.01. Masala Mills' beta is actually 1.11. Where did the extra 0.10 come from?","visual":"<div class=\"kchips\"><span class=\"kchip\">Peer A 1.00<\/span><span class=\"kchip\">Peer B 0.90<\/span><span class=\"kchip\">Peer C 1.20<\/span><span class=\"kchip\">Peer D 0.95<\/span><span class=\"kchip up\">Masala Mills 1.11<\/span><\/div>","say":"Four listed snack peers have betas of one, point nine, one point two and point nine five. Average them and you get about one point zero one. But Masala Mills' beta is one point one one. The gap is debt. Each peer's beta carries its own leverage, and Masala Mills has more. This lesson is how you strip debt out and put yours back in."},{"type":"explain","title":"Beta is how much a stock moves with the market","text":"That systematic risk is the only risk CAPM pays for; company-specific risk diversifies away. Demand that swings with the cycle means a beta above 1. Needs-based demand means below 1.","visual":"<div class=\"cmp\"><div class=\"cmp-c b\"><h4>Above 1<\/h4><ul><li>Autos, homebuilders, airlines<\/li><li>Semiconductors, luxury<\/li><li>Anything heavily leveraged<\/li><\/ul><\/div><div class=\"cmp-c a\"><h4>Below 1<\/h4><ul><li>Staples, utilities<\/li><li>Healthcare, pharma<\/li><li>Gold can even go negative<\/li><\/ul><\/div><\/div>","say":"Beta measures how much a stock moves when the market moves. That market risk is the only risk CAPM rewards, because company specific risk diversifies away in a portfolio. Demand that swings with the cycle, autos, airlines, luxury, runs above one. Needs based demand, staples and pharma, runs below. Debt pushes any of them higher. And gold, which rises in a sell off, can show a negative beta."},{"type":"explain","title":"Debt piles the same risk onto thinner equity","text":"Borrowing adds no business risk. It concentrates the operating swings on a smaller equity slice, so levered beta is never below un
