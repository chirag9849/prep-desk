\/tr><\/tbody><\/table>","say":"When is a DCF the wrong tool? Whenever the cash flows are not credible. No reliable projections, so comps. Cash negative for years, so almost all value sits in a guessed terminal value. Banks, where debt is the raw material. A company that may not survive, where liquidation value is the floor. And an early stage startup that might die on the way; one discount rate cannot price that."},{"type":"mcq","q":"Zepto's updated DRHP: revenue Rs 11,110 Cr to Rs 22,624 Cr, net loss Rs 4,695 Cr to Rs 5,905 Cr. Which multiple?","options":["P/E on next year's profit","EV/EBITDA on adjusted EBITDA","EV/Revenue or EV/GMV against stage-matched peers, plus unit economics per order","P/B"],"answer":2,"why":"No earnings and negative EBITDA, so there is nothing to multiply. Use revenue or GMV multiples, then check whether contribution per order is improving: Zepto's adjusted EBITDA loss per order fell from Rs 142.7 to Rs 59.4.","say":"Zepto's filing shows revenue doubling to over twenty two thousand crore while the net loss widened to nearly six thousand crore. Which multiple do you reach for, and what second number tells you whether the story is working?"},{"type":"explain","title":"Cyclicals: value the cycle, not the quarter","text":"P/E looks lowest at the earnings peak because the market already prices the fall, and highest at the trough. Use mid-cycle earnings, 5 to 7 years averaged for steel or cement, with a mid-cycle multiple. EV/tonne survives the cycle.","visual":"<div class=\"cmp\"><div class=\"cmp-c b\"><h4>Peak year<\/h4><ul><li>Record margin, low P/E<\/li><li>Applying today's multiple to today's earnings overstates value<\/li><\/ul><\/div><div class=\"cmp-c a\"><h4>Mid-cycle<\/h4><ul><li>Average margin and volume over a full cycle<\/li><li>Mid-cycle multiple, or EV per tonne of capacity<\/li><\/ul><\/div><\/div>","say":"Cyclicals trick you twice. At the peak, earnings are record high and the price to earnings ratio looks lowest, because the market already expects the fall. At the trough it looks absurd because earnings have collapsed. So normalise: average margins and volumes over a full cycle, five to seven years for cement, and apply a mid cycle multiple. EV per tonne of capacity holds up when earnings do not."},{"type":"mcq","q":"A cement company shows a 7x P/E on record FY26 margins. Your call?","options":["Cheap, buy","Not cheap: peak earnings make any P/E look low; rebase to mid-cycle EBITDA and a mid-cycle multiple","Expensive because cement is cyclical","Use EV/EBITDA, which fixes the cycle"],"answer":1,"why":"The denominator is the problem, not the multiple. Seven times peak earnings can be fifteen times normal earnings. EV/EBITDA on peak EBITDA has the same flaw.","say":"A cement company trades at seven times earnings on record margins. Cheap? Decide what the seven is divided by before you answer."},{"type":"explain","title":"Sum of the parts: each segment on its own method, one bridge","text":"When segments differ, one blended multiple misprices both. Value each piece its own way, then bridge once. A core business plus a loss-making venture, &#8377; Cr:","visual":"<table class=\"t compact\"><thead><tr><th>Piece<\/th><th>Method<\/th><th>&#8377; Cr<\/th><\/tr><\/thead><tbody><tr><td>Mature core<\/td><td>10x EBITDA 2,000<\/td><td>20,000<\/td><\/tr><tr><td>Loss-making venture<\/td><td>4x revenue 800<\/td><td>3,200<\/td><\/tr><tr><td>Net debt 3,000; head office costs 100 a year at 8x<\/td><td>subtract<\/td><td>&minus;3,800<\/td><\/tr><tr><td>Listed associate<\/td><td>market<\/td><td>+1,000<\/td><\/tr><tr><td><b>Equity<\/b><\/td><td><\/td><td><b>20,400<\/b><\/td><\/tr><\/tbody><\/table>","say":"A conglomerate needs a sum of the parts. A mature core at ten times EBITDA is worth twenty thousand. A loss making venture has no EBITDA to multiply, so four times revenue: three thousand two hundred. Subtract net debt and capitalised head office costs, add the listed associate at market value. Equity twenty thousand four hundred. One blended ten times multiple would have ignored the venture entirely."},{"type":"number","q":"SOTP: core 10x EBITDA 2,000, venture 4x revenue 800, net debt 3,000, head office 100 a year at 8x, listed associate 1,000. Equity in Rs Cr?","answer":20400,"tol":10,"unit":"Rs Cr","why":"20,000 + 3,200 - 3,000 - 800 + 1,000 = 20,400. Then a holdco discount only if the structure itself creates frictions.","say":"Add it up. Core at ten times two thousand of EBITDA, venture at four times eight hundred of revenue, net debt three thousand, head office costs of one hundred a year capitalised at eight times, and a listed associate worth one thousand. Equity value in crore?"},{"type":"explain","title":"The holdco discount, and what narrows it","text":"Listed Indian holdcos traded at an average discount of about 54.5% to their stakes in September 2026; Bajaj Holdings at about 48%. Real frictions earn the discount. Cash events and disclosure shrink it.","visual":"<div class=\"cmp\"><div class=\"cmp-c b\"><h4>Why it exists<\/h4><ul><li>Tax at the subsidiary, then again on what reaches holders<\/li><li>Minority has no say on reinvest vs distribute<\/li><li>Cross-holdings, thin trading<\/li><\/ul><\/div><div class=\"cmp-c a\"><h4>What narrows it<\/h4><ul><li>Demerger: ITC Hotels, 1 Jan 2025, 1 for 10, holders got 60% directly<\/li><li>Stake sales funding buybacks or special dividends<\/li><li>Segment reporting, investor days<\/li><\/ul><\/div><\/div>","say":"Why does a holdco trade below the sum of its stakes? Profits are taxed at the subsidiary and again when the holdco distributes. Minority holders cannot decide whether cash is reinvested or paid out. Cross holdings and thin trading add more. Indian holdcos averaged about a fifty four per cent discount in September 2026. It narrows when a demerger hands holders the business, or a stake sale funds a buyback."},{"type":"mcq","q":"A bank reports ROE of 18%. Why can't you discount all its profit as free cash, and what do you use instead?","options":["You can; profit is cash for a bank","Regulatory capital forces it to retain earnings to fund loan growth; use FCFE or a DDM at the cost of equity, and P/B against ROE","Use EV/EBITDA like any company","Use EV/Revenue"],"answer":1,"why":"Deposits are raw material and interest is cost of goods, so EV and EBITDA mean nothing. Capital rules trap part of the profit. Value equity directly: residual income, DDM, or P/B = (ROE - g) / (Ke - g).","say":"A bank earns eighteen per cent on equity. Why can't you treat all of that profit as cash shareholders can take out, and which models does that push you towards?"},{"type":"number","q":"Bank: book Rs 1,000 Cr, ROE 18%, cost of equity 13%, growth 5%. Residual income value of equity in Rs Cr?","answer":1625,"tol":5,"unit":"Rs Cr","why":"Excess return 5% x 1,000 = 50, growing at 5%: 50 / (13% - 5%) = 625. Book 1,000 + 625 = 1,625, or 1.63x book. A Rs 45 Cr after-tax NPA shortfall cuts book to 955 and value by about 73.","say":"Value the bank. Book one thousand crore, return on equity eighteen per cent, cost of equity thirteen, growth five. Using residual income, what is the equity worth in crore?"},{"type":"reveal","q":"In an SOTP for a group with cigarette, retail and telecom arms, which method and multiple for each segment, and why?","tag":"Your miss","a":"<p>Each segment on its own economics, never one group multiple. <b>Cigarettes:<\/b> EV/EBITDA from tobacco peers, or a DCF, since it is stable and cash-rich. <b>Retail:<\/b> listed retail comps, often EV/Sales, since margins are thin. <b>Telecom:<\/b> EV/EBITDA against global peers or its own DCF, given heavy capex. Then sum the EVs, bridge once, and discount only for real frictions.<\/p>","say":"Your miss, the point you highlighted. A group with cigarette, retail and telecom arms. Which method and multiple would you pick for each segment, and why? Then reveal."},{"type":"reveal","q":"You can buy the listed subsidiaries directly or buy the holdco that owns them. Why might the holdco route give you less value per rupee?","tag":"Your miss","a":"<p><b>Double taxation:<\/b> profits taxed at the subsidiary, and holdco shareholders taxed again on what the holdco distributes. <b>No control:<\/b> the promoter group, not the minority, decides whether to reinvest or distribute. <b>Governance:<\/b> cross-holdings and related-party dealings raise questions an operating company does not carry. <b>Illiquidity:<\/b> many holdcos trade thinly. Hence discounts near 50% in India.<\/p>","say":"Your miss, the reasons. You can buy the listed subsidiaries directly or buy the holding company that owns them. Why might the holdco route give you less value per rupee of underlying assets? Four reasons, then reveal."},{"type":"reveal","q":"Two banks report the same ROE and book value per share. What do you check before trusting that book value, and what if it looks weak?","tag":"Your miss","a":"<p><b>Asset quality:<\/b> gross and net NPA ratios and provision coverage. If bad loans are under-provisioned, reported book overstates true net worth and ROE is flattered too. Adjust book down for the after-tax shortfall before applying P/B or residual income: a &#8377;45 Cr gap cuts book from 1,000 to 955 and value by about 73. For an NBFC, also check the funding side and any duration mismatch.<\/p>","say":"Your miss, the methods. Two banks show the same return on equity and book value per share. What do you check before trusting that book value, and what do you do if it looks weak? Then reveal."},{"type":"recap","points":["No credible cash flow, no DCF: loss-makers get EV/Revenue or EV/GMV plus unit economics","Cyclicals: mid-cycle earnings and a mid-cycle multiple; peak-year P/E always looks cheap","SOTP: each segment its own method, one bridge, a holdco discount only for real frictions","Banks: value equity directly; residual income gives 1.63x book at ROE 18%, Ke 13%, g 5%"],"say":"What to keep. No credible cash flow means no DCF: loss makers get revenue or GMV multiples plus unit economics. Cyclicals need mid cycle earnings, because a peak year multiple always looks cheap. Conglomerates get a sum of the parts, each segment its own method, one bridge, a holdco discount only for real frictions. Banks are valued on equity directly: residual income, or price to book against return on equity."}]}],"ratios":{"items":[{"id":"r-current","name":"Current ratio","family":"Liquidity","formula":"Current assets &divide; current liabilities","tells":"Whether assets that turn into cash within a year cover bills due within a year.","hi":"Sun Pharma and TCS hold large cash piles and receivables while owing suppliers relatively little.","lo":"Airtel and Tata Steel sit below 1x because suppliers and short-term loans fund them, which steady cash earners can handle.","say":"Below 1x is fine when cash flows in daily, as at Airtel; it is a worry when short-term debt fills the gap.","good":"high","cmp":[{"title":null,"unit":"x","dp":1,"asOf":"FY26 (year to March 2026), consolidated","kind":"ind","items":[{"label":"IT services","co":"TCS","v":2.2278,"note":null},{"label":"FMCG","co":"HUL","v":1.2233,"note":null},{"label":"Pharma","co":"Sun Pharma","v":2.8243,"note":null},{"label":"Autos","co":"Maruti","v":1.0679,"note":null},{"label":"Steel","co":"Tata Steel","v":0.7456,"note":null},{"label":"Retail","co":"DMart","v":1.9771,"note":null},{"label":"Telecom","co":"Airtel","v":0.517,"note":null},{"label":"Real estate","co":"DLF","v":1.5886,"note":null}]}]},{"id":"r-quick","name":"Quick ratio","family":"Liquidity","formula":"(Current assets &minus; inventory) &divide; current liabilities","tells":"Whether a company can pay its short-term bills without selling any stock.","hi":"Sun Pharma and TCS stay above 2x because their current assets are mostly cash and receivables, not stock.","lo":"Tata Steel and DMart fall sharply once stock is removed, since inventory makes up most of their current assets.","say":"The gap between current and quick ratio shows how much liquidity depends on selling stock; DMart's gap is the widest.","good":"high","cmp":[{"title":null,"unit":"x","dp":1,"asOf":"FY26 (year to March 2026), consolidated","kind":"ind","items":[{"label":"IT services","co":"TCS","v":2.2273,"note":null},{"label":"FMCG","co":"HUL","v":0.9153,"note":null},{"label":"Pharma","co":"Sun Pharma","v":2.3162,"note":null},{"label":"Autos","co":"Maruti","v":0.7576,"note":null},{"label":"Steel","co":"Tata Steel","v":0.2581,"note":null},{"label":"Retail","co":"DMart","v":0.417,"note":null},{"label":"Telecom","co":"Airtel","v":0.5135,"note":null},{"label":"Real estate","co":"DLF","v":0.6231,"note":null}]}]},{"id":"r-cash","name":"Cash ratio","family":"Liquidity","formula":"(Cash + liquid investments) &divide; current liabilities","tells":"Whether cash on hand alone could clear all short-term bills, with no collections and no stock sold.","hi":"Sun Pharma holds more cash than all its short-term bills, and TCS keeps a large treasury built from years of profit.","lo":"DMart and Tata Steel keep little idle cash: DMart spends it on new stores, Tata Steel on plants and repaying debt.","say":"A very high cash ratio is safe but lazy; ask whether that cash should fund growth or go back to shareholders.","good":"high","cmp":[{"title":null,"unit":"x","dp":1,"asOf":"FY26 (year to March 2026), consolidated","kind":"ind","items":[{"label":"IT services","co":"TCS","v":0.7663,"note":null},{"label":"FMCG","co":"HUL","v":0.482,"note":null},{"label":"Pharma","co":"Sun Pharma","v":1.4383,"note":null},{"label":"Autos","co":"Maruti","v":0.4661,"note":null},{"label":"Steel","co":"Tata Steel","v":0.1141,"note":null},{"label":"Retail","co":"DMart","v":0.0808,"note":null},{"label":"Telecom","co":"Airtel","v":0.2526,"note":null},{"label":"Real estate","co":"DLF","v":0.325,"note":null}]}]},{"id":"r-invturn","name":"Inventory days and turnover","family":"Efficiency","formula":"Inventory &divide; total operating costs (revenue e (about 50%), lowest capital ratios, yet credit cost below 0.5%.","Consumer NBFC":"Highest NIM (9.7%) and highest credit cost (2.1%); few bad loans on the books because it writes them off fast; no CASA.","Vehicle finance NBFC":"High NIM (8.4%) but the most bad loans (gross NPA 4.6%) from used-vehicle lending, lowest cost to income (25%), no CASA."}}}</script>

function pad(n) { return (n < 10 ? '0' : '') + n; }
function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function addDays(ds, n) { const [y, m, d] = ds.split('-').map(Number); const t = new Date(y, m - 1, d + n); return dstr(t); }
function daysBetween(a, b) { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 864e5); }
function fmtNum(v, dp) {
  if (v == null || isNaN(v)) return 'n/a';
  if (dp == null) { const a = Math.abs(v); dp = a >= 100 ? 0 : a >= 10 ? 1 : 2; }

}

function shuffle(a, rnd) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor((rnd || Math.random)() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function seeded(seed) { let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let S = DEFAULT();
function load() {

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { console.warn('storage write failed', e); } }

  root.querySelectorAll('.rbar').forEach(r => r.classList.toggle('on', +r.dataset.rank < k));
  root.querySelectorAll('.rc-lines p').forEach((p, i) => p.classList.toggle('on', i < m));
}
function playRatio(s) {
  if (!P || cur() !== s) return;
  const root = P.slideEl; if (!root) return;
  P.timers.forEach(clearTimeout); P.timers = [];
  const lines = root.querySelector('.rc-lines'); if (lines) lines.classList.remove('wait');
  if (reducedMotion()) { ratioShow(root, Infinity, 9); return; }
  ratioShow(root, 0, 9);
  const n = ratioRanks(root);
  for (let k = 1; k <= n; k++) P.timers.push(setTimeout(() => { if (P && cur() === s) ratioShow(root, k, 9); }, 220 + 95 * (k - 1)));
}
/* Listen mode: bars grow in over the first 60% of the narration, then the Top, Bottom and say lines appear */
function ratioListenReset(s) {
  const root = P.slideEl; if (!root) return;
  const lines = root.querySelector('.rc-lines');
  if (reducedMotion()) { if (lines) lines.classList.remove('wait'); ratioShow(root, Infinity, 9); return; }
  if (lines) lines.classList.add('wait');
  ratioShow(root, 0, 0);
}
function ratioListenProgress(s, f) {
  const root = P.slideEl; if (!root || reducedMotion()) return;
  const n = ratioRanks(root);
  const k = f >= 1 ? Infinity : Math.min(n, Math.floor((f / 0.6) * n) + 1);
  const m = f >= 1 ? 9 : f >= 0.86 ? 3 : f >= 0.74 ? 2 : f >= 0.62 ? 1 : 0;
  ratioShow(root, k, m);
}

/* ---------- finish ---------- */
function slideFinish(s) {
  const n = P.slides.filter(x => INTERACTIVE.has(x.type)).length;
  const right = Object.values(P.results).filter(r => r.ok).length;
  const frac = n ? right / n : 1;
  const mins = Math.max(1, Math.round((Date.now() - P.started) / 60000));
  const L = P.lesson;
  const isRatio = !!L.isRatio, isRev = L.module === 'rev';
  const ring = ringSvg(frac, 150, 'bigring'); ring.querySelector('text').textContent = n ? `${right}/${n}` : 'Done';
  const title = isRatio ? (frac === 1 ? 'Perfect round' : frac >= .7 ? 'Strong round' : 'Round done') : isRev ? 'Review done' : frac === 1 ? 'Flawless' : frac >= .7 ? 'Lesson done' : 'Lesson done, with notes';
  const wrong = Object.values(P.results).filter(r => !r.ok).length;
  const wrap = el('div', { class: 'sl finish' }, kicker(isRatio ? 'Round complete' : 'Lesson complete'), el('h1', {}, title), ring,
    el('p', { class: 'lead' }, isRatio ? `${right} of ${n} right.` : wrong ? `${wrong} item${wrong === 1 ? '' : 's'} went to your review queue. ${wrong === 1 ? 'It comes' : 'They come'} back tomorrow.` : 'Nothing to review. Everything went in clean.'),
    el('div', { class: 'fstats' }, el('div', { class: 'fstat gold' }, el('b', {}, '+' + (P.xp + (P._bonus || 0))), el('span', {}, 'XP earned')), el('div', { class: 'fstat flame' }, el('b', {}, String(streakNow())), el('span', {}, 'day streak')), el('div', { class: 'fstat' }, el('b', {}, mins + ' min'), el('span', {}, 'time spent'))));
  const acts = el('div', { class: 'factions' }, el('button', { class: 'btn lg', onclick: () => closePlayer() }, 'Back to the map'));
  if (!isRatio && !isRev) {
    const Ls = lessonList(L.module); const nx = Ls[Ls.indexOf(L) + 1];
    if (nx) acts.append(el('button', { class: 'btn primary lg', onclick: () => { S.open[nx.id] = 1; save(); openLesson(nx); } }, 'Next lesson', svg('right')));
    else if (L.module === 'rat' && ratioRounds().length) acts.append(el('button', { class: 'btn primary lg', onclick: () => openLesson(buildRatioLesson(ratioRounds()[0])) }, 'Practice round', svg('dice')));
  }
  if (isRatio) acts.append(el('button', { class: 'btn primary lg', onclick: () => { const r = ratioRounds().find(x => x.key === L.roundKey); if (r) openLesson(buildRatioLesson(r)); else closePlayer(); } }, 'Play again', svg('refresh')));
  wrap.append(acts);
  return wrap;
}
function finishLesson() {
  if (P.finished) return; P.finished = true;
  const L = P.lesson;
  const n = P.slides.filter(x => INTERACTIVE.has(x.type)).length;
  const right = Object.values(P.results).filter(r => r.ok).length;
  markActive();
  if (L.isRatio) {
    const b = S.ratio.best[L.roundKey]; if (!b || right > b.score) S.ratio.best[L.roundKey] = { score: right, of: n, at: today() };
    S.ratio.played = (S.ratio.played || 0) + 1;
    if (L.roundKey === 'rotd') { S.ratio.days[today()] = Object.assign(S.ratio.days[today()] || {}, { rotd: true }); }
    P._bonus = XP.round; S.xp += XP.round;
  } else if (L.module === 'rev') { P._bonus = 10; S.xp += 10; }
  else { if (!S.done[L.id]) { P._bonus = XP.finish; S.xp += XP.finish; } S.done[L.id] = { at: today(), score: right, of: n, xp: P.xp }; }
  save();
  Sound.big();
  setTimeout(() => { const r = $('.finish .bigring', P.el); if (r) Confetti.at(r, 90, 10); }, 450);
  setTimeout(() => { const r = $('.finish .bigring', P.el); if (r) Confetti.burst(innerWidth * .2, innerHeight * .35, 40, 8); }, 700);
  setTimeout(() => { Confetti.burst(innerWidth * .8, innerHeight * .35, 40, 8); }, 900);
}

/* ---------- review session ---------- */
function startReview() {
  const due = dueReviews(); if (!due.length) return;
  const slides = [];
  for (const r of due.slice(0, 12)) {
    const L = LESSON[r.lesson]; if (!L) { delete S.review[r.key]; continue; }
    const s = L.slides[r.idx]; if (!s) { delete S.review[r.key]; continue; }
    slides.push(Object.assign({}, s, { _src: r, tag: s.type === 'reveal' ? (s.tag || 'Review') : s.tag }));
  }
  save();
  if (!slides.length) { render(); return; }
  slides.unshift({ type: 'hook', title: `${slides.length} thing${slides.length === 1 ? '' : 's'} to revisit`, text: 'Items you missed or marked shaky. Get each one right and it moves further out: tomorrow, then three days, then a week.', say: `You have ${slides.length} items to revisit today. Get each one right and it comes back less often.` });
  openLesson({ id: 'rev', module: 'rev', title: 'Review', mins: Math.max(2, slides.length), slides }, { review: true });
}
function openRatioOfDay(g) {
  const s = { type: 'ratioq', g, mode: Math.random() < .5 ? 'hi' : 'lo', say: '' };
  s.say = (s.mode === 'hi' ? 'Ratio of the day. Which industry runs highest on ' : 'Ratio of the day. Which industry runs lowest on ') + g.name + '? ' + (g.ratio.tells || '');
  openLesson({ id: 'rat:rotd', module: 'rat', title: 'Ratio of the day', mins: 1, slides: [s], isRatio: true, roundKey: 'rotd' });
}

/* ---------- listen integration ---------- */
function toggleListen() {
  P.listen = !P.listen; S.listen = P.listen; save();
  P.el.classList.toggle('listen', P.listen);
  P.lbtn.setAttribute('aria-pressed', P.listen ? 'true' : 'false');
  P.lbtn.replaceChildren(svg(P.listen ? 'speaker' : 'play'), el('span', { class: 'lbl' }, 'Listen'));
  if (P.listen) startNarration(); else { Listen.stop(); P.el.classList.remove('paused'); const s = cur(); if (s.type === 'ratio' && P.slideEl) { const l = P.slideEl.querySelector('.rc-lines'); if (l) l.classList.remove('wait'); ratioShow(P.slideEl, Infinity, 9); } }
}
function setCaption(text) {
  const ct = $('.caps .ct', P.el); if (!ct) return;
  ct.innerHTML = '';
  Listen_sentences(text).forEach((sn, i) => ct.append(el('span', { class: 'cw', 'data-i': i }, sn + ' ')));
}
function Listen_sentences(t) { const x = (t || '').replace(/\s+/g, ' ').trim(); if (!x) return [t]; return x.split(/(?<=[.!?]["']?) (?=\S)/); }
function markSentence(i) { const ct = $('.caps .ct', P.el); if (!ct) return; ct.querySelectorAll('.cw').forEach((w, j) => { w.classList.toggle('now', j === i); w.classList.toggle('on', j < i); }); }
function speakThen(text, then) {
  if (!P) return;
  setCaption(text);
  Listen.speak(text, { rate: S.rate, onSentence: markSentence, onEnd: () => { markSentence(999); if (then) then(); } });
}
function startNarration() {
  if (!P || !P.listen) return;
  const s = cur();
  const text = s.say || (s.type === 'finish' ? 'Lesson complete. Well done.' : strip(s.q || s.text || s.title || ''));
  if (!text) { if (!INTERACTIVE.has(s.type) && s.type !== 'finish') P.timers.push(setTimeout(() => go(1), 1200)); return; }
  setCaption(text);
  const steps = s.type === 'explain' && s.steps ? s.steps.length : 0;
  const isRatioCard = s.type === 'ratio';
  if (isRatioCard) { P.timers.forEach(clearTimeout); P.timers = []; ratioListenReset(s); }
  let stRows = 0; if (s.type === 'statements') { stRows = (s.order || []).length; P.timers.forEach(clearTimeout); P.timers = []; const root = P.slideEl; root.querySelectorAll('.str').forEach(r => { if ((s.order || []).some(([c, i]) => c + ':' + i === r.dataset.k)) r.classList.remove('lit', 'now'); }); root.querySelector('.st-check').classList.remove('on'); }
  let lastStep = 0, lastRow = -1;
  Listen.speak(text, {
    rate: S.rate,
    onSentence: markSentence,
    onProgress: f => {
      if (!P || cur() !== s) return;
      if (steps) { const k = Math.min(steps, Math.floor(f * (steps + 0.6))); if (k > lastStep) { lastStep = k; revealStep(s, k); } }
      if (isRatioCard) ratioListenProgress(s, f);
      if (stRows) {
        const k = Math.min(stRows, Math.floor(((f - .08) / .84) * (stRows + 1)));
        const root = P.slideEl;
        for (let j = lastRow + 1; j < k && j < stRows; j++) { root.querySelectorAll('.str.now').forEach(x => x.classList.remove('now')); const [c, i] = s.order[j]; const r = root.querySelector(`.str[data-k="${c}:${i}"]`); if (r) r.classList.add('lit', 'now'); lastRow = j; }
        if (k > stRows && lastRow >= stRows - 1) { root.querySelectorAll('.str.now').forEach(x => x.classList.remove('now')); root.querySelector('.st-check').classList.add('on'); }
      }
    },
    onEnd: () => {
      if (!P || cur() !== s) return;
      markSentence(999);
      if (steps) revealStep(s, steps);
      if (isRatioCard) ratioListenProgress(s, 1);
      if (stRows) { const root = P.slideEl; root.querySelectorAll('.str').forEach(r => r.classList.add('lit')); root.querySelectorAll('.str.now').forEach(x => x.classList.remove('now')); root.querySelector('.st-check').classList.add('on'); }
      if (s.type === 'finish') return;
      if (!INTERACTIVE.has(s.type)) P.timers.push(setTimeout(() => { if (P && P.listen && cur() === s) go(1); }, stRows ? 900 : isRatioCard ? 1200 : 700));
      else if (s.type === 'reveal') { /* wait for the user */ }
    }
  });
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!P) return;
  const s = cur();
  const inInput = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA');
  if (e.key === 'Escape') { e.preventDefault(); const m = $('.modal-bg'); if (m) m.remove(); else closePlayer(); return; }
  if (inInput && e.key !== 'Enter') return;
  if (e.key === 'ArrowRight' || (e.key === ' ' && !inInput)) { e.preventDefault(); go(1); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); return; }
  if (e.key === 'Enter') { if (s._enter && !inInput) { e.preventDefault(); s._enter(); } else if (!inInput && canAdvance()) { e.preventDefault(); go(1); } return; }
  if (/^[1-9]$/.test(e.key) && s._pick) { e.preventDefault(); s._pick(parseInt(e.key, 10) - 1); }
});

/* ---------- boot ---------- */
load();
if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);
render();
window.Studio = { state: () => S, data: DATA, openLesson, startReview, openRatioOfDay, ratioRounds, buildRatioLesson, closePlayer, go, show, player: () => P, save, render };

</script>
