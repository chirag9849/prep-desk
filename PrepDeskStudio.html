<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Desk Studio</title>
<meta name="description" content="Short, narrated, interactive lessons for IB and ER interview prep.">
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('prepdesk.studio.v1')||'{}');var t=s&&s.theme;if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<style>
/* ---- theme tokens (copied from build/template_head.html) ---- */
:root{
  color-scheme: light;
  --bg:#c4c1b9; --surface:#d4d3cd; --surface-2:#cfccc5; --surface-3:#c5c2b9;
  --ink:#161615; --ink-2:#44433f; --ink-3:#57554f;
  --line:#bcb8ad; --line-2:#aca79b;
  --accent:#c42b35; --accent-2:#a3222b; --accent-soft:#e2d4d4;
  --gold:#a86b0c; --gold-2:#d99a26; --gold-soft:#e2d9c7; --brand:#256abf;
  --flame:#e2621b;
  --focus:#2a78d6;
  --series-1:#2a78d6;
  --g-N:#256abf; --g-U:#86b6ef; --g-P:#f0a09b; --g-M:#c8312f; --g-0:#bdb8ae; --g-X:#a39d90; --g-X-ink:#ffffff;
  --g-N-ink:#ffffff; --g-U-ink:#0d2a4d; --g-P-ink:#4a1210; --g-M-ink:#ffffff;
  --hm-0:#cdccc6; --hm-1:#86b6ef; --hm-2:#3987e5; --hm-3:#1c5cab; --hm-4:#0d366b;
  --upd-bg:#e6ddc9; --upd-line:#e0ad3c; --upd-ink:#6b4700;
  --ind-bg:#d3dae3; --ind-line:#7fb0ec; --ind-ink:#17457f;
  --note-bg:#e6e0b5; --note-ink:#5a4b00;
  --ok:#0b7a3b;
  --shadow:0 1px 2px rgba(20,18,12,.05),0 4px 14px rgba(20,18,12,.05);
  --shadow-lg:0 10px 40px rgba(20,18,12,.18);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Cambria,"Sitka Text",Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f1012; --surface:#17191c; --surface-2:#1c1f23; --surface-3:#22252a;
    --ink:#ecebe6; --ink-2:#b9b7b0; --ink-3:#95938c;
    --line:#2a2d32; --line-2:#383c42;
    --accent:#ff6b6b; --accent-2:#ff8a8a; --accent-soft:#3a1c1f;
    --gold:#e8b44f; --gold-2:#f0c46a; --gold-soft:#342a14; --brand:#6aa6ec;
    --flame:#ff8a3d;
    --focus:#5b9ae6;
    --series-1:#3987e5;
    --g-N:#5b9ae6; --g-U:#1f5aa3; --g-P:#8e3533; --g-M:#ea6a67; --g-0:#34373c; --g-X:#6d7178; --g-X-ink:#ffffff;
    --g-N-ink:#0b1a2e; --g-U-ink:#ffffff; --g-P-ink:#ffffff; --g-M-ink:#2a0d0c;
    --hm-0:#25282c; --hm-1:#184f95; --hm-2:#2a78d6; --hm-3:#6da7ec; --hm-4:#b7d3f6;
    --upd-bg:#2d2513; --upd-line:#8a6a1f; --upd-ink:#f1d189;
    --ind-bg:#14233a; --ind-line:#2f619f; --ind-ink:#a9ccf5;
    --note-bg:#33301a; --note-ink:#f0e39a;
    --ok:#3ecf7a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f1012; --surface:#17191c; --surface-2:#1c1f23; --surface-3:#22252a;
  --ink:#ecebe6; --ink-2:#b9b7b0; --ink-3:#95938c;
  --line:#2a2d32; --line-2:#383c42;
  --accent:#ff6b6b; --accent-2:#ff8a8a; --accent-soft:#3a1c1f;
  --gold:#e8b44f; --gold-2:#f0c46a; --gold-soft:#342a14; --brand:#6aa6ec;
  --flame:#ff8a3d;
  --focus:#5b9ae6;
  --series-1:#3987e5;
  --g-N:#5b9ae6; --g-U:#1f5aa3; --g-P:#8e3533; --g-M:#ea6a67; --g-0:#34373c; --g-X:#6d7178; --g-X-ink:#ffffff;
  --g-N-ink:#0b1a2e; --g-U-ink:#ffffff; --g-P-ink:#ffffff; --g-M-ink:#2a0d0c;
  --hm-0:#25282c; --hm-1:#184f95; --hm-2:#2a78d6; --hm-3:#6da7ec; --hm-4:#b7d3f6;
  --upd-bg:#2d2513; --upd-line:#8a6a1f; --upd-ink:#f1d189;
  --ind-bg:#14233a; --ind-line:#2f619f; --ind-ink:#a9ccf5;
  --note-bg:#33301a; --note-ink:#f0e39a;
  --ok:#3ecf7a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
/* ---- tables and formula ---- */
.t{width:100%;border-collapse:collapse;font:13.5px/1.45 var(--sans);margin:4px 0 14px}
.t th,.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.t thead th{font-weight:600;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.t td:first-child{font-weight:600;color:var(--ink-2)}
.t.compact th,.t.compact td{padding:6px 8px;font-size:13px}
.formula{font:italic 16px/1.5 var(--serif);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0 12px;text-align:center;overflow-x:auto;white-space:nowrap}
/* ---- cheat sheet visual components (copied) ---- */
/* ---------- visual cheat sheet */
.cs-index{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 18px}
.cs-index .cs-jump{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);text-align:left;font:600 13.5px/1.25 var(--sans);color:var(--ink)}
.cs-index .cs-jump:hover{border-color:var(--ink-3)}
.cs-index small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.cs-num{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:#fff;font:700 13px/1 var(--sans)}
.cs-sec{margin:0 0 28px;scroll-margin-top:80px}
.cs-head{display:flex;gap:12px;align-items:flex-start;margin:6px 0 12px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.cs-head .cs-num{width:34px;height:34px;font-size:15px;border-radius:10px}
.cs-head h2{font:700 20px/1.25 var(--sans);margin:2px 0 3px}
.cs-head p{margin:0;color:var(--ink-2);font-size:14px;max-width:820px}
.cs-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cs-note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 16px;box-shadow:var(--shadow);min-width:0;position:relative}
.cs-note.wide{grid-column:1/-1}
.cs-note>h3{font:700 15.5px/1.3 var(--sans);margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cs-note .cs-tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.cs-body{font:14px/1.55 var(--sans);min-width:0}
.cs-body>*:last-child{margin-bottom:0}
.cs-body p{margin:0 0 10px}
.cs-body ul,.cs-body ol{margin:0 0 10px;padding-left:1.2em}
.cs-body li{margin-bottom:4px}
.cs-body .t{margin:2px 0 10px}
.cs-body .formula{font-size:15px;margin:6px 0 10px}
.cs-body .pos{color:var(--ok);font-weight:700}
.cs-body .neg{color:var(--accent);font-weight:700}
.cs-body .mut{color:var(--ink-3)}
.cs-body .trap,.cs-body .mynote,.cs-body .upd,.cs-body .ind,.cs-body .key{padding:8px 11px;border-radius:9px;margin:0 0 10px;font-size:13.5px;line-height:1.5}
.cs-body .trap{background:var(--accent-soft);border-left:3px solid var(--accent)}
.cs-body .trap b:first-child{color:var(--accent)}
.cs-body .mynote{background:var(--note-bg);color:var(--note-ink);border-left:3px solid color-mix(in srgb,var(--note-ink) 45%,transparent)}
.cs-body .upd{background:var(--upd-bg);color:var(--upd-ink);border-left:3px solid var(--upd-line)}
.cs-body .ind{background:var(--ind-bg);color:var(--ind-ink);border-left:3px solid var(--ind-line)}
.cs-body .key{background:var(--surface-2);border:1px solid var(--line);font-weight:600}
.cs-body .setup{margin:0 0 10px;padding:8px 11px;border-radius:9px;background:color-mix(in srgb,var(--brand) 7%,var(--surface));border-left:3px solid var(--brand);font-size:13.8px;line-height:1.5}
.cs-body .setup b:first-child{color:var(--brand)}
.cs-body .must{border:1px solid color-mix(in srgb,var(--gold-2) 55%,var(--line));background:var(--gold-soft);border-radius:10px;padding:10px 12px 8px;margin:0 0 10px}
.cs-body .must>b:first-child{display:block;font:700 11.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.cs-body .must ul{margin:0;padding-left:1.15em;font-size:13.5px}
.cs-body dl.rapid{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cs-body dl.rapid dt{font:600 13.5px/1.4 var(--sans);padding:8px 11px 2px;background:var(--surface-2)}
.cs-body dl.rapid dd{margin:0;padding:2px 11px 8px;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line)}
.cs-body dl.rapid dd:last-child{border-bottom:0}
.cs-body dl.rapid dt:nth-of-type(even),.cs-body dl.rapid dt:nth-of-type(even)+dd{background:var(--surface)}
/* flow chain */
.flow{display:flex;flex-wrap:wrap;gap:22px;align-items:stretch;margin:4px 0 12px}
.fstep{position:relative;flex:1 1 90px;min-width:84px;max-width:190px;border:1px solid var(--line-2);border-radius:10px;padding:7px 9px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-17px;top:50%;width:12px;height:12px;border-top:2px solid var(--ink-3);border-right:2px solid var(--ink-3);transform:translateY(-50%) rotate(45deg)}
.fstep .fk{font:700 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fstep b{font:700 14.5px/1.25 var(--sans)}
.fstep small{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.fstep.hl{border-color:var(--series-1);background:color-mix(in srgb,var(--series-1) 12%,var(--surface))}
.fstep.hl2{border-color:var(--accent);background:var(--accent-soft)}
/* three statements side by side */
.fs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 10px}
.fsc{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.fsh{font:700 11.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:8px 10px;background:var(--surface-3);color:var(--ink-2)}
.fsr{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--line);font-size:13px}
.fsr b{font-variant-numeric:tabular-nums;white-space:nowrap}
.fsr.tot{background:var(--surface-2);font-weight:700}
.balance{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font:600 13px/1.3 var(--sans);padding:8px 10px;border:1px dashed var(--line-2);border-radius:9px;margin:0 0 10px}
.balance .eq{font-size:16px;color:var(--ink-3)}
/* formula cards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:4px 0 10px}
.fcard{border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;background:var(--surface-2)}
.fname{font:700 12.5px/1.2 var(--sans);color:var(--ink-2);margin-bottom:4px}
.fx{font:italic 15px/1.4 var(--serif);color:var(--ink)}
.fnote{font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.4}
/* spectrum */
.spectrum{display:flex;gap:3px;margin:6px 0 2px}
.sp-seg{flex:var(--w) 1 0;min-width:0;padding:8px 9px;border-radius:8px;background:color-mix(in srgb,var(--series-1) calc(var(--t,14) * 1%),var(--surface));border:1px solid color-mix(in srgb,var(--series-1) 35%,transparent);font-size:12.5px;line-height:1.3}
.sp-seg b{display:block;font-size:13px}
.sp-seg small{color:var(--ink-2)}
.sp-axis{position:relative;height:16px;font:11px/1 var(--sans);color:var(--ink-3);margin:2px 0 12px}
.sp-axis span{position:absolute;left:calc(var(--x) * 1%);transform:translateX(-50%)}
.sp-axis span:first-child{transform:none}
.sp-axis span:last-child{transform:translateX(-100%)}
/* compare cards */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:4px 0 10px}
.cmp-c{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface-2);min-width:0}
.cmp-c h4{font:700 13.5px/1.3 var(--sans);margin:0 0 6px}
.cmp-c ul{margin:0;padding-left:1.1em;font-size:13px}
.cmp-c li{margin-bottom:3px}
.cmp-c.a{border-top:3px solid var(--series-1)}
.cmp-c.b{border-top:3px solid var(--accent)}
.cmp-c.c{border-top:3px solid var(--gold-2)}
/* numbered steps */
ol.steps{list-style:none;padding:0;margin:4px 0 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;border:1px solid var(--line-2);border-radius:10px;padding:26px 9px 8px;background:var(--surface-2);font-size:12.5px;line-height:1.35;margin:0}
ol.steps li::before{content:counter(st);position:absolute;left:9px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 11px/18px var(--sans);text-align:center}
ol.steps li b{display:block;font-size:13px;margin-bottom:2px}
/* mini column chart */
.minichart{margin:6px 0 12px}
.mc-legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.mc-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mc-plot{display:flex;align-items:flex-end;gap:14px;height:150px;padding:0 4px;border-bottom:1px solid var(--line-2)}
.mc-group{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;position:relative}
.mc-col{width:min(22px,40%);height:calc(var(--v) / var(--max) * 120px);border-radius:4px 4px 0 0;position:relative}
.mc-col em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:600 10.5px/1.6 var(--sans);font-style:normal;color:var(--ink-2);white-space:nowrap}
.mc-x{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:11px/1.9 var(--sans);color:var(--ink-3);white-space:nowrap}
.mc-xpad{height:20px}
.mc-a{background:var(--series-1)} .mc-b{background:var(--accent)} .mc-c{background:var(--gold-2)} .mc-n{background:var(--g-0)}
/* chips for impacts */
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.kchip{font:600 12.5px/1 var(--sans);padding:6px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2)}
.kchip.up{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.kchip.dn{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
/* T-account */
.tacct{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin:4px 0 10px;font-size:13px}
.tacct>div{padding:0}
.tacct>div+div{border-left:2px solid var(--ink-3)}
.tacct .th{font:700 11.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:8px 10px;background:var(--surface-3);color:var(--ink-2)}
.tacct .tr{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.tacct .tr b{font-variant-numeric:tabular-nums;white-space:nowrap}
/* inline svg figures */
figure.svgfig{margin:4px 0 12px}
figure.svgfig svg{display:block;width:100%;height:auto;max-width:100%;color:var(--ink)}
figure.svgfig figcaption{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.4}
.s-line{stroke:currentColor;fill:none;stroke-width:1.6}
.s-mline{stroke:var(--ink-3);fill:none;stroke-width:1.4}
.s-grid{stroke:var(--line);fill:none;stroke-width:1}
.s-box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.4}
.s-box2{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.4}
.s-boxa{fill:color-mix(in srgb,var(--series-1) 14%,var(--surface));stroke:var(--series-1);stroke-width:1.6}
.s-boxb{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.s-boxg{fill:var(--gold-soft);stroke:var(--gold-2);stroke-width:1.6}
.s-fa{fill:var(--series-1)} .s-fb{fill:var(--accent)} .s-fg{fill:var(--gold-2)} .s-fn{fill:var(--g-0)} .s-fink{fill:currentColor}
.s-la{stroke:var(--series-1);fill:none;stroke-width:2} .s-lb{stroke:var(--accent);fill:none;stroke-width:2}
.s-t{font:500 12px var(--sans);fill:currentColor}
.s-ts{font:500 11px var(--sans);fill:var(--ink-3)}
.s-tb{font:700 12.5px var(--sans);fill:currentColor}
.s-ta{font:700 12px var(--sans);fill:var(--series-1)} .s-tr{font:700 12px var(--sans);fill:var(--accent)}
@media (max-width: 900px){
  .cs-notes{grid-template-columns:minmax(0,1fr)}
  .fs3{grid-template-columns:minmax(0,1fr)}
  .flow{gap:18px}
  .fstep{max-width:none;flex:1 1 40%}
  .fstep:not(:last-child)::after{right:-14px;width:9px;height:9px}
}

/* =========================================================
   Studio: base
   ========================================================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;min-height:100%}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
kbd{font:600 11px/1 var(--mono);padding:3px 5px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;background:var(--surface-2);color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
:root{--mod-acc:var(--brand);--mod-val:var(--accent);--mod-rat:var(--gold);--mod-rev:var(--ok);--ease:cubic-bezier(.2,.8,.2,1)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:600 14.5px/1.2 var(--sans);text-decoration:none;white-space:nowrap;transition:transform .15s var(--ease),border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary kbd{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--surface) 45%,transparent)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:14px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:0}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.linkish{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:12.5px;cursor:pointer}
.linkish:hover{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);padding:5px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.m-acc{color:var(--mod-acc);border-color:color-mix(in srgb,var(--mod-acc) 40%,transparent);background:color-mix(in srgb,var(--mod-acc) 10%,var(--surface))}
.chip.m-val{color:var(--mod-val);border-color:color-mix(in srgb,var(--mod-val) 40%,transparent);background:color-mix(in srgb,var(--mod-val) 10%,var(--surface))}
.chip.m-rat{color:var(--mod-rat);border-color:color-mix(in srgb,var(--mod-rat) 45%,transparent);background:color-mix(in srgb,var(--mod-rat) 12%,var(--surface))}
.chip.m-rev{color:var(--mod-rev);border-color:color-mix(in srgb,var(--mod-rev) 45%,transparent);background:color-mix(in srgb,var(--mod-rev) 12%,var(--surface))}
.chip.miss{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}

/* =========================================================
   Home: top bar
   ========================================================= */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:0 20px;height:62px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--serif);letter-spacing:.02em;flex:none}
.brand-name{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand-name small{display:block;font:500 11px/1 var(--sans);color:var(--ink-3);margin-top:2px;letter-spacing:.04em;text-transform:uppercase}
.top .grow{flex:1}
.stat{display:inline-flex;align-items:center;gap:7px;font:700 14px/1 var(--sans);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.stat small{font-weight:500;color:var(--ink-3);font-size:12px}
.stat .flame{color:var(--flame)}
.stat.cold .flame{color:var(--ink-3)}
.stat .xp{color:var(--gold)}
.ring{width:38px;height:38px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .trk{stroke:var(--surface-3)}
.ring .val{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .8s var(--ease)}
.ring text{font:700 8.5px var(--sans);fill:var(--ink)}

/* =========================================================
   Home: layout
   ========================================================= */
.home{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
.hgreet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 16px}
.hgreet h1{font:800 30px/1.1 var(--sans);letter-spacing:-.02em;margin:0}
.hgreet p{margin:6px 0 0;color:var(--ink-2);max-width:620px}
.sec-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-h h2{font:800 13px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.sec-h .n{font:600 12px/1 var(--sans);color:var(--ink-3)}

.today{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.tcard{scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-width:0;overflow:hidden;text-align:left}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mc,var(--brand))}
.tcard .tk{display:flex;align-items:center;gap:8px;font:600 11.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.tcard .tt{font:700 17px/1.25 var(--sans);letter-spacing:-.01em;color:var(--ink)}
.tcard .tb{font-size:13px;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .tf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.tcard .tf .mins{font:600 12.5px/1 var(--sans);color:var(--ink-3)}
.tcard.rev{--mc:var(--mod-rev)}
.tcard.rat{--mc:var(--mod-rat)}
.tcard.empty{border-style:dashed;box-shadow:none;background:transparent;justify-content:center;align-items:center;text-align:center;color:var(--ink-3);min-height:120px}
.tcard.empty::before{display:none}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.mod{position:relative;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;--mc:var(--brand)}
.mod.m-acc{--mc:var(--mod-acc)} .mod.m-val{--mc:var(--mod-val)} .mod.m-rat{--mc:var(--mod-rat)}
.mod-h{display:flex;align-items:center;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 12%,var(--surface)),var(--surface))}
.mod-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--mc);color:#fff;flex:none;box-shadow:0 4px 14px color-mix(in srgb,var(--mc) 35%,transparent)}
.mod-ic svg{width:20px;height:20px}
.mod-t{flex:1;min-width:0}
.mod-t b{display:block;font:800 17px/1.2 var(--sans);letter-spacing:-.01em}
.mod-t span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.mod-bar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:7px}
.mod-bar i{display:block;height:100%;border-radius:4px;background:var(--mc);transition:width .8s var(--ease)}
.mod-pct{font:800 20px/1 var(--sans);color:var(--mc);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.path{position:relative;padding:10px 0 18px;background:
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.2px) 0 0/22px 22px}
.path svg.rail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.rail .todo{fill:none;stroke:var(--ink-3);opacity:.5;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 10}
.rail .done{fill:none;stroke:var(--mc);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 6px color-mix(in srgb,var(--mc) 35%,transparent))}
.node{position:absolute;width:160px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.node-b{position:relative;width:66px;height:66px;border-radius:50%;border:3px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-3);padding:0;box-shadow:0 2px 0 var(--line-2),var(--shadow);transition:transform .2s var(--ease),box-shadow .2s}
.node-b svg{width:26px;height:26px;stroke-width:2.2}
.node-b:hover{transform:translateY(-2px)}
.node-b .num{font:800 20px/1 var(--sans);color:var(--ink-2)}
.node.done .node-b{background:var(--mc);border-color:var(--mc);color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--mc) 60%,black),var(--shadow)}
.node.cur .node-b{border-color:var(--mc);color:var(--mc);background:var(--surface);box-shadow:0 2px 0 var(--mc),0 0 0 8px color-mix(in srgb,var(--mc) 16%,transparent),var(--shadow-lg);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 2px 0 var(--mc),0 0 0 6px color-mix(in srgb,var(--mc) 18%,transparent),var(--shadow-lg)}50%{box-shadow:0 2px 0 var(--mc),0 0 0 13px color-mix(in srgb,var(--mc) 6%,transparent),var(--shadow-lg)}}
.node.lock .node-b{border-style:dashed;background:var(--surface-2);box-shadow:none}
.node.lock .node-b:hover{transform:none}
.node-txt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 6px 0;max-width:160px}
.node-l{font:700 13px/1.25 var(--sans);color:var(--ink);letter-spacing:-.005em;max-width:150px}
.node.lock .node-l{color:var(--ink-3);font-weight:600}
.node-m{font:600 11.5px/1.25 var(--sans);color:var(--ink-3)}
.node-m .best{color:var(--mc)}
.node .jump{font-size:11.5px;color:var(--mc);background:none;border:0;padding:2px 6px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;border-radius:6px}
.node .jump:hover{background:color-mix(in srgb,var(--mc) 12%,transparent)}
.node.star .node-b{border-radius:22px;transform:rotate(45deg)}
.node.star .node-b>*{transform:rotate(-45deg)}
.node.star .node-b:hover{transform:rotate(45deg) translateY(-2px)}
.mod-empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:14px}
.rotd{margin:0 16px 10px;padding:12px 14px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--mod-rat) 60%,transparent);background:var(--gold-soft);font-size:13.5px}
.rotd b{color:var(--gold)}
.rotd .fx{font:italic 14.5px/1.4 var(--serif);margin:4px 0 2px}

.review-list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.rv{min-width:0}
.rv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.rv .rq{flex:1;min-width:0;font:500 13.5px/1.35 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .rd{font:600 11.5px/1 var(--sans);color:var(--ink-3);white-space:nowrap}
.rv.due .rd{color:var(--accent)}
.foot{margin-top:40px;font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.6}

/* =========================================================
   Player
   ========================================================= */
.player{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;animation:pfade .25s var(--ease)}
@keyframes pfade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:58px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(8px)}
.pbar .pt{flex:1;min-width:0;text-align:center}
.pbar .pt b{display:block;font:700 13.5px/1.2 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .pt span{display:block;font:500 11.5px/1 var(--sans);color:var(--ink-3);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.dots{display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap;padding:8px 16px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--surface-3);border:1px solid var(--line-2);padding:0;transition:transform .2s var(--ease),background .2s}
.dot.seen{background:var(--ink-3);border-color:var(--ink-3)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--accent);border-color:var(--accent)}
.dot.cur{transform:scale(1.5);background:var(--ink);border-color:var(--ink)}
.stage{flex:1;position:relative;overflow:hidden;min-height:0}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:26px 20px 30px;display:flex;flex-direction:column;align-items:center;-webkit-overflow-scrolling:touch}
.slide.in{animation:sin .36s var(--ease) both}
.slide.in.back{animation-name:sinb}
.slide.out{animation:sout .3s var(--ease) both;pointer-events:none}
.slide.out.back{animation-name:soutb}
@keyframes sin{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes sinb{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes sout{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-70px)}}
@keyframes soutb{from{opacity:1;transform:none}to{opacity:0;transform:translateX(70px)}}
.sl{width:100%;max-width:760px;margin:auto 0;display:flex;flex-direction:column;gap:14px}
.sl.wide{max-width:900px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kicker i{display:inline-block;width:22px;height:3px;border-radius:2px;background:var(--mc,var(--brand))}
.sl h1{font:800 clamp(26px,4.6vw,42px)/1.1 var(--sans);letter-spacing:-.025em;margin:0}
.sl h2{font:800 clamp(22px,3.6vw,32px)/1.15 var(--sans);letter-spacing:-.02em;margin:0}
.sl .lead{font:400 clamp(17px,2.2vw,20px)/1.5 var(--sans);color:var(--ink-2);margin:0;max-width:640px}
.sl .lead b{color:var(--ink);font-weight:700}
.qtext{font:700 clamp(20px,2.6vw,26px)/1.38 var(--serif);color:var(--ink);margin:0;letter-spacing:-.005em}
.qtext.red{color:var(--accent)}
.vis{margin-top:4px}
.vis .cs-body{font-size:15px}
.vis .cs-body .fstep b{font-size:16px}
.vis .cs-body .fstep small{font-size:12.5px}
.vis .cs-body .fsr{font-size:14px}
.vis .cs-body .fx{font-size:17px}
.vis .cs-body .key{font-size:15px}
.vis .cs-body .trap,.vis .cs-body .ind,.vis .cs-body .upd,.vis .cs-body .mynote{font-size:14.5px}
.vis [class*="step-"]{transition:opacity .5s var(--ease),transform .5s var(--ease),filter .5s}
.vis.stepped [class*="step-"]:not(.st-on){opacity:.18;transform:translateY(5px);filter:saturate(.2)}
.vis .fstep:not(:last-child)::after{transition:opacity .5s}
.vis.stepped .fstep:not(.st-on)::after{opacity:.2}

.hook-wrap{position:relative;padding:30px 30px 34px;border-radius:24px;background:
  radial-gradient(900px 400px at 10% -10%,color-mix(in srgb,var(--mc,var(--brand)) 22%,transparent),transparent 60%),
  radial-gradient(600px 300px at 100% 110%,color-mix(in srgb,var(--gold-2) 16%,transparent),transparent 60%),
  var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden}
.hook-wrap::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;border:26px solid color-mix(in srgb,var(--mc,var(--brand)) 10%,transparent)}
.hook-wrap h1{position:relative;margin-top:12px}
.hook-wrap .lead{position:relative;margin-top:14px;font-size:clamp(17px,2.4vw,21px)}
.hook-wrap .vis{position:relative;margin-top:18px}
.hook-co{position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:22px;font:600 12.5px/1 var(--sans);color:var(--ink-3)}
.hook-co i{width:8px;height:8px;border-radius:50%;background:var(--mc,var(--brand));display:inline-block}

.steps-cap{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;counter-reset:sc}
.steps-cap li{counter-increment:sc;display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:14.5px;line-height:1.4;opacity:.35;transition:opacity .4s,transform .4s var(--ease),border-color .3s;transform:translateX(-4px)}
.steps-cap li::before{content:counter(sc);flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 12px/22px var(--sans);text-align:center}
.steps-cap li.on{opacity:1;transform:none;border-color:var(--line-2);background:var(--surface)}
.steps-cap li.now{border-color:var(--mc,var(--brand));box-shadow:0 0 0 2px color-mix(in srgb,var(--mc,var(--brand)) 20%,transparent)}
.tap-hint{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}

/* statements */
.st3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.stc{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sth{font:800 11.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;padding:11px 12px;color:var(--ink-2);background:var(--surface-3);display:flex;align-items:center;gap:8px}
.sth i{width:8px;height:8px;border-radius:2px;background:var(--mc,var(--brand));display:inline-block}
.str{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px;position:relative;transition:background .35s}
.str span{min-width:0;color:var(--ink-2)}
.str b{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px;opacity:0;transform:translateY(6px);transition:opacity .35s var(--ease),transform .35s var(--ease);color:var(--ink-3)}
.str.lit b{opacity:1;transform:none}
.str.lit span{color:var(--ink)}
.str.lit b.pos{color:var(--ok)} .str.lit b.neg{color:var(--accent)}
.str.now{background:color-mix(in srgb,var(--mc,var(--brand)) 14%,var(--surface))}
.str.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mc,var(--brand))}
.st-check{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font:700 15px/1.3 var(--sans);padding:12px 14px;border:1.5px dashed var(--line-2);border-radius:12px;margin-top:10px;opacity:.35;transition:opacity .4s,border-color .4s,background .4s}
.st-check.on{opacity:1;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.st-check .ck{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;transform:scale(0);transition:transform .35s var(--ease)}
.st-check.on .ck{transform:scale(1)}
.st-check .ck svg{width:14px;height:14px;stroke-width:3}
.st-check .eq{color:var(--ink-3);font-size:18px}

/* options */
.opts{display:grid;gap:10px;margin-top:6px}
.opts.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px 14px 14px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);font:500 16px/1.35 var(--sans);transition:transform .15s var(--ease),border-color .15s,background .15s;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--ink-3);transform:translateY(-1px)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);font:700 13px/1 var(--sans)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));animation:popok .45s var(--ease)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--accent);background:var(--accent-soft);animation:shake .4s var(--ease)}
.opt.bad .k{background:var(--accent);color:#fff}
.opt.dim{opacity:.5}
.opt:disabled{opacity:1;cursor:default}
.opt:disabled.dim{opacity:.45}
@keyframes popok{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);animation:fbin .35s var(--ease)}
.fb .fi{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ink-3)}
.fb .fi svg{width:16px;height:16px;stroke-width:2.8}
.fb.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.fb.ok .fi{background:var(--ok)}
.fb.bad{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.fb.bad .fi{background:var(--accent)}
.fb .ft{font:700 15px/1.3 var(--sans);margin:0 0 3px}
.fb .fw{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin:0}
.fb .fw b{color:var(--ink)}
.fb .xpb{margin-left:auto;flex:none;font:800 13px/1 var(--sans);color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:6px 9px;white-space:nowrap}
@keyframes fbin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* number */
.numrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.numin{display:flex;align-items:center;gap:8px;flex:1 1 220px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--surface);padding:0 14px;min-height:56px}
.numin{min-width:0}
.numin input{flex:1;width:100%;min-width:0;border:0;background:none;color:var(--ink);font:700 22px/1 var(--sans);padding:12px 0;outline:none;font-variant-numeric:tabular-nums}
.numin input::placeholder{color:var(--ink-3);font-weight:500;font-size:16px}
.numin .unit{font:600 13px/1 var(--sans);color:var(--ink-3);white-space:nowrap}
.numin.ok{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.numin.bad{border-color:var(--accent);animation:shake .4s var(--ease)}

/* order */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border-radius:14px;border:1.5px dashed var(--line-2);background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.pool:empty::after{content:"All placed. Now check it.";color:var(--ink-3);font-size:13px;padding:6px 4px}
.ochip{display:inline-flex;align-items:center;gap:8px;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font:500 14.5px/1.3 var(--sans);text-align:left;cursor:grab;transition:transform .15s var(--ease),border-color .15s;max-width:100%}
.ochip:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.ochip.sel{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.ochip.drag{opacity:.4}
.slots{display:grid;gap:8px;margin-top:4px}
.slot{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 8px 6px 6px;border-radius:13px;border:1.5px dashed var(--line-2);background:var(--surface-2);transition:border-color .15s,background .15s}
.slot .sn{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:var(--surface);font:800 13px/1 var(--sans)}
.slot .sv{flex:1;min-width:0;font:500 14.5px/1.3 var(--sans);color:var(--ink-3)}
.slot.filled{border-style:solid;background:var(--surface)}
.slot.filled .sv{color:var(--ink);cursor:pointer}
.slot.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.slot.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.slot.ok .sn{background:var(--ok);color:#fff}
.slot.bad{border-color:var(--accent);background:var(--accent-soft);animation:shake .4s var(--ease)}
.slot.bad .sn{background:var(--accent);color:#fff}
.slot .x{margin-left:auto;flex:none;border:0;background:none;color:var(--ink-3);font-size:18px;line-height:1;padding:4px 8px;border-radius:8px}
.slot .x:hover{background:var(--surface-3);color:var(--ink)}

/* sort */
.buckets{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px;margin-top:6px}
.bucket{min-height:120px;border-radius:14px;border:1.5px dashed var(--line-2);background:var(--surface-2);padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;transition:border-color .15s,background .15s,transform .15s var(--ease)}
.bucket .bh{display:flex;align-items:center;gap:8px;font:800 13px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding:4px 4px 6px}
.bucket .bh .k{margin-left:auto;width:22px;height:22px;border-radius:6px;background:var(--surface-3);color:var(--ink-3);font:700 11.5px/1 var(--sans);display:grid;place-items:center}
.bucket.arm{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface));cursor:pointer}
.bucket.arm:hover{transform:translateY(-2px)}
.bucket .ochip{padding:8px 10px;font-size:13.5px;cursor:pointer}
.bucket .ochip.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.bucket .ochip.bad{border-color:var(--accent);background:var(--accent-soft);animation:shake .4s var(--ease)}

/* reveal */
.rev-card{padding:22px 24px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-lg)}
.rev-card .qtext{color:var(--accent)}
.say-aloud{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--line-2);font-size:14px;color:var(--ink-2)}
.say-aloud .mic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.say-aloud .mic svg{width:16px;height:16px}
.say-aloud .tmr{margin-left:auto;font:700 15px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.ans{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font:16.5px/1.6 var(--serif);animation:fbin .4s var(--ease)}
.ans p{margin:0 0 10px} .ans p:last-child{margin:0}
.ans ul,.ans ol{margin:0 0 10px;padding-left:1.3em}
.ans b{font-weight:700}
.ans .t{font-family:var(--sans)}
.grade{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.grade .btn{flex:1 1 150px;padding:13px 16px;font-size:15px}
.grade .btn.got{border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok)}
.grade .btn.got:hover{background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.grade .btn.shaky{border-color:color-mix(in srgb,var(--gold) 70%,transparent);color:var(--gold)}
.grade .btn.shaky:hover{background:var(--gold-soft)}
.grade .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* recap and finish */
.recap{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px;counter-reset:rc}
.recap li{counter-increment:rc;display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font:600 clamp(16px,2vw,19px)/1.4 var(--sans);box-shadow:var(--shadow);opacity:0;transform:translateY(10px);animation:rcin .5s var(--ease) forwards}
.recap li:nth-child(2){animation-delay:.18s} .recap li:nth-child(3){animation-delay:.36s} .recap li:nth-child(4){animation-delay:.54s} .recap li:nth-child(5){animation-delay:.72s}
.recap li::before{content:counter(rc);flex:none;width:30px;height:30px;border-radius:10px;background:var(--mc,var(--brand));color:#fff;font:800 14px/30px var(--sans);text-align:center}
@keyframes rcin{to{opacity:1;transform:none}}
.finish{text-align:center;align-items:center}
.finish .bigring{width:150px;height:150px;margin:0 auto}
.finish .bigring .trk{fill:none;stroke:var(--surface-3);stroke-width:10}
.finish .bigring .val{fill:none;stroke:var(--ok);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.2s var(--ease)}
.finish .bigring text{font:800 30px var(--sans);fill:var(--ink)}
.finish .bigring .sub{font:600 11px var(--sans);fill:var(--ink-3)}
.fstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.fstat{min-width:110px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.fstat b{display:block;font:800 22px/1.1 var(--sans);letter-spacing:-.02em}
.fstat span{font-size:12px;color:var(--ink-3)}
.fstat.gold b{color:var(--gold)} .fstat.flame b{color:var(--flame)}
.factions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}

/* ratio game */
.rq-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rq-fx{font:italic 15.5px/1.4 var(--serif);color:var(--ink-2);padding:8px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:inline-block}
.rq-tells{font-size:14.5px;color:var(--ink-2);margin:0}
.opts.ind{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.ind .opt{flex-direction:column;align-items:flex-start;gap:6px;padding:12px 12px;min-height:66px;font-size:15px;font-weight:600}
.opts.ind .opt .k{width:22px;height:22px;font-size:11.5px;border-radius:6px}
.opts.ind .opt small{font-weight:500;font-size:12px;color:var(--ink-3)}
.rchart{display:grid;gap:6px;margin-top:4px;animation:fbin .4s var(--ease)}
.rrow{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 68px;gap:10px;align-items:center;font-size:13.5px}
.rrow .rl{min-width:0;line-height:1.15}
.rrow .rl b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rl span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rt{position:relative;height:20px;border-radius:5px;background:color-mix(in srgb,var(--surface-3) 70%,transparent)}
.rrow .rb{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--g-U);width:0;transition:width .9s var(--ease)}
.rrow .rb.neg{background:var(--g-P)}
.rrow.hi .rb{background:var(--g-N)} .rrow.lo .rb{background:var(--gold-2)}
.rrow.pick .rl b{color:var(--accent)}
.sth .abbr{display:none}
.rrow.pick .rb{outline:2px solid var(--accent);outline-offset:1px}
.rrow.hit .rl b{color:var(--ok)}
.rrow .rval{text-align:right;font:700 13.5px/1 var(--sans);font-variant-numeric:tabular-nums}
.rrow.na .rt{background:none} .rrow.na .rval{color:var(--ink-3);font-weight:500}
.rrow .rz{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink-3)}
.rlines{display:grid;gap:8px;margin-top:4px}
.rlines p{display:flex;gap:9px;align-items:flex-start;margin:0;font-size:14.5px;line-height:1.5;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.rlines p svg{flex:none;width:16px;height:16px;margin-top:3px}
.rlines p.up svg{color:var(--g-N)} .rlines p.dn svg{color:var(--gold)} .rlines p.say svg{color:var(--ink-3)}
.rlines p.say{font-style:italic;color:var(--ink-2)}
.score-pill{font:800 13px/1 var(--sans);padding:7px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.score-pill b{color:var(--ok)}

/* ratio teaching card (slide type "ratio") */
:root{--rb-n:color-mix(in srgb,var(--series-1) 26%,var(--surface-3));--rb-track:color-mix(in srgb,var(--surface-3) 60%,transparent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--rb-n:color-mix(in srgb,var(--series-1) 38%,var(--surface-3));--rb-track:color-mix(in srgb,var(--surface-3) 75%,transparent)} }
:root[data-theme="dark"]{--rb-n:color-mix(in srgb,var(--series-1) 38%,var(--surface-3));--rb-track:color-mix(in srgb,var(--surface-3) 75%,transparent)}
.sl.xwide{max-width:1080px}
.rcard{gap:10px}
.rc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rc-fx{align-self:flex-start;max-width:100%;font:italic clamp(15px,1.8vw,17.5px)/1.45 var(--serif);color:var(--ink);padding:9px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.rc-tells{font:400 clamp(15.5px,1.9vw,18px)/1.5 var(--sans);color:var(--ink-2);margin:0;max-width:700px}
.rgroups{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:2px}
.rgrp{min-width:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:12px 12px 10px}
.rgrp-h{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin:0 8px 6px;font-size:12.5px;line-height:1.3;color:var(--ink-3)}
.rgrp-h b{font:800 12.5px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.rbars{display:grid;gap:3px}
.rbar{--lw:176px;--vw:78px;display:grid;grid-template-columns:minmax(0,var(--lw)) minmax(0,1fr) var(--vw);column-gap:14px;align-items:center;padding:4px 8px;border-radius:11px;text-align:left;border:0;background:none;width:100%;color:inherit;font:inherit;cursor:default}
.rbar.fp{cursor:pointer}
@media (hover:hover){ .rbar.fp:hover{background:color-mix(in srgb,var(--surface-3) 45%,transparent)} }
.rbar.open{background:color-mix(in srgb,var(--surface-3) 55%,transparent)}
.rlab{min-width:0;line-height:1.2}
.rlab b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font:700 15.5px/1.2 var(--sans);color:var(--ink);overflow:hidden;overflow-wrap:anywhere}
.rlab span{display:block;font:500 12.5px/1.25 var(--sans);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rtrack{position:relative;height:26px;border-radius:7px;background:var(--rb-track)}
.rbar.na .rtrack{background:none}
.rfill{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--rb-n);transform:scaleX(0);transform-origin:left center;transition:transform .85s var(--ease)}
.rfill.neg{transform-origin:right center}
.rfill.clip{border-radius:7px 0 0 7px;-webkit-mask-image:linear-gradient(90deg,#000 72%,rgba(0,0,0,.08));mask-image:linear-gradient(90deg,#000 72%,rgba(0,0,0,.08))}
.rfill.neg.clip{border-radius:0 7px 7px 0;-webkit-mask-image:linear-gradient(270deg,#000 72%,rgba(0,0,0,.08));mask-image:linear-gradient(270deg,#000 72%,rgba(0,0,0,.08))}
.rbar.on .rfill{transform:scaleX(1)}
.rbar.rtop .rfill{background:var(--series-1)}
.rbar.rbot .rfill{background:var(--gold-2)}
.rbrk{position:absolute;top:-4px;bottom:-4px;width:12px;opacity:0;transition:opacity .4s .5s;background:linear-gradient(115deg,transparent 0 30%,var(--surface) 30% 45%,transparent 45% 55%,var(--surface) 55% 70%,transparent 70%)}
.rbar.on .rbrk{opacity:1}
.rzero{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink-2);z-index:1}
.rval{text-align:right;font:800 17px/1 var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink);opacity:0;transform:translateX(-6px);transition:opacity .4s .25s,transform .4s .25s var(--ease);white-space:nowrap}
.rbar.on .rval{opacity:1;transform:none}
.rbar.rtop .rval{color:var(--series-1)}
.rbar.rbot .rval{color:var(--gold)}
.rbar.na .rval{color:var(--ink-3);font-weight:600}
.rna{display:flex;align-items:center;height:100%;padding:0 10px;border-radius:7px;border:1px dashed var(--line-2);font:italic 500 13px/1.2 var(--sans);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .4s}
.rbar.on .rna{opacity:1}
.rnote{grid-column:2/-1;font-size:12.5px;line-height:1.35;color:var(--ink-3);margin-top:4px}
.rnote.clipnote{font-style:italic}
.rfp{grid-column:1/-1;display:none;margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--ink-2)}
.rbar.open .rfp{display:block}
.rlegend{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;margin:10px 4px 0;font-size:12px;color:var(--ink-3)}
.rlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.rlegend .lt{background:var(--series-1)} .rlegend .lb{background:var(--gold-2)}
.rlegend .tip{margin-left:auto}
.rc-lines{display:grid;gap:8px}
.rc-lines p{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:15px;line-height:1.5;padding:11px 14px;border-radius:13px;background:var(--surface);border:1px solid var(--line);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.rc-lines p svg{flex:none;width:17px;height:17px;margin-top:3px}
.rc-lines p b{font-weight:800;margin-right:4px}
.rc-lines p.up{border-left:4px solid var(--series-1)} .rc-lines p.up svg,.rc-lines p.up b{color:var(--series-1)}
.rc-lines p.dn{border-left:4px solid var(--gold-2)} .rc-lines p.dn svg,.rc-lines p.dn b{color:var(--gold)}
.rc-lines p.say{color:var(--ink-2);background:var(--surface-2)} .rc-lines p.say svg,.rc-lines p.say b{color:var(--ink)}
.rc-lines.wait p:not(.on){opacity:0;transform:translateY(8px)}
@media (min-width:1000px){ .rgroups.n2{grid-template-columns:repeat(2,minmax(0,1fr))} .rgroups.n2 .rbar{--lw:140px;--vw:68px;column-gap:10px} .rgroups.n2 .rlab b{font-size:14.5px} }
@media (max-width:700px){
  .rgrp{padding:10px 8px 10px;border-radius:14px}
  .rbar{--lw:108px;--vw:58px;column-gap:8px;padding:5px 4px}
  .rlab b{font-size:13.5px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .rlab span{font-size:11px}
  .rtrack{height:22px}
  .rval{font-size:14.5px}
  .rna{font-size:11.5px;padding:0 7px}
  .rnote{font-size:11.5px}
  .rc-lines p{font-size:14px;padding:10px 12px}
  .rlegend .tip{margin-left:0;flex-basis:100%}
}
@media (max-width:560px){
  .rbar{--vw:64px;grid-template-columns:minmax(0,1fr) var(--vw);grid-template-areas:"lab lab" "trk val";row-gap:5px;column-gap:10px;padding:6px 6px}
  .rlab{grid-area:lab;display:flex;align-items:baseline;gap:7px;min-width:0}
  .rlab b{display:block;flex:none;max-width:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal;font-size:14px}
  .rlab span{flex:1;min-width:0;margin:0;font-size:12px}
  .rtrack{grid-area:trk;height:20px}
  .rval{grid-area:val;font-size:15px}
  .rnote{grid-column:1/-1;margin-top:0}
  .rgrp-h{margin:0 6px 4px}
}
@media (prefers-reduced-motion: reduce){ .rfill{transform:none} .rval,.rna,.rbrk{opacity:1;transform:none} .rc-lines.wait p:not(.on){opacity:1;transform:none} }
/* practice divider on the ratios map */
.pdiv{position:absolute;left:16px;right:16px;display:flex;align-items:center;gap:10px;font:800 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mc)}
.pdiv::before,.pdiv::after{content:"";flex:1;height:0;border-top:2px dashed color-mix(in srgb,var(--mc) 45%,transparent)}
.pdiv span{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pdiv small{font:500 11.5px/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-3)}

/* player bottom nav and captions */
.pnav{display:flex;align-items:center;gap:10px;padding:10px 16px 14px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(8px)}
.pnav .hint{flex:1;text-align:center;font-size:12.5px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnav .hint kbd{margin:0 2px}
.pnav .btn{min-width:110px}
.pnav .btn.next{min-width:140px}
.player.at-end .pnav{display:none}
.caps{display:none;align-items:flex-start;gap:12px;margin:0 16px 10px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--surface);font:500 15px/1.5 var(--sans);box-shadow:var(--shadow-lg);max-height:30vh;overflow:auto}
.player.listen .caps{display:flex}
.caps .cw{opacity:.55;transition:opacity .15s}
.caps .cw.on{opacity:1}
.caps .cw.now{opacity:1;color:var(--gold-2)}
.caps .cs{flex:none;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--surface) 18%,transparent);display:grid;place-items:center}
.caps .cs svg{width:14px;height:14px}
.caps .cs .bars{display:flex;gap:2px;align-items:flex-end;height:12px}
.caps .cs .bars i{width:3px;background:var(--gold-2);border-radius:1px;animation:eq .9s ease-in-out infinite}
.caps .cs .bars i:nth-child(2){animation-delay:.2s} .caps .cs .bars i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
.player.paused .caps .cs .bars i{animation:none;height:4px}
.listen-ctl{display:inline-flex;align-items:center;gap:6px}
.rate{font:700 12.5px/1 var(--sans);padding:0 8px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);appearance:none;-webkit-appearance:none;text-align:center;cursor:pointer}
.listen-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 10px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font:700 13px/1 var(--sans);color:var(--ink)}
.listen-btn svg{width:16px;height:16px}
.listen-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.listen-btn[aria-pressed="true"] .lbl::after{content:"ing"}

/* toasts, confetti, modal */
#toasts{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;background:var(--ink);color:var(--surface);border-radius:999px;padding:9px 16px;box-shadow:var(--shadow-lg);font:700 14px/1 var(--sans);animation:tin .3s var(--ease),tout .3s var(--ease) 2.1s forwards}
.toast .tx{color:var(--gold-2)}
.toast span:not(.tx){font-weight:500;opacity:.85}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-8px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:290}
.modal-bg{position:fixed;inset:0;z-index:250;background:rgba(8,8,8,.5);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;box-shadow:var(--shadow-lg);padding:22px 24px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.modal h3{font:800 20px/1.2 var(--sans);margin:0 0 4px;letter-spacing:-.01em}
.modal .sub{color:var(--ink-3);font-size:13.5px;margin:0 0 16px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-of-type{border-bottom:0}
.setting label{font-weight:600;font-size:14px}
.setting small{display:block;color:var(--ink-3);font-weight:400;font-size:12.5px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font:600 13px/1 var(--sans);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.m-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.danger{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.danger.armed{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty-state{padding:60px 20px;text-align:center;color:var(--ink-3)}

<script id="studio-data" type="application/json">{"built":"2026-10-06","lessons":[{"id":"acc-01","module":"acc","title":"How the three statements talk","mins":6,"blurb":"Masala Mills books more depreciation, profit falls and cash goes up. One loop explains it.","slides":[{"type":"hook","title":"Cash went up. Why?","text":"Masala Mills books &#8377;10 Cr more depreciation this year. Profit falls. Cash rises. Nobody sold anything.","visual":"<div class=\"kchips\"><span class=\"kchip dn\">Net income &darr;<\/span><span class=\"kchip up\">Cash &uarr;<\/span><span class=\"kchip dn\">PP&amp;E &darr;<\/span><\/div>","say":"Here is the puzzle for this lesson. Masala Mills, our snack and spice maker, books 10 crore more of depreciation. Profit falls, as you'd expect. But cash actually goes up. Nothing was sold, no loan was taken. By the end of this lesson you'll explain that in one sentence."},{"type":"explain","title":"One loop, three statements","text":"Net income ends the <b>income statement<\/b>, starts the <b>cash flow statement<\/b> and adds to retained earnings. The cash flow statement adds back non-cash charges, adjusts for working capital, and its change in cash sets balance sheet cash.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">IS<\/span><b>Net income<\/b><small>the bottom line<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">CFS<\/span><b>+ non-cash charges<\/b><small>reverse what used no cash<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">CFS<\/span><b>&plusmn; working capital<\/b><small>receivables, stock, payables<\/small><\/div><div class=\"fstep hl step-4\"><span class=\"fk\">CFS<\/span><b>Change in cash<\/b><\/div><div class=\"fstep step-5\"><span class=\"fk\">BS<\/span><b>Cash, retained earnings<\/b><small>both land here<\/small><\/div><\/div>","steps":["Net income is where the income statement ends","The cash flow statement starts there and reverses non-cash charges","Then it adjusts for working capital","That gives the change in cash","Cash and retained earnings land on the balance sheet"],"say":"Every walk-through question is this loop run once. Net income finishes the income statement. The cash flow statement picks it up, adds back charges that used no cash, adjusts for working capital, and lands on the change in cash. That cash goes to the balance sheet, and net income goes to retained earnings. Same route every time."},{"type":"sort","q":"Which statement does each item hit first?","buckets":["IS","CFS","BS"],"items":[["Depreciation expense","IS"],["Capex","CFS"],["Cash balance","BS"],["Revenue","IS"],["Dividends paid","CFS"],["Inventory","BS"]],"why":"Expenses and revenue start on the income statement. Capex and dividends are cash movements that never touch profit. Balances, like cash and inventory, live on the balance sheet.","say":"Quick warm up. Drag each item to the statement where it shows up first. Think about whether it is a flow through profit, a cash movement that never touches profit, or a balance that sits at a point in time."},{"type":"statements","title":"Walk it: ₹10 Cr more depreciation","text":"Tax rate 25%. Watch the tax line: that is where the cash comes from.","rows":{"is":[["Depreciation",10],["EBIT",-10],["Tax at 25%",-2.5],["Net income",-7.5]],"cfs":[["Net income",-7.5],["Add back depreciation",10],["Change in cash",2.5]],"bs":[["Cash",2.5],["PP&E",-10],["Retained earnings",-7.5]]},"order":[["is",0],["is",1],["is",2],["is",3],["cfs",0],["cfs",1],["cfs",2],["bs",0],["bs",1],["bs",2]],"check":"Assets -7.5 = Liabilities 0 + Equity -7.5","say":"Watch the three statements fill in. Depreciation up 10, EBIT down 10. Tax falls by 2.5 at 25 per cent, so net income is down 7.5. On the cash flow statement we start at minus 7.5 and add the 10 back, because no cash left. Cash is up 2.5. On the balance sheet, cash up 2.5, plant down 10, retained earnings down 7.5. It balances."},{"type":"mcq","q":"So why did cash rise when depreciation rose?","options":["Depreciation is added back, so cash rises by the full 10","The add-back only cancels the non-cash charge; the gain is the tax saved, 10 times 25% = 2.5","PP&E fell, so cash had to rise to balance","Cash does not change; the example is wrong"],"answer":1,"why":"The add-back is neutral. Depreciation cut taxable profit, so Masala Mills paid 2.5 less tax. That tax saving is the only real cash.","say":"Now the puzzle from the start. Why did cash rise? Pick the answer you would say in the room. Be careful: the add-back on its own does not create cash, it only reverses a charge that never used cash."},{"type":"explain","title":"The rule for any non-cash charge","text":"For a deductible non-cash charge of X at tax rate t: net income falls X(1 &minus; t), cash rises X &times; t. Amortisation, write-downs, PIK interest: same arithmetic, different balance sheet line.","visual":"<div class=\"fgrid\"><div class=\"fcard\"><div class=\"fname\">Net income<\/div><div class=\"fx\">&minus;X &times; (1 &minus; t)<\/div><div class=\"fnote\">the charge after tax<\/div><\/div><div class=\"fcard\"><div class=\"fname\">Cash<\/div><div class=\"fx\">+X &times; t<\/div><div class=\"fnote\">the tax saved<\/div><\/div><\/div><table class=\"t compact\"><thead><tr><th>Charge of 100<\/th><th>Other side of the entry<\/th><th>NI, cash at 25%<\/th><\/tr><\/thead><tbody><tr><td>Depreciation<\/td><td>PP&amp;E &minus;100<\/td><td>&minus;75, +25<\/td><\/tr><tr><td>Inventory write-down<\/td><td>Inventory &minus;100<\/td><td>&minus;75, +25<\/td><\/tr><tr><td>PIK interest<\/td><td>Debt +100<\/td><td>&minus;75, +25<\/td><\/tr><\/tbody><\/table>","say":"Learn the rule once and you never memorise another walk-through. Any deductible non-cash charge X cuts net income by X times one minus the tax rate, and lifts cash by X times the tax rate. Depreciation, an inventory write-down, PIK interest: the only thing that changes is which balance sheet line takes the hit."},{"type":"number","q":"Masala Mills writes down ₹100 Cr of stale inventory. Tax rate 25%. Change in cash, in crore?","answer":25,"tol":0.5,"unit":"crore","why":"Net income falls 75, the 100 is added back, so cash is up 25. That is the tax saved: 100 times 25%.","say":"Your turn with the rule. Masala Mills finds 100 crore of stale inventory and writes it down. Tax rate 25 per cent. By how much does cash change? Type the number in crore."},{"type":"statements","title":"Walk it: ₹100 Cr inventory write-down","text":"Same shape as depreciation. Only the balance sheet line changes.","rows":{"is":[["COGS (write-down)",100],["EBIT",-100],["Tax at 25%",-25],["Net income",-75]],"cfs":[["Net income",-75],["Add back write-down",100],["Change in cash",25]],"bs":[["Cash",25],["Inventory",-100],["Retained earnings",-75]]},"order":[["is",0],["is",1],["is",2],["is",3],["cfs",0],["cfs",1],["cfs",2],["bs",0],["bs",1],["bs",2]],"check":"Assets -75 = Liabilities 0 + Equity -75","say":"Here it is on all three statements. The write-down runs through cost of goods sold, EBIT falls 100, tax falls 25, net income falls 75. Add the 100 back and cash is up 25. On the balance sheet inventory is down 100, cash up 25, so assets are down 75, matching retained earnings down 75."},{"type":"mcq","q":"Masala Mills impairs ₹100 Cr of goodwill. The tax office allows no deduction. What happens to cash?","options":["Rises 25","Rises 100","Unchanged","Falls 100"],"answer":2,"why":"No deduction, no tax saved, no cash effect. Net income falls the full 100 and goodwill falls 100. The add-back exactly cancels the charge.","say":"One twist. Masala Mills impairs 100 crore of goodwill, and this time the tax office gives no deduction. What happens to cash? Think about where the cash came from in the earlier examples."},{"type":"explain","title":"When tax says 'not yet'","text":"Cash rises only when the deduction is allowed <b>now<\/b>. If the tax office allows it later, the saving sits as a deferred tax asset and cash is flat this quarter. Never deductible: cash never moves.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>Deductible now<\/h4><ul><li>Net income &minus;75<\/li><li>Cash +25<\/li><\/ul><\/div><div class=\"cmp-c c\"><h4>Deductible later<\/h4><ul><li>Net income &minus;75<\/li><li>Cash 0, DTA +25<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Never deductible<\/h4><ul><li>Net income &minus;100<\/li><li>Cash 0<\/li><\/ul><\/div><\/div><p class=\"ind\"><b>India:<\/b> at the 25.17% rate, $10 of depreciation gives net income &minus;7.48 and cash +2.52.<\/p>","say":"Three cases, one rule. Deductible now: cash rises by the tax saved. Deductible later, which is common for inventory write-downs until the goods are actually scrapped: net income still falls, but the saving parks in a deferred tax asset and cash is flat for now. Never deductible, like most goodwill impairments: cash never moves."},{"type":"reveal","q":"How would a $10 increase in depreciation flow through the financial statements?","tag":"Your miss","a":"<p>At a 30% tax rate. <b>IS:<\/b> EBIT &minus;10, tax &minus;3, net income &minus;7. <b>CFS:<\/b> start at &minus;7, add back the 10 of non-cash depreciation, cash +3. <b>BS:<\/b> PP&amp;E &minus;10 and cash +3, so assets &minus;7; retained earnings &minus;7. Balanced.<\/p><p>Then the line that shows you understand it: cash rises because tax fell. The add-back only cancels the charge; the +3 is the tax shield, 10 &times; 30%. If the charge is not deductible, cash does not move.<\/p>","say":"Boss question one, and it is one you missed. How would a 10 dollar increase in depreciation flow through the financial statements? Say the whole walk out loud, income statement, cash flow, balance sheet, and finish with why cash went up. Then reveal."},{"type":"reveal","q":"How would a $100 inventory write-down impact the three financial statements?","tag":"Your miss","a":"<p>At 30% tax. <b>IS:<\/b> the write-down runs through COGS, EBIT &minus;100, net income &minus;70. <b>CFS:<\/b> net income &minus;70, add back the non-cash 100, cash +30. <b>BS:<\/b> inventory &minus;100, cash +30, assets &minus;70; retained earnings &minus;70.<\/p><p>Same X(1 &minus; t) and X &times; t pattern as depreciation, just hitting inventory instead of PP&amp;E. Nuance: inventory losses are often deductible only once realised, so until then the 30 sits in a DTA and cash is flat.<\/p>","say":"Second one you missed. How would a 100 dollar inventory write-down hit the three statements? Use the rule, name the balance sheet line, and add the one nuance about when the tax office actually allows the deduction. Reveal when you have said it."},{"type":"recap","points":["Net income links all three: it starts the CFS and adds to retained earnings","A deductible non-cash charge X: net income down X(1 - t), cash up X times t","No tax deduction, no cash effect; deduction later, a DTA for now"],"say":"Three things to keep. Net income is the hinge between all three statements. For any deductible non-cash charge, net income falls by the charge after tax and cash rises by the tax saved. And if there is no deduction, there is no cash effect. Next lesson we walk bigger changes through: borrowing, buying plant, and interest that hides inside a factory."}]},{"id":"acc-02","module":"acc","title":"Walk anything through","mins":7,"blurb":"Masala Mills borrows, builds a roasting line and hides interest inside a factory. Follow the cash and the tax.","slides":[{"type":"hook","title":"Borrow 100, spend 50, and profit does not move","text":"Masala Mills raises &#8377;100 Cr of debt at 5% and spends &#8377;50 Cr on a roasting line (5-year life). Day one, profit is untouched. A year later, profit and cash move in opposite directions.","say":"New puzzle. Masala Mills borrows 100 crore at 5 per cent and spends 50 of it on a new roasting line that will last five years. On day one, profit does not move at all. One year later, profit falls and cash does something different. Let's walk it, step by step."},{"type":"statements","title":"Day one: two swaps, no profit","text":"Borrowing swaps cash for debt. Buying plant swaps cash for an asset. The income statement sits out.","rows":{"is":[["Net income",0]],"cfs":[["Debt raised (financing)",100],["Capex (investing)",-50],["Change in cash",50]],"bs":[["Cash",50],["PP&E",50],["Debt",100],["Retained earnings",0]]},"order":[["is",0],["cfs",0],["cfs",1],["cfs",2],["bs",0],["bs",1],["bs",2],["bs",3]],"check":"Assets +100 = Liabilities +100 + Equity 0","say":"Day one. Nothing happens on the income statement, because borrowing money and buying a machine are both swaps. Cash flow: 100 comes in from financing, 50 goes out as capex, so cash is up 50. Balance sheet: cash up 50, plant up 50, debt up 100. Both sides grew by 100. Still balanced."},{"type":"mcq","q":"Day one, what happens to net income?","options":["Falls by the ₹5 Cr of interest","Falls by ₹10 Cr of depreciation","Nothing: both are balance sheet swaps","Rises, because cash went up"],"answer":2,"why":"No interest has accrued yet and the machine has not been used. Raising debt and buying an asset never touch profit on the day they happen.","say":"Quick check before year one. On the day Masala Mills borrows and buys, what happens to net income? Think about whether anything has been earned or used up yet."},{"type":"statements","title":"Year one at 25% tax","text":"Depreciation 10 (50 over 5 years) and interest 5 (5% of 100). Changes during the year only.","rows":{"is":[["Depreciation",10],["Interest",5],["Pre-tax profit",-15],["Tax at 25%",-3.75],["Net income",-11.25]],"cfs":[["Net income",-11.25],["Add back depreciation",10],["Change in cash",-1.25]],"bs":[["Cash",-1.25],["PP&E",-10],["Retained earnings",-11.25]]},"order":[["is",0],["is",1],["is",2],["is",3],["is",4],["cfs",0],["cfs",1],["cfs",2],["bs",0],["bs",1],["bs",2]],"check":"Assets -11.25 = Liabilities 0 + Equity -11.25","say":"Year one. Depreciation of 10 and interest of 5 cut pre-tax profit by 15. Tax falls 3.75, so net income is down 11.25. On the cash flow statement, add the 10 of depreciation back: cash is down 1.25. The interest was real cash, 5 out, and the tax saved was only 3.75. Balance sheet: cash down 1.25, plant down 10, retained earnings down 11.25."},{"type":"mcq","q":"Same deal at the Red Book's 40% tax rate. Year one change in cash?","options":["-1.25","+1","+10","-9"],"answer":1,"why":"Pre-tax profit falls 15, net income falls 9 (15 times 60%), add back 10: cash is +1. At 40% the tax saved, 6, beats the cash interest of 5.","say":"Now the version the book asks, at a 40 per cent tax rate. Same debt, same machine, same interest. What is the change in cash in year one? Work it through: net income first, then the add-back."},{"type":"explain","title":"Why the sign flipped","text":"Cash in year one = tax saved on the 15 of new charges, minus the 5 of cash interest. The tax rate decides the sign. Interest runs on the full 100: drawn day one, no repayment, so no averaging.","visual":"<table class=\"t compact\"><thead><tr><th>Tax rate<\/th><th>Tax saved (15 &times; t)<\/th><th>Cash interest<\/th><th>Cash<\/th><\/tr><\/thead><tbody><tr><td>25%<\/td><td>3.75<\/td><td>&minus;5<\/td><td class=\"neg\">&minus;1.25<\/td><\/tr><tr><td>40%<\/td><td>6.00<\/td><td>&minus;5<\/td><td class=\"pos\">+1.00<\/td><\/tr><\/tbody><\/table><p class=\"upd\"><b>Updated:<\/b> 40% is a pre-2018 US rate. Today's US federal rate is 21%, India's concessional rate 25.17%. State the rate you are using.<\/p>","say":"Here is why the answer flips. Cash in year one is the tax saved on the new charges, minus the interest actually paid. At 25 per cent the saving is 3.75, less than the 5 of interest, so cash falls. At 40 per cent the saving is 6, so cash rises. And the interest runs on the full 100: drawn on day one, nothing repaid."},{"type":"explain","title":"Capitalised interest: the cost that hides in CWIP","text":"Interest on a loan funding a plant under construction is added to the asset (Ind AS 23), not expensed. Masala Mills' &#8377;9 Cr of build-phase interest sits in capital work in progress and returns later as depreciation.","visual":"<table class=\"t compact\"><thead><tr><th>Where<\/th><th>Normal interest<\/th><th>Capitalised<\/th><\/tr><\/thead><tbody><tr><td>P&amp;L during the build<\/td><td>Interest &minus;9<\/td><td>Nothing<\/td><\/tr><tr><td>Balance sheet<\/td><td>Equity lower<\/td><td>CWIP +9<\/td><\/tr><tr><td>Plant opens<\/td><td>Nothing more<\/td><td>Extra depreciation<\/td><\/tr><\/tbody><\/table><p class=\"trap\"><b>Trap:<\/b> during a build, EBIT and interest cover look flattered against a peer whose plant already runs.<\/p>","say":"Now the hidden one. While Masala Mills is building its new plant, the interest on the construction loan does not go to the income statement. Ind AS 23 adds it to the cost of the asset, inside capital work in progress. Nine crore of interest, zero expense for now. It comes back later as depreciation. So mid-build, profit and interest cover look better than they really are."},{"type":"mcq","q":"Masala Mills capitalises ₹9 Cr of interest on the plant under construction. Where does the cash go on the cash flow statement?","options":["Operating outflow, like any interest","Investing outflow, as part of capex","Financing outflow","No cash leaves"],"answer":1,"why":"The cash still leaves, but it is part of the asset's cost, so it sits in investing with the rest of the capex. No add-back is needed because it never hit net income.","say":"The cash for that interest still leaves the company. Where does it show up on the cash flow statement? Think about which bucket the cost itself landed in."},{"type":"explain","title":"Change the life, not the past","text":"A &#8377;100 machine, 5-year life, straight line. After two years Masala Mills decides it will last 3 years longer. Book value 60, now 6 years left, so depreciation drops from 20 to 10. Prospective only (Ind AS 8): no restatement.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">BV<\/span><b>&#8377;60<\/b><small>100 &minus; 2 &times; 20<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Life<\/span><b>6 years<\/b><small>3 left + 3 more<\/small><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">Dep<\/span><b>&#8377;10 a year<\/b><small>down from 20<\/small><\/div><\/div><p class=\"ind\"><b>India:<\/b> tax depreciation runs on WDV blocks, so a book-life change moves only the DTL; cash is flat.<\/p>","steps":["Book value after two years is 60","Six years remain, not three","Depreciation halves, from today onward"],"say":"Last mechanic. A 100 rupee machine on a five year life has a book value of 60 after two years. Masala Mills now thinks it will last three years longer, so six years remain. Spread 60 over 6: depreciation drops from 20 to 10. This is a change in estimate, so it applies going forward. You never restate the two years already reported."},{"type":"number","q":"After two years the ₹100 machine (5-year life) gets 3 extra years. New annual depreciation, in rupees?","answer":10,"tol":0.1,"unit":"rupees","why":"Book value 100 minus 40 = 60. Remaining life 3 + 3 = 6 years. 60 divided by 6 = 10 a year.","say":"Work it yourself. The 100 rupee machine, five year life, two years gone, and now three extra years. What is the new annual depreciation charge? Type the number."},{"type":"reveal","q":"A company issues $100m of debt and spends $50m on PP&E: 5% interest, 5-year straight line, 40% tax. Walk through the initial year and the end of year 1.","tag":"Your miss","a":"<p><b>Year 0:<\/b> balance sheet only. Cash +50 (debt in 100, capex out 50), PP&amp;E +50, debt +100. No income statement effect.<\/p><p><b>Year 1:<\/b> depreciation 10 and interest 5 cut pre-tax profit by 15; at 40% net income falls 9. CFS: &minus;9 plus the 10 add-back, cash +1. BS: PP&amp;E &minus;10, cash +1, retained earnings &minus;9.<\/p><p>Nuance: interest runs on the full 100 (drawn day one, no paydown); a fuller model wo
