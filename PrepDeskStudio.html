all>new and replacement plant<\/small><\/div><div class=\"fstep hl2 step-3\"><span class=\"fk\">Less tax<\/span><b>&minus;&#8377;22.5 Cr<\/b><small>25% of 90<\/small><\/div><div class=\"fstep step-4\"><span class=\"fk\">Cash left<\/span><b>&#8377;77.5 Cr<\/b><small>for fixed charges<\/small><\/div><div class=\"fstep hl step-5\"><span class=\"fk\">FCCR<\/span><b>1.55x<\/b><small>77.5 &divide; (20 + 30 + 0)<\/small><\/div><\/div>","steps":["Start from 150 crore of EBITDA","Take off 50 crore of capex","Take off 22.5 crore of tax","77.5 crore is left","Divide by interest 20, repayments 30, leases 0"],"say":"FCCR is the strictest. Start with Masala Mills' EBITDA of 150. Take off 50 of capex and 22.5 of tax: 77.5 is left. Divide by every fixed charge: 20 of interest, 30 of repayments, and lease payments, which are zero here. 77.5 over 50 is 1.55 times. Below 1, the company needs lenders to refinance."},{"type":"ratio","id":"r-fccr","say":"Again only two bars. Airtel reaches 0.86 times: its 57 per cent EBITDA margin throws off huge cash, but capex and refinanced loans keep it under 1. Tata Steel sits at 0.46, as capex, tax and refinanced repayments outrun its EBITDA. Below 1 is fine only if lenders keep refinancing, as they do for Airtel."},{"type":"number","q":"Masala Mills FY27: borrowings &#8377;300 Cr, lease liabilities &#8377;40 Cr, cash &#8377;60 Cr, EBITDA &#8377;200 Cr. Net debt to EBITDA?","answer":1.4,"tol":0.02,"unit":"x","why":"Net debt = 300 + 40 &minus; 60 = 280. 280 &divide; 200 = 1.4x. Lease liabilities count as debt.","say":"Questions now. Masala Mills next year: 300 of borrowings, 40 of lease liabilities, 60 of cash, and 200 of EBITDA. What's net debt to EBITDA? Watch the leases."},{"type":"mcq","q":"Maruti covers its interest about 62 times, the best of the eight. What does that tell a lender?","options":["It could safely take on 60 times more debt","Its operating margin is the highest of the eight","Little: it has almost no borrowings, so the interest bill is tiny","Its DSCR must also be above 60x"],"answer":2,"why":"Maruti has no borrowings, so the denominator is tiny. The coverage tests bite for borrowers near 3x, such as Airtel and Tata Steel.","say":"Maruti's interest cover is about 62 times, the highest of the eight. What should a lender actually take from that number?"},{"type":"number","q":"A Masala Mills plant loan year: net profit &#8377;50 Cr, depreciation &#8377;30 Cr, interest &#8377;20 Cr, long-term loan repayments &#8377;60 Cr. DSCR?","answer":1.25,"tol":0.01,"unit":"x","why":"Cash earnings 50 + 30 + 20 = 100. Debt service 20 + 60 = 80. 100 &divide; 80 = 1.25x.","say":"Calculate a DSCR. Net profit 50, depreciation 30, interest 20, and 60 of loan repayments due this year. Remember interest goes on both top and bottom."},{"type":"sort","q":"Leverage or coverage? Sort each ratio into its family","buckets":["Leverage","Coverage"],"items":[["Net debt to EBITDA","Leverage"],["Debt to equity","Leverage"],["Interest cover","Coverage"],["DSCR","Coverage"],["FCCR","Coverage"]],"why":"Leverage ratios size the debt pile. Coverage ratios test whether this year's earnings pay this year's interest, repayments and other fixed charges.","say":"Sort the five ratios from this lesson. Does each one size the debt pile, or test whether this year can pay?"},{"type":"order","q":"Rank by net debt to EBITDA, highest first","items":["Tata Steel","Airtel","TCS","DLF"],"why":"Tata Steel 2.4x, Airtel 1.3x, TCS &minus;0.5x, DLF &minus;5.5x. Below zero means more cash than debt.","say":"Order these four by net debt to EBITDA, most indebted first. Remember that some of them hold more cash than debt."},{"type":"mcq","q":"Tata Steel's DSCR is 0.97x. What does below 1x mean?","options":["Part of this year's interest and repayments needs new borrowing","It has defaulted on its loans","Its interest cover is below 1x","It holds more cash than debt"],"answer":0,"why":"Cash earnings fall just short of interest plus repayments, so some must be refinanced. Its interest cover is still about 3x, and repayments include loans it refinanced.","say":"Last one. Tata Steel's DSCR is 0.97 times. What does a number just below 1 tell you, and what doesn't it tell you?"},{"type":"reveal","q":"What ratios would you look at to perform credit analysis?","tag":"Your miss","a":"<p>Two families. <b>Leverage<\/b> asks how big the debt is: net debt &divide; EBITDA, debt &divide; equity, debt &divide; capital. <b>Coverage<\/b> asks if this year's cash pays this year's charges: EBIT or EBITDA &divide; interest, DSCR, FCCR. Add liquidity: current and quick ratio.<\/p><p>Read them together and against how steady the cash flow is. Airtel runs about 1.3x net debt to EBITDA with 3x interest cover; Tata Steel 2.4x with a DSCR just under 1x, so it relies on refinancing.<\/p>","say":"Boss question, one you missed. What ratios would you look at to perform credit analysis? Group them into families, then give a real example. Say it, then reveal."},{"type":"reveal","q":"How do you calculate the debt service coverage ratio (DSCR), and what does it measure?","tag":"Your miss","a":"<p>DSCR = (net profit + depreciation + interest) &divide; (interest + principal repayments due in the year). Project lenders often put cash flow available for debt service on top instead.<\/p><p>It tests whether a year's cash earnings pay that year's interest and installments together. Masala Mills: 127.5 &divide; 50 = 2.55x. Below 1x, repayments need new borrowing, as at Tata Steel (0.97x). It is the covenant Indian project lenders watch, so read the loan's own definition.<\/p>","say":"Second boss question, also a miss. How do you calculate DSCR and what does it measure? Give the formula, a number, and what below 1 means."},{"type":"recap","points":["Leverage ratios size the debt pile (net debt to EBITDA, debt to equity); coverage ratios test this year's payments","Interest cover ignores repayments; DSCR adds them, and FCCR also takes off capex and tax and counts lease payments","Huge cover at a debt-free company (Maruti 62x) is a tiny denominator; the tests bite for borrowers like Airtel and Tata Steel"],"say":"Three takeaways. Leverage ratios size the debt, coverage ratios test whether this year can pay. Interest cover ignores repayments, DSCR adds them, and FCCR goes further with capex, tax and leases. And a huge cover at a debt-free company is just a tiny denominator. Next: what's left from each rupee of sales."}]},{"id":"rat-04","module":"rat","title":"Profitability: what is left from each rupee","mins":8,"blurb":"DLF keeps 54 paise of every rupee of sales while its operating margin is mid-table. Learn the three margins and how to walk between them.","slides":[{"type":"hook","title":"54 paise of profit from every rupee of sales?","text":"DLF keeps about 54 paise of net profit per rupee of revenue. Airtel keeps about 13. Yet Airtel's operating margin is the highest of the eight and DLF's sits mid-table. Where did DLF's extra profit come from?","visual":"<div class=\"kchips\"><span class=\"kchip up\">DLF net margin 54%<\/span><span class=\"kchip dn\">DLF EBITDA margin 18%<\/span><span class=\"kchip up\">Airtel EBITDA margin 57%<\/span><\/div>","say":"Last puzzle in this run. DLF keeps about 54 paise of net profit from every rupee of revenue. Airtel keeps about 13. But on operating margin, Airtel is the best of the eight, and DLF is only fifth. Profit can't appear from nowhere, so where did DLF's extra come from? Let's learn the three margins and find out."},{"type":"explain","title":"Follow one rupee down the P&L","text":"Every margin is a profit line divided by revenue. Gross margin takes off materials. EBITDA margin takes off all operating costs. Net margin also takes off depreciation, interest and tax.","visual":"<div class=\"minichart\" style=\"--max:100\"><div class=\"mc-legend\"><span><i class=\"mc-a\"><\/i>&#8377; left from every &#8377;100 of sales<\/span><\/div><div class=\"mc-plot\"><div class=\"mc-group step-1\"><div class=\"mc-col mc-a\" style=\"--v:100\"><em>100<\/em><\/div><span class=\"mc-x\">Revenue<\/span><\/div><div class=\"mc-group step-2\"><div class=\"mc-col mc-a\" style=\"--v:40\"><em>40<\/em><\/div><span class=\"mc-x\">Gross profit<\/span><\/div><div class=\"mc-group step-3\"><div class=\"mc-col mc-a\" style=\"--v:15\"><em>15<\/em><\/div><span class=\"mc-x\">EBITDA<\/span><\/div><div class=\"mc-group step-4\"><div class=\"mc-col mc-a\" style=\"--v:6.75\"><em>6.75<\/em><\/div><span class=\"mc-x\">Net profit<\/span><\/div><\/div><div class=\"mc-xpad\"><\/div><\/div>","steps":["Masala Mills sells 100 rupees of snacks","40 is left after materials","15 is left after all operating costs","6.75 is left for owners"],"say":"Follow 100 rupees of Masala Mills' sales down the income statement. After paying for chillies, flour, oil and packets, 40 is left. After salaries, ads and power, 15 is left. After depreciation, interest and tax, owners keep 6.75. Each of those, divided by revenue, is a margin: gross, EBITDA and net. Now each one in turn."},{"type":"explain","title":"Gross margin: what is left after materials","text":"Revenue minus material cost, divided by revenue. It shows pricing power over raw inputs. Compare it only within an industry, because each company decides which costs count as materials.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Revenue<\/span><b>&#8377;1,000 Cr<\/b><small>snacks and spices<\/small><\/div><div class=\"fstep hl2 step-2\"><span class=\"fk\">Materials<\/span><b>&minus;&#8377;600 Cr<\/b><small>chillies, flour, oil, packets<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">Gross profit<\/span><b>&#8377;400 Cr<\/b><small>1,000 &minus; 600<\/small><\/div><div class=\"fstep hl step-4\"><span class=\"fk\">Gross margin<\/span><b>40%<\/b><small>400 &divide; 1,000<\/small><\/div><\/div>","steps":["Revenue is 1,000 crore","Materials cost 600 crore","Gross profit is 400 crore","400 over 1,000 is 40%"],"say":"Start at the top. Masala Mills sells 1,000 crore of snacks and spices. Chillies, flour, oil and packets cost 600. What's left, 400, is gross profit, and 400 over 1,000 is a 40 per cent gross margin. One warning before the chart: each company chooses which costs count as materials, so compare gross margins only inside an industry."},{"type":"ratio","id":"r-gm","say":"Sun Pharma leads at 80 per cent: medicines cost little to make next to their price. Tata Steel looks high at 60, but only because power, fuel and processing sit outside materials. That's the warning in action. At the bottom, DMart at 15, reselling branded goods at a thin markup, and Maruti at 28, since bought-in parts take 72 per cent of sales. TCS and Airtel have no material cost, so they're left out."},{"type":"explain","title":"EBITDA margin: profit from running the business","text":"Take off every operating cost: materials, staff, ads, power. Divide what is left by revenue. It sits before depreciation, interest and tax, so companies with different debt and plant compare more fairly.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Gross profit<\/span><b>&#8377;400 Cr<\/b><small>after materials<\/small><\/div><div class=\"fstep hl2 step-2\"><span class=\"fk\">Other costs<\/span><b>&minus;&#8377;250 Cr<\/b><small>staff, ads, power, freight<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">EBITDA<\/span><b>&#8377;150 Cr<\/b><small>400 &minus; 250<\/small><\/div><div class=\"fstep hl step-4\"><span class=\"fk\">EBITDA margin<\/span><b>15%<\/b><small>150 &divide; 1,000<\/small><\/div><\/div><p class=\"key\">In this data EBITDA leaves out other income, such as treasury gains.<\/p>","steps":["Start from 400 crore of gross profit","Take off 250 crore of other operating costs","EBITDA is 150 crore","150 over 1,000 is 15%"],"say":"Next, take off everything else it costs to run the business: salaries, advertising, power and freight. For Masala Mills that's 250 crore, leaving EBITDA of 150. 150 over 1,000 is a 15 per cent EBITDA margin. Interest, tax and depreciation haven't come off yet, so a debt-free company and a borrower compare more fairly. Other income, like treasury gains, stays out too."},{"type":"ratio","id":"r-ebitdam","say":"Airtel is way ahead at 57 per cent. Its network costs are mostly fixed, so each extra user adds almost pure profit. Sun Pharma is next at 28, on rich specialty drug margins. At the bottom, Maruti at 12, assembling cars from bought parts in a price-sensitive market, and DMart at 7.5, keeping prices low to pull shoppers in. Across industries, 57 for telecom and 8 for retail can both be healthy."},{"type":"explain","title":"Net margin: what owners keep","text":"Net profit to owners divided by revenue: what is left after depreciation, interest and tax. It mixes operations, debt and tax in one number, so walk back up to EBITDA margin before judging.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">EBITDA<\/span><b>&#8377;150 Cr<\/b><small>15% margin<\/small><\/div><div class=\"fstep hl2 step-2\"><span class=\"fk\">Depreciation<\/span><b>&minus;&#8377;40 Cr<\/b><small>plant wears out<\/small><\/div><div class=\"fstep hl2 step-3\"><span class=\"fk\">Interest<\/span><b>&minus;&#8377;20 Cr<\/b><small>on &#8377;250 Cr debt<\/small><\/div><div class=\"fstep hl2 step-4\"><span class=\"fk\">Tax<\/span><b>&minus;&#8377;22.5 Cr<\/b><small>25% of 90<\/small><\/div><div class=\"fstep hl step-5\"><span class=\"fk\">Net profit<\/span><b>&#8377;67.5 Cr<\/b><small>6.75% margin<\/small><\/div><\/div>","steps":["Start from 150 crore of EBITDA","Take off 40 crore of depreciation","Take off 20 crore of interest","Tax at 25% on 90 is 22.5 crore","Owners keep 67.5 crore, 6.75% of sales"],"say":"Last step down. From EBITDA of 150, take 40 of depreciation and 20 of interest. Tax at 25 per cent on the 90 that's left is 22.5. Owners keep 67.5, a net margin of 6.75 per cent. Notice that the whole drop from 15 to 6.75 came from plant, debt and tax, not from running the business. That's why you walk back up before judging."},{"type":"ratio","id":"r-npm","say":"DLF tops the chart at 54 per cent, but read the note: its profit includes its share of a rental joint venture, which never shows in revenue. That solves our puzzle. Sun Pharma keeps about 20 and TCS 18. At the bottom, Tata Steel at under 5, where interest, depreciation and tax eat about 70 per cent of EBITDA, and DMart at about 4, thin by design."},{"type":"number","q":"Masala Mills FY27: revenue &#8377;1,200 Cr, material cost &#8377;780 Cr. Gross margin, in per cent?","answer":35,"tol":0.1,"unit":"%","why":"Gross profit 1,200 &minus; 780 = 420. 420 &divide; 1,200 = 35%.","say":"Questions now. Next year Masala Mills sells 1,200 crore and spends 780 on materials. What's the gross margin, in per cent?"},{"type":"number","q":"Same year: EBITDA &#8377;180 Cr, depreciation &#8377;45 Cr, interest &#8377;15 Cr, tax 25%. Net margin on &#8377;1,200 Cr of revenue, in per cent?","answer":7.5,"tol":0.05,"unit":"%","why":"Pre-tax profit 180 &minus; 45 &minus; 15 = 120. Tax 30. Net profit 90. 90 &divide; 1,200 = 7.5%.","say":"Keep going down the same year. EBITDA of 180, depreciation 45, interest 15, tax at 25 per cent. What net margin does that leave on 1,200 of revenue?"},{"type":"mcq","q":"Airtel's EBITDA margin is 57%, its net margin about 13%. What eats most of the gap?","options":["Depreciation and interest on a heavy, debt-funded network","Material costs","Discounts to subscribers","Other income"],"answer":0,"why":"Airtel carries huge towers, fibre and spectrum (asset turnover 0.4x), and interest takes about a third of its operating profit (cover 3.1x). Tax takes more after that.","say":"Airtel earns 57 per cent at the EBITDA line but keeps only about 13 at the bottom. Think back to its assets and its debt. What eats the gap?"},{"type":"mcq","q":"Only one company's net margin is higher than its EBITDA margin. Which, and why?","options":["Sun Pharma: a one-off forex gain","HUL: the ice cream demerger","DLF: its profit includes its rental joint venture, which is not in revenue","TCS: it has no debt"],"answer":2,"why":"DLF: 54% net against 18% EBITDA. Its share of the rental joint venture's profit counts in net profit but never in revenue or EBITDA.","say":"Normally net margin sits well below EBITDA margin. One of the eight breaks the rule. Which one, and why? This is our opening puzzle."},{"type":"order","q":"Rank by EBITDA margin, highest first","items":["Airtel","HUL","Tata Steel","DMart"],"why":"Airtel 57%, HUL 23%, Tata Steel 15%, DMart 7.5%. Fixed network costs at the top, price-led retail at the bottom.","say":"Order these four by EBITDA margin, the fattest first. Think about who has mostly fixed costs, who has strong brands, and who competes on price."},{"type":"sort","q":"Which margin does each Masala Mills cost come off first?","buckets":["Gross","EBITDA","Net"],"items":[["Chillies and flour","Gross"],["Packaging film","Gross"],["Staff salaries","EBITDA"],["TV advertising","EBITDA"],["Depreciation on roasters","Net"],["Interest on loans","Net"],["Income tax","Net"]],"why":"Materials hit gross margin first. Other operating costs such as staff and ads come off before EBITDA. Depreciation, interest and tax come off only on the way to net profit.","say":"Sort these Masala Mills costs. Which margin is the first one each cost reduces: gross, EBITDA or net? Picture the rupee falling down the income statement."},{"type":"reveal","q":"Why compare EBITDA margins within an industry and not across industries?","tag":"","a":"<p>Margins follow the business model. Airtel's network costs are mostly fixed, so it earns a 57% EBITDA margin; DMart keeps prices low and earns 7.5%. Both can be healthy, because DMart turns its assets about six times faster.<\/p><p>Gross margin is worse across industries: each company decides what counts as material cost. Tata Steel's 60% looks rich only because power, fuel and processing sit outside materials. Compare within a peer set, then link margin to turnover through DuPont.<\/p>","say":"Boss question. Why do you compare EBITDA margins within an industry and not across industries? Use two real companies in your answer. Say it, then reveal."},{"type":"reveal","q":"Why walk back from net margin to EBITDA margin before judging a company?","tag":"","a":"<p>Net margin mixes operations, financing, tax and one-offs. Tata Steel's 4.6% net margin sits on a 14.8% EBITDA margin: depreciation, interest and tax eat about 70% of EBITDA. DLF's 54% includes its rental joint venture's profit, which never shows in revenue.<\/p><p>Walk up: gross margin for pricing over inputs, EBITDA margin for operations, then depreciation (capital intensity), interest (debt), tax and one-offs. Fix the diagnosis at the level where the problem sits.<\/p>","say":"Last boss question. Why should you walk back from net margin to EBITDA margin before you judge a company? Use Tata Steel and DLF as your examples."},{"type":"recap","points":["Every margin is a profit line over revenue: gross takes off materials, EBITDA all operating costs, net also depreciation, interest and tax","Compare margins within an industry: Airtel's 57% and DMart's 7.5% EBITDA margins can both be healthy","Walk back up from net margin before judging: Tata Steel loses about 70% of EBITDA below the line; DLF's 54% includes joint venture profit"],"say":"Three things to keep. Each margin is a profit line over revenue, and each step down takes off another layer of cost. Compare margins inside an industry, because 57 per cent for telecom and 8 for retail can both be healthy. And walk back up from net margin before you judge. That's the four ratio families done."}]},{"id":"rat-05","module":"rat","title":"Returns and DuPont","mins":9,"blurb":"TCS earns 46% on equity and Airtel 18%. One split shows which return comes from the business and which from debt.","slides":[{"type":"hook","title":"46% or 18%: which return is real?","text":"TCS earns 46% on shareholders' money. Airtel earns 18%. One number comes from the business. The other leans on borrowed money. By the end you'll tell which.","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>TCS<\/h4><ul><li>Return on equity 46%<\/li><li>Almost no borrowings<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>Airtel<\/h4><ul><li>Return on equity 18%<\/li><li>Debt about equal to equity<\/li><\/ul><\/div><\/div>","say":"Returns are the ratios interviewers love, because they tell you if a business is any good. TCS earns 46 per cent on shareholders' money, Airtel 18. But a return can come from the business itself or from borrowing. This lesson teaches four return ratios and one split, called DuPont, that tells the two apart."},{"type":"explain","title":"ROCE: return on all the capital","text":"Take profit before anyone is paid: profit before tax plus interest. Divide by all the money in the business, from shareholders and lenders. Masala Mills earns <b>14.5%<\/b>.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"ROCE for Masala Mills: profit before tax 120 plus interest 40, over equity 600 plus debt 500, equals 14.5 per cent\"><g class=\"step-1\"><rect x=\"78\" y=\"8\" width=\"138\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"148\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Profit before tax<\/text><text x=\"148\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">120<\/text><text x=\"230\" y=\"37\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"243\" y=\"8\" width=\"79\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"282\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Interest<\/text><text x=\"282\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">40<\/text><\/g><line x1=\"70\" y1=\"69\" x2=\"330\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"128\" y=\"84\" width=\"66\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"161\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Equity<\/text><text x=\"161\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">600<\/text><text x=\"207\" y=\"113\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"220\" y=\"84\" width=\"52\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"246\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Debt<\/text><text x=\"246\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">500<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">14.5%<\/text><\/g><\/svg><figcaption>Masala Mills FY26, &#8377; Cr. The top line is EBIT: 160 over 1,100 of capital.<\/figcaption><\/figure>","steps":["Top: profit before tax plus interest, which is 160 of EBIT","Bottom: every rupee of capital, 1,100","ROCE is 14.5%"],"say":"Start with ROCE, return on capital employed. On top, profit before tax plus interest, so profit before either lenders or the taxman take a cut. For Masala Mills that's 120 plus 40, so 160. Underneath, all the capital: 600 of equity plus 500 of debt. 160 over 1,100 is 14.5 per cent. Higher is better."},{"type":"ratio","id":"r-roce","say":"Here are the eight industries. TCS sits on top at 56 per cent, because it needs little capital beyond people and offices. HUL is second at 28. At the bottom, DLF at 7 per cent: its capital includes a rental joint venture whose profit is left out of EBIT. Tata Steel's heavy plants earn just 12."},{"type":"explain","title":"ROE: the shareholders' slice","text":"Net profit belongs to shareholders, so divide it by shareholders' equity only. Masala Mills earns <b>15%<\/b>. Its debt costs 8% (40 on 500), less than the business earns, and shareholders keep the gap.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"ROE for Masala Mills: net profit 90 over equity 600 equals 15 per cent\"><g class=\"step-1\"><rect x=\"154\" y=\"8\" width=\"92\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Net profit<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">90<\/text><\/g><line x1=\"113\" y1=\"69\" x2=\"287\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"121\" y=\"84\" width=\"158\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Shareholders' equity<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">600<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">15%<\/text><\/g><\/svg><figcaption>Net profit is after interest and 25% tax: 160 &minus; 40 &minus; 30 = 90.<\/figcaption><\/figure>","steps":["Top: net profit, after interest and tax","Bottom: shareholders' equity only","ROE is 15%"],"say":"Next, ROE, return on equity. Net profit is what's left for shareholders after interest and tax, so we divide it by their money only. Masala Mills makes 90 of net profit on 600 of equity. That's 15 per cent. Its debt costs 8 per cent, 40 of interest on 500, while the business earns 14.5 before tax. Shareholders keep that gap."},{"type":"ratio","id":"r-roe","say":"On ROE, TCS again leads at 46 per cent: high margins, few assets, and it pays out most of its profit so equity stays lean. HUL follows at 22. Look at Airtel at 18, ahead of Sun Pharma and Maruti. Hold that thought. DLF is last at 10, with a big land bank against modest yearly profit."},{"type":"explain","title":"ROA: profit on everything owned","text":"Divide net profit by total assets, however they were funded. Masala Mills owns 1,500 of assets but has only 600 of equity. Same profit, bigger base: ROA is <b>6%<\/b> against a 15% ROE.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"ROA for Masala Mills: net profit 90 over total assets 1,500 equals 6 per cent\"><g class=\"step-1\"><rect x=\"154\" y=\"8\" width=\"92\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Net profit<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">90<\/text><\/g><line x1=\"51\" y1=\"69\" x2=\"349\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"59\" y=\"84\" width=\"66\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"92\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Equity<\/text><text x=\"92\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">600<\/text><text x=\"138\" y=\"113\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"151\" y=\"84\" width=\"52\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"177\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Debt<\/text><text x=\"177\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">500<\/text><text x=\"216\" y=\"113\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"229\" y=\"84\" width=\"112\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"285\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Payables etc.<\/text><text x=\"285\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">400<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">6%<\/text><\/g><\/svg><figcaption>Total assets 1,500 = equity 600 + debt 500 + other liabilities 400.<\/figcaption><\/figure>","steps":["Top: the same net profit of 90","Bottom: all 1,500 of assets, funded by everyone","ROA is 6%"],"say":"ROA, return on assets, uses the same 90 of net profit, but divides by everything the company owns, 1,500. That base is funded by equity, debt and suppliers. So ROA is 6 per cent. The gap between 6 and 15 is the debt and other liabilities. Assets are 2.5 times equity, and 6 times 2.5 is 15."},{"type":"ratio","id":"r-roa","say":"ROA strips the debt boost out. TCS still leads at 27 per cent, because it owns little beyond cash and receivables. Now watch Airtel. Its 18 per cent ROE drops to just 6 on assets. Tata Steel is last at 4: a huge plant base earning a thin margin."},{"type":"explain","title":"DuPont: split ROE into three","text":"ROE is margin times turnover times leverage. Each answers one question: how much profit per sale, how many sales per rupee of assets, how many assets per rupee of equity.","visual":"<div class=\"fgrid\"><div class=\"fcard step-1\"><div class=\"fname\">Net margin<\/div><div class=\"fx\">90 &divide; 1,250 = 7.2%<\/div><div class=\"fnote\">profit per rupee of sales<\/div><\/div><div class=\"fcard step-2\"><div class=\"fname\">Asset turnover<\/div><div class=\"fx\">1,250 &divide; 1,500 = 0.83x<\/div><div class=\"fnote\">sales per rupee of assets<\/div><\/div><div class=\"fcard step-3\"><div class=\"fname\">Assets &divide; equity<\/div><div class=\"fx\">1,500 &divide; 600 = 2.5x<\/div><div class=\"fnote\">the leverage boost<\/div><\/div><\/div><div class=\"formula step-4\">7.2% &times; 0.83 &times; 2.5 = 15% ROE<\/div>","steps":["Margin: 7.2%","Turnover: 0.83 times","Leverage: 2.5 times","Multiply: 15%, the same ROE"],"say":"DuPont breaks ROE into three parts. Net margin, 90 over sales of 1,250, is 7.2 per cent. Asset turnover, sales over assets, is 0.83 times. And assets over equity, the leverage boost, is 2.5 times. Multiply them and you get back to 15 per cent. Margin times turnover is just ROA. Leverage turns ROA into ROE."},{"type":"explain","title":"TCS vs Airtel, split open","text":"TCS earns its 46% from margin and turnover, with modest leverage. Airtel turns its assets only 0.38 times a year, so its 18% leans on a 3.7x multiplier: borrowed money funds much of its network.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 572 168\" role=\"img\" aria-label=\"DuPont split: TCS 18.4 per cent margin times 1.46 turns times 1.70 equals 46 per cent ROE; Airtel 12.7 per cent times 0.38 turns times 3.70 equals 18 per cent\"><text x=\"146\" y=\"18\" text-anchor=\"middle\" class=\"s-ts\">Net margin<\/text><text x=\"268\" y=\"18\" text-anchor=\"middle\" class=\"s-ts\">Asset turnover<\/text><text x=\"390\" y=\"18\" text-anchor=\"middle\" class=\"s-ts\">Assets &divide; equity<\/text><text x=\"516\" y=\"18\" text-anchor=\"middle\" class=\"s-ts\">ROE<\/text><g class=\"step-1\"><text x=\"10\" y=\"61\" class=\"s-tb\">TCS<\/text><rect x=\"100\" y=\"32\" width=\"92\" height=\"44\" rx=\"7\" class=\"s-boxa\"/><text x=\"146\" y=\"60\" text-anchor=\"middle\" class=\"s-tb\">18.4%<\/text><text x=\"207\" y=\"60\" text-anchor=\"middle\" class=\"s-tb\">&times;<\/text><rect x=\"222\" y=\"32\" width=\"92\" height=\"44\" rx=\"7\" class=\"s-boxa\"/><text x=\"268\" y=\"60\" text-anchor=\"middle\" class=\"s-tb\">1.46x<\/text><text x=\"329\" y=\"60\" text-anchor=\"middle\" class=\"s-tb\">&times;<\/text><rect x=\"344\" y=\"32\" width=\"92\" height=\"44\" rx=\"7\" class=\"s-box\"/><text x=\"390\" y=\"60\" text-anchor=\"middle\" class=\"s-tb\">1.70x<\/text><text x=\"451\" y=\"60\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"470\" y=\"32\" width=\"92\" height=\"44\" rx=\"7\" class=\"s-boxg\"/><text x=\"516\" y=\"60\" text-anchor=\"middle\" class=\"s-tb\">46%<\/text><\/g><g class=\"step-2\"><text x=\"10\" y=\"127\" class=\"s-tb\">Airtel<\/text><rect x=\"100\" y=\"98\" width=\"92\" height=\"44\" rx=\"7\" class=\"s-box\"/><text x=\"146\" y=\"126\" text-anchor=\"middle\" class=\"s-tb\">12.7%<\/text><text x=\"207\" y=\"126\" text-anchor=\"middle\" class=\"s-tb\">&times;<\/text><rect x=\"222\" y=\"98\" width=\"92\" height=\"44\" rx=\"7\" class=\"s-box\"/><text x=\"268\" y=\"126\" text-anchor=\"middle\" class=\"s-tb\">0.38x<\/text><text x=\"329\" y=\"126\" text-anchor=\"middle\" class=\"s-tb\">&times;<\/text><rect x=\"344\" y=\"98\" width=\"92\" height=\"44\" rx=\"7\" class=\"s-boxb\"/><text x=\"390\" y=\"126\" text-anchor=\"middle\" class=\"s-tb\">3.70x<\/text><text x=\"451\" y=\"126\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"470\" y=\"98\" width=\"92\" height=\"44\" rx=\"7\" class=\"s-boxg\"/><text x=\"516\" y=\"126\" text-anchor=\"middle\" class=\"s-tb\">18%<\/text><\/g><\/svg><figcaption>Blue boxes do the work for TCS. The red box does it for Airtel. FY26.<\/figcaption><\/figure>","steps":["TCS: margin and turnover do the work","Airtel: leverage does the work"],"say":"Here's the puzzle from the start. TCS: an 18.4 per cent margin, assets turning 1.46 times, leverage of only 1.7. That's 46 per cent, earned by the business. Airtel: a 12.7 per cent margin, but its towers and spectrum turn over only 0.38 times. Leverage of 3.7 times lifts it to 18. Same tool, opposite engines."},{"type":"explain","title":"ROIC: the return on capital at work","text":"Tax the operating profit as if there were no debt, then divide by the capital the operations use: equity plus debt minus cash. Compare the answer with WACC.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"ROIC for Masala Mills: EBIT 160 times 0.75 equals 120, over equity 600 plus debt 500 minus cash 120 equals 980, giving 12.2 per cent\"><g class=\"step-1\"><rect x=\"134\" y=\"8\" width=\"132\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">EBIT &times; (1 &minus; 25%)<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">120<\/text><\/g><line x1=\"81\" y1=\"69\" x2=\"319\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"89\" y=\"84\" width=\"66\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"122\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Equity<\/text><text x=\"122\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">600<\/text><text x=\"167\" y=\"113\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"180\" y=\"84\" width=\"52\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"207\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Debt<\/text><text x=\"207\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">500<\/text><text x=\"246\" y=\"113\" text-anchor=\"middle\" class=\"s-tb\">&minus;<\/text><rect x=\"259\" y=\"84\" width=\"52\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"285\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Cash<\/text><text x=\"285\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">120<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">12.2%<\/text><\/g><\/svg><figcaption>Against a WACC of 12%, Masala Mills barely creates value.<\/figcaption><\/figure>","steps":["Top: EBIT 160 after a 25% tax, so 120","Bottom: capital used, 980, with idle cash taken out","ROIC is 12.2%, just above a 12% WACC"],"say":"Last one, ROIC, return on invested capital. On top, EBIT taxed as if there were no debt: 160 times 0.75 is 120. Below, the capital the business actually uses: equity plus debt, minus the cash sitting idle. That's 980. ROIC is 12.2 per cent. Masala Mills' WACC is 12, so it only just earns its cost of capital."},{"type":"ratio","id":"r-roic","say":"TCS tops ROIC at 69 per cent: people, not plants. Maruti jumps to second at 36, because we set its large treasury aside, and the car business needs little capital. At the bottom, DLF at 3 per cent and Tata Steel at 8, which is about where a cost of capital sits."},{"type":"mcq","q":"Which company has the lowest ROIC of the eight, and why?","options":["Tata Steel, because steel prices fell","DLF, because its capital is slow land and a joint venture stake whose profit sits outside EBIT","DMart, because it pays no dividend","Airtel, because it carries the most debt"],"answer":1,"why":"DLF's ROIC is 3%. Land and the rental JV stake sit in its capital, while the JV's profit never enters EBIT. Tata Steel is next lowest at 8%.","say":"Questions now. Think back to the ROIC chart. Who was at the bottom, and what was the business reason?"},{"type":"number","q":"Masala Mills next year: net margin 8%, asset turnover 0.9x, assets 2.0x equity. ROE, in %?","answer":14.4,"tol":0.1,"unit":"%","why":"DuPont: 8% &times; 0.9 &times; 2.0 = 14.4%. Better margins and turns, but less leverage, so ROE dips slightly from 15%.","say":"Your turn with DuPont. Masala Mills improves its margin to 8 per cent and turns assets 0.9 times, but pays down debt, so assets fall to 2 times equity. Multiply the three. What's the ROE?"},{"type":"mcq","q":"DMart's net margin is 4.3%, Sun Pharma's 19.6%. Yet their ROAs are close: 10% and 11%. What carries DMart?","options":["Leverage","Asset turnover: it turns its assets about 2.3 times a year","A one-off gain","Dividend payout"],"answer":1,"why":"ROA is margin times turnover. DMart: 4.3% &times; 2.33 &asymp; 10%. Sun Pharma: 19.6% &times; 0.54 &asymp; 11%. Leverage is not in ROA at all.","say":"DMart earns a thin margin, Sun Pharma a fat one. Their returns on assets are almost the same. Which part of DuPont explains it? Remember, ROA has no leverage in it."},{"type":"order","q":"Rank by ROCE, highest first","items":["TCS","HUL","DMart","DLF"],"why":"TCS 56%, HUL 28%, DMart 16%, DLF 7%. Light capital wins; land banks lose.","say":"Put these four in order of ROCE, highest at the top. Think about how much capital each business needs to earn its profit."},{"type":"sort","q":"Where does debt lift ROE well above ROA?","buckets":["ROE far above ROA","ROE close to ROA"],"items":[["Airtel","ROE far above ROA"],["Tata Steel","ROE far above ROA"],["DMart","ROE close to ROA"],["Sun Pharma","ROE close to ROA"],["Maruti","ROE close to ROA"]],"why":"Airtel (18% vs 6%) and Tata Steel (11% vs 4%) carry real debt. DMart, Sun Pharma and Maruti barely borrow, so ROE sits near ROA.","say":"Sort each company. Where ROE is far above ROA, borrowed money is doing the lifting. Where they sit close together, the company barely borrows."},{"type":"mcq","q":"A business earns a 9% ROIC against a 12% WACC. It doubles its growth rate. What happens to its value?","options":["It rises, because growth is always good","It falls: each new rupee invested earns less than it costs","No change, because ROIC is unaffected","It rises only if margins stay flat"],"answer":1,"why":"Below WACC, growth destroys value, and faster growth destroys it faster. Growth only adds value when ROIC beats WACC.","say":"Last one. Remember the rule that came with ROIC and the cost of capital. This business earns 9 per cent on capital that costs 12. It decides to grow twice as fast. Good news or bad?"},{"type":"reveal","tag":"Your miss","q":"What is return on invested capital (ROIC) used to measure?","a":"<p>ROIC measures how well a company turns the capital tied up in its operations into after-tax operating profit, independent of how that capital is funded.<\/p><div class=\"formula\">ROIC = EBIT &times; (1 &minus; t) &divide; (equity + debt &minus; cash)<\/div><p>Compare it with WACC. ROIC above WACC means growth creates value; below it, growth destroys value. A ROIC held above WACC for years points to a moat.<\/p>","say":"Boss question, one you missed before. Say your answer out loud first: what does ROIC measure? Then reveal and compare."},{"type":"reveal","tag":"Your miss","q":"How do you calculate ROA and ROE, and how does operating (unlevered) ROA differ from the common accounting ROA?","a":"<p>ROA = net profit &divide; total assets. ROE = net profit &divide; equity, which is ROA &times; assets &divide; equity.<\/p><p>Common ROA uses net profit, which is after interest, so the funding choice leaks into it. <b>Operating ROA<\/b> uses NOPAT, or net profit plus after-tax interest, so two firms with the same assets and different debt show the same return.<\/p>","say":"One more you missed. How do you calculate ROA and ROE, and what changes in operating ROA? Answer aloud, then reveal."},{"type":"recap","points":["ROCE and ROIC measure the business on all its capital; ROE measures the shareholders' slice.","DuPont: ROE = margin &times; asset turnover &times; assets &divide; equity. TCS wins on margin and turns, Airtel on leverage.","Growth creates value only while ROIC beats WACC."],"say":"Three things to keep. ROCE and ROIC judge the whole business, ROE judges the shareholders' slice. Split ROE with DuPont before you praise it. And growth only helps while ROIC beats the cost of capital."}]},{"id":"rat-06","module":"rat","title":"Cash quality and valuation multiples","mins":12,"blurb":"TCS trades at 16 times profit and DMart at 78. Eight ratios show what each price is paying for.","slides":[{"type":"hook","title":"16 times or 78 times?","text":"TCS trades at 16 times its profit. DMart trades at 78 times. TCS also earns the best returns of the eight. Is TCS the bargain?","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>TCS<\/h4><ul><li>P/E 16x<\/li><li>ROE 46%<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>DMart<\/h4><ul><li>P/E 78x<\/li><li>ROE 12%<\/li><\/ul><\/div><\/div>","say":"TCS trades at 16 times its profit, DMart at 78 times, and TCS earns far better returns. Looks like an easy call. It isn't. This lesson teaches two cash quality checks and six valuation multiples, so you can say what each price is really paying for."},{"type":"explain","title":"Cash conversion: did profit become cash?","text":"Start from EBITDA, take off tax paid and the cash stuck in stock and receivables. What's left is cash from operations. Divide by EBITDA. Masala Mills converts <b>80%<\/b>.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">EBITDA<\/span><b>200<\/b><small>operating profit<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Less<\/span><b>Tax paid &minus;30<\/b><small>cash to the taxman<\/small><\/div><div class=\"fstep step-3\"><span class=\"fk\">Less<\/span><b>Working capital &minus;10<\/b><small>more stock, receivables<\/small><\/div><div class=\"fstep hl step-4\"><span class=\"fk\">CFO<\/span><b>160<\/b><small>160 &divide; 200 = 80%<\/small><\/div><\/div>","steps":["Operating profit: 200","Tax paid takes 30","Extra stock and receivables take 10","CFO is 160, so 80% conversion"],"say":"First a quality check. Did profit turn into cash? Masala Mills makes 200 of EBITDA. Tax paid takes 30, and 10 more gets stuck in stock and unpaid bills. Cash from operations is 160. Divide by EBITDA: 80 per cent. Because CFO is after tax, 70 to 90 per cent is healthy. A steady slide is the warning."},{"type":"ratio","id":"r-cfo-ebitda","say":"DLF is off the chart at 438 per cent, because flat buyers pay advances years before revenue is booked. Airtel and Tata Steel sit just above 100. At the bottom, DMart at 67 per cent, losing cash to tax and stock for new stores, and TCS at 72, where tax takes about a fifth."},{"type":"explain","title":"FCF yield: cash per rupee of market value","text":"Free cash flow is CFO minus capex. Divide by market cap. Masala Mills yields <b>11%<\/b>: buy the whole company for 1,000 and it throws off 110 a year.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"FCF yield for Masala Mills: CFO 160 minus capex 50, over market cap 1,000, equals 11 per cent\"><g class=\"step-1\"><rect x=\"132\" y=\"8\" width=\"51\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"158\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">CFO<\/text><text x=\"158\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">160<\/text><text x=\"196\" y=\"37\" text-anchor=\"middle\" class=\"s-tb\">&minus;<\/text><rect x=\"209\" y=\"8\" width=\"59\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"238\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Capex<\/text><text x=\"238\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">50<\/text><\/g><line x1=\"124\" y1=\"69\" x2=\"276\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"154\" y=\"84\" width=\"92\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Market cap<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">1,000<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">11%<\/text><\/g><\/svg><figcaption>Market cap = &#8377;100 a share &times; 10 Cr shares.<\/figcaption><\/figure>","steps":["Top: free cash flow, 160 minus 50","Bottom: what the market charges for the equity","FCF yield is 11%"],"say":"FCF yield is the cash version of an earnings yield. Free cash flow is CFO minus capex: 160 minus 50 is 110. Divide by market cap, 100 rupees a share times 10 crore shares, so 1,000. That's an 11 per cent yield. High means cheap, or that the market expects the cash to shrink. Your job is to find out which."},{"type":"ratio","id":"r-fcf-yield","say":"Tata Steel leads at 9.3 per cent: strong cash at a low, cyclical valuation. Airtel and TCS follow near 6 and 7. DMart is the only negative, minus 0.3, because it spent more on new stores than it earned in cash. Sun Pharma's steady cash is priced richly, at about 2."},{"type":"explain","title":"P/E: years of profit you pay for","text":"Market cap over net profit, or price over earnings per share. Same answer. Masala Mills trades at <b>11.1x<\/b>: you pay about 11 years of today's profit.","visual":"<div class=\"fgrid\"><div class=\"fcard step-1\"><div class=\"fname\">Whole company<\/div><div class=\"fx\">1,000 &divide; 90 = 11.1x<\/div><div class=\"fnote\">market cap over net profit<\/div><\/div><div class=\"fcard step-2\"><div class=\"fname\">Per share<\/div><div class=\"fx\">&#8377;100 &divide; &#8377;9 = 11.1x<\/div><div class=\"fnote\">price over EPS<\/div><\/div><\/div>","steps":["Whole company: 1,000 over 90","Per share: 100 rupees over 9 rupees of EPS, the same 11.1"],"say":"The P E ratio. Market cap of 1,000 over net profit of 90 gives 11.1 times. Or per share: a price of 100 rupees over earnings per share of 9 rupees. Same 11.1. Read it as how many years of today's profit the market is paying for. A high P E means investors expect that profit to grow."},{"type":"ratio","id":"r-pe","say":"DMart tops the chart at 78 times: priced for decades of new stores. Airtel and HUL sit near 41. At the bottom, TCS at 16, because its profit grew only about 8 per cent a year over three years, and Tata Steel at 20, since its profit swings with steel prices."},{"type":"explain","title":"PEG: is the P/E backed by growth?","text":"Divide the P/E by the profit growth rate, written as a number: 10% growth is 10. Masala Mills: 11.1 &divide; 10 = <b>1.1x<\/b>. Near 1 means you pay roughly one turn of P/E per point of growth.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"PEG for Masala Mills: P E of 11.1 over 10 per cent growth equals 1.1\"><g class=\"step-1\"><rect x=\"166\" y=\"8\" width=\"67\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">P/E<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">11.1x<\/text><\/g><line x1=\"113\" y1=\"69\" x2=\"287\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"121\" y=\"84\" width=\"158\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">3-year profit growth<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">10<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">1.1x<\/text><\/g><\/svg><figcaption>Check the growth is repeatable, not a rebound from a weak year.<\/figcaption><\/figure>","steps":["Top: the P/E, 11.1","Bottom: growth of 10% a year, written as 10","PEG is 1.1x"],"say":"PEG asks whether the P E is earned. Divide the P E by the profit growth rate, written as a plain number. Masala Mills' profit grew 10 per cent a year, so 11.1 over 10 is 1.1. Around 1 looks fair. Far above 1, you're paying for growth that hasn't happened yet. Lower is better, if the growth is real."},{"type":"ratio","id":"r-peg","say":"DMart is far out on top at 9.8 times: 78 times earnings on about 8 per cent past growth. HUL is blank, because a one-off demerger gain distorts its growth. At the bottom, Airtel at 0.9, but that's flattered by growth off a low base. Maruti's 1.2 is the honest fair one."},{"type":"explain","title":"EV/EBITDA: price the whole business","text":"Enterprise value is what you'd pay for the business with its debt: market cap plus debt plus minority interest, minus cash. Divide by EBITDA. Masala Mills: <b>7.2x<\/b>.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Equity<\/span><b>Market cap 1,000<\/b><\/div><div class=\"fstep step-2\"><span class=\"fk\">Plus<\/span><b>Debt +500<\/b><\/div><div class=\"fstep step-3\"><span class=\"fk\">Plus<\/span><b>Minority +50<\/b><\/div><div class=\"fstep step-4\"><span class=\"fk\">Less<\/span><b>Cash &minus;120<\/b><\/div><div class=\"fstep hl step-5\"><span class=\"fk\">EV<\/span><b>1,430<\/b><small>1,430 &divide; 200 = 7.2x<\/small><\/div><\/div>","steps":["Start with market cap","Add debt, a claim on the business","Add minority interest","Take off cash","EV of 1,430 over EBITDA of 200"],"say":"EV over EBITDA. Enterprise value prices the whole business, for every investor. Start with market cap, 1,000. Add debt, 500, and minority interest, 50. Take off cash, 120. EV is 1,430. EBITDA belongs to everyone too, so the match is fair. 1,430 over 200 is 7.2 times. Debt levels no longer distort the comparison."},{"type":"ratio","id":"r-ev-ebitda","say":"DLF towers at 109 times, but that's not just hype: most of its value sits in its rental joint venture, outside EBITDA. DMart follows at 45. At the bottom, Tata Steel at 9, for cyclical earnings, and TCS near 10 despite top returns, because growth is slow."},{"type":"explain","title":"EV/Sales: when profit is too small to use","text":"Same EV, divided by revenue. Masala Mills: 1,430 &divide; 1,250 = <b>1.14x<\/b>. It equals EV/EBITDA times the EBITDA margin, so it ignores margins entirely.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"EV to sales for Masala Mills: 1,430 over 1,250 equals 1.14 times\"><g class=\"step-1\"><rect x=\"134\" y=\"8\" width=\"132\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Enterprise value<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">1,430<\/text><\/g><line x1=\"126\" y1=\"69\" x2=\"274\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"164\" y=\"84\" width=\"72\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Revenue<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">1,250<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">1.14x<\/text><\/g><\/svg><figcaption>Check: 7.15x EV/EBITDA &times; 16% EBITDA margin = 1.14x.<\/figcaption><\/figure>","steps":["Top: the same EV, 1,430","Bottom: revenue, 1,250","EV/Sales is 1.14x"],"say":"EV over sales uses the same enterprise value, divided by revenue. 1,430 over 1,250 is 1.14 times. It's handy when profit is tiny or margins are still moving. But it equals EV over EBITDA times the margin. So compare it only among companies whose margins should end up similar."},{"type":"ratio","id":"r-ev-sales","say":"DLF again on top at 19.2 times, for the same reason: the rental joint venture's value sits outside its revenue. Sun Pharma is next at 6.8, because a 28 per cent margin makes each sale worth more. Tata Steel and Maruti sit at the bottom, near 1.3 and 1.6: thin margins on huge sales."},{"type":"explain","title":"P/B: price against book value","text":"Market cap over shareholders' equity. Masala Mills: 1,000 &divide; 600 = <b>1.67x<\/b>. The market pays above book when ROE beats the cost of equity. Masala Mills earns 15% on that book.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"P B for Masala Mills: market cap 1,000 over equity 600 equals 1.67 times\"><g class=\"step-1\"><rect x=\"154\" y=\"8\" width=\"92\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Market cap<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">1,000<\/text><\/g><line x1=\"113\" y1=\"69\" x2=\"287\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"121\" y=\"84\" width=\"158\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Shareholders' equity<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">600<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">1.67x<\/text><\/g><\/svg><figcaption>Justified P/B = (ROE &minus; g) &divide; (cost of equity &minus; g).<\/figcaption><\/figure>","steps":["Top: market cap, 1,000","Bottom: book equity, 600","P/B is 1.67x"],"say":"P B, price to book. Market cap over shareholders' equity: 1,000 over 600 is 1.67 times. Why pay more than book? Because Masala Mills earns 15 per cent on that equity. When ROE beats the cost of equity, each rupee of book is worth more than a rupee. Always judge P B and ROE together."},{"type":"ratio","id":"r-pb","say":"DMart leads at 9.5 times, then HUL at 8.8: high returns from brands that barely show in book value. At the bottom, Tata Steel at 2.2, earning about 11 per cent on equity in a cyclical business, and Maruti at 3.4, whose book carries a big treasury earning far less than cars."},{"type":"explain","title":"Dividend yield and payout","text":"Yield is dividend per share over price: the cash return at today's price. Payout is dividends over net profit: the share of profit handed back. Masala Mills pays &#8377;3 a share.","visual":"<div class=\"fgrid\"><div class=\"fcard step-1\"><div class=\"fname\">Dividend yield<\/div><div class=\"fx\">&#8377;3 &divide; &#8377;100 = 3%<\/div><div class=\"fnote\">cash return at today's price<\/div><\/div><div class=\"fcard step-2\"><div class=\"fname\">Payout ratio<\/div><div class=\"fx\">30 &divide; 90 = 33%<\/div><div class=\"fnote\">&#8377;3 &times; 10 Cr shares, over profit<\/div><\/div><\/div>","steps":["Yield: 3 rupees on a 100 rupee share","Payout: 30 crore of dividends on 90 of profit"],"say":"Two dividend numbers. Masala Mills pays 3 rupees a share on a 100 rupee price, a 3 per cent yield. Across 10 crore shares that's 30 crore, a third of its 90 crore profit. That's the payout ratio. A high payout suits companies with more cash than they can reinvest. Growers keep it."},{"type":"ratio","id":"r-div","say":"Two charts here. On yield, TCS leads at 5.2 per cent: it pays out about 80 per cent of profit at a low P E. DMart pays nothing; every rupee goes into new stores. On payout, HUL tops at 91 per cent, with TCS next at 81. Sun Pharma and Maruti hand back about a third."},{"type":"mcq","q":"DLF trades at 109x EV/EBITDA. What is the best first explanation?","options":["The market is in a property bubble","Most of its value sits in its rental joint venture, whose profit is outside EBITDA","Its debt is huge","Its EBITDA is negative"],"answer":1,"why":"The JV's earnings never reach DLF's EBITDA, but its value is in DLF's market cap. Before calling a multiple expensive, check that the denominator captures the value.","say":"Questions. DLF's EV over EBITDA is above 100. Before you shout bubble, what did the chart's note say?"},{"type":"number","q":"Masala Mills' share price rises to &#8377;130. 10 Cr shares, debt 500, minority 50, cash 120, EBITDA 200 (&#8377; Cr). New EV/EBITDA?","answer":8.65,"tol":0.05,"unit":"x","why":"Market cap 1,300 + 500 + 50 &minus; 120 = EV 1,730. 1,730 &divide; 200 = 8.65x.","say":"Build the EV yourself. The share price rises to 130 rupees. Debt, minority and cash stay the same, and EBITDA is still 200. What's the new EV over EBITDA?"},{"type":"sort","q":"Which value goes on top: equity value or enterprise value?","buckets":["Equity value (market cap or price)","Enterprise value"],"items":[["P/E","Equity value (market cap or price)"],["P/B","Equity value (market cap or price)"],["FCF yield","Equity value (market cap or price)"],["Dividend yield","Equity value (market cap or price)"],["EV/EBITDA","Enterprise value"],["EV/Sales","Enterprise value"]],"why":"Net profit, book equity and dividends belong to shareholders, and FCF yield is set against market cap, so all four use equity value. EBITDA and revenue belong to every investor, so they pair with EV.","say":"Sort each multiple by what sits in its numerator, or for the yields, its denominator. The rule: match a shareholders' number with equity value, and an everyone's number with enterprise value."},{"type":"mcq","q":"TCS has the top ROE (46%) and the top dividend yield, yet the lowest P/E (16x). Main reason?","options":["Its earnings are low quality","Slow profit growth, about 8% a year over three years","It carries heavy debt","It pays no dividend"],"answer":1,"why":"P/E pays for future profit growth, not past returns. TCS's slow growth also puts its PEG at 1.9x, so even 16x is not obviously cheap.","say":"Back to the hook. TCS has the best returns and the fattest dividend, at the lowest P E. What is the market pricing in?"},{"type":"order","q":"Rank by FCF yield, highest first","items":["Tata Steel","TCS","DLF","DMart"],"why":"Tata Steel 9.3%, TCS 6.3%, DLF 3.8%, DMart -0.3%: DMart spent more on stores than it earned in cash.","say":"Rank these four on free cash flow yield, highest at the top. One of them is negative."},{"type":"reveal","tag":"Your miss","q":"When should you value a company on a revenue multiple instead of EBITDA?","a":"<p>Default to <b>EV/EBITDA<\/b> once the business is profitable at the operating level. Switch to EV/Sales only when EBITDA is negative, near zero or too unstable to trust: early-stage, fast-growing or cyclical businesses at a trough.<\/p><p>The cost: revenue ignores margins, so two firms with the same sales get the same value however profitable they are. Use peers whose margins should converge, and go back to EBITDA once it is usable.<\/p>","say":"Boss question, one you missed before. When would you use a revenue multiple instead of EBITDA? Say it out loud, then reveal."},{"type":"recap","points":["CFO over EBITDA of 70% to 90% is healthy; FCF yield is the cash version of an earnings yield.","Match numerator and denominator: P/E, P/B and yields use equity value; EV/EBITDA and EV/Sales use enterprise value.","A multiple is a bet on growth and returns: read P/E with PEG, and P/B with ROE."],"say":"Three things to keep. Check cash conversion before trusting profit. Match equity numbers with equity value and everyone's numbers with enterprise value. And read every multiple next to what justifies it: P E with growth, P B with ROE."}]},{"id":"rat-07","module":"rat","title":"Banks and NBFCs","mins":11,"blurb":"Bajaj Finance earns three times SBI's margin. Six lender ratios show why that is the wrong comparison.","slides":[{"type":"hook","title":"9.7% against 2.9%","text":"Bajaj Finance earns a 9.7% margin on its loans. SBI earns 2.9%. Is Bajaj Finance three times the better lender?","visual":"<div class=\"cmp\"><div class=\"cmp-c a\"><h4>Bajaj Finance<\/h4><ul><li>NIM 9.7%<\/li><li>Consumer loans<\/li><\/ul><\/div><div class=\"cmp-c b\"><h4>SBI<\/h4><ul><li>NIM 2.9%<\/li><li>Big companies, government bonds<\/li><\/ul><\/div><\/div>","say":"Banks and NBFCs don't fit the usual ratios. There's no EBITDA, and debt is the raw material, not a risk. Bajaj Finance earns a 9.7 per cent margin on its loans, SBI just 2.9. Three times better? By the end of this lesson, six lender ratios will tell you why that's the wrong question."},{"type":"explain","title":"How a lender makes money","text":"Meet Toy Bank: 900 of deposits and 100 of equity, lent out as 800 of loans and 200 of government bonds. Its profit is one short chain. Every ratio in this lesson measures one link.","visual":"<div class=\"flow\"><div class=\"fstep step-1\"><span class=\"fk\">Earn<\/span><b>Interest 90<\/b><small>loans and bonds<\/small><\/div><div class=\"fstep step-2\"><span class=\"fk\">Pay<\/span><b>Depositors &minus;50<\/b><\/div><div class=\"fstep hl step-3\"><span class=\"fk\">NII<\/span><b>40<\/b><small>net interest income<\/small><\/div><div class=\"fstep step-4\"><span class=\"fk\">Add, less<\/span><b>+10 fees, &minus;25 costs<\/b><small>other income, opex<\/small><\/div><div class=\"fstep hl2 step-5\"><span class=\"fk\">Less<\/span><b>Bad loans &minus;4<\/b><small>provisions<\/small><\/div><div class=\"fstep step-6\"><span class=\"fk\">Profit<\/span><b>21<\/b><small>before tax<\/small><\/div><\/div>","steps":["Interest earned on loans and bonds: 90","Interest paid to depositors: 50","Net interest income: 40","Add fees of 10, take off running costs of 25","Set aside 4 for bad loans","Pre-tax profit: 21"],"say":"Meet Toy Bank, rupees in crore. It takes 900 of deposits, adds 100 of equity, and lends it out. It earns 90 of interest and pays depositors 50, so net interest income is 40. Add 10 of fees, take off 25 of running costs and 4 for bad loans. Profit before tax is 21. Each ratio today measures one link of this chain."},{"type":"explain","title":"Four kinds of lender, eight names","text":"Banks take current and savings deposits. NBFCs cannot, so they borrow at higher cost and lend at higher rates to riskier borrowers.","visual":"<table class=\"t compact\"><thead><tr><th>Type<\/th><th>Our eight lenders<\/th><\/tr><\/thead><tbody><tr><td>Private bank<\/td><td>HDFC Bank, ICICI Bank, Kotak, Axis<\/td><\/tr><tr><td>PSU bank<\/td><td>SBI, Bank of Baroda<\/td><\/tr><tr><td>Consumer NBFC<\/td><td>Bajaj Finance<\/td><\/tr><tr><td>Vehicle finance NBFC<\/td><td>Shriram Finance<\/td><\/tr><\/tbody><\/table><div class=\"kchips\"><span class=\"kchip up\">NBFC: wider margin<\/span><span class=\"kchip dn\">NBFC: higher losses, no CASA<\/span><\/div>","say":"The charts use eight lenders in four groups. Four private banks, two government-owned PSU banks, and two NBFCs, non-bank lenders: Bajaj Finance for consumer loans and Shriram for used vehicles. NBFCs can't take current or savings deposits, so their money costs more. They make up for it by lending at high rates to riskier borrowers."},{"type":"explain","title":"NIM: the lending spread","text":"Net interest income, what it earns minus what it pays, over the assets that earn interest. Toy Bank: <b>4%<\/b>.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"NIM for Toy Bank: interest earned 90 minus interest paid 50, over earning assets 1,000, equals 4 per cent\"><g class=\"step-1\"><rect x=\"69\" y=\"8\" width=\"125\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"131\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Interest earned<\/text><text x=\"131\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">90<\/text><text x=\"207\" y=\"37\" text-anchor=\"middle\" class=\"s-tb\">&minus;<\/text><rect x=\"220\" y=\"8\" width=\"112\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"276\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Interest paid<\/text><text x=\"276\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">50<\/text><\/g><line x1=\"61\" y1=\"69\" x2=\"339\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"128\" y=\"84\" width=\"59\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"158\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Loans<\/text><text x=\"158\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">800<\/text><text x=\"200\" y=\"113\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"213\" y=\"84\" width=\"59\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"242\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Bonds<\/text><text x=\"242\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">200<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">4.0%<\/text><\/g><\/svg><figcaption>Banks use average interest-earning assets for the year.<\/figcaption><\/figure>","steps":["Top: net interest income, 90 minus 50","Bottom: everything that earns interest, 1,000","NIM is 4%"],"say":"NIM, net interest margin, is the lending spread. Toy Bank earns 90 and pays 50, so net interest income is 40. Divide by the assets that earn interest: 800 of loans plus 200 of bonds. 40 over 1,000 is 4 per cent. Higher is better, but a high NIM usually means riskier loans."},{"type":"ratio","id":"r-nim","say":"The two NBFCs top the chart: Bajaj Finance at 9.7 and Shriram at 8.4 per cent. Small consumer and used-vehicle loans carry high rates. At the bottom, SBI and Bank of Baroda near 2.9: big corporate loans at low rates, plus lots of low-yield government bonds. HDFC Bank reads low partly because it measures on total assets."},{"type":"explain","title":"CASA: the cheapest money","text":"Current accounts pay almost nothing, savings accounts pay little, term deposits pay the most. CASA is the cheap share of deposits. Toy Bank: <b>40%<\/b>.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"CASA ratio for Toy Bank: current 90 plus savings 270, over deposits 900, equals 40 per cent\"><g class=\"step-1\"><rect x=\"115\" y=\"8\" width=\"72\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"151\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Current<\/text><text x=\"151\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">90<\/text><text x=\"200\" y=\"37\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"213\" y=\"8\" width=\"72\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"249\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Savings<\/text><text x=\"249\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">270<\/text><\/g><line x1=\"107\" y1=\"69\" x2=\"293\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"141\" y=\"84\" width=\"118\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Total deposits<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">900<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">40%<\/text><\/g><\/svg><figcaption>The other 540 sits in costlier term deposits.<\/figcaption><\/figure>","steps":["Top: the cheap money, current plus savings","Bottom: all deposits, 900","CASA is 40%"],"say":"A wide spread starts with cheap money. Current accounts pay almost nothing, savings accounts a little. Toy Bank has 90 in current and 270 in savings, out of 900 of deposits. That's a CASA ratio of 40 per cent. A higher CASA lets a bank lend at the same rates and still earn a wider margin."},{"type":"ratio","id":"r-casa","say":"Kotak leads at 43 per cent, then ICICI Bank at 41: strong branches and apps pull in current and savings money. HDFC Bank is lowest at 34: after the HDFC Limited merger, it raised term deposits to fund the extra loans. The NBFCs are blank. They can't take these deposits at all."},{"type":"explain","title":"Cost to income: what running it costs","text":"Staff, branches and technology, over all the income before bad-loan provisions. Toy Bank spends 25 of its 50: <b>50%<\/b>. Lower is better.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"Cost to income for Toy Bank: costs 25 over income 50 equals 50 per cent\"><g class=\"step-1\"><rect x=\"138\" y=\"8\" width=\"125\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Operating costs<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">25<\/text><\/g><line x1=\"51\" y1=\"69\" x2=\"349\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"59\" y=\"84\" width=\"151\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"134\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Net interest income<\/text><text x=\"134\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">40<\/text><text x=\"223\" y=\"113\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"236\" y=\"84\" width=\"105\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"289\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Other income<\/text><text x=\"289\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">10<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">50%<\/text><\/g><\/svg><figcaption>Provisions for bad loans stay out of this ratio.<\/figcaption><\/figure>","steps":["Top: running costs, 25","Bottom: net interest income plus fees, 50","Cost to income is 50%"],"say":"Cost to income shows how much of a lender's income goes on staff, branches and technology. Toy Bank spends 25. Its income is 40 of net interest plus 10 of fees, so 50. Half its income goes on running costs: 50 per cent. Lower is better. Bad-loan provisions are left out, they come next."},{"type":"ratio","id":"r-cti","say":"SBI is highest at 50 per cent, with Bank of Baroda close behind: huge branch networks, high wage and pension costs. Lowest is Shriram at 25, then Bajaj Finance at 33. Their wide margins make costs look small. HDFC Bank's 38 is flattered by a one-off IPO gain."},{"type":"explain","title":"Credit cost: the price of risk","text":"Provisions set aside this year for bad loans, over average loans. Toy Bank sets aside 4 on 800: <b>0.5%<\/b>. Read it against NIM: margin minus credit cost is what remains.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"Credit cost for Toy Bank: provisions 4 over loans 800 equals 0.5 per cent\"><g class=\"step-1\"><rect x=\"121\" y=\"8\" width=\"158\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Provisions this year<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">4<\/text><\/g><line x1=\"113\" y1=\"69\" x2=\"287\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"144\" y=\"84\" width=\"112\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"200\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Average loans<\/text><text x=\"200\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">800<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">0.5%<\/text><\/g><\/svg><figcaption>Toy Bank: a 4% margin less a 0.5% credit cost.<\/figcaption><\/figure>","steps":["Top: this year's provisions, 4","Bottom: the loan book, 800","Credit cost is 0.5%"],"say":"Credit cost is what a lender sets aside each year for loans that will go bad. Toy Bank provides 4 on 800 of loans, so 0.5 per cent. This is the number that answers our hook. A wide margin means little if bad loans eat it. Margin minus credit cost is what's left."},{"type":"ratio","id":"r-credit-cost","say":"Bajaj Finance is highest at about 2.1 per cent, then Shriram at 1.7: riskier borrowers, with losses priced into high rates. At the bottom, HDFC Bank and SBI at under 0.4: salaried people and large companies, often against security. So Bajaj's margin lead shrinks once losses come off."},{"type":"explain","title":"Gross and net NPA: loans that stopped paying","text":"Gross NPA is the share of loans that stopped paying. Net NPA takes off the provisions already set aside. It shows what is still exposed.","visual":"<div class=\"fgrid\"><div class=\"fcard step-1\"><div class=\"fname\">Gross NPA<\/div><div class=\"fx\">16 &divide; 800 = 2.0%<\/div><div class=\"fnote\">bad loans over gross loans<\/div><\/div><div class=\"fcard step-2\"><div class=\"fname\">Net NPA<\/div><div class=\"fx\">(16 &minus; 10) &divide; (800 &minus; 10) = 0.76%<\/div><div class=\"fnote\">after 10 of provisions held<\/div><\/div><\/div>","steps":["Gross: 16 of Toy Bank's 800 of loans stopped paying","Net: 10 is already provided, so only 6 is exposed"],"say":"NPA means non-performing asset, a loan that has stopped paying, usually for 90 days. 16 of Toy Bank's 800 of loans have stopped. Gross NPA is 2 per cent. It has already set aside 10 against them, so only 6 is exposed. Net NPA is 6 over 790, about 0.76 per cent. Lower is better for both."},{"type":"ratio","id":"r-gnpa","say":"Shriram stands out at 4.6 per cent gross: small truck owners buying used vehicles, with swinging incomes. Bank of Baroda is next, still carrying old bad loans. Lowest is Bajaj Finance at 1.0. But careful: it writes bad loans off fast, so they leave this count. Its high credit cost tells the real story."},{"type":"explain","title":"Capital adequacy: the loss buffer","text":"Capital over risk-weighted assets. Riskier assets count more. Toy Bank's loans count in full, its government bonds at zero: 100 &divide; 800 = <b>12.5%<\/b>, above the 11.5% minimum.","visual":"<figure class=\"svgfig\"><svg viewBox=\"0 0 560 138\" role=\"img\" aria-label=\"Capital adequacy for Toy Bank: capital 100 over risk weighted assets 800 equals 12.5 per cent\"><g class=\"step-1\"><rect x=\"164\" y=\"8\" width=\"72\" height=\"46\" rx=\"7\" class=\"s-boxa\"/><text x=\"200\" y=\"25\" text-anchor=\"middle\" class=\"s-ts\">Capital<\/text><text x=\"200\" y=\"44\" text-anchor=\"middle\" class=\"s-tb\">100<\/text><\/g><line x1=\"74\" y1=\"69\" x2=\"326\" y2=\"69\" class=\"s-line\"/><g class=\"step-2\"><rect x=\"82\" y=\"84\" width=\"112\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"138\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Loans at 100%<\/text><text x=\"138\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">800<\/text><text x=\"207\" y=\"113\" text-anchor=\"middle\" class=\"s-tb\">+<\/text><rect x=\"220\" y=\"84\" width=\"99\" height=\"46\" rx=\"7\" class=\"s-boxg\"/><text x=\"269\" y=\"101\" text-anchor=\"middle\" class=\"s-ts\">Bonds at 0%<\/text><text x=\"269\" y=\"120\" text-anchor=\"middle\" class=\"s-tb\">0<\/text><\/g><g class=\"step-3\"><text x=\"410\" y=\"76\" text-anchor=\"middle\" class=\"s-tb\">=<\/text><rect x=\"424\" y=\"46\" width=\"124\" height=\"46\" rx=\"8\" class=\"s-boxb\"/><text x=\"486\" y=\"75\" text-anchor=\"middle\" class=\"s-tr\">12.5%<\/text><\/g><\/svg><figcaption>CRAR counts all capital. CET1 counts only core equity.<\/figcaption><\/figure>","steps":["Top: loss-absorbing capital, 100","Bottom: assets weighted by risk, 800","CRAR is 12.5%"],"say":"Capital adequacy is the buffer that absorbs losses. Capital goes on top. Underneath, assets weighted by risk: Toy Bank's loans count in full, its government bonds at zero. 100 over 800 is 12.5 per cent, above the 11.5 per cent minimum. CRAR counts all capital, CET1 only core equity. Spare capital is room to grow loans."},{"type":"ratio","id":"r-car","say":"Two charts: total capital, then core equity. Kotak leads both, at 22.4 and 21.3 per cent, after years of surplus equity. Bajaj Finance raises fresh equity to fund fast growth. SBI is lowest, with core equity of 12.3: government banks build capital mainly from profit, so buffers are thinner."},{"type":"mcq","q":"Bajaj Finance's NIM is 9.7%, SBI's 2.9%. Which ratio do you read next before calling Bajaj Finance the better lender?","options":["CASA ratio","Credit cost: 2.1% against 0.4%","P/E ratio","Capital adequacy"],"answer":1,"why":"A high NIM usually pays for riskier loans. Margin minus credit cost is what remains, and Bajaj Finance's losses are about five times SBI's.","say":"Questions now. Back to the hook. Bajaj Finance earns a margin more than three times SBI's. Which ratio do you check before praising it?"},{"type":"number","q":"A lender earns &#8377;150 Cr of interest and pays &#8377;90 Cr. Average interest-earning assets are &#8377;2,000 Cr. NIM, in %?","answer":3.0,"tol":0.05,"unit":"%","why":"Net interest income 150 &minus; 90 = 60. 60 &divide; 2,000 = 3.0%, close to the big banks' range.","say":"Compute the spread. 150 crore earned, 90 crore paid, on 2,000 crore of assets that earn interest. What's the net interest margin?"},{"type":"sort","q":"Cost to income: above 45% or below 40%?","buckets":["Above 45%","Below 40%"],"items":[["SBI","Above 45%"],["Bank of Baroda","Above 45%"],["Axis Bank","Above 45%"],["Shriram Finance","Below 40%"],["Bajaj Finance","Below 40%"],["HDFC Bank","Below 40%"],["Kotak","Above 45%"],["ICICI Bank","Below 40%"]],"why":"SBI 50%, Bank of Baroda 49%, Axis 48%, Kotak 47%. Shriram 25%, Bajaj Finance 33%, HDFC Bank 38%, ICICI Bank 40%.","say":"Sort the eight lenders by cost to income. Think about branch networks and pension costs on one side, and very wide margins on the other."},{"type":"mcq","q":"Bajaj Finance has the lowest gross NPA (1.0%) yet the highest credit cost. How?","options":["Its loans are the safest of the eight","It writes off bad consumer loans fast, so they leave the NPA count","It does not report NPAs","Its credit cost is a one-off"],"answer":1,"why":"Written-off loans drop out of gross NPA but still cost provisions. Low NPA plus high credit cost means fast write-offs, not safe loans.","say":"A puzzle from the NPA chart. Bajaj Finance has the fewest bad loans on its books but sets aside the most for losses. How can both be true?"},{"type":"order","q":"Rank by CET1 core equity ratio, highest first","items":["Kotak","HDFC Bank","Axis Bank","SBI"],"why":"Kotak 21.3%, HDFC Bank 17.3%, Axis Bank 14.4%, SBI 12.3%.","say":"Rank these four banks on core equity, the CET1 ratio, highest at the top."},{"type":"number","q":"Gross NPA &#8377;40 Cr on gross loans of &#8377;2,000 Cr. Provisions held: &#8377;30 Cr. Net NPA ratio, in %?","answer":0.51,"tol":0.02,"unit":"%","why":"Net NPA 40 &minus; 30 = 10. Net loans 2,000 &minus; 30 = 1,970. 10 &divide; 1,970 = 0.51%. Gross NPA is 2.0%.","say":"Last calculation. 40 crore of bad loans on 2,000 crore of loans, with 30 crore already provided. Take the provisions off both the top and the bottom. What's the net NPA ratio?"},{"type":"reveal","tag":"Your miss","q":"When would you value a business using the P/B ratio?","a":"<p>When book value is close to economic value: banks, NBFCs and insurers. Their assets are loans and bonds carried near fair value, and regulatory capital, a book number, limits how fast they grow. EV/EBITDA makes no sense when interest is the raw material.<\/p><p>Read P/B with ROE: <b>justified P/B<\/b> = (ROE &minus; g) &divide; (cost of equity &minus; g). It is close to useless for asset-light firms like software.<\/p>","say":"Boss question, one you missed before. When would you value a business on price to book? Say it out loud, then reveal."},{"type":
